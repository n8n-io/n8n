  - cellType: CODE
    cellId: 019fc446-7984-7703-a1c8-b17cc003affc # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: MCP trial → conversion funnel chart
    config:
      source: |-
        import plotly.graph_objects as go

        funnel_df = mcp_trial_conversion_funnel.sort_values("stage_order")

        fig = go.Figure(
