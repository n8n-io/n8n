  - cellType: SQL
    cellId: 019fb008-93de-75d5-9777-6b65e9a8196d # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Trial AI Builder user activation rate
    config:
      source: |-
        with
        settings as (
            select
                timestamp(date_trunc(current_date(), week (monday))) as start_at,
            {{ selected_n8n_version }} as selected_n8n_version
        )

        , internal_instances as (
            select distinct
                instance_id
            from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )

        , trial_windows as (
            select distinct
                user_cloud_id,
                trial_number,
                instance_id,
                trial_started_date,
                activated_at,
                least(
                    trial_expiry_date,
                    coalesce(trial_converted_date, trial_expiry_date)
                ) as trial_end_date
            from `n8n-telemetry.marts.fct_trials`
            cross join settings
            where
                instance_id is not null
                and trial_started_date <= current_date()
                and trial_expiry_date >= date(settings.start_at)
        )

        , builder_created as (
            select
                trial_windows.user_cloud_id,
                trial_windows.trial_number,
                trial_windows.trial_started_date,
                trial_windows.trial_end_date,
                trial_windows.activated_at,
                builder_events.instance_id,
                builder_events.workflow_id,
                min(builder_events.timestamp) as workflow_created_at
            from
                `n8n-telemetry.rudder_schema.builder_created_workflow`
                    as builder_events
            inner join trial_windows
                on
                    builder_events.instance_id = trial_windows.instance_id
                    and date(
                        builder_events.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on builder_events.instance_id = internal_instances.instance_id
            cross join settings
            where
                builder_events._partitiontime >= settings.start_at
                and builder_events.timestamp >= settings.start_at
                and builder_events.instance_id is not null
                and builder_events.workflow_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(builder_events.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(builder_events.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1, 2, 3, 4, 5, 6, 7
        )

        , builder_publications as (
            select
                publish_events.instance_id,
                publish_events.workflow_id,
                publish_events.timestamp as workflow_published_at
            from
                `n8n-telemetry.rudder_schema.builder_published_workflow`
                    as publish_events
            cross join settings
            where
                publish_events._partitiontime >= settings.start_at
                and publish_events.timestamp >= settings.start_at
                and publish_events.instance_id is not null
                and publish_events.workflow_id is not null
        )

        , canvas_publications as (
            select
                publish_events.context_traits_instance_id as instance_id,
                publish_events.workflow_id,
                publish_events.timestamp as workflow_published_at
            from
                `n8n-telemetry.rudder_schema.user_published_version_from_canvas`
                    as publish_events
            cross join settings
            where
                publish_events._partitiontime >= settings.start_at
                and publish_events.timestamp >= settings.start_at
                and publish_events.context_traits_instance_id is not null
                and publish_events.workflow_id is not null
        )

        , mcp_publications as (
            select
                mcp_tool_calls.instance_id,
                mcp_tool_calls.results_data_workflow_id as workflow_id,
                mcp_tool_calls.timestamp as workflow_published_at
            from `n8n-telemetry.rudder_schema.user_called_mcp_tool` as mcp_tool_calls
            cross join settings
            where
                mcp_tool_calls._partitiontime >= settings.start_at
                and mcp_tool_calls.timestamp >= settings.start_at
                and mcp_tool_calls.results_success is true
                and mcp_tool_calls.tool_name = 'publish_workflow'
                and mcp_tool_calls.instance_id is not null
                and mcp_tool_calls.results_data_workflow_id is not null
        )

        , all_publications as (
            select
                instance_id,
                workflow_id,
                workflow_published_at
            from builder_publications

            union all

            select
                instance_id,
                workflow_id,
                workflow_published_at
            from canvas_publications

            union all

            select
                instance_id,
                workflow_id,
                workflow_published_at
            from mcp_publications
        )

        , published_workflows as (
            select
                builder_created.user_cloud_id,
                builder_created.trial_number,
                builder_created.instance_id,
                builder_created.workflow_id,
                min(all_publications.workflow_published_at) as first_published_at
            from builder_created
            left join all_publications
                on
                    builder_created.instance_id = all_publications.instance_id
                    and builder_created.workflow_id = all_publications.workflow_id
                    and builder_created.workflow_created_at
                    <= all_publications.workflow_published_at
            group by 1, 2, 3, 4
        )

        , user_cohort as (
            select
                builder_created.user_cloud_id,
                builder_created.trial_number,
                count(distinct builder_created.workflow_id) as ai_workflows_created,
                count(
                    distinct if(
                        published_workflows.first_published_at is not null,
                        builder_created.workflow_id,
                        null
                    )
                ) as ai_workflows_published,
                max(
                    builder_created.activated_at between builder_created.trial_started_date
                    and least(current_date(), builder_created.trial_end_date)
                ) as is_activated_during_trial_to_date
            from builder_created
            left join published_workflows
                on
                    builder_created.user_cloud_id = published_workflows.user_cloud_id
                    and builder_created.trial_number = published_workflows.trial_number
                    and builder_created.instance_id = published_workflows.instance_id
                    and builder_created.workflow_id = published_workflows.workflow_id
            group by 1, 2
        )

        , grouped as (
            select
                case
                    when ai_workflows_published > 0
                        then 'Published at least one AI-created workflow'
                    else 'No AI-created workflow published yet'
                end as publication_status,
                count(*) as trial_users,
                countif(is_activated_during_trial_to_date) as activated_users
            from user_cohort
            group by 1
        )

        , final as (
            select
                publication_status,
                trial_users,
                activated_users,
                round(
                    safe_divide(activated_users, trial_users) * 100,
                    1
                ) as activation_rate_pct,
                1 as sort_order
            from grouped

            union all

            select
                'All trial users who created with AI Builder' as publication_status,
                count(*) as trial_users,
                countif(is_activated_during_trial_to_date) as activated_users,
                round(
                    safe_divide(
                        countif(is_activated_during_trial_to_date),
                        count(*)
                    ) * 100,
                    1
                ) as activation_rate_pct,
                0 as sort_order
            from user_cohort
        )

        select
            publication_status,
            trial_users,
            activated_users,
            activation_rate_pct
        from final
        order by sort_order asc, activation_rate_pct desc
      dataFrameCell: false
      dataConnectionId: 019ce681-e9fb-7002-ad50-b766bf65c6cf
      resultVariableName: trial_ai_builder_user_activation_rate
      useRichDisplay: true
      enablePreview: true
      sqlCellOutputType: PANDAS
      useQueryMode: false
      castDecimals: true
      useNativeDates: true
      outputFilteredResult: true
      allowDuplicateColumns: false
      tableDisplayConfig:
        pageSize: 50
        height: null
        hideIcons: false
        defaultColumnWidth: null
        hideIndex: false
        defaultSortColumn: null
        defaultSortIndexColumn: null
        defaultSortDirection: ASC
        conditionalFormatting: null
        calcs: null
        filters: null
        columnProperties:
          - originalName: activated_users
            renameTo: null
            size: 137
            wrapText: null
            displayFormat: null
          - originalName: activation_rate_pct
            renameTo: null
