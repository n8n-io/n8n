  - cellType: SQL
    cellId: 019fcf00-d382-716d-beb9-2b1edc084949 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Unique trial users entry source → actions
    config:
      source: |-
        with
        settings as (
            select
                timestamp(date_sub(current_date(), interval 3 week)) as start_at,
                date_sub(current_date(), interval 3 week) as start_date,
                {{ selected_n8n_version }} as selected_n8n_version
        )

        , internal_instances as (
            select distinct
                instance_id
            from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )

        -- Unique cloud trial users (one user_cloud_id) whose trial window overlaps
        -- the selected time range (open + concluded). End date is capped at today.
        , trial_cohort_raw as (
            select
                cast(trials.user_cloud_id as string) as user_id_cloud,
                trials.instance_id,
                trials.trial_started_date,
                least(
                    trials.trial_expiry_date,
                    coalesce(trials.trial_converted_date, trials.trial_expiry_date),
                    current_date()
                ) as trial_end_date,
                trials.is_converted
            from `n8n-telemetry.marts.fct_trials` as trials
            left join internal_instances
                on trials.instance_id = internal_instances.instance_id
            cross join settings
            where
                trials.instance_id is not null
                and trials.user_cloud_id is not null
                and trials.trial_started_date <= current_date()
                and trials.trial_expiry_date >= settings.start_date
                and internal_instances.instance_id is null
        )

        -- One logical trial row per cloud user (latest started trial). Keep all
        -- instance_ids for activity joins via trial_user_instances.
        , trial_users as (
            select
                user_id_cloud,
                max(is_converted) as is_converted
            from trial_cohort_raw
            group by 1
        )

        , trial_cohort as (
            select
                trial_cohort_raw.user_id_cloud,
                trial_cohort_raw.instance_id,
                trial_cohort_raw.trial_started_date,
                trial_cohort_raw.trial_end_date,
                trial_users.is_converted
            from trial_cohort_raw
            inner join trial_users
                on trial_cohort_raw.user_id_cloud = trial_users.user_id_cloud
        )

        , builder_messages as (
            select
                trial_cohort.user_id_cloud,
                user_messages.timestamp,
                coalesce(
                    nullif(user_messages.action_source, ''),
                    'unknown'
                ) as action_source
            from `n8n-telemetry.rudder_schema.user_sent_builder_message`
                as user_messages
            inner join trial_cohort
                on
                    user_messages.instance_id = trial_cohort.instance_id
                    and date(user_messages.timestamp)
                    between trial_cohort.trial_started_date
                    and trial_cohort.trial_end_date
            cross join settings
            where
                user_messages._partitiontime >= settings.start_at
                and user_messages.timestamp >= settings.start_at
                and user_messages.instance_id is not null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(user_messages.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(user_messages.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
        )

        , first_source as (
            -- Prefer the first attributed source in-trial; fall back to unknown/legacy
            -- only when every message lacks action_source.
            select
                user_id_cloud,
                coalesce(
                    array_agg(
                        if(action_source = 'unknown', null, action_source)
                        ignore nulls
                        order by timestamp
                        limit 1
                    )[safe_offset(0)],
                    'unknown'
                ) as first_action_source
            from builder_messages
            group by 1
        )

        , ai_workflow_creators as (
            select distinct
                trial_cohort.user_id_cloud
            from `n8n-telemetry.rudder_schema.builder_created_workflow`
                as builder_events
            inner join trial_cohort
                on
