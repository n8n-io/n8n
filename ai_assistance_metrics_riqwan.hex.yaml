        optional: false
      defaultValue: 2.33.*
  - cellType: SQL
    cellId: 019fa416-2c30-72db-8ef8-a773b5947756 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Weekly AI Assistance metrics
    config:
      source: |
        with
        settings as (
            select
                timestamp('2026-07-07') as start_at,
            {{ selected_n8n_version }} as selected_n8n_version
        )

        , internal_instances as (
            select distinct
                instance_id
            from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )

        , trial_windows as (
            select distinct
                instance_id,
                trial_started_date,
                least(
                    trial_expiry_date,
                    coalesce(trial_converted_date, trial_expiry_date)
                ) as trial_end_date
            from `n8n-telemetry.marts.fct_trials`
            cross join settings
            where
                instance_id is not null
                and trial_started_date <= current_date()
                and trial_expiry_date >= date(settings.start_at)
        )

        , created_threads as (
            select
                user_messages.instance_id,
                user_messages.thread_id,
                min(user_messages.timestamp) as thread_created_at,
                array_agg(
                    coalesce(user_messages.version_cli, 'Unknown')
                    order by user_messages.timestamp
                    limit 1
                )[offset(0)] as n8n_version
            from
                `n8n-telemetry.rudder_schema.user_sent_builder_message` as user_messages
            inner join trial_windows
                on
                    user_messages.instance_id = trial_windows.instance_id
                    and date(
                        user_messages.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on user_messages.instance_id = internal_instances.instance_id
            cross join settings
            where
                user_messages._partitiontime >= settings.start_at
                and user_messages.timestamp >= settings.start_at
                and user_messages.instance_id is not null
                and user_messages.thread_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(user_messages.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(user_messages.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1, 2
        )

        , message_events as (
            select
                user_messages.instance_id,
                user_messages.thread_id,
                user_messages.timestamp as message_at,
                'user' as message_source
            from
                `n8n-telemetry.rudder_schema.user_sent_builder_message` as user_messages
            cross join settings
            where
                user_messages._partitiontime >= settings.start_at
                and user_messages.timestamp >= settings.start_at
                and user_messages.instance_id is not null
                and user_messages.thread_id is not null

            union all

            select
                builder_messages.instance_id,
                builder_messages.thread_id,
                builder_messages.timestamp as message_at,
                'assistant' as message_source
            from `n8n-telemetry.rudder_schema.builder_sent_message` as builder_messages
            cross join settings
            where
                builder_messages._partitiontime >= settings.start_at
                and builder_messages.timestamp >= settings.start_at
                and builder_messages.instance_id is not null
                and builder_messages.thread_id is not null
                and coalesce(builder_messages.is_intermediate, false) is false
        )

        , thread_metrics as (
            select
                greatest(
                    date_trunc(date(created_threads.thread_created_at), week (monday)),
                    date('2026-07-07')
                ) as week_start,
                created_threads.instance_id,
                created_threads.thread_id,
                count(message_events.message_at) as message_count,
                countif(message_events.message_source = 'user') as user_message_count,
                countif(message_events.message_source = 'assistant')
                    as assistant_message_count
            from created_threads
            left join message_events
                on
                    created_threads.instance_id = message_events.instance_id
                    and created_threads.thread_id = message_events.thread_id
            group by 1, 2, 3
        )

        , threads_weekly as (
            select
                week_start,
                count(distinct instance_id) as thread_creating_instances,
                count(*) as threads_created,
                sum(message_count) as messages_created,
                sum(user_message_count) as user_messages_created,
                sum(assistant_message_count) as assistant_messages_created
            from thread_metrics
            group by 1
        )

        , workflows_weekly as (
            select
                greatest(
                    date_trunc(date(workflows.timestamp), week (monday)),
                    date('2026-07-07')
                ) as week_start,
                count(distinct workflows.instance_id) as workflow_creating_instances,
                count(distinct workflows.workflow_id) as workflows_created
            from `n8n-telemetry.rudder_schema.builder_created_workflow` as workflows
            inner join trial_windows
                on
                    workflows.instance_id = trial_windows.instance_id
                    and date(
                        workflows.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on workflows.instance_id = internal_instances.instance_id
            cross join settings
            where
                workflows._partitiontime >= settings.start_at
                and workflows.timestamp >= settings.start_at
                and workflows.instance_id is not null
                and workflows.workflow_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(workflows.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(workflows.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1
        )

        , published_workflows_weekly as (
            select
                greatest(
                    date_trunc(date(published_workflows.timestamp), week (monday)),
                    date('2026-07-07')
                ) as week_start,
                count(
                    distinct concat(
                        published_workflows.instance_id,
                        '#',
                        published_workflows.workflow_id
                    )
                ) as workflows_published
            from
                `n8n-telemetry.rudder_schema.builder_published_workflow`
                    as published_workflows
            inner join trial_windows
                on
                    published_workflows.instance_id = trial_windows.instance_id
                    and date(
                        published_workflows.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on published_workflows.instance_id = internal_instances.instance_id
            cross join settings
            where
                published_workflows._partitiontime >= settings.start_at
                and published_workflows.timestamp >= settings.start_at
                and published_workflows.instance_id is not null
                and published_workflows.workflow_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(published_workflows.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(published_workflows.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1
        )

        , non_ai_created_workflows_weekly as (
            select
                greatest(
                    date_trunc(date(created_workflows.timestamp), week (monday)),
                    date('2026-07-07')
                ) as week_start,
                count(
                    distinct concat(
                        created_workflows.instance_id,
                        '#',
                        created_workflows.workflow_id
                    )
                ) as non_ai_workflows_created
            from `n8n-telemetry.rudder_schema.user_created_workflow`
                as created_workflows
            inner join trial_windows
                on
                    created_workflows.instance_id = trial_windows.instance_id
                    and date(
                        created_workflows.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on created_workflows.instance_id = internal_instances.instance_id
            cross join settings
            where
                created_workflows._partitiontime >= settings.start_at
                and created_workflows.timestamp >= settings.start_at
                and created_workflows.instance_id is not null
                and created_workflows.workflow_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(created_workflows.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(created_workflows.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1
        )

        , non_ai_published_workflows_weekly as (
            select
                greatest(
                    date_trunc(date(published_workflows.timestamp), week (monday)),
                    date('2026-07-07')
                ) as week_start,
                count(
                    distinct concat(
                        published_workflows.context_traits_instance_id,
                        '#',
                        published_workflows.workflow_id
                    )
                ) as non_ai_workflows_published
            from
                `n8n-telemetry.rudder_schema.user_published_version_from_canvas`
                    as published_workflows
            inner join trial_windows
                on
                    published_workflows.context_traits_instance_id
                    = trial_windows.instance_id
                    and date(
                        published_workflows.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on published_workflows.context_traits_instance_id
                    = internal_instances.instance_id
            cross join settings
            where
                published_workflows._partitiontime >= settings.start_at
                and published_workflows.timestamp >= settings.start_at
                and published_workflows.context_traits_instance_id is not null
                and published_workflows.workflow_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(published_workflows.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(published_workflows.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1
        )

        , mcp_workflows_weekly as (
            select
                greatest(
                    date_trunc(date(mcp_tool_calls.timestamp), week (monday)),
                    date('2026-07-07')
                ) as week_start,
                count(
                    distinct if(
                        mcp_tool_calls.tool_name = 'create_workflow_from_code',
                        concat(
                            mcp_tool_calls.instance_id,
                            '#',
                            mcp_tool_calls.results_data_workflow_id
                        ),
                        null
                    )
                ) as mcp_workflows_created,
                count(
                    distinct if(
                        mcp_tool_calls.tool_name = 'publish_workflow',
                        concat(
                            mcp_tool_calls.instance_id,
                            '#',
                            mcp_tool_calls.results_data_workflow_id
                        ),
                        null
                    )
                ) as mcp_workflows_published
            from `n8n-telemetry.rudder_schema.user_called_mcp_tool` as mcp_tool_calls
            inner join trial_windows
                on
                    mcp_tool_calls.instance_id = trial_windows.instance_id
                    and date(
                        mcp_tool_calls.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on mcp_tool_calls.instance_id = internal_instances.instance_id
            cross join settings
            where
                mcp_tool_calls._partitiontime >= settings.start_at
                and mcp_tool_calls.timestamp >= settings.start_at
                and mcp_tool_calls.results_success is true
                and mcp_tool_calls.tool_name in (
                    'create_workflow_from_code',
                    'publish_workflow'
                )
                and mcp_tool_calls.instance_id is not null
                and mcp_tool_calls.results_data_workflow_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(mcp_tool_calls.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(mcp_tool_calls.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1
        )

        , all_weeks as (
            select distinct week_start
            from (
                select week_start from threads_weekly
                union all
                select week_start from workflows_weekly
                union all
                select week_start from published_workflows_weekly
                union all
                select week_start from non_ai_created_workflows_weekly
                union all
                select week_start from non_ai_published_workflows_weekly
                union all
                select week_start from mcp_workflows_weekly
            )
        )

        , final as (
            select
                all_weeks.week_start,
                coalesce(threads_weekly.thread_creating_instances, 0)
                    as thread_creating_instances,
                coalesce(threads_weekly.threads_created, 0) as threads_created,
                safe_divide(
                    threads_weekly.threads_created,
                    threads_weekly.thread_creating_instances
                ) as threads_per_instance,
                coalesce(workflows_weekly.workflow_creating_instances, 0)
                    as workflow_creating_instances,
                coalesce(workflows_weekly.workflows_created, 0) as workflows_created,
                coalesce(published_workflows_weekly.workflows_published, 0)
                    as workflows_published,
                coalesce(non_ai_created_workflows_weekly.non_ai_workflows_created, 0)
                    as non_ai_workflows_created,
                coalesce(
                    non_ai_published_workflows_weekly.non_ai_workflows_published,
                    0
                ) as non_ai_workflows_published,
                coalesce(mcp_workflows_weekly.mcp_workflows_created, 0)
                    as mcp_workflows_created,
                coalesce(mcp_workflows_weekly.mcp_workflows_published, 0)
                    as mcp_workflows_published,
                safe_divide(
                    workflows_weekly.workflows_created,
                    workflows_weekly.workflow_creating_instances
                ) as workflows_per_instance,
                coalesce(threads_weekly.messages_created, 0) as messages_created,
                coalesce(threads_weekly.user_messages_created, 0)
                    as user_messages_created,
                coalesce(threads_weekly.assistant_messages_created, 0)
                    as assistant_messages_created,
                safe_divide(
                    threads_weekly.messages_created,
                    threads_weekly.threads_created
                ) as messages_per_thread
            from all_weeks
            left join threads_weekly
                on all_weeks.week_start = threads_weekly.week_start
            left join workflows_weekly
                on all_weeks.week_start = workflows_weekly.week_start
            left join published_workflows_weekly
                on all_weeks.week_start = published_workflows_weekly.week_start
            left join non_ai_created_workflows_weekly
                on all_weeks.week_start = non_ai_created_workflows_weekly.week_start
            left join non_ai_published_workflows_weekly
                on all_weeks.week_start = non_ai_published_workflows_weekly.week_start
            left join mcp_workflows_weekly
                on all_weeks.week_start = mcp_workflows_weekly.week_start
        )

        select
            week_start,
            thread_creating_instances,
            threads_created,
            threads_per_instance,
            workflow_creating_instances,
            workflows_created,
            workflows_published,
            non_ai_workflows_created,
            non_ai_workflows_published,
            mcp_workflows_created,
            mcp_workflows_published,
            workflows_per_instance,
            messages_created,
            user_messages_created,
            assistant_messages_created,
            messages_per_thread
        from final
        order by 1
      dataFrameCell: false
      dataConnectionId: 019ce681-e9fb-7002-ad50-b766bf65c6cf
