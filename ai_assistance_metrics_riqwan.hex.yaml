  - cellType: MARKDOWN
    cellId: 019fc453-bb1b-7319-a55c-f909a20217f9 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Entry source → actions notes
    config:
      source: |-
        ### Entry source → actions
        Among concluded-trial users who used Instance AI in the last 3 weeks, each user is attributed to their **first non-unknown** `user_sent_builder_message.action_source` in the trial window.

        Right now most users still have **Unknown / legacy** attribution (source not set on messages). The chart:
        1. Shows attributed entry-source volumes
        2. Uses a Sankey for attributed sources → later actions
        3. Prints a full rate table including Unknown

        Actions:
        - Created AI workflow (`builder_created_workflow`)
        - Edited AI workflow (`builder_modified_workflow`, excluding follow-up edits of a workflow created in the same thread)
        - Debugged execution (any trial message with `action_source = node_error_view`)
        - Published AI workflow (Builder / Canvas / MCP)
        - Activated AI workflow (`user_activated_workflow` on an AI-created workflow, in-trial)
        - Converted (`funnel_cloud_loose.s5_at`)
  - cellType: MARKDOWN
    cellId: 019fc446-736f-753d-8f69-3599559cb9bd # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: MCP conversion funnel notes
    config:
      source: |-
        ### MCP funnel definition
        Same window and conversion definition as the Instance AI funnel: **concluded cloud trials** in the last 3 weeks (excludes `n8n.io`), conversion = `funnel_cloud_loose.s5_at`.

        1. Concluded trial users
        2. Called at least one MCP tool during the trial (`user_called_mcp_tool`)
        3. Created at least one workflow via MCP (`user_created_workflow.source = 'n8n-mcp'`)
        4. Published at least one of those MCP-created workflows during the trial (MCP / Canvas / AI Builder publish events)
        5. Converted to paid (`s5_at`)

        Respects the `n8n version` input filter.
  - cellType: SQL
    cellId: 019fc451-3d5c-74ca-97cf-9811b22d2fd2 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Why execute-only users stop (vs publishers)
    config:
      source: |-
        -- Why execute-only users don't publish: compare publishers vs execute-only (last 3 weeks)
        with
        settings as (
            select
                timestamp(date_sub(current_date(), interval 3 week)) as start_at,
                {{ selected_n8n_version }} as selected_n8n_version
        )

        , internal_instances as (
            select distinct instance_id
            from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )

        , trial_cohort as (
            select
                funnel.user_id_cloud,
                funnel.instance_id,
                date(funnel.s4_at) as trial_started_date,
                coalesce(date(funnel.trial_win_end), date(funnel.s4_at)) as trial_end_date
            from `n8n-telemetry.computed.funnel_cloud_loose` as funnel
            left join internal_instances
                on funnel.instance_id = internal_instances.instance_id
            cross join settings
            where
                funnel.s4_at is not null
                and funnel.trial_win_over is true
                and funnel.s4_at >= settings.start_at
                and funnel.user_id_cloud is not null
                and internal_instances.instance_id is null
        )

        , instance_ai_users as (
            select distinct trial_cohort.user_id_cloud
            from `n8n-telemetry.rudder_schema.user_sent_builder_message` as m
            inner join trial_cohort
                on m.instance_id = trial_cohort.instance_id
                and date(m.timestamp) between trial_cohort.trial_started_date and trial_cohort.trial_end_date
            cross join settings
            where m._partitiontime >= settings.start_at
              and m.timestamp >= settings.start_at
              and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(m.version_cli, 'Unknown') = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(m.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
        )

        , ai_created as (
            select
                t.user_id_cloud,
                t.trial_started_date,
                t.trial_end_date,
                b.instance_id,
                b.workflow_id,
                min(b.timestamp) as workflow_created_at
            from `n8n-telemetry.rudder_schema.builder_created_workflow` as b
            inner join trial_cohort as t
                on b.instance_id = t.instance_id
                and date(b.timestamp) between t.trial_started_date and t.trial_end_date
            inner join instance_ai_users as u
                on t.user_id_cloud = u.user_id_cloud
            cross join settings
            where b._partitiontime >= settings.start_at
              and b.timestamp >= settings.start_at
              and b.instance_id is not null
              and b.workflow_id is not null
              and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(b.version_cli, 'Unknown') = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(b.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1, 2, 3, 4, 5
        )

        , pubs as (
            select instance_id, workflow_id, timestamp as published_at
            from `n8n-telemetry.rudder_schema.builder_published_workflow`
            cross join settings
            where _partitiontime >= settings.start_at and timestamp >= settings.start_at
            union all
            select context_traits_instance_id, workflow_id, timestamp
            from `n8n-telemetry.rudder_schema.user_published_version_from_canvas`
            cross join settings
            where _partitiontime >= settings.start_at and timestamp >= settings.start_at
            union all
            select instance_id, results_data_workflow_id, timestamp
            from `n8n-telemetry.rudder_schema.user_called_mcp_tool`
            cross join settings
            where _partitiontime >= settings.start_at and timestamp >= settings.start_at
              and results_success and tool_name = 'publish_workflow'
        )

        , acts as (
            select instance_id, workflow_id, min(timestamp) as first_activated_at
            from `n8n-telemetry.rudder_schema.user_activated_workflow`
            cross join settings
            where _partitiontime >= settings.start_at and timestamp >= settings.start_at
            group by 1, 2
        )

        , execs as (
            select
                instance_id,
                workflow_id,
                timestamp as executed_at,
                lower(coalesce(status, '')) as status,
                error,
                exec_type,
                executed_by
            from `n8n-telemetry.rudder_schema.builder_executed_workflow`
            cross join settings
            where _partitiontime >= settings.start_at and timestamp >= settings.start_at
        )

        , user_labels as (
            select
                c.user_id_cloud,
                logical_or(
                    p.published_at is not null
                    and date(p.published_at) <= c.trial_end_date
                ) as published_during_trial,
                logical_or(a.first_activated_at is not null) as activated,
                logical_or(e.executed_at is not null) as executed
            from ai_created as c
            left join pubs as p
                on c.instance_id = p.instance_id
                and c.workflow_id = p.workflow_id
                and c.workflow_created_at <= p.published_at
            left join acts as a
                on c.instance_id = a.instance_id
                and c.workflow_id = a.workflow_id
                and c.workflow_created_at <= a.first_activated_at
            left join execs as e
                on c.instance_id = e.instance_id
                and c.workflow_id = e.workflow_id
                and c.workflow_created_at <= e.executed_at
            group by 1
        )

        , cohorts as (
            select
                user_id_cloud,
                case
                    when published_during_trial then 'Published during trial'
                    when executed and not published_during_trial and not activated
                        then 'Execute-only (no publish)'
                end as cohort
            from user_labels
            where published_during_trial
               or (executed and not published_during_trial and not activated)
        )

        , user_exec_stats as (
            select
                c.user_id_cloud,
                count(*) as exec_count,
                countif(
                    e.status in ('success', 'succeeded', 'ok', 'completed')
                    or (e.status = '' and e.error is null)
                ) as success_execs,
                countif(
                    e.status in ('error', 'failed', 'failure')
                    or e.error is not null
                ) as failed_execs,
                countif(
                    e.status in ('error', 'failed', 'failure')
                    or e.error is not null
                ) = count(*) as all_execs_failed,
                countif(
                    e.status in ('success', 'succeeded', 'ok', 'completed')
                    or (e.status = '' and e.error is null)
                ) > 0 as any_success,
                array_agg(
                    struct(e.executed_at, e.status, e.error)
                    order by e.executed_at desc
                    limit 1
                )[offset(0)] as last_exec
            from ai_created as c
            inner join execs as e
                on c.instance_id = e.instance_id
                and c.workflow_id = e.workflow_id
                and c.workflow_created_at <= e.executed_at
                and date(e.executed_at) <= c.trial_end_date
            group by 1
        )

        , run_finished as (
            select
                c.user_id_cloud,
                count(*) as builder_runs,
                countif(lower(coalesce(r.final_status, '')) in ('success', 'succeeded', 'ok', 'completed'))
                    as successful_builder_runs,
                countif(r.workflow_ready is true) as workflow_ready_runs,
                countif(coalesce(r.validate_blocking_count, 0) > 0) as runs_with_blocking_validation,
                avg(r.wall_duration_ms) as avg_run_duration_ms
            from ai_created as c
            inner join `n8n-telemetry.rudder_schema.ai_builder_run_finished` as r
                on c.instance_id = r.instance_id
                and c.workflow_id = r.workflow_id
            cross join settings
            where r._partitiontime >= settings.start_at
              and r.timestamp >= settings.start_at
              and date(r.timestamp) between c.trial_started_date and c.trial_end_date
            group by 1
        )

        , stalls as (
            select
                c.user_id_cloud,
                count(*) as stall_events
            from ai_created as c
            inner join `n8n-telemetry.rudder_schema.ai_builder_session_stall` as s
                on c.instance_id = s.instance_id
                and c.workflow_id = s.workflow_id
            cross join settings
            where s._partitiontime >= settings.start_at
              and s.timestamp >= settings.start_at
              and date(s.timestamp) between c.trial_started_date and c.trial_end_date
            group by 1
        )

        , fails as (
            select
                t.user_id_cloud,
                count(*) as failed_to_answer_events
            from `n8n-telemetry.rudder_schema.ai_builder_failed_to_answer` as f
            inner join trial_cohort as t
                on coalesce(f.context_traits_instance_id, cast(null as string)) = t.instance_id
                or f.user_id = cast(t.user_id_cloud as string)
            cross join settings
            where f._partitiontime >= settings.start_at
              and f.timestamp >= settings.start_at
              and date(f.timestamp) between t.trial_started_date and t.trial_end_date
            group by 1
        )

        , messages as (
            select
                t.user_id_cloud,
                count(*) as builder_messages,
                count(distinct date(m.timestamp)) as active_days,
                count(distinct m.thread_id) as threads,
                countif(m.is_first_message is true) as first_messages
            from `n8n-telemetry.rudder_schema.user_sent_builder_message` as m
            inner join trial_cohort as t
                on m.instance_id = t.instance_id
                and date(m.timestamp) between t.trial_started_date and t.trial_end_date
            cross join settings
            where m._partitiontime >= settings.start_at
              and m.timestamp >= settings.start_at
            group by 1
        )

        , validate_outcomes as (
            select
                c.user_id_cloud,
                count(*) as validate_events,
                countif(lower(coalesce(v.outcome, '')) in ('fail', 'failed', 'error', 'blocked'))
                    as validate_fails,
                countif(coalesce(v.l_2_passed, true) is false) as l2_failures
            from ai_created as c
            inner join `n8n-telemetry.rudder_schema.ai_builder_validate_outcome` as v
                on c.instance_id = v.instance_id
            cross join settings
            where v._partitiontime >= settings.start_at
              and v.timestamp >= settings.start_at
              and date(v.timestamp) between c.trial_started_date and c.trial_end_date
            group by 1
        )

        , joined as (
            select
                cohorts.cohort,
                cohorts.user_id_cloud,
                coalesce(user_exec_stats.exec_count, 0) as exec_count,
                coalesce(user_exec_stats.success_execs, 0) as success_execs,
                coalesce(user_exec_stats.failed_execs, 0) as failed_execs,
                coalesce(user_exec_stats.all_execs_failed, false) as all_execs_failed,
                coalesce(user_exec_stats.any_success, false) as any_success,
                user_exec_stats.last_exec.status as last_exec_status,
                user_exec_stats.last_exec.error is not null as last_exec_had_error,
                coalesce(run_finished.builder_runs, 0) as builder_runs,
                coalesce(run_finished.successful_builder_runs, 0) as successful_builder_runs,
                coalesce(run_finished.workflow_ready_runs, 0) as workflow_ready_runs,
                coalesce(run_finished.runs_with_blocking_validation, 0) as runs_with_blocking_validation,
                coalesce(stalls.stall_events, 0) as stall_events,
                coalesce(fails.failed_to_answer_events, 0) as failed_to_answer_events,
                coalesce(messages.builder_messages, 0) as builder_messages,
                coalesce(messages.active_days, 0) as active_days,
                coalesce(messages.threads, 0) as threads,
                coalesce(validate_outcomes.validate_fails, 0) as validate_fails
            from cohorts
            left join user_exec_stats using (user_id_cloud)
            left join run_finished using (user_id_cloud)
            left join stalls using (user_id_cloud)
            left join fails using (user_id_cloud)
            left join messages using (user_id_cloud)
            left join validate_outcomes using (user_id_cloud)
        )

        select
            cohort,
            count(*) as users,

            -- execution quality
            round(avg(exec_count), 2) as avg_execs,
            round(100 * avg(if(any_success, 1, 0)), 1) as pct_any_successful_exec,
            round(100 * avg(if(all_execs_failed, 1, 0)), 1) as pct_all_execs_failed,
            round(100 * avg(if(last_exec_had_error, 1, 0)), 1) as pct_last_exec_errored,
            round(100 * safe_divide(sum(failed_execs), sum(exec_count)), 1) as pct_execs_failed,

            -- builder run quality
            round(avg(builder_runs), 2) as avg_builder_runs,
            round(100 * avg(if(workflow_ready_runs > 0, 1, 0)), 1) as pct_ever_workflow_ready,
            round(100 * avg(if(runs_with_blocking_validation > 0, 1, 0)), 1)
                as pct_had_blocking_validation,
            round(100 * avg(if(stall_events > 0, 1, 0)), 1) as pct_had_session_stall,
            round(100 * avg(if(failed_to_answer_events > 0, 1, 0)), 1) as pct_failed_to_answer,
            round(100 * avg(if(validate_fails > 0, 1, 0)), 1) as pct_validate_fail,

            -- engagement
            round(avg(builder_messages), 1) as avg_messages,
            round(avg(active_days), 2) as avg_active_days,
            round(avg(threads), 2) as avg_threads,
            round(100 * avg(if(active_days = 1, 1, 0)), 1) as pct_single_day_only,
            round(100 * avg(if(builder_messages <= 3, 1, 0)), 1) as pct_le_3_messages
        from joined
        group by 1
        order by 1
      dataFrameCell: false
      dataConnectionId: 019ce681-e9fb-7002-ad50-b766bf65c6cf
      resultVariableName: execute_only_vs_publishers
