  - cellType: SQL
    cellId: 019fa415-1066-70a9-98d1-3490f1d06532 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: n8n version options
    config:
      source: |
        with
        version_values as (
            select distinct
                coalesce(version_cli, 'Unknown') as n8n_version
            from `n8n-telemetry.rudder_schema.user_sent_builder_message`
            where _partitiontime >= timestamp('2026-07-07')
                and timestamp >= timestamp('2026-07-07')
        )

        , version_families as (
            select distinct
                concat(
                    regexp_extract(n8n_version, r'^(\d+\.\d+)\.'),
                    '.*'
                ) as n8n_version
            from version_values
            where regexp_contains(n8n_version, r'^\d+\.\d+\.\d+')
        )

        , version_options as (
            select
                'All versions' as n8n_version,
                0 as sort_order

            union all

            select
                n8n_version,
                1 as sort_order
            from version_families

            union all

            select
                n8n_version,
                2 as sort_order
            from version_values
        )

        select
            n8n_version
        from version_options
        order by sort_order, n8n_version desc
      dataFrameCell: false
      dataConnectionId: 019ce681-e9fb-7002-ad50-b766bf65c6cf
      resultVariableName: n8n_version_options
