  - cellType: SQL
    cellId: 019fc453-b40d-73ea-83e2-085298ab6e64 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Instance AI entry source → actions
    config:
      source: |-
        with
        settings as (
            select
                timestamp(date_sub(current_date(), interval 3 week)) as start_at,
                {{ selected_n8n_version }} as selected_n8n_version
        )

        , internal_instances as (
            select distinct
                instance_id
            from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )

        , trial_cohort as (
            select
                funnel.user_id_cloud,
                funnel.instance_id,
                date(funnel.s4_at) as trial_started_date,
                coalesce(date(funnel.trial_win_end), date(funnel.s4_at))
                    as trial_end_date,
                funnel.s5_at is not null as is_converted
            from `n8n-telemetry.computed.funnel_cloud_loose` as funnel
            left join internal_instances
                on funnel.instance_id = internal_instances.instance_id
            cross join settings
            where
                funnel.s4_at is not null
                and funnel.trial_win_over is true
                and funnel.s4_at >= settings.start_at
                and funnel.user_id_cloud is not null
                and internal_instances.instance_id is null
        )

        , builder_messages as (
            select
                trial_cohort.user_id_cloud,
                user_messages.timestamp,
                coalesce(nullif(user_messages.action_source, ''), 'unknown')
                    as action_source
            from `n8n-telemetry.rudder_schema.user_sent_builder_message`
                as user_messages
            inner join trial_cohort
                on
                    user_messages.instance_id = trial_cohort.instance_id
                    and date(user_messages.timestamp)
                    between trial_cohort.trial_started_date
                    and trial_cohort.trial_end_date
            cross join settings
            where
                user_messages._partitiontime >= settings.start_at
                and user_messages.timestamp >= settings.start_at
                and user_messages.instance_id is not null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(user_messages.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(user_messages.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
        )

        , first_source as (
            -- Prefer the first attributed source in-trial; fall back to unknown/legacy
            -- only when every message lacks action_source.
            select
                user_id_cloud,
                coalesce(
                    array_agg(
                        if(action_source = 'unknown', null, action_source)
                        ignore nulls
                        order by timestamp
                        limit 1
                    )[safe_offset(0)],
                    'unknown'
                ) as first_action_source
            from builder_messages
            group by 1
        )

        , ai_workflow_creators as (
            select distinct
                trial_cohort.user_id_cloud
            from `n8n-telemetry.rudder_schema.builder_created_workflow`
                as builder_events
            inner join trial_cohort
                on
                    builder_events.instance_id = trial_cohort.instance_id
                    and date(builder_events.timestamp)
                    between trial_cohort.trial_started_date
                    and trial_cohort.trial_end_date
            cross join settings
            where
                builder_events._partitiontime >= settings.start_at
                and builder_events.timestamp >= settings.start_at
                and builder_events.instance_id is not null
                and builder_events.workflow_id is not null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(builder_events.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(builder_events.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
        )

        , builder_publications as (
            select
                publish_events.instance_id,
                publish_events.workflow_id,
                publish_events.timestamp as workflow_published_at
            from `n8n-telemetry.rudder_schema.builder_published_workflow`
                as publish_events
            cross join settings
            where
                publish_events._partitiontime >= settings.start_at
                and publish_events.timestamp >= settings.start_at
                and publish_events.instance_id is not null
                and publish_events.workflow_id is not null
        )

        , canvas_publications as (
            select
                publish_events.context_traits_instance_id as instance_id,
                publish_events.workflow_id,
                publish_events.timestamp as workflow_published_at
            from `n8n-telemetry.rudder_schema.user_published_version_from_canvas`
                as publish_events
            cross join settings
            where
                publish_events._partitiontime >= settings.start_at
                and publish_events.timestamp >= settings.start_at
                and publish_events.context_traits_instance_id is not null
                and publish_events.workflow_id is not null
        )

        , mcp_publications as (
            select
                mcp_tool_calls.instance_id,
                mcp_tool_calls.results_data_workflow_id as workflow_id,
                mcp_tool_calls.timestamp as workflow_published_at
            from `n8n-telemetry.rudder_schema.user_called_mcp_tool` as mcp_tool_calls
            cross join settings
            where
                mcp_tool_calls._partitiontime >= settings.start_at
                and mcp_tool_calls.timestamp >= settings.start_at
                and mcp_tool_calls.results_success is true
                and mcp_tool_calls.tool_name = 'publish_workflow'
                and mcp_tool_calls.instance_id is not null
                and mcp_tool_calls.results_data_workflow_id is not null
        )

        , all_publications as (
            select * from builder_publications
            union all
            select * from canvas_publications
            union all
            select * from mcp_publications
        )

        , ai_workflow_publishers as (
            select distinct
                builder_events.user_id_cloud
            from (
                select
                    trial_cohort.user_id_cloud,
                    builder_events.instance_id,
                    builder_events.workflow_id,
                    min(builder_events.timestamp) as workflow_created_at,
                    max(trial_cohort.trial_end_date) as trial_end_date
                from `n8n-telemetry.rudder_schema.builder_created_workflow`
                    as builder_events
                inner join trial_cohort
                    on
                        builder_events.instance_id = trial_cohort.instance_id
                        and date(builder_events.timestamp)
                        between trial_cohort.trial_started_date
                        and trial_cohort.trial_end_date
                cross join settings
                where
                    builder_events._partitiontime >= settings.start_at
                    and builder_events.timestamp >= settings.start_at
                    and builder_events.instance_id is not null
                    and builder_events.workflow_id is not null
                    and (
                        settings.selected_n8n_version = 'All versions'
                        or coalesce(builder_events.version_cli, 'Unknown')
                        = settings.selected_n8n_version
                        or (
                            ends_with(settings.selected_n8n_version, '.*')
                            and starts_with(
                                coalesce(builder_events.version_cli, 'Unknown'),
                                replace(settings.selected_n8n_version, '*', '')
                            )
                        )
                    )
                group by 1, 2, 3
            ) as builder_events
            inner join all_publications
                on
                    builder_events.instance_id = all_publications.instance_id
                    and builder_events.workflow_id = all_publications.workflow_id
                    and builder_events.workflow_created_at
                    <= all_publications.workflow_published_at
                    and date(all_publications.workflow_published_at)
                    <= builder_events.trial_end_date
        )

        , workflow_editors as (
            -- Standalone edits only: exclude modify events that follow a create of the
            -- same workflow in the same thread (create → edit is expected, not a
            -- separate Sankey destination).
            select distinct
                trial_cohort.user_id_cloud
            from `n8n-telemetry.rudder_schema.builder_modified_workflow`
                as modify_events
            inner join trial_cohort
                on
                    modify_events.instance_id = trial_cohort.instance_id
                    and date(modify_events.timestamp)
                    between trial_cohort.trial_started_date
                    and trial_cohort.trial_end_date
            cross join settings
            left join `n8n-telemetry.rudder_schema.builder_created_workflow`
                as create_events
                on
                    modify_events.instance_id = create_events.instance_id
                    and modify_events.thread_id = create_events.thread_id
                    and modify_events.workflow_id = create_events.workflow_id
                    and create_events.timestamp <= modify_events.timestamp
                    and create_events._partitiontime >= settings.start_at
                    and create_events.timestamp >= settings.start_at
                    and create_events.instance_id is not null
                    and create_events.workflow_id is not null
            where
                modify_events._partitiontime >= settings.start_at
                and modify_events.timestamp >= settings.start_at
                and modify_events.instance_id is not null
                and modify_events.workflow_id is not null
                and create_events.workflow_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(modify_events.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(modify_events.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
        )

        , execution_debuggers as (
            select distinct
                trial_cohort.user_id_cloud
            from `n8n-telemetry.rudder_schema.user_sent_builder_message`
                as user_messages
            inner join trial_cohort
                on
                    user_messages.instance_id = trial_cohort.instance_id
                    and date(user_messages.timestamp)
                    between trial_cohort.trial_started_date
                    and trial_cohort.trial_end_date
            cross join settings
            where
                user_messages._partitiontime >= settings.start_at
                and user_messages.timestamp >= settings.start_at
                and user_messages.instance_id is not null
                and user_messages.action_source = 'node_error_view'
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(user_messages.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(user_messages.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
        )


        , activations as (
            select
                activations.instance_id,
                activations.workflow_id,
                min(activations.timestamp) as first_activated_at
            from `n8n-telemetry.rudder_schema.user_activated_workflow`
                as activations
            cross join settings
            where
                activations._partitiontime >= settings.start_at
                and activations.timestamp >= settings.start_at
                and activations.instance_id is not null
                and activations.workflow_id is not null
            group by 1, 2
        )

        , ai_workflow_activators as (
            select distinct
                builder_events.user_id_cloud
            from (
                select
                    trial_cohort.user_id_cloud,
                    builder_events.instance_id,
                    builder_events.workflow_id,
                    min(builder_events.timestamp) as workflow_created_at,
                    max(trial_cohort.trial_end_date) as trial_end_date
                from `n8n-telemetry.rudder_schema.builder_created_workflow`
                    as builder_events
                inner join trial_cohort
                    on
                        builder_events.instance_id = trial_cohort.instance_id
                        and date(builder_events.timestamp)
                        between trial_cohort.trial_started_date
                        and trial_cohort.trial_end_date
                cross join settings
                where
                    builder_events._partitiontime >= settings.start_at
                    and builder_events.timestamp >= settings.start_at
                    and builder_events.instance_id is not null
                    and builder_events.workflow_id is not null
                    and (
                        settings.selected_n8n_version = 'All versions'
                        or coalesce(builder_events.version_cli, 'Unknown')
                        = settings.selected_n8n_version
                        or (
                            ends_with(settings.selected_n8n_version, '.*')
                            and starts_with(
                                coalesce(builder_events.version_cli, 'Unknown'),
                                replace(settings.selected_n8n_version, '*', '')
                            )
                        )
                    )
                group by 1, 2, 3
            ) as builder_events
            inner join activations
                on
                    builder_events.instance_id = activations.instance_id
                    and builder_events.workflow_id = activations.workflow_id
                    and builder_events.workflow_created_at
                    <= activations.first_activated_at
                    and date(activations.first_activated_at)
                    <= builder_events.trial_end_date
        )

        , cohort as (
            select
                first_source.user_id_cloud,
                case first_source.first_action_source
                    when 'assistant_page' then 'Assistant page'
                    when 'canvas_action_button' then 'Canvas action button'
                    when 'canvas_choice_prompt' then 'Canvas choice prompt'
                    when 'node_error_view' then 'Node error view'
                    when 'credential_edit' then 'Credential edit'
                    when 'credentials_list' then 'Credentials list'
                    when 'agent_builder_page' then 'Agent builder'
                    when 'agent_preview' then 'Agent preview'
                    when 'template-view' then 'Template view'
                    when 'website-template' then 'Website template'
                    when 'evals' then 'Evals'
                    when 'playwright' then 'Playwright'
                    when 'unknown' then 'Unknown / legacy'
                    else first_source.first_action_source
                end as entry_source,
                trial_cohort.is_converted,
                ai_workflow_creators.user_id_cloud is not null as created_ai_workflow,
                ai_workflow_publishers.user_id_cloud is not null as published_ai_workflow,
                ai_workflow_activators.user_id_cloud is not null as activated_ai_workflow,
                workflow_editors.user_id_cloud is not null as edited_ai_workflow,
                execution_debuggers.user_id_cloud is not null as debugged_execution
            from first_source
            inner join trial_cohort
                on first_source.user_id_cloud = trial_cohort.user_id_cloud
            left join ai_workflow_creators
                on first_source.user_id_cloud = ai_workflow_creators.user_id_cloud
            left join ai_workflow_publishers
                on first_source.user_id_cloud = ai_workflow_publishers.user_id_cloud
            left join ai_workflow_activators
                on first_source.user_id_cloud = ai_workflow_activators.user_id_cloud
            left join workflow_editors
                on first_source.user_id_cloud = workflow_editors.user_id_cloud
            left join execution_debuggers
                on first_source.user_id_cloud = execution_debuggers.user_id_cloud
        )

        , source_totals as (
            select
                entry_source,
                count(*) as users
            from cohort
            group by 1
        )

        , action_links as (
            select entry_source, 'Created AI workflow' as action_label, count(*) as users
            from cohort
            where created_ai_workflow
            group by 1

            union all

            select entry_source, 'Edited AI workflow', count(*)
            from cohort
            where edited_ai_workflow
            group by 1

            union all

            select entry_source, 'Debugged execution', count(*)
            from cohort
            where debugged_execution
            group by 1

            union all

            select entry_source, 'Published AI workflow', count(*)
            from cohort
            where published_ai_workflow
            group by 1

            union all

            select entry_source, 'Activated AI workflow', count(*)
            from cohort
            where activated_ai_workflow
            group by 1

            union all

            select entry_source, 'Converted (paid / s5)', count(*)
            from cohort
            where is_converted
            group by 1
        )

        select
            'source_size' as row_type,
            source_totals.entry_source as source_label,
            cast(null as string) as action_label,
            source_totals.users,
            round(
                safe_divide(
                    source_totals.users,
                    sum(source_totals.users) over ()
                ) * 100,
                1
            ) as pct_of_instance_ai_users
        from source_totals

        union all

        select
            'source_to_action' as row_type,
            action_links.entry_source as source_label,
            action_links.action_label,
            action_links.users,
            round(
                safe_divide(
                    action_links.users,
                    source_totals.users
                ) * 100,
                1
            ) as pct_of_instance_ai_users
        from action_links
        inner join source_totals
            on action_links.entry_source = source_totals.entry_source

        order by
            case row_type when 'source_size' then 0 else 1 end,
            users desc,
            source_label,
            action_label
      dataFrameCell: false
      dataConnectionId: 019ce681-e9fb-7002-ad50-b766bf65c6cf
