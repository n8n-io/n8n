                        )
                    )
                )
        )

        , cohort as (
            select
                trial_cohort.user_id_cloud,
                trial_cohort.is_converted,
                instance_ai_users.user_id_cloud is not null as used_instance_ai,
                ai_workflow_creators.user_id_cloud is not null as created_ai_workflow,
                ai_workflow_publishers.user_id_cloud is not null
                    as published_ai_workflow,
                workflow_editors.user_id_cloud is not null as edited_ai_workflow,
                execution_debuggers.user_id_cloud is not null as debugged_execution,
                (
                    workflow_editors.user_id_cloud is not null
                    or execution_debuggers.user_id_cloud is not null
                ) as edited_or_debugged
            from trial_cohort
            left join instance_ai_users
                on trial_cohort.user_id_cloud = instance_ai_users.user_id_cloud
            left join ai_workflow_creators
                on trial_cohort.user_id_cloud = ai_workflow_creators.user_id_cloud
            left join ai_workflow_publishers
                on trial_cohort.user_id_cloud = ai_workflow_publishers.user_id_cloud
            left join workflow_editors
                on trial_cohort.user_id_cloud = workflow_editors.user_id_cloud
            left join execution_debuggers
                on trial_cohort.user_id_cloud = execution_debuggers.user_id_cloud
        )

        , counts as (
            select
                count(*) as concluded_trials,
                countif(used_instance_ai) as used_instance_ai,
                countif(used_instance_ai and created_ai_workflow)
                    as created_ai_workflow,
                countif(
                    used_instance_ai
                    and created_ai_workflow
                    and published_ai_workflow
                ) as published_ai_workflow,
                countif(
                    used_instance_ai
                    and created_ai_workflow
                    and published_ai_workflow
                    and is_converted
                ) as converted_via_create_publish,
                countif(used_instance_ai and edited_ai_workflow) as edited_ai_workflow,
                countif(
                    used_instance_ai and edited_ai_workflow and is_converted
                ) as converted_via_edit,
                countif(used_instance_ai and debugged_execution) as debugged_execution,
                countif(
                    used_instance_ai and debugged_execution and is_converted
                ) as converted_via_debug
            from cohort
        )

        , funnel_stages as (
            select
                'Create & publish' as pathway,
                stage_order,
                funnel_stage,
                users
            from counts
            cross join unnest([
                struct(
                    1 as stage_order,
                    '1. Concluded trial users' as funnel_stage,
                    concluded_trials as users
                ),
                struct(2, '2. Used Instance AI during trial', used_instance_ai),
                struct(3, '3. Created AI Builder workflow', created_ai_workflow),
                struct(4, '4. Published AI-created workflow', published_ai_workflow),
                struct(5, '5. Converted (paid / s5)', converted_via_create_publish)
            ])

            union all

            select
                'Edit workflow' as pathway,
                stage_order,
                funnel_stage,
                users
            from counts
            cross join unnest([
                struct(
                    1 as stage_order,
                    '1. Concluded trial users' as funnel_stage,
                    concluded_trials as users
                ),
                struct(2, '2. Used Instance AI during trial', used_instance_ai),
                struct(3, '3. Edited workflow with Instance AI', edited_ai_workflow),
                struct(4, '4. Converted (paid / s5)', converted_via_edit)
            ])

            union all

            select
                'Debug execution' as pathway,
                stage_order,
                funnel_stage,
                users
            from counts
            cross join unnest([
                struct(
                    1 as stage_order,
                    '1. Concluded trial users' as funnel_stage,
                    concluded_trials as users
                ),
                struct(2, '2. Used Instance AI during trial', used_instance_ai),
                struct(
                    3,
                    '3. Debugged execution with Instance AI',
                    debugged_execution
                ),
                struct(4, '4. Converted (paid / s5)', converted_via_debug)
            ])
        )

        select
            pathway,
            stage_order,
            funnel_stage,
            users,
            round(
                safe_divide(
                    users,
                    first_value(users) over (
                        partition by pathway
                        order by stage_order
                    )
                ) * 100,
                2
            ) as pct_of_concluded_trials,
            round(
                safe_divide(
                    users,
                    lag(users) over (
                        partition by pathway
                        order by stage_order
                    )
                ) * 100,
                1
            ) as pct_of_previous_stage
        from funnel_stages
        order by pathway, stage_order
