  - cellType: SQL
    cellId: 019fc451-bd0b-7494-a9c4-3621b67b435f # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Execute-only stop patterns + error families
    config:
      source: |-
        -- Execute-only deep dive: stop-after-success + error taxonomy (last 3 weeks)
        with
        settings as (
            select
                timestamp(date_sub(current_date(), interval 3 week)) as start_at,
                {{ selected_n8n_version }} as selected_n8n_version
        )
        , internal_instances as (
            select distinct instance_id from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )
        , trial_cohort as (
            select
                funnel.user_id_cloud, funnel.instance_id,
                date(funnel.s4_at) as trial_started_date,
                coalesce(date(funnel.trial_win_end), date(funnel.s4_at)) as trial_end_date
            from `n8n-telemetry.computed.funnel_cloud_loose` as funnel
            left join internal_instances using (instance_id)
            cross join settings
            where funnel.s4_at is not null and funnel.trial_win_over
              and funnel.s4_at >= settings.start_at
              and funnel.user_id_cloud is not null
              and internal_instances.instance_id is null
        )
        , instance_ai_users as (
            select distinct t.user_id_cloud
            from `n8n-telemetry.rudder_schema.user_sent_builder_message` m
            inner join trial_cohort t
              on m.instance_id = t.instance_id
             and date(m.timestamp) between t.trial_started_date and t.trial_end_date
            cross join settings
            where m._partitiontime >= settings.start_at and m.timestamp >= settings.start_at
              and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(m.version_cli,'Unknown') = settings.selected_n8n_version
                    or (ends_with(settings.selected_n8n_version,'.*')
                        and starts_with(coalesce(m.version_cli,'Unknown'), replace(settings.selected_n8n_version,'*','')))
                )
        )
        , ai_created as (
            select t.user_id_cloud, t.trial_end_date, b.instance_id, b.workflow_id,
                   min(b.timestamp) as workflow_created_at
            from `n8n-telemetry.rudder_schema.builder_created_workflow` b
            inner join trial_cohort t
              on b.instance_id = t.instance_id
             and date(b.timestamp) between t.trial_started_date and t.trial_end_date
            inner join instance_ai_users u on t.user_id_cloud = u.user_id_cloud
            cross join settings
            where b._partitiontime >= settings.start_at and b.timestamp >= settings.start_at
              and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(b.version_cli,'Unknown') = settings.selected_n8n_version
                    or (ends_with(settings.selected_n8n_version,'.*')
                        and starts_with(coalesce(b.version_cli,'Unknown'), replace(settings.selected_n8n_version,'*','')))
                )
            group by 1,2,3,4
        )
        , pubs as (
            select instance_id, workflow_id, timestamp as published_at
            from `n8n-telemetry.rudder_schema.builder_published_workflow`
            cross join settings where _partitiontime >= settings.start_at and timestamp >= settings.start_at
            union all
            select context_traits_instance_id, workflow_id, timestamp
            from `n8n-telemetry.rudder_schema.user_published_version_from_canvas`
            cross join settings where _partitiontime >= settings.start_at and timestamp >= settings.start_at
            union all
            select instance_id, results_data_workflow_id, timestamp
            from `n8n-telemetry.rudder_schema.user_called_mcp_tool`
            cross join settings
            where _partitiontime >= settings.start_at and timestamp >= settings.start_at
              and results_success and tool_name='publish_workflow'
        )
        , acts as (
            select instance_id, workflow_id from `n8n-telemetry.rudder_schema.user_activated_workflow`
            cross join settings where _partitiontime >= settings.start_at and timestamp >= settings.start_at
            group by 1,2
        )
        , execs as (
            select instance_id, workflow_id, timestamp as executed_at,
                   lower(coalesce(status,'')) as status, error, exec_type
            from `n8n-telemetry.rudder_schema.builder_executed_workflow`
            cross join settings where _partitiontime >= settings.start_at and timestamp >= settings.start_at
        )
        , execute_only as (
            select c.user_id_cloud
            from ai_created c
            left join pubs p
              on c.instance_id=p.instance_id and c.workflow_id=p.workflow_id
             and c.workflow_created_at<=p.published_at
             and date(p.published_at)<=c.trial_end_date
            left join acts a
              on c.instance_id=a.instance_id and c.workflow_id=a.workflow_id
            left join execs e
              on c.instance_id=e.instance_id and c.workflow_id=e.workflow_id
             and c.workflow_created_at<=e.executed_at
            group by 1
            having countif(p.published_at is not null)=0
               and countif(a.workflow_id is not null)=0
               and countif(e.executed_at is not null)>0
        )
        , user_exec as (
            select
                c.user_id_cloud,
                count(*) as exec_count,
                countif(
                    e.status in ('error','failed','failure')
                    or e.error is not null
                ) as failed_execs,
                countif(
                    e.status in ('success','succeeded','ok','completed')
                    or (e.status='' and e.error is null)
                ) as success_execs,
                min(e.executed_at) as first_exec_at,
                max(e.executed_at) as last_exec_at,
                min(if(
                    e.status in ('success','succeeded','ok','completed')
                    or (e.status='' and e.error is null),
                    e.executed_at, null
                )) as first_success_at,
                array_agg(e.status ignore nulls order by e.executed_at desc limit 1)[offset(0)] as last_status,
                array_agg(e.error ignore nulls order by e.executed_at desc limit 1)[safe_offset(0)] as last_error,
                array_agg(e.exec_type ignore nulls order by e.executed_at desc limit 1)[safe_offset(0)] as last_exec_type
            from ai_created c
            inner join execute_only eo using (user_id_cloud)
            inner join execs e
              on c.instance_id=e.instance_id and c.workflow_id=e.workflow_id
             and c.workflow_created_at<=e.executed_at
             and date(e.executed_at)<=c.trial_end_date
            group by 1
        )
        , labeled as (
            select
                *,
                case
                    when success_execs > 0 and exec_count = 1
                        then 'A. One successful test run, then stopped'
                    when success_execs > 0 and last_error is null
                         and last_status in ('success','succeeded','ok','completed','')
                        then 'B. Got success; stopped without publishing'
                    when success_execs > 0 and (last_error is not null
                         or last_status in ('error','failed','failure'))
                        then 'C. Had success earlier; last run failed, stopped'
                    when success_execs = 0
                        then 'D. Only failed executions, never succeeded'
                    else 'E. Other'
                end as stop_pattern
            from user_exec
        )
        , pattern_summary as (
            select
                'pattern' as section,
                stop_pattern as key,
                count(*) as users,
                round(100*count(*)/sum(count(*)) over(), 1) as pct,
                round(avg(exec_count),2) as avg_execs
            from labeled
            group by 1,2
        )
        , status_summary as (
            select
                'last_status' as section,
                coalesce(nullif(last_status,''), '(blank)') as key,
                count(*) as users,
                round(100*count(*)/sum(count(*)) over(), 1) as pct,
                null as avg_execs
            from labeled
            group by 1,2
        )
        , error_taxonomy as (
            select
                'error_family' as section,
                case
                    when last_error is null then '(no error on last exec)'
                    when regexp_contains(lower(last_error), r'credential|auth|unauthorized|forbidden|api key|token|oauth|login')
                        then 'Credentials / auth'
                    when regexp_contains(lower(last_error), r'express?ion|invalid syntax|cannot read|undefined|null')
                        then 'Expression / data error'
                    when regexp_contains(lower(last_error), r'timeout|timed out|ECONN|network|ENOTFOUND|socket|fetch failed')
                        then 'Network / timeout'
                    when regexp_contains(lower(last_error), r'rate limit|429|quota|credit')
                        then 'Rate limit / credits'
                    when regexp_contains(lower(last_error), r'webhook|trigger|waiting')
                        then 'Trigger / webhook waiting'
                    when regexp_contains(lower(last_error), r'node .* not|unknown node|not installed|community')
                        then 'Missing / unsupported node'
                    when regexp_contains(lower(last_error), r'validation|required|must be|invalid')
                        then 'Validation / config'
                    else 'Other error'
                end as key,
                count(*) as users,
                round(100*count(*)/sum(count(*)) over(), 1) as pct,
                null as avg_execs
            from labeled
            where stop_pattern = 'D. Only failed executions, never succeeded'
               or stop_pattern = 'C. Had success earlier; last run failed, stopped'
            group by 1,2
        )
        select * from pattern_summary
        union all
        select * from status_summary
        union all
        select * from error_taxonomy
        order by section, users desc
      dataFrameCell: false
      dataConnectionId: 019ce681-e9fb-7002-ad50-b766bf65c6cf
      resultVariableName: execute_only_stop_patterns
