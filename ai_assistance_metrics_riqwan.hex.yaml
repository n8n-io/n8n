  - cellType: SQL
    cellId: 019fb269-7c15-7532-9f76-5cf52a157e03 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Trial conversion by Instance AI usage
    config:
      source: |
        with
        settings as (
            select
                timestamp(date_sub(current_date(), interval 6 month)) as start_at,
            {{ selected_n8n_version }} as selected_n8n_version
        )

        , internal_instances as (
            select distinct
                instance_id
            from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )

        , trial_cohort as (
            select
                funnel.user_id_cloud,
                funnel.instance_id,
                date(funnel.s4_at) as trial_started_date,
                coalesce(date(funnel.trial_win_end), date(funnel.s4_at))
                    as trial_end_date,
                funnel.s5_at is not null as is_converted
            from `n8n-telemetry.computed.funnel_cloud_loose` as funnel
            left join internal_instances
                on funnel.instance_id = internal_instances.instance_id
            cross join settings
            where
                funnel.s4_at is not null
                and funnel.trial_win_over is true
                and funnel.s4_at >= settings.start_at
                and funnel.user_id_cloud is not null
                and internal_instances.instance_id is null
        )

        , instance_ai_usage as (
            select distinct
                trial_cohort.user_id_cloud
            from `n8n-telemetry.rudder_schema.user_sent_builder_message`
                as user_messages
            inner join trial_cohort
                on
                    user_messages.instance_id = trial_cohort.instance_id
                    and date(
                        user_messages.timestamp
                    ) between trial_cohort.trial_started_date
                    and trial_cohort.trial_end_date
            cross join settings
            where
                user_messages._partitiontime >= settings.start_at
                and user_messages.timestamp >= settings.start_at
                and user_messages.instance_id is not null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(user_messages.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(user_messages.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
        )

        , cohort as (
            select
                trial_cohort.user_id_cloud,
                trial_cohort.is_converted,
                instance_ai_usage.user_id_cloud is not null as has_instance_ai_usage
            from trial_cohort
            left join instance_ai_usage
                on trial_cohort.user_id_cloud = instance_ai_usage.user_id_cloud
        )

        , grouped as (
            select
                case
                    when has_instance_ai_usage then 'Used Instance AI during trial'
                    else 'No Instance AI usage during trial'
                end as instance_ai_usage_segment,
                count(*) as trial_users,
                countif(is_converted) as converted_users,
                round(
                    safe_divide(countif(is_converted), count(*)) * 100,
                    2
                ) as conversion_rate_pct,
                1 as sort_order
            from cohort
            group by 1
        )

        , overall as (
            select
                'All concluded trial users' as instance_ai_usage_segment,
                count(*) as trial_users,
                countif(is_converted) as converted_users,
                round(
                    safe_divide(countif(is_converted), count(*)) * 100,
                    2
                ) as conversion_rate_pct,
                0 as sort_order
            from cohort
        )

        select
            instance_ai_usage_segment,
            trial_users,
            converted_users,
            conversion_rate_pct
        from grouped

        union all

        select
            instance_ai_usage_segment,
            trial_users,
            converted_users,
            conversion_rate_pct
        from overall

        order by
            case
                when instance_ai_usage_segment = 'All concluded trial users' then 0
                else 1
            end asc,
            trial_users desc
      dataFrameCell: false
      dataConnectionId: 019ce681-e9fb-7002-ad50-b766bf65c6cf
      resultVariableName: trial_conversion_by_instance_ai_usage
