  - cellType: SQL
    cellId: 019fc446-6b28-759b-88a3-43cf20faa607 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: MCP trial → conversion funnel
    config:
      source: |-
        with
        settings as (
            select
                timestamp(date_sub(current_date(), interval 3 week)) as start_at,
                {{ selected_n8n_version }} as selected_n8n_version
        )

        , internal_instances as (
            select distinct
                instance_id
            from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )

        , trial_cohort as (
            select
                funnel.user_id_cloud,
                funnel.instance_id,
                date(funnel.s4_at) as trial_started_date,
                coalesce(date(funnel.trial_win_end), date(funnel.s4_at))
                    as trial_end_date,
                funnel.s5_at is not null as is_converted
            from `n8n-telemetry.computed.funnel_cloud_loose` as funnel
            left join internal_instances
                on funnel.instance_id = internal_instances.instance_id
            cross join settings
            where
                funnel.s4_at is not null
                and funnel.trial_win_over is true
                and funnel.s4_at >= settings.start_at
                and funnel.user_id_cloud is not null
                and internal_instances.instance_id is null
        )

        , mcp_users as (
            select distinct
                trial_cohort.user_id_cloud
            from `n8n-telemetry.rudder_schema.user_called_mcp_tool` as mcp_tool_calls
            inner join trial_cohort
                on
                    mcp_tool_calls.instance_id = trial_cohort.instance_id
                    and date(mcp_tool_calls.timestamp)
                    between trial_cohort.trial_started_date
                    and trial_cohort.trial_end_date
            cross join settings
            where
                mcp_tool_calls._partitiontime >= settings.start_at
                and mcp_tool_calls.timestamp >= settings.start_at
                and mcp_tool_calls.instance_id is not null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(mcp_tool_calls.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(mcp_tool_calls.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
        )

        , mcp_workflow_creators as (
            select distinct
                trial_cohort.user_id_cloud
            from `n8n-telemetry.rudder_schema.user_created_workflow`
                as created_workflows
            inner join trial_cohort
                on
                    created_workflows.instance_id = trial_cohort.instance_id
                    and date(created_workflows.timestamp)
                    between trial_cohort.trial_started_date
                    and trial_cohort.trial_end_date
            cross join settings
            where
                created_workflows._partitiontime >= settings.start_at
                and created_workflows.timestamp >= settings.start_at
                and created_workflows.source = 'n8n-mcp'
                and created_workflows.instance_id is not null
                and created_workflows.workflow_id is not null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(created_workflows.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(created_workflows.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
        )

        , builder_publications as (
            select
                publish_events.instance_id,
                publish_events.workflow_id,
                publish_events.timestamp as workflow_published_at
            from `n8n-telemetry.rudder_schema.builder_published_workflow`
                as publish_events
            cross join settings
            where
                publish_events._partitiontime >= settings.start_at
                and publish_events.timestamp >= settings.start_at
                and publish_events.instance_id is not null
                and publish_events.workflow_id is not null
        )

        , canvas_publications as (
            select
                publish_events.context_traits_instance_id as instance_id,
                publish_events.workflow_id,
                publish_events.timestamp as workflow_published_at
            from `n8n-telemetry.rudder_schema.user_published_version_from_canvas`
                as publish_events
            cross join settings
            where
                publish_events._partitiontime >= settings.start_at
                and publish_events.timestamp >= settings.start_at
                and publish_events.context_traits_instance_id is not null
                and publish_events.workflow_id is not null
        )

        , mcp_publications as (
            select
                mcp_tool_calls.instance_id,
                mcp_tool_calls.results_data_workflow_id as workflow_id,
                mcp_tool_calls.timestamp as workflow_published_at
            from `n8n-telemetry.rudder_schema.user_called_mcp_tool` as mcp_tool_calls
            cross join settings
            where
                mcp_tool_calls._partitiontime >= settings.start_at
                and mcp_tool_calls.timestamp >= settings.start_at
                and mcp_tool_calls.results_success is true
                and mcp_tool_calls.tool_name = 'publish_workflow'
                and mcp_tool_calls.instance_id is not null
                and mcp_tool_calls.results_data_workflow_id is not null
        )

        , all_publications as (
            select * from builder_publications
            union all
            select * from canvas_publications
            union all
            select * from mcp_publications
        )

        , mcp_workflow_publishers as (
            select distinct
                mcp_created.user_id_cloud
            from (
                select
                    trial_cohort.user_id_cloud,
                    created_workflows.instance_id,
                    created_workflows.workflow_id,
                    min(created_workflows.timestamp) as workflow_created_at,
                    max(trial_cohort.trial_end_date) as trial_end_date
                from `n8n-telemetry.rudder_schema.user_created_workflow`
                    as created_workflows
                inner join trial_cohort
                    on
                        created_workflows.instance_id = trial_cohort.instance_id
                        and date(created_workflows.timestamp)
                        between trial_cohort.trial_started_date
                        and trial_cohort.trial_end_date
                cross join settings
                where
                    created_workflows._partitiontime >= settings.start_at
                    and created_workflows.timestamp >= settings.start_at
                    and created_workflows.source = 'n8n-mcp'
                    and created_workflows.instance_id is not null
                    and created_workflows.workflow_id is not null
                    and (
                        settings.selected_n8n_version = 'All versions'
                        or coalesce(created_workflows.version_cli, 'Unknown')
                        = settings.selected_n8n_version
                        or (
                            ends_with(settings.selected_n8n_version, '.*')
                            and starts_with(
                                coalesce(created_workflows.version_cli, 'Unknown'),
                                replace(settings.selected_n8n_version, '*', '')
                            )
                        )
                    )
                group by 1, 2, 3
            ) as mcp_created
            inner join all_publications
                on
                    mcp_created.instance_id = all_publications.instance_id
                    and mcp_created.workflow_id = all_publications.workflow_id
                    and mcp_created.workflow_created_at
                    <= all_publications.workflow_published_at
                    and date(all_publications.workflow_published_at)
                    <= mcp_created.trial_end_date
        )

        , cohort as (
            select
                trial_cohort.user_id_cloud,
                trial_cohort.is_converted,
                mcp_users.user_id_cloud is not null as used_mcp,
                mcp_workflow_creators.user_id_cloud is not null as created_mcp_workflow,
                mcp_workflow_publishers.user_id_cloud is not null
                    as published_mcp_workflow
            from trial_cohort
            left join mcp_users
                on trial_cohort.user_id_cloud = mcp_users.user_id_cloud
            left join mcp_workflow_creators
                on trial_cohort.user_id_cloud = mcp_workflow_creators.user_id_cloud
            left join mcp_workflow_publishers
                on trial_cohort.user_id_cloud = mcp_workflow_publishers.user_id_cloud
        )

        , counts as (
            select
                count(*) as concluded_trials,
                countif(used_mcp) as used_mcp,
                countif(used_mcp and created_mcp_workflow) as created_mcp_workflow,
                countif(
                    used_mcp
                    and created_mcp_workflow
                    and published_mcp_workflow
                ) as published_mcp_workflow,
                countif(
                    used_mcp
                    and created_mcp_workflow
                    and published_mcp_workflow
                    and is_converted
                ) as converted
            from cohort
        )

        select
            stage_order,
            funnel_stage,
            users,
            round(
                safe_divide(users, first_value(users) over (order by stage_order))
                * 100,
                2
            ) as pct_of_concluded_trials,
            round(
                safe_divide(
                    users,
                    lag(users) over (order by stage_order)
                ) * 100,
                1
            ) as pct_of_previous_stage
        from counts
        cross join unnest([
            struct(1 as stage_order, '1. Concluded trial users' as funnel_stage, concluded_trials as users),
            struct(2, '2. Used MCP during trial', used_mcp),
            struct(3, '3. Created MCP workflow', created_mcp_workflow),
            struct(4, '4. Published MCP-created workflow', published_mcp_workflow),
            struct(5, '5. Converted (paid / s5)', converted)
        ])
        order by stage_order
      dataFrameCell: false
      dataConnectionId: 019ce681-e9fb-7002-ad50-b766bf65c6cf
      resultVariableName: mcp_trial_conversion_funnel
      useRichDisplay: true
      enablePreview: true
      sqlCellOutputType: PANDAS
      useQueryMode: false
      castDecimals: true
      useNativeDates: true
      outputFilteredResult: true
      allowDuplicateColumns: false
      tableDisplayConfig:
        pageSize: 50
