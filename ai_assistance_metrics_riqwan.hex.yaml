  - cellType: SQL
    cellId: 019fafe5-32aa-743e-9eeb-3c02eb0f0768 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Current workflow creation sources
    config:
      source: |
        with
        settings as (
            select
                timestamp(date_trunc(current_date(), week (monday))) as start_at,
            {{ selected_n8n_version }} as selected_n8n_version
        )

        , internal_instances as (
            select distinct
                instance_id
            from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )

        , trial_windows as (
            select distinct
                instance_id,
                trial_started_date,
                least(
                    trial_expiry_date,
                    coalesce(trial_converted_date, trial_expiry_date)
                ) as trial_end_date
            from `n8n-telemetry.marts.fct_trials`
            cross join settings
            where
                instance_id is not null
                and trial_started_date <= current_date()
                and trial_expiry_date >= date(settings.start_at)
        )

        , builder_created as (
            select distinct
                'Instance AI / AI Builder' as creation_source,
                1 as source_priority,
                concat(
                    builder_workflows.instance_id,
                    '#',
                    builder_workflows.workflow_id
                ) as instance_workflow_id
            from
                `n8n-telemetry.rudder_schema.builder_created_workflow`
                    as builder_workflows
            inner join trial_windows
                on
                    builder_workflows.instance_id = trial_windows.instance_id
                    and date(
                        builder_workflows.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on builder_workflows.instance_id = internal_instances.instance_id
            cross join settings
            where
                builder_workflows._partitiontime >= settings.start_at
                and builder_workflows.timestamp >= settings.start_at
                and builder_workflows.instance_id is not null
                and builder_workflows.workflow_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(builder_workflows.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(builder_workflows.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
        )

        , other_created as (
            select distinct
                2 as source_priority,
                concat(
                    created_workflows.instance_id,
                    '#',
                    created_workflows.workflow_id
                ) as instance_workflow_id,
                case
                    when created_workflows.source = 'ui' then 'UI'
                    when created_workflows.source = 'api' then 'API'
                    when created_workflows.source = 'n8n-mcp' then 'MCP'
                    when created_workflows.source = 'import' then 'Import'
                    else 'Other'
                end as creation_source
            from
                `n8n-telemetry.rudder_schema.user_created_workflow`
                    as created_workflows
            inner join trial_windows
                on
                    created_workflows.instance_id = trial_windows.instance_id
                    and date(
                        created_workflows.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on created_workflows.instance_id = internal_instances.instance_id
            cross join settings
            where
                created_workflows._partitiontime >= settings.start_at
                and created_workflows.timestamp >= settings.start_at
                and created_workflows.instance_id is not null
                and created_workflows.workflow_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(created_workflows.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(created_workflows.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
        )

        , combined as (
            select
                instance_workflow_id,
                creation_source,
                source_priority
            from builder_created

            union all

            select
                instance_workflow_id,
                creation_source,
                source_priority
            from other_created
        )

        , classified as (
            select
                instance_workflow_id,
                array_agg(creation_source order by source_priority limit 1)[offset(0)]
                    as creation_source
            from combined
            group by 1
        )

        , source_counts as (
            select
                creation_source,
                count(*) as workflows_created
            from classified
            group by 1
        )

        select
            creation_source,
            workflows_created,
            round(
                safe_divide(
                    workflows_created,
                    sum(workflows_created) over ()
                ) * 100,
                1
            ) as share_pct
        from source_counts
        order by 2 desc
