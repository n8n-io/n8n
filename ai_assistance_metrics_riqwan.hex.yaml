  - cellType: SQL
    cellId: 019fd3fa-41dd-7759-b559-5695bf2747d1 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: "tmp probe: Instance AI trial count diagnosis"
    config:
      source: |-
        -- Diagnose why Instance AI trial-user counts look too low
        with
        settings as (
            select
                timestamp('2026-07-07') as start_at,
                date('2026-07-07') as start_date
        )

        , internal_instances as (
            select distinct instance_id
            from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )

        , raw_msgs as (
            select
                count(*) as msg_events,
                count(distinct instance_id) as distinct_instances,
                countif(instance_id is null) as null_instance_id
            from `n8n-telemetry.rudder_schema.user_sent_builder_message`
            cross join settings
            where
                _partitiontime >= settings.start_at
                and timestamp >= settings.start_at
        )

        , fct_trials_overlap as (
            select
                count(*) as trial_rows,
                count(distinct user_cloud_id) as distinct_users,
                count(distinct instance_id) as distinct_instances
            from `n8n-telemetry.marts.fct_trials` as trials
            left join internal_instances using (instance_id)
            cross join settings
            where
                trials.instance_id is not null
                and trials.user_cloud_id is not null
                and trials.trial_started_date <= current_date()
                and trials.trial_expiry_date >= settings.start_date
                and internal_instances.instance_id is null
        )

        , fct_joined as (
            select
                count(distinct trials.user_cloud_id) as users_with_msg,
                count(distinct trials.instance_id) as instances_with_msg,
                count(*) as joined_msg_rows
            from `n8n-telemetry.rudder_schema.user_sent_builder_message` as m
            inner join `n8n-telemetry.marts.fct_trials` as trials
                on m.instance_id = trials.instance_id
                and date(m.timestamp) between trials.trial_started_date
                and least(
                    trials.trial_expiry_date,
                    coalesce(trials.trial_converted_date, trials.trial_expiry_date),
                    current_date()
                )
            left join internal_instances
                on trials.instance_id = internal_instances.instance_id
            cross join settings
            where
                m._partitiontime >= settings.start_at
                and m.timestamp >= settings.start_at
                and m.instance_id is not null
                and trials.user_cloud_id is not null
                and trials.trial_started_date <= current_date()
                and trials.trial_expiry_date >= settings.start_date
                and internal_instances.instance_id is null
        )

        , funnel_concluded as (
            select
                count(*) as concluded_trials,
                count(distinct funnel.user_id_cloud) as distinct_users
            from `n8n-telemetry.computed.funnel_cloud_loose` as funnel
            left join internal_instances
                on funnel.instance_id = internal_instances.instance_id
            cross join settings
            where
                funnel.s4_at is not null
                and funnel.trial_win_over is true
                and funnel.s4_at >= settings.start_at
                and funnel.user_id_cloud is not null
                and internal_instances.instance_id is null
        )

        , funnel_joined as (
            select
                count(distinct funnel.user_id_cloud) as users_with_msg,
                count(distinct funnel.instance_id) as instances_with_msg
            from `n8n-telemetry.computed.funnel_cloud_loose` as funnel
            inner join `n8n-telemetry.rudder_schema.user_sent_builder_message` as m
                on m.instance_id = funnel.instance_id
                and date(m.timestamp) between date(funnel.s4_at)
                and coalesce(date(funnel.trial_win_end), date(funnel.s4_at))
            left join internal_instances
                on funnel.instance_id = internal_instances.instance_id
            cross join settings
            where
                funnel.s4_at is not null
                and funnel.trial_win_over is true
                and funnel.s4_at >= settings.start_at
                and funnel.user_id_cloud is not null
                and internal_instances.instance_id is null
                and m._partitiontime >= settings.start_at
                and m.timestamp >= settings.start_at
                and m.instance_id is not null
        )

        , funnel_joined_loose_time as (
            -- Same concluded cohort, but message anytime since start_at (ignore in-trial date join)
            select count(distinct funnel.user_id_cloud) as users_with_msg_anytime
            from `n8n-telemetry.computed.funnel_cloud_loose` as funnel
            inner join `n8n-telemetry.rudder_schema.user_sent_builder_message` as m
                on m.instance_id = funnel.instance_id
            left join internal_instances
                on funnel.instance_id = internal_instances.instance_id
            cross join settings
            where
                funnel.s4_at is not null
                and funnel.trial_win_over is true
                and funnel.s4_at >= settings.start_at
                and funnel.user_id_cloud is not null
                and internal_instances.instance_id is null
                and m._partitiontime >= settings.start_at
                and m.timestamp >= settings.start_at
                and m.instance_id is not null
        )

        select
            (select msg_events from raw_msgs) as raw_msg_events,
            (select distinct_instances from raw_msgs) as raw_msg_instances,
            (select trial_rows from fct_trials_overlap) as fct_trial_rows,
            (select distinct_users from fct_trials_overlap) as fct_trial_users,
            (select users_with_msg from fct_joined) as fct_users_with_msg_in_trial,
            (select instances_with_msg from fct_joined) as fct_instances_with_msg_in_trial,
            (select concluded_trials from funnel_concluded) as funnel_concluded_trials,
            (select users_with_msg from funnel_joined) as funnel_users_with_msg_in_trial,
            (select users_with_msg_anytime from funnel_joined_loose_time) as funnel_users_with_msg_anytime
      dataFrameCell: false
      dataConnectionId: 019ce681-e9fb-7002-ad50-b766bf65c6cf
      resultVariableName: tmp_probe_instance_ai_counts
      useRichDisplay: true
      enablePreview: true
      sqlCellOutputType: PANDAS
