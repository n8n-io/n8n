  - cellType: CODE
    cellId: 019fc453-bf17-7620-9036-98c53dd93092 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Concluded trial users entry source → actions Sankey
    config:
      source: |-
        import plotly.graph_objects as go
        from plotly.subplots import make_subplots
        import pandas as pd

        df = instance_ai_entry_source_actions.copy()

        source_sizes = df[df["row_type"] == "source_size"].copy()
        links = df[df["row_type"] == "source_to_action"].copy()

        total_users = int(source_sizes["users"].sum())
        unknown_users = int(
            source_sizes.loc[
                source_sizes["source_label"] == "Unknown / legacy", "users"
            ].sum()
        )
        known_sizes = source_sizes[source_sizes["source_label"] != "Unknown / legacy"].copy()
        known_links = links[links["source_label"] != "Unknown / legacy"].copy()

        known_sizes = known_sizes.sort_values("users", ascending=False).reset_index(drop=True)
        action_order = [
            "Created AI workflow",
            "Edited AI workflow",
            "Debugged execution",
            "Published AI workflow",
            "Activated AI workflow",
            "Converted (paid / s5)",
        ]
        actions = [a for a in action_order if a in set(known_links["action_label"])]
        source_labels = known_sizes["source_label"].tolist()
        node_labels = source_labels + actions
        node_index = {label: i for i, label in enumerate(node_labels)}

        palette = [
            "#2f6fed",
            "#e67e22",
            "#8e44ad",
            "#16a085",
            "#c0392b",
            "#2980b9",
            "#d35400",
            "#9b59b6",
        ]
        source_colors = {
            label: palette[i % len(palette)] for i, label in enumerate(source_labels)
        }
        action_colors = {
            "Created AI workflow": "#3498db",
            "Edited AI workflow": "#e67e22",
            "Debugged execution": "#8e44ad",
            "Published AI workflow": "#27ae60",
            "Activated AI workflow": "#1abc9c",
