                and activation_events.timestamp >= settings.start_at
                and activation_events.instance_id is not null
                and activation_events.workflow_id is not null
        )

        , library_publications as (
            select
                library_events.context_traits_instance_id as instance_id,
                library_events.workflow_id,
                library_events.timestamp as library_published_at
            from `n8n-telemetry.rudder_schema.workflow_library_published`
                as library_events
            cross join settings
            where
                library_events._partitiontime >= settings.start_at
                and library_events.timestamp >= settings.start_at
                and library_events.context_traits_instance_id is not null
                and library_events.workflow_id is not null
        )

        , additional_publish_checks as (
            select
                builder_created.instance_id,
                builder_created.workflow_id,
                countif(
                    activation_events.activated_at >= builder_created.workflow_created_at
                ) > 0 as has_activation_event,
                countif(
                    library_publications.library_published_at
                        >= builder_created.workflow_created_at
                ) > 0 as has_library_publication
            from builder_created
            left join activation_events
                on
                    builder_created.instance_id = activation_events.instance_id
                    and builder_created.workflow_id = activation_events.workflow_id
            left join library_publications
                on
                    builder_created.instance_id = library_publications.instance_id
                    and builder_created.workflow_id = library_publications.workflow_id
            group by 1, 2
        )

        , first_publication as (
            select
                builder_created.instance_id,
                builder_created.workflow_id,
                min(all_publications.workflow_published_at) as first_published_at,
                array_agg(
                    all_publications.publication_channel
                    order by all_publications.workflow_published_at
                    limit 1
                )[safe_offset(0)] as first_publication_channel
            from builder_created
            left join all_publications
                on
                    builder_created.instance_id = all_publications.instance_id
                    and builder_created.workflow_id = all_publications.workflow_id
                    and builder_created.workflow_created_at
                    <= all_publications.workflow_published_at
            group by 1, 2
        )

        , cohort as (
            select
                builder_created.instance_id,
                builder_created.workflow_id,
                builder_created.workflow_created_at,
                builder_created.trial_end_date,
                first_publication.first_published_at,
                first_publication.first_publication_channel,
                additional_publish_checks.has_activation_event,
                additional_publish_checks.has_library_publication
            from builder_created
            left join first_publication
                on
                    builder_created.instance_id = first_publication.instance_id
                    and builder_created.workflow_id = first_publication.workflow_id
            left join additional_publish_checks
                on
                    builder_created.instance_id = additional_publish_checks.instance_id
                    and builder_created.workflow_id
                    = additional_publish_checks.workflow_id
        )

        select
            count(*) as ai_builder_workflows_created,
            countif(first_published_at is not null) as published_any_channel,
            countif(
                first_publication_channel = 'Instance AI / AI Builder'
            ) as published_by_instance_ai,
            countif(
                first_publication_channel in ('Canvas', 'MCP')
            ) as published_other_ways,
            countif(first_published_at is null) as not_yet_published,
            countif(has_activation_event and first_published_at is null)
                as activation_without_known_publication,
            countif(has_library_publication) as library_publications,
            countif(has_library_publication and first_published_at is null)
                as library_without_known_publication,
            round(
                safe_divide(
                    countif(first_published_at is not null),
                    count(*)
                ) * 100,
                1
            ) as publish_rate_pct,
            countif(date(first_published_at) <= trial_end_date)
                as published_during_trial,
            round(
                safe_divide(
                    countif(date(first_published_at) <= trial_end_date),
                    count(*)
                ) * 100,
                1
            ) as published_during_trial_rate_pct
        from cohort
