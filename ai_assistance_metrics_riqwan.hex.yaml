    cellId: 019fa415-7ca2-764b-ae5c-47150dd28b28 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: n8n version
    config:
      inputType: DROPDOWN
      name: selected_n8n_version
      outputType: DYNAMIC
      options:
        valueOptions:
          variableName: n8n_version_options['n8n_version']
          dfName: n8n_version_options
