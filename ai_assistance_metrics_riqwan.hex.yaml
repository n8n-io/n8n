  - cellType: SQL
    cellId: 019fb255-0df6-7128-821a-4e1a53661834 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Trial AI Builder users purchasing credits
    config:
      source: |-
        with
        settings as (
            select
                timestamp(date_trunc(current_date(), week (monday))) as start_at,
            {{ selected_n8n_version }} as selected_n8n_version
        )

        , internal_instances as (
            select distinct
                instance_id
            from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )

        , trial_windows as (
            select distinct
                user_cloud_id,
                trial_number,
                instance_id,
                trial_started_date,
                least(
                    trial_expiry_date,
                    coalesce(trial_converted_date, trial_expiry_date)
                ) as trial_end_date
            from `n8n-telemetry.marts.fct_trials`
            cross join settings
            where
                instance_id is not null
                and trial_started_date <= current_date()
                and trial_expiry_date >= date(settings.start_at)
        )

        , ai_builder_trial_users as (
            select distinct
                trial_windows.user_cloud_id
            from
                `n8n-telemetry.rudder_schema.builder_created_workflow`
                    as builder_events
            inner join trial_windows
                on
                    builder_events.instance_id = trial_windows.instance_id
                    and date(
                        builder_events.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on builder_events.instance_id = internal_instances.instance_id
            cross join settings
            where
                builder_events._partitiontime >= settings.start_at
                and builder_events.timestamp >= settings.start_at
                and builder_events.instance_id is not null
                and builder_events.workflow_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(builder_events.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(builder_events.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
        )

        , user_credit_status as (
            select
                ai_builder_trial_users.user_cloud_id,
                pricing_users.credits_quota_current,
                pricing_users.cloud_id is not null as is_in_pricing_cohort,
                coalesce(pricing_users.is_converted_to_paid, false)
                    as is_converted_to_paid,
                coalesce(pricing_users.tier_change_resets, 0) > 0
                    as has_tier_change_credit_reset
            from ai_builder_trial_users
            left join
                `n8n-telemetry.reporting.report_instance_ai_pricing_experiment_users`
                    as pricing_users
                on
                    cast(ai_builder_trial_users.user_cloud_id as string)
                    = pricing_users.cloud_id
        )

        select
            count(*) as ai_builder_trial_users,
            countif(is_in_pricing_cohort) as users_in_pricing_cohort,
            countif(is_converted_to_paid) as users_purchased_credits,
            round(
                safe_divide(
                    countif(is_converted_to_paid),
