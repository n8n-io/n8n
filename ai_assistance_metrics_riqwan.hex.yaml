        - Created AI workflow (`builder_created_workflow`)
        - Edited AI workflow (`builder_modified_workflow`, excluding follow-up edits of a workflow created in the same thread)
        - Debugged execution (any trial message with `action_source = node_error_view`)
        - Published AI workflow (Builder / Canvas / MCP)
        - Activated AI workflow (`user_activated_workflow` on an AI-created workflow, in-trial)
        - Converted (`fct_trials.is_converted`)

        Unknown / legacy is omitted from the Sankey and kept in the rate table.
