  - cellType: SQL
    cellId: 019fb25e-7607-749f-8622-3b5cceb95085 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Weekly trial workflow metrics
    config:
      source: |-
        with
        settings as (
            select
                timestamp('2026-07-07') as start_at,
            {{ selected_n8n_version }} as selected_n8n_version
        )

        , internal_instances as (
            select distinct
                instance_id
            from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )

        , trial_windows as (
            select distinct
                instance_id,
                trial_started_date,
                least(
                    trial_expiry_date,
                    coalesce(trial_converted_date, trial_expiry_date)
                ) as trial_end_date
            from `n8n-telemetry.marts.fct_trials`
            cross join settings
            where
                instance_id is not null
                and trial_started_date <= current_date()
                and trial_expiry_date >= date(settings.start_at)
        )

        , ai_created_weekly as (
            select
                greatest(
                    date_trunc(date(workflows.timestamp), week (monday)),
                    date(settings.start_at)
                ) as week_start,
                count(
                    distinct concat(workflows.instance_id, '#', workflows.workflow_id)
                ) as workflows_created
            from `n8n-telemetry.rudder_schema.builder_created_workflow` as workflows
            inner join trial_windows
                on
                    workflows.instance_id = trial_windows.instance_id
                    and date(
                        workflows.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on workflows.instance_id = internal_instances.instance_id
            cross join settings
            where
                workflows._partitiontime >= settings.start_at
                and workflows.timestamp >= settings.start_at
                and workflows.instance_id is not null
                and workflows.workflow_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(workflows.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(workflows.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1
        )

        , ai_published_weekly as (
            select
                greatest(
                    date_trunc(date(workflows.timestamp), week (monday)),
                    date(settings.start_at)
                ) as week_start,
                count(
                    distinct concat(workflows.instance_id, '#', workflows.workflow_id)
                ) as workflows_published
            from `n8n-telemetry.rudder_schema.builder_published_workflow` as workflows
            inner join trial_windows
                on
                    workflows.instance_id = trial_windows.instance_id
                    and date(
                        workflows.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on workflows.instance_id = internal_instances.instance_id
            cross join settings
            where
                workflows._partitiontime >= settings.start_at
                and workflows.timestamp >= settings.start_at
                and workflows.instance_id is not null
                and workflows.workflow_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(workflows.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(workflows.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1
        )

        , non_ai_created_weekly as (
            select
                greatest(
                    date_trunc(date(workflows.timestamp), week (monday)),
                    date(settings.start_at)
                ) as week_start,
                count(
                    distinct concat(workflows.instance_id, '#', workflows.workflow_id)
                ) as non_ai_workflows_created
            from `n8n-telemetry.rudder_schema.user_created_workflow` as workflows
            inner join trial_windows
                on
                    workflows.instance_id = trial_windows.instance_id
                    and date(
                        workflows.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on workflows.instance_id = internal_instances.instance_id
            cross join settings
            where
                workflows._partitiontime >= settings.start_at
                and workflows.timestamp >= settings.start_at
                and coalesce(workflows.source, 'Unknown') != 'n8n-mcp'
                and workflows.instance_id is not null
                and workflows.workflow_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(workflows.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(workflows.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1
        )

        , canvas_published_weekly as (
            select
                greatest(
                    date_trunc(date(workflows.timestamp), week (monday)),
                    date(settings.start_at)
                ) as week_start,
                count(
                    distinct concat(
                        workflows.context_traits_instance_id,
                        '#',
                        workflows.workflow_id
                    )
                ) as non_ai_workflows_published
            from
                `n8n-telemetry.rudder_schema.user_published_version_from_canvas`
                    as workflows
            inner join trial_windows
                on
                    workflows.context_traits_instance_id = trial_windows.instance_id
                    and date(
                        workflows.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on workflows.context_traits_instance_id = internal_instances.instance_id
            cross join settings
            where
                workflows._partitiontime >= settings.start_at
                and workflows.timestamp >= settings.start_at
                and workflows.context_traits_instance_id is not null
                and workflows.workflow_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(workflows.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(workflows.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1
        )

        , mcp_workflows_weekly as (
            select
                greatest(
                    date_trunc(date(mcp_tool_calls.timestamp), week (monday)),
                    date(settings.start_at)
                ) as week_start,
                count(
                    distinct if(
                        mcp_tool_calls.tool_name = 'create_workflow_from_code',
                        concat(
                            mcp_tool_calls.instance_id,
                            '#',
                            mcp_tool_calls.results_data_workflow_id
                        ),
                        null
                    )
                ) as mcp_workflows_created,
                count(
                    distinct if(
                        mcp_tool_calls.tool_name = 'publish_workflow',
                        concat(
                            mcp_tool_calls.instance_id,
                            '#',
                            mcp_tool_calls.results_data_workflow_id
                        ),
                        null
                    )
                ) as mcp_workflows_published
            from `n8n-telemetry.rudder_schema.user_called_mcp_tool` as mcp_tool_calls
            inner join trial_windows
                on
                    mcp_tool_calls.instance_id = trial_windows.instance_id
                    and date(
                        mcp_tool_calls.timestamp
                    ) between trial_windows.trial_started_date
                    and trial_windows.trial_end_date
            left join internal_instances
                on mcp_tool_calls.instance_id = internal_instances.instance_id
            cross join settings
            where
                mcp_tool_calls._partitiontime >= settings.start_at
                and mcp_tool_calls.timestamp >= settings.start_at
                and mcp_tool_calls.results_success is true
                and mcp_tool_calls.tool_name in (
                    'create_workflow_from_code',
                    'publish_workflow'
                )
                and mcp_tool_calls.instance_id is not null
                and mcp_tool_calls.results_data_workflow_id is not null
                and internal_instances.instance_id is null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(mcp_tool_calls.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(mcp_tool_calls.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1
        )

        , all_weeks as (
            select distinct week_start
            from (
                select week_start from ai_created_weekly
                union all
                select week_start from ai_published_weekly
                union all
                select week_start from non_ai_created_weekly
                union all
                select week_start from canvas_published_weekly
                union all
                select week_start from mcp_workflows_weekly
            )
        )

        select
            all_weeks.week_start,
            coalesce(ai_created_weekly.workflows_created, 0) as workflows_created,
            coalesce(ai_published_weekly.workflows_published, 0) as workflows_published,
            coalesce(non_ai_created_weekly.non_ai_workflows_created, 0)
                as non_ai_workflows_created,
            coalesce(canvas_published_weekly.non_ai_workflows_published, 0)
                as non_ai_workflows_published,
            coalesce(mcp_workflows_weekly.mcp_workflows_created, 0)
                as mcp_workflows_created,
            coalesce(mcp_workflows_weekly.mcp_workflows_published, 0)
                as mcp_workflows_published
        from all_weeks
        left join ai_created_weekly
            on all_weeks.week_start = ai_created_weekly.week_start
        left join ai_published_weekly
            on all_weeks.week_start = ai_published_weekly.week_start
        left join non_ai_created_weekly
            on all_weeks.week_start = non_ai_created_weekly.week_start
        left join canvas_published_weekly
            on all_weeks.week_start = canvas_published_weekly.week_start
        left join mcp_workflows_weekly
            on all_weeks.week_start = mcp_workflows_weekly.week_start
        order by 1
      dataFrameCell: false
      dataConnectionId: 019ce681-e9fb-7002-ad50-b766bf65c6cf
