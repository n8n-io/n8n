    cellId: 019fcecb-f2be-700d-a644-123f0f61fb68 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: All trial users entry source → actions notes
    config:
      source: |-
        ### All trial users: entry source → actions

        Same Sankey as above, but for **all cloud trial users** (open + concluded) whose trial window overlaps the last 3 weeks — not only concluded trials.

        Also respects the notebook **n8n version** filter.

        Cohort: `marts.fct_trials` (excl. n8n.io). Each user is attributed to their **first non-unknown** `user_sent_builder_message.action_source` during the trial ∩ last-3-weeks window on the selected version(s).

