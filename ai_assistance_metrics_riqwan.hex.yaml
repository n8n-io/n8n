  - cellType: MARKDOWN
    cellId: 019fc440-06cc-75bf-b2b6-aac6aaac0aff # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Instance AI conversion funnel notes
    config:
      source: |
        ### Funnel definition
        Strict nested stages for **concluded cloud trials** in the last 3 weeks (excludes `n8n.io`), using the same conversion definition as *Trial conversion by Instance AI usage* (`funnel_cloud_loose.s5_at`).

        Shared top of funnel:
        1. Concluded trial users
        2. Sent at least one Instance AI / builder message during the trial window

        **Create & publish**
        3. Created at least one AI Builder workflow during the trial
        4. Published at least one of those AI-created workflows during the trial (Builder / Canvas / MCP)
        5. Converted to paid (`s5_at`)

        **Edit workflow**
        3. Edited a workflow with Instance AI (`builder_modified_workflow`) during the trial
        4. Converted to paid (`s5_at`)

        **Debug execution**
        3. Debugged from a node error (`user_sent_builder_message.action_source = 'node_error_view'`) during the trial
        4. Converted to paid (`s5_at`)

        Pathways are not mutually exclusive — a user can appear in more than one. Respects the `n8n version` input filter.
  - cellType: CODE
    cellId: 019fc440-029b-76be-acaa-4061fd4c4610 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Instance AI trial → conversion funnel chart
    config:
      source: |
        from plotly.subplots import make_subplots
        import plotly.graph_objects as go

        funnel_df = instance_ai_trial_conversion_funnel.sort_values(
            ["pathway", "stage_order"]
        )

        pathway_styles = {
            "Create & publish": "#2f6fed",
            "Edit workflow": "#e67e22",
            "Debug execution": "#8e44ad",
        }

        fig = make_subplots(
            rows=1,
            cols=3,
            subplot_titles=list(pathway_styles.keys()),
            specs=[[{"type": "funnel"}, {"type": "funnel"}, {"type": "funnel"}]],
            horizontal_spacing=0.08,
        )

        for col, (pathway, color) in enumerate(pathway_styles.items(), start=1):
            pathway_df = funnel_df[funnel_df["pathway"] == pathway]
            fig.add_trace(
                go.Funnel(
                    name=pathway,
                    y=pathway_df["funnel_stage"],
                    x=pathway_df["users"],
                    textinfo="value+percent initial",
                    hovertemplate=(
                        "%{y}<br>Users: %{x:,}"
                        "<br>% of concluded trials: %{percentInitial:.1%}"
                        "<br>% of previous stage: %{percentPrevious:.1%}"
                        "<extra></extra>"
                    ),
                    marker={"color": color},
                    showlegend=False,
                ),
                row=1,
                col=col,
            )

        fig.update_layout(
            title="Instance AI trial → conversion pathways (last 3 weeks)",
            margin=dict(l=10, r=10, t=80, b=20),
            height=520,
        )

        fig.show()
