  - cellType: SQL
    cellId: 019fd3f6-c58d-73b1-8808-b9ffca3b2f29 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Trial activation + conversion by Instance AI usage
    config:
      source: |-
        -- Trial activation + conversion by Instance AI usage
        -- Cohort: concluded cloud trials in the since 2026-07-07 (Instance AI availability window) (excl. n8n.io),
        -- same base as "Trial conversion by Instance AI usage".
        -- Usage: ≥1 user_sent_builder_message during the trial window.
        -- Meaningful: ≥2 user messages OR created an AI Builder workflow in-trial.
        -- Activation: fct_trials.activated_at falls within the trial window.
        -- Conversion: funnel_cloud_loose.s5_at is not null.
        with
        settings as (
            select
                timestamp('2026-07-07') as start_at,
                {{ selected_n8n_version }} as selected_n8n_version
        )

        , internal_instances as (
            select distinct
                instance_id
            from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )

        , trial_cohort as (
            select
                funnel.user_id_cloud,
                funnel.instance_id,
                date(funnel.s4_at) as trial_started_date,
                coalesce(date(funnel.trial_win_end), date(funnel.s4_at)) as trial_end_date,
                funnel.s5_at is not null as is_converted
            from `n8n-telemetry.computed.funnel_cloud_loose` as funnel
            left join internal_instances
                on funnel.instance_id = internal_instances.instance_id
            cross join settings
            where
                funnel.s4_at is not null
                and funnel.trial_win_over is true
                and funnel.s4_at >= settings.start_at
                and funnel.user_id_cloud is not null
                and internal_instances.instance_id is null
        )

        , activation as (
            select
                cast(trials.user_cloud_id as string) as user_id_cloud,
                max(
                    trials.activated_at is not null
                    and date(trials.activated_at) between date(trials.trial_started_date)
                    and least(
                        trials.trial_expiry_date,
                        coalesce(trials.trial_converted_date, trials.trial_expiry_date)
                    )
                ) as is_activated
            from `n8n-telemetry.marts.fct_trials` as trials
            inner join trial_cohort
                on cast(trials.user_cloud_id as string) = trial_cohort.user_id_cloud
                and trials.instance_id = trial_cohort.instance_id
            group by 1
        )

        , instance_ai_messages as (
            select
                trial_cohort.user_id_cloud,
                count(*) as user_message_count
            from `n8n-telemetry.rudder_schema.user_sent_builder_message` as user_messages
            inner join trial_cohort
                on
                    user_messages.instance_id = trial_cohort.instance_id
                    and date(user_messages.timestamp) between trial_cohort.trial_started_date
                    and trial_cohort.trial_end_date
            cross join settings
            where
                user_messages._partitiontime >= settings.start_at
                and user_messages.timestamp >= settings.start_at
                and user_messages.instance_id is not null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(user_messages.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(user_messages.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1
        )

        , ai_workflow_creators as (
            select distinct
                trial_cohort.user_id_cloud
            from `n8n-telemetry.rudder_schema.builder_created_workflow` as builder_events
            inner join trial_cohort
                on
                    builder_events.instance_id = trial_cohort.instance_id
                    and date(builder_events.timestamp) between trial_cohort.trial_started_date
                    and trial_cohort.trial_end_date
            cross join settings
            where
                builder_events._partitiontime >= settings.start_at
                and builder_events.timestamp >= settings.start_at
                and builder_events.instance_id is not null
                and builder_events.workflow_id is not null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(builder_events.version_cli, 'Unknown')
                    = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(builder_events.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
        )

        , cohort as (
            select
                trial_cohort.user_id_cloud,
                coalesce(activation.is_activated, false) as is_activated,
                trial_cohort.is_converted,
                coalesce(instance_ai_messages.user_message_count, 0) as user_message_count,
                instance_ai_messages.user_id_cloud is not null as has_any_instance_ai_usage,
                (
                    coalesce(instance_ai_messages.user_message_count, 0) >= 2
                    or ai_workflow_creators.user_id_cloud is not null
                ) as has_meaningful_instance_ai_usage
            from trial_cohort
            left join activation
                on trial_cohort.user_id_cloud = activation.user_id_cloud
            left join instance_ai_messages
                on trial_cohort.user_id_cloud = instance_ai_messages.user_id_cloud
            left join ai_workflow_creators
                on trial_cohort.user_id_cloud = ai_workflow_creators.user_id_cloud
        )

        , segments as (
            select
                'Any Instance AI usage (≥1 message)' as usage_definition,
                case
                    when has_any_instance_ai_usage then 'Used Instance AI during trial'
                    else 'No Instance AI usage during trial'
                end as usage_segment,
                *
            from cohort

            union all

            select
                'Meaningful (≥2 messages or AI-created workflow)' as usage_definition,
                case
                    when has_meaningful_instance_ai_usage
                        then 'Meaningful Instance AI usage during trial'
                    else 'No meaningful Instance AI usage during trial'
                end as usage_segment,
                *
            from cohort
        )

        , grouped as (
            select
                usage_definition,
                usage_segment,
                count(*) as trial_users,
                countif(is_activated) as activated_users,
                round(safe_divide(countif(is_activated), count(*)) * 100, 2) as activation_rate_pct,
                countif(is_converted) as converted_users,
                round(safe_divide(countif(is_converted), count(*)) * 100, 2) as conversion_rate_pct
            from segments
            group by 1, 2
        )

        , overall as (
            select
                usage_definition,
                'All concluded trial users' as usage_segment,
                count(*) as trial_users,
                countif(is_activated) as activated_users,
                round(safe_divide(countif(is_activated), count(*)) * 100, 2) as activation_rate_pct,
                countif(is_converted) as converted_users,
                round(safe_divide(countif(is_converted), count(*)) * 100, 2) as conversion_rate_pct
            from segments
            group by 1
        )

        select *
        from grouped

        union all

        select *
        from overall

        order by
            usage_definition,
            case
                when usage_segment = 'All concluded trial users' then 0
                else 1
            end,
            trial_users desc
      dataFrameCell: false
      dataConnectionId: 019ce681-e9fb-7002-ad50-b766bf65c6cf
      resultVariableName: trial_activation_conversion_by_instance_ai
      useRichDisplay: true
      enablePreview: true
      sqlCellOutputType: PANDAS
      useQueryMode: false
      castDecimals: true
      useNativeDates: true
      outputFilteredResult: true
      allowDuplicateColumns: false
      tableDisplayConfig:
        pageSize: 50
        height: null
        hideIcons: false
        defaultColumnWidth: null
        hideIndex: false
        defaultSortColumn: null
        defaultSortIndexColumn: null
        defaultSortDirection: ASC
        conditionalFormatting: null
        calcs: null
        filters: null
        columnProperties: []
        columnOrdering: null
        customColumnOrdering: null
        pinnedColumns: null
        hiddenColumns: null
        pinIndexColumns: false
        showAggregations: false
        columnAggregations: null
