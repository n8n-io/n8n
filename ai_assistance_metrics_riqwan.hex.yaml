  - cellType: SQL
    cellId: 019fc44c-03dc-74fc-b626-dc323456dccd # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: "Create→publish: ran but never published split"
    config:
      source: |-
        -- Split of "ran/activated but never published" creators (last 3 weeks funnel cohort)
        with
        settings as (
            select
                timestamp(date_sub(current_date(), interval 3 week)) as start_at,
                {{ selected_n8n_version }} as selected_n8n_version
        )
        , internal_instances as (
            select distinct instance_id
            from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )
        , trial_cohort as (
            select
                funnel.user_id_cloud,
                funnel.instance_id,
                date(funnel.s4_at) as trial_started_date,
                coalesce(date(funnel.trial_win_end), date(funnel.s4_at)) as trial_end_date
            from `n8n-telemetry.computed.funnel_cloud_loose` as funnel
            left join internal_instances on funnel.instance_id = internal_instances.instance_id
            cross join settings
            where funnel.s4_at is not null
              and funnel.trial_win_over is true
              and funnel.s4_at >= settings.start_at
              and funnel.user_id_cloud is not null
              and internal_instances.instance_id is null
        )
        , instance_ai_users as (
            select distinct trial_cohort.user_id_cloud
            from `n8n-telemetry.rudder_schema.user_sent_builder_message` m
            inner join trial_cohort
                on m.instance_id = trial_cohort.instance_id
               and date(m.timestamp) between trial_cohort.trial_started_date and trial_cohort.trial_end_date
            cross join settings
            where m._partitiontime >= settings.start_at and m.timestamp >= settings.start_at
              and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(m.version_cli, 'Unknown') = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(coalesce(m.version_cli, 'Unknown'), replace(settings.selected_n8n_version, '*', ''))
                    )
                )
        )
        , ai_created as (
            select
                t.user_id_cloud, t.trial_end_date, b.instance_id, b.workflow_id,
                min(b.timestamp) as workflow_created_at
            from `n8n-telemetry.rudder_schema.builder_created_workflow` b
            inner join trial_cohort t
                on b.instance_id = t.instance_id
               and date(b.timestamp) between t.trial_started_date and t.trial_end_date
            inner join instance_ai_users u on t.user_id_cloud = u.user_id_cloud
            cross join settings
            where b._partitiontime >= settings.start_at and b.timestamp >= settings.start_at
              and b.instance_id is not null and b.workflow_id is not null
              and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(b.version_cli, 'Unknown') = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(coalesce(b.version_cli, 'Unknown'), replace(settings.selected_n8n_version, '*', ''))
                    )
                )
            group by 1,2,3,4
        )
        , pubs as (
            select instance_id, workflow_id, timestamp as published_at from `n8n-telemetry.rudder_schema.builder_published_workflow`
            cross join settings where _partitiontime >= settings.start_at and timestamp >= settings.start_at
            union all
            select context_traits_instance_id, workflow_id, timestamp from `n8n-telemetry.rudder_schema.user_published_version_from_canvas`
            cross join settings where _partitiontime >= settings.start_at and timestamp >= settings.start_at
            union all
            select instance_id, results_data_workflow_id, timestamp from `n8n-telemetry.rudder_schema.user_called_mcp_tool`
            cross join settings
            where _partitiontime >= settings.start_at and timestamp >= settings.start_at
              and results_success and tool_name = 'publish_workflow'
        )
        , acts as (
            select instance_id, workflow_id, min(timestamp) as first_activated_at
            from `n8n-telemetry.rudder_schema.user_activated_workflow`
            cross join settings
            where _partitiontime >= settings.start_at and timestamp >= settings.start_at
            group by 1,2
        )
        , execs as (
            select instance_id, workflow_id, min(timestamp) as first_executed_at
            from `n8n-telemetry.rudder_schema.builder_executed_workflow`
            cross join settings
            where _partitiontime >= settings.start_at and timestamp >= settings.start_at
            group by 1,2
        )
        , wf as (
            select
                c.user_id_cloud,
                logical_or(p.published_at is not null and date(p.published_at) <= c.trial_end_date) as published_during_trial,
                logical_or(a.first_activated_at is not null) as activated,
                logical_or(e.first_executed_at is not null) as executed
            from ai_created c
            left join pubs p on c.instance_id=p.instance_id and c.workflow_id=p.workflow_id and c.workflow_created_at<=p.published_at
            left join acts a on c.instance_id=a.instance_id and c.workflow_id=a.workflow_id and c.workflow_created_at<=a.first_activated_at
            left join execs e on c.instance_id=e.instance_id and c.workflow_id=e.workflow_id and c.workflow_created_at<=e.first_executed_at
            group by 1
        )
        , never_published_runners as (
            select *
            from wf
            where not published_during_trial and (activated or executed)
        )
        select
            case
                when activated and executed then 'Executed + activated (still no publish)'
                when executed and not activated then 'Executed only (manual/test run, no publish)'
                when activated and not executed then 'Activated only (no builder execute event)'
            end as runner_subtype,
            count(*) as users,
            round(100 * count(*) / sum(count(*)) over (), 1) as pct_of_runners_no_publish
        from never_published_runners
        group by 1
        order by users desc
      dataFrameCell: false
      dataConnectionId: 019ce681-e9fb-7002-ad50-b766bf65c6cf
      resultVariableName: create_to_publish_runner_split
      useRichDisplay: true
      enablePreview: true
      sqlCellOutputType: PANDAS
      useQueryMode: false
      castDecimals: true
