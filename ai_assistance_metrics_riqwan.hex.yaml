  - cellType: SQL
    cellId: 019fc44a-bea8-7749-9c56-a4c99f6e645e # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Create→publish drop-off reasons (last 3 weeks)
    config:
      source: |-
        -- Why create → publish drops: last 3 weeks concluded trials (same funnel cohort)
        with
        settings as (
            select
                timestamp(date_sub(current_date(), interval 3 week)) as start_at,
                {{ selected_n8n_version }} as selected_n8n_version
        )

        , internal_instances as (
            select distinct instance_id
            from `n8n-telemetry.computed.users`
            where lower(email_domain) = 'n8n.io'
        )

        , trial_cohort as (
            select
                funnel.user_id_cloud,
                funnel.instance_id,
                date(funnel.s4_at) as trial_started_date,
                coalesce(date(funnel.trial_win_end), date(funnel.s4_at)) as trial_end_date,
                funnel.s5_at is not null as is_converted
            from `n8n-telemetry.computed.funnel_cloud_loose` as funnel
            left join internal_instances
                on funnel.instance_id = internal_instances.instance_id
            cross join settings
            where
                funnel.s4_at is not null
                and funnel.trial_win_over is true
                and funnel.s4_at >= settings.start_at
                and funnel.user_id_cloud is not null
                and internal_instances.instance_id is null
        )

        , instance_ai_users as (
            select distinct trial_cohort.user_id_cloud
            from `n8n-telemetry.rudder_schema.user_sent_builder_message` as user_messages
            inner join trial_cohort
                on user_messages.instance_id = trial_cohort.instance_id
                and date(user_messages.timestamp)
                    between trial_cohort.trial_started_date and trial_cohort.trial_end_date
            cross join settings
            where
                user_messages._partitiontime >= settings.start_at
                and user_messages.timestamp >= settings.start_at
                and user_messages.instance_id is not null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(user_messages.version_cli, 'Unknown') = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(user_messages.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
        )

        , ai_created as (
            select
                trial_cohort.user_id_cloud,
                trial_cohort.trial_started_date,
                trial_cohort.trial_end_date,
                trial_cohort.is_converted,
                builder_events.instance_id,
                builder_events.workflow_id,
                min(builder_events.timestamp) as workflow_created_at
            from `n8n-telemetry.rudder_schema.builder_created_workflow` as builder_events
            inner join trial_cohort
                on builder_events.instance_id = trial_cohort.instance_id
                and date(builder_events.timestamp)
                    between trial_cohort.trial_started_date and trial_cohort.trial_end_date
            inner join instance_ai_users
                on trial_cohort.user_id_cloud = instance_ai_users.user_id_cloud
            cross join settings
            where
                builder_events._partitiontime >= settings.start_at
                and builder_events.timestamp >= settings.start_at
                and builder_events.instance_id is not null
                and builder_events.workflow_id is not null
                and (
                    settings.selected_n8n_version = 'All versions'
                    or coalesce(builder_events.version_cli, 'Unknown') = settings.selected_n8n_version
                    or (
                        ends_with(settings.selected_n8n_version, '.*')
                        and starts_with(
                            coalesce(builder_events.version_cli, 'Unknown'),
                            replace(settings.selected_n8n_version, '*', '')
                        )
                    )
                )
            group by 1, 2, 3, 4, 5, 6
        )

        , all_publications as (
            select instance_id, workflow_id, timestamp as published_at, 'builder' as channel
            from `n8n-telemetry.rudder_schema.builder_published_workflow`
            cross join settings
            where _partitiontime >= settings.start_at and timestamp >= settings.start_at
              and instance_id is not null and workflow_id is not null

            union all

            select context_traits_instance_id, workflow_id, timestamp, 'canvas'
            from `n8n-telemetry.rudder_schema.user_published_version_from_canvas`
            cross join settings
            where _partitiontime >= settings.start_at and timestamp >= settings.start_at
              and context_traits_instance_id is not null and workflow_id is not null

            union all

            select instance_id, results_data_workflow_id, timestamp, 'mcp'
            from `n8n-telemetry.rudder_schema.user_called_mcp_tool`
            cross join settings
            where _partitiontime >= settings.start_at and timestamp >= settings.start_at
              and results_success is true
              and tool_name = 'publish_workflow'
              and instance_id is not null and results_data_workflow_id is not null
        )

        , activations as (
            select instance_id, workflow_id, min(timestamp) as first_activated_at
            from `n8n-telemetry.rudder_schema.user_activated_workflow`
            cross join settings
            where _partitiontime >= settings.start_at and timestamp >= settings.start_at
              and instance_id is not null and workflow_id is not null
            group by 1, 2
        )

        , executions as (
            select
                instance_id,
                workflow_id,
                min(timestamp) as first_executed_at
            from `n8n-telemetry.rudder_schema.builder_executed_workflow`
            cross join settings
            where _partitiontime >= settings.start_at and timestamp >= settings.start_at
              and workflow_id is not null
              and instance_id is not null
            group by 1, 2
        )

        , message_counts as (
            select
                trial_cohort.user_id_cloud,
                count(*) as builder_messages
            from `n8n-telemetry.rudder_schema.user_sent_builder_message` as user_messages
            inner join trial_cohort
                on user_messages.instance_id = trial_cohort.instance_id
                and date(user_messages.timestamp)
                    between trial_cohort.trial_started_date and trial_cohort.trial_end_date
            cross join settings
            where
                user_messages._partitiontime >= settings.start_at
                and user_messages.timestamp >= settings.start_at
            group by 1
        )

        , workflow_outcomes as (
            select
                ai_created.user_id_cloud,
                ai_created.workflow_id,
                ai_created.workflow_created_at,
                ai_created.trial_end_date,
                ai_created.is_converted,
                date_diff(ai_created.trial_end_date, date(ai_created.workflow_created_at), day)
                    as days_left_in_trial_at_create,
                min(all_publications.published_at) as first_published_at,
                logical_or(
                    all_publications.published_at is not null
                    and date(all_publications.published_at) <= ai_created.trial_end_date
                ) as published_during_trial,
                logical_or(
                    all_publications.published_at is not null
                    and date(all_publications.published_at) > ai_created.trial_end_date
                ) as published_after_trial,
                min(activations.first_activated_at) as first_activated_at,
                min(executions.first_executed_at) as first_executed_at
            from ai_created
            left join all_publications
                on ai_created.instance_id = all_publications.instance_id
                and ai_created.workflow_id = all_publications.workflow_id
                and ai_created.workflow_created_at <= all_publications.published_at
            left join activations
                on ai_created.instance_id = activations.instance_id
                and ai_created.workflow_id = activations.workflow_id
                and ai_created.workflow_created_at <= activations.first_activated_at
            left join executions
                on ai_created.instance_id = executions.instance_id
                and ai_created.workflow_id = executions.workflow_id
                and ai_created.workflow_created_at <= executions.first_executed_at
            group by 1, 2, 3, 4, 5, 6
        )

        , user_outcomes as (
            select
                user_id_cloud,
                max(is_converted) as is_converted,
                count(*) as ai_workflows_created,
                countif(published_during_trial) as ai_workflows_published_during_trial,
                countif(published_after_trial and not published_during_trial)
                    as ai_workflows_published_only_after_trial,
                countif(first_published_at is null) as ai_workflows_never_published,
                countif(first_activated_at is not null) as ai_workflows_activated,
                countif(first_executed_at is not null) as ai_workflows_executed,
                countif(
                    first_activated_at is not null and first_published_at is null
                ) as activated_never_published,
                countif(
                    first_executed_at is not null and first_published_at is null
                ) as executed_never_published,
                min(days_left_in_trial_at_create) as min_days_left_at_create,
                avg(days_left_in_trial_at_create) as avg_days_left_at_create
            from workflow_outcomes
            group by 1
        )

        , labeled as (
            select
                user_outcomes.*,
                coalesce(message_counts.builder_messages, 0) as builder_messages,
                case
                    when ai_workflows_published_during_trial > 0
                        then 'A. Published during trial'
                    when ai_workflows_published_only_after_trial > 0
                        then 'B. Published only after trial ended'
                    when activated_never_published > 0 or executed_never_published > 0
                        then 'C. Ran/activated but never published'
                    when builder_messages <= 1
                        then 'D. Created then abandoned (≤1 message)'
                    when builder_messages between 2 and 5
                        then 'E. Light chat (2–5 msgs), never published'
                    else 'F. Engaged chat (6+ msgs), never published'
                end as dropoff_reason
            from user_outcomes
            left join message_counts using (user_id_cloud)
        )

        select
            dropoff_reason,
            count(*) as users,
            round(100 * count(*) / sum(count(*)) over (), 1) as pct_of_creators,
            countif(is_converted) as converted_users,
            round(avg(ai_workflows_created), 2) as avg_workflows_created,
            round(avg(builder_messages), 1) as avg_builder_messages,
            round(avg(avg_days_left_at_create), 1) as avg_days_left_in_trial_at_create,
            countif(min_days_left_at_create <= 1) as created_with_le_1_day_left
        from labeled
        group by 1
        order by 1
      dataFrameCell: false
      dataConnectionId: 019ce681-e9fb-7002-ad50-b766bf65c6cf
      resultVariableName: create_to_publish_dropoff_reasons
