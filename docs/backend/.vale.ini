# Vale configuration for the backend onboarding documents in this folder.
#
# Run locally with `vale sync` once (downloads the write-good package), then
# `vale docs/backend` from the repo root. CI runs the same in ci-docs-backend.yml.
#
# The local style `n8n-backend-docs` encodes the ASD-STE100 writing rules
# (short sentences, no contractions, no dashes) and the product terms that
# reviewers correct most often.

StylesPath = styles
MinAlertLevel = warning
Packages = write-good
# Accepted technical terms live in styles/config/vocabularies/n8n-backend/accept.txt.
Vocab = n8n-backend

[*.md]
BasedOnStyles = Vale, write-good, n8n-backend-docs

# Code spans and fenced blocks are skipped by default. Also skip Mermaid labels
# and HTML comments, which hold notation rather than sentences.
TokenIgnores = (<!--.*?-->)
BlockIgnores = (?s)```mermaid.*?```

# write-good flags "we" and every passive verb. The voice of these documents
# uses "we" on purpose, and a few passives read better than their rewrites.
# Weasel and TooWordy flag ordinary technical words such as "several" and "additional".
write-good.Passive = NO
write-good.E-Prime = NO
write-good.Weasel = NO
write-good.TooWordy = NO

# Downloaded style packages ship their own README files. Do not lint them.
[**/styles/**]
BasedOnStyles =
