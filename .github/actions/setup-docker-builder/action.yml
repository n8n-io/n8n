# Sets up a Buildx builder with a layer cache. Blacksmith runners get the
# sticky-disk builder; GitHub-hosted runners fall back to plain Buildx.

name: 'Docker Builder Setup'
description: 'Sets up a Buildx builder with Docker layer caching, using the Blacksmith sticky disk when the runner supports it.'

inputs:
  cache-key:
    description: 'Sticky-disk identity for the Docker layer cache. Use n8n-io/n8n: Blacksmith only retains disks that already exist, and a newly created key stays empty across runs, so a per-image key silently disables caching entirely.'
    required: true

runs:
  using: 'composite'
  steps:
    # An empty key makes the builder use a local, uncached one. The job stays
    # green and loses the cache. Fail here instead.
    - name: Verify Docker cache key is set
      if: ${{ inputs.cache-key == '' }}
      shell: bash
      run: |
        echo "::error::setup-docker-builder needs a non-empty cache-key"
        exit 1

    - name: Setup Docker Builder for Docker Cache (Blacksmith)
      if: ${{ contains(runner.name, 'blacksmith') }}
      uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2.1.0
      with:
        cache-key: ${{ inputs.cache-key }}

    - name: Setup Docker Builder (GitHub fallback)
      if: ${{ !contains(runner.name, 'blacksmith') }}
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
