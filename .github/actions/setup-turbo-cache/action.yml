# Starts the Turborepo remote cache server for the job.
#
# Only jobs that run turbo need this. The server also registers a post step, so
# a job that never calls turbo pays for a server it does not use.

name: 'Turborepo Cache Setup'
description: 'Starts the Turborepo remote cache server, unless one is already running for this job.'

runs:
  using: 'composite'
  steps:
    # When this action is reached twice in one job (e.g. load-n8n-docker's
    # rebuild fallback → build-n8n-docker), a turbo cache server is already
    # running and its TURBO_API env is already exported, so the nested builds
    # can just use it. Starting a second server overwrites TURBOGHA_PORT, which
    # both post-runs then read: the first post shuts the second server down, and
    # the other post fails the job with a bare `fetch failed` — and the first
    # server's caches are never saved.
    - name: Check for running Turborepo cache server
      id: turbo-server
      shell: bash
      run: echo "running=${TURBOGHA_PORT:+true}" >> "$GITHUB_OUTPUT"

    # Skipped on Windows: the turbogha server binds IPv4 while `localhost`
    # resolves to IPv6 first there, so turbo can never reach it (the build
    # logs `failed to contact remote cache` for every artifact and falls back
    # to a local cache). The remote cache is inert, but the action's post-run
    # still fetches the unreachable server to save it and dies with a bare
    # `fetch failed`, turning the whole job red. Skip it so the one Windows
    # build job stays green; Linux/Blacksmith jobs keep remote caching.
    - name: Configure Turborepo Cache
      if: steps.turbo-server.outputs.running != 'true' && runner.os != 'Windows'
      uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      with:
        server-port: 0
