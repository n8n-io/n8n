name: 'CI: Owners Required Reviews'
run-name: "${{ github.event_name == 'workflow_dispatch' && format('CI: Owners Required Reviews (PR #{0})', inputs.pr_number) || '' }}"

# The shared workflow uses the configured GitHub App to publish Required Reviews.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ['Util: Notify PR Status']
    types: [completed]
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to re-evaluate'
        required: true
        type: string

permissions: {}

jobs:
  required-reviews:
    uses: n8n-io/github-actions/.github/workflows/ownership-checks.yml@565cebcd8f10f91c5164219e827c30b6f9d46708 # v1.1.0
    permissions:
      id-token: write
      pull-requests: read
    with:
      ownership-comment: false
      devhub-url: https://devhub.services.n8n.cloud
      pull-request-number: ${{ inputs.pr_number }}
    secrets:
      required-reviews-app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
      required-reviews-app-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}
