# 🐱 jscpd — deterministic copy-paste/duplication scan.
#
# Runs jscpd against this repo and uploads the full JSON+HTML report, plus
# the report split into BUCKET_COUNT small JSON files, so a caller can
# download one small bucket at random per invocation instead of the full
# report (which can run into tens of MB on a monorepo this size). The split
# buckets are uploaded by a matrix job, one shard per bucket.
#
# Reporters/ignores/threshold come from this repo's own .jscpd.json; this
# workflow passes none of those flags itself.

name: 🐱 jscpd

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Number of small sample files the report is split into (split-jscpd-report.mjs).
  BUCKET_COUNT: '20'

jobs:
  jscpd:
    runs-on: ${{ vars.RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    timeout-minutes: 30
    outputs:
      bucket-indices: ${{ steps.indices.outputs.indices }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run jscpd
        id: jscpd
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/jscpd-report"
          version="$(node -p "require('./package.json').devDependencies.jscpd")"
          npx --yes "jscpd@$version" . \
            --output "$RUNNER_TEMP/jscpd-report" \
            --silent

      - name: Upload jscpd report
        id: report-artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: jscpd-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jscpd-report
          retention-days: 31
          if-no-files-found: warn

      # Splits `duplicates` into BUCKET_COUNT files so a caller can download
      # one small sample instead of the full report (tens of MB on a large
      # monorepo). Logic + tests live in split-jscpd-report.mjs.
      - name: Split report into buckets
        id: split
        if: always() && steps.jscpd.outcome == 'success'
        continue-on-error: true
        env:
          REPORT_PATH: ${{ runner.temp }}/jscpd-report/jscpd-report.json
          OUTPUT_DIR: ${{ runner.temp }}/jscpd-buckets
        run: node .github/scripts/split-jscpd-report.mjs

      # Handed to the upload-buckets matrix job below, one shard per bucket
      # file, instead of one artifact holding all of them: a caller samples a
      # single small bucket without pulling the rest.
      - name: Upload bucket files for the matrix job
        id: raw-buckets-artifact
        if: always() && steps.split.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: jscpd-buckets-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jscpd-buckets
          retention-days: 1
          if-no-files-found: warn

      - name: Compute bucket indices
        id: indices
        if: always() && steps.raw-buckets-artifact.outcome == 'success'
        run: |
          echo "indices=$(node -e "console.log(JSON.stringify(Array.from({length:Number(process.env.BUCKET_COUNT)},(_,i)=>i)))")" >> "$GITHUB_OUTPUT"

  upload-buckets:
    needs: jscpd
    if: needs.jscpd.outputs.bucket-indices != ''
    runs-on: ${{ vars.RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2204' }}
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.jscpd.outputs.bucket-indices) }}

    steps:
      - name: Download bucket files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jscpd-buckets-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: buckets

      - name: Upload jscpd bucket
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: jscpd-bucket-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.index }}
          path: buckets/bucket-${{ matrix.index }}.json
          retention-days: 31
          if-no-files-found: warn
