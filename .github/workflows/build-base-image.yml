name: 'Build: Base Image'
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Build: Base Image (push={0})', inputs.push) || '' }}"

on:
  push:
    branches:
      - master
    paths:
      - 'docker/images/n8n-base/Dockerfile'
      - 'docker/images/n8n-base/Dockerfile.debian'
      - '.github/scripts/docker/base-debian-smoke-check.mjs'
      - '.github/workflows/build-base-image.yml'
  pull_request:
    paths:
      - 'docker/images/n8n-base/Dockerfile'
      - 'docker/images/n8n-base/Dockerfile.debian'
      - '.github/scripts/docker/base-debian-smoke-check.mjs'
      - '.github/workflows/build-base-image.yml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to registries'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLATFORMS: linux/amd64,linux/arm64
    strategy:
      fail-fast: false
      matrix:
        # One entry per published image: `tag` is the `n8nio/base:<tag>` tag,
        # `dhi_ref` the DHI base it builds on, pinned to a multi-arch index
        # digest. Bump tag and digest together when updating, and keep the Alpine
        # and Debian rows on the same Node version. After a bump publishes a new
        # base, repin RUNTIME_IMAGE in the n8n and runners Dockerfiles.
        include:
          - tag: '22'
            dockerfile: docker/images/n8n-base/Dockerfile
            dhi_ref: dhi.io/node:22.23.4-alpine3.24-dev@sha256:a2c4778492ad46fd6f362d8d93e21c0543d0009db7f934d5eb9f9ccb77eafdcb
          - tag: '24.22.1'
            dockerfile: docker/images/n8n-base/Dockerfile
            dhi_ref: dhi.io/node:24.22.1-alpine3.24-dev@sha256:7b851ff65d774343caf89450555663caef54dbd8f673658a615d256883973337
          - tag: '26.12.1'
            dockerfile: docker/images/n8n-base/Dockerfile
            dhi_ref: dhi.io/node:26.12.1-alpine3.24-dev@sha256:4b1591bfce570a17f9562e206b62e76be84d6df32c3a86bfc677fc87959402cc
          - tag: '26.12.1-debian'
            dockerfile: docker/images/n8n-base/Dockerfile.debian
            dhi_ref: dhi.io/node:26.12.1-debian13-dev@sha256:c8939885965365c675a024d062bcb761bda4b47e95ce0323aa998ac9bc312fd6
            # The Docker smoke test builds n8n-debian on the published base, so
            # it does not test a change to this Dockerfile. Check it here.
            smoke_check: .github/scripts/docker/base-debian-smoke-check.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to DHI Registry (for pulling base images)
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: 'false'
          login-dhi: 'true'
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Docker registries (for pushing)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true)
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: 'true'
          login-dockerhub: 'true'
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Smoke check
        if: matrix.smoke_check
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          DHI_REF: ${{ matrix.dhi_ref }}
          SMOKE_CHECK: ${{ matrix.smoke_check }}
        run: |
          set -euo pipefail
          for platform in ${PLATFORMS//,/ }; do
            docker buildx build --platform "$platform" --build-arg "DHI_REF=$DHI_REF" \
              -f "$DOCKERFILE" -t base-smoke --load .
            docker run --rm --platform "$platform" --user root --entrypoint node \
              -v "$PWD/$SMOKE_CHECK:/check.mjs:ro" base-smoke /check.mjs
          done

      # The builder starts empty on each run. This step reuses the layers the
      # smoke check built, so it pushes the image that was checked.
      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          build-args: |
            DHI_REF=${{ matrix.dhi_ref }}
          platforms: ${{ env.PLATFORMS }}
          provenance: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          sbom: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/base:${{ matrix.tag }}-${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/base:${{ matrix.tag }}
            ghcr.io/${{ github.repository_owner }}/base:${{ matrix.tag }}-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/base:${{ matrix.tag }}
