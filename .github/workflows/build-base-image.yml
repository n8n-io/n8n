name: 'Build: Base Image'
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Build: Base Image (push={0})', inputs.push) || '' }}"

on:
  push:
    branches:
      - master
    paths:
      - 'docker/images/n8n-base/Dockerfile'
      - 'docker/images/n8n-base/Dockerfile.debian'
      - '.github/scripts/docker/base-debian-smoke-check.sh'
      - '.github/workflows/build-base-image.yml'
  pull_request:
    paths:
      - 'docker/images/n8n-base/Dockerfile'
      - 'docker/images/n8n-base/Dockerfile.debian'
      - '.github/scripts/docker/base-debian-smoke-check.sh'
      - '.github/workflows/build-base-image.yml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to registries'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per published image: `tag` is the `n8nio/base:<tag>` tag,
        # `dhi_ref` the DHI base it builds on, pinned to a multi-arch index
        # digest. Bump tag and digest together when updating. The Debian
        # (glibc) base is published for the Node version of the n8n image only.
        include:
          - tag: '22'
            dockerfile: docker/images/n8n-base/Dockerfile
            dhi_ref: dhi.io/node:22.23.3-alpine3.24-dev@sha256:23ee07ace431ea7d14e22c0e52fb52b0bd1853dabdacd89ba75f937f6dff8a8d
          - tag: '24.21.0'
            dockerfile: docker/images/n8n-base/Dockerfile
            dhi_ref: dhi.io/node:24.21.0-alpine3.24-dev@sha256:d22ba0e9ab2a54609ae533df4ebfd6f36c1f233b662a4c547f5a3195e8c21937
          - tag: '26.10.0'
            dockerfile: docker/images/n8n-base/Dockerfile
            dhi_ref: dhi.io/node:26.10.0-alpine3.24-dev@sha256:8da859df5dc853c923ace53c4cfe994a909a28917f7fcfc8508869beab8cf132
          - tag: '26.7.0-debian'
            dockerfile: docker/images/n8n-base/Dockerfile.debian
            dhi_ref: dhi.io/node:26.7.0-debian13-dev@sha256:f64567ec3fd6eb86a5cbd384bc2f09f329796c5bcb1737d8d85041dda981e797
            # No n8n image builds on this base yet, so the Docker smoke test
            # does not cover it. Check its contract here.
            smoke_check: .github/scripts/docker/base-debian-smoke-check.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to DHI Registry (for pulling base images)
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: 'false'
          login-dhi: 'true'
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Docker registries (for pushing)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true)
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: 'true'
          login-dockerhub: 'true'
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      # Load each platform into the daemon and run the check on it. The push
      # step below reuses these layers, so the pushed image is the checked one.
      - name: Smoke check
        if: matrix.smoke_check
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          DHI_REF: ${{ matrix.dhi_ref }}
          SMOKE_CHECK: ${{ matrix.smoke_check }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --platform "$platform" --build-arg "DHI_REF=$DHI_REF" \
              -f "$DOCKERFILE" -t base-smoke --load .
            docker run --rm --platform "$platform" --user root --entrypoint sh \
              -v "$PWD/$SMOKE_CHECK:/smoke.sh:ro" base-smoke /smoke.sh
          done

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          build-args: |
            DHI_REF=${{ matrix.dhi_ref }}
          platforms: linux/amd64,linux/arm64
          provenance: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          sbom: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/base:${{ matrix.tag }}-${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/base:${{ matrix.tag }}
            ghcr.io/${{ github.repository_owner }}/base:${{ matrix.tag }}-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/base:${{ matrix.tag }}
          no-cache: ${{ !matrix.smoke_check }}
