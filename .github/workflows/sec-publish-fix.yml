name: 'Security: Publish fix'

on:
  pull_request:
    types: [closed]
    branches: [master, '2.x']

jobs:
  sync-security-fix:
    if: |
      github.repository == 'n8n-io/n8n-private' &&
      github.event.pull_request.merged == true &&
      ((github.base_ref == 'master' && github.head_ref == 'bundle/3.x') ||
       (github.base_ref == '2.x' && github.head_ref == 'bundle/2.x'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}
          owner: n8n-io
          repositories: n8n,n8n-private

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Open PR to public repo
        run: |
          COMMIT_TO_PUBLISH=$(git rev-parse HEAD)
          case "$PUBLIC_BASE" in
            master) PREFIX=private ;;
            2.x) PREFIX=private-2x ;;
            *) exit 1 ;;
          esac
          BRANCH_NAME="$PREFIX-$(date +%Y%m%d-%H%M%S)"

          git remote add public-repo "https://x-access-token:${GH_TOKEN}@github.com/n8n-io/n8n.git"
          git fetch public-repo "$PUBLIC_BASE"
          git checkout -b "$BRANCH_NAME" "public-repo/$PUBLIC_BASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick "$COMMIT_TO_PUBLISH"
          git push public-repo "$BRANCH_NAME"
          gh pr create \
            --repo n8n-io/n8n \
            --base "$PUBLIC_BASE" \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body "Cherry-picked from n8n-private. Original PR: $PR_URL"
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          PUBLIC_BASE: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Notify on failure
        if: failure()
        env:
          SLACK_TOKEN: ${{ secrets.QBOT_SLACK_TOKEN }}
        run: |
          node .github/scripts/slack/notify.mjs \
            --channel '#alerts-security' \
            --text 'Security fix PR creation failed. Run "Security: Sync from Public", merge the refreshed bundle branch into the fix branches, and reopen the bundle PR. (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'
