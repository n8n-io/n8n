name: 'Test: E2E Performance'

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      page-load-iterations:
        description: 'Measured runs per page for the page-load benchmark (tests/performance/pages). Empty keeps the default of 10.'
        type: string
        default: ''
      timeout-minutes:
        description: 'Job timeout in minutes. 50 runs per page need about 90.'
        type: number
        default: 30
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight

jobs:
  # Cache-aware: no-op if an ancestor already populated the SHA-keyed cache.
  prepare-docker:
    uses: ./.github/workflows/prepare-docker-reusable.yml
    secrets: inherit

  build-and-test-performance:
    needs: [prepare-docker]
    uses: ./.github/workflows/test-e2e-reusable.yml
    with:
      test-mode: docker-artifact
      # The reusable workflow runs the command as a bash word list, so an env
      # prefix would not parse; `env` sets PERF_ITERATIONS for a dispatched run.
      test-command: ${{ inputs.page-load-iterations && format('pnpm --filter=n8n-playwright exec env PERF_ITERATIONS={0} playwright test --project=performance', inputs.page-load-iterations) || 'pnpm --filter=n8n-playwright test:performance' }}
      workers: '1'
      # fromJSON: a dispatch from the CLI delivers the number as a string, and the
      # called workflow rejects a string for a number input.
      timeout-minutes: ${{ fromJSON(inputs.timeout-minutes || 30) }}
      pre-generated-matrix: '[{"shard":1,"images":""},{"shard":2,"images":""}]'
      currents-project-id: 'O9BJaN'
      artifact-prefix: performance
    secrets: inherit

  idle-memory-baselines:
    needs: [prepare-docker]
    uses: ./.github/workflows/test-e2e-reusable.yml
    with:
      test-mode: docker-artifact
      test-command: pnpm --filter=@n8n/efficiency test:memory
      workers: '1'
      currents-project-id: 'O9BJaN'
      artifact-prefix: memory-performance
    secrets: inherit

  canvas-perf-sentinels:
    name: Canvas Perf Sentinels
    # Sentinels are nightly only — wall-clock browser perf has 15-30% variance,
    # so gating PR runs on these would produce false-positive blockers.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build-and-test-performance
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: packages/quality/testing/playwright/scripts/canvas-perf-sentinels.mjs
          sparse-checkout-cone-mode: false

      - name: Download performance shard artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: performance-shard-*
          path: performance-artifacts
          merge-multiple: false

      - name: Run canvas perf sentinels
        run: |
          mapfile -t RESULTS_PATHS < <(find performance-artifacts -name 'test-results.json' -print)
          if [ "${#RESULTS_PATHS[@]}" -eq 0 ]; then
            echo "::warning::No test-results.json found in performance artifacts — sentinel skipped."
            exit 0
          fi
          node packages/quality/testing/playwright/scripts/canvas-perf-sentinels.mjs "${RESULTS_PATHS[@]}"
