name: 'Docker Build Smoke Test'

permissions:
  contents: read

# Verifies the full Docker build chain works without any caching.
# Catches native module compilation failures (e.g., isolated-vm, sqlite3)
# that layer caching can mask in the regular E2E pipeline.
#
# Full chain: pnpm install → pnpm build (no Turbo cache) →
#             build base image (no Docker cache) →
#             build n8n + runners images (no Docker cache)

env:
  # The images copy native bindings from the host build, so both have to use the same
  # Node. dockerize-n8n.mjs reads this env for the image builds. Keep in sync with
  # NODE_VERSION in docker-build-push.yml, which is what the published images use.
  NODE_VERSION: '26.10.0'
  # Also build the distroless runners image and exec-check
  # both runners images' interpreters, so a broken runtime assembly (e.g. a
  # missing shared library after a Node bump) fails at PR time. The smoke
  # script derives the images to check from this same flag.
  DOCKER_BUILD_DISTROLESS: 'true'

on:
  schedule:
    - cron: '0 3 * * *' # 3:00 AM UTC, after the nightly Docker build at midnight
  pull_request:
    paths:
      - 'docker/docker-bake.hcl'
      - 'docker/images/n8n/**'
      - 'docker/images/n8n-base/**'
      - 'docker/images/runners/**'
      - 'scripts/build-n8n.mjs'
      - 'scripts/dockerize-n8n.mjs'
      - 'scripts/smoke-n8n-image.mjs'
      - 'packages/quality/efficiency/images/**'
      - 'packages/quality/efficiency/playwright.config.ts'
      - 'packages/quality/efficiency/package.json'
      - 'packages/quality/testing/playwright/quality-config.ts'
      - 'packages/quality/testing/playwright/quality-test.ts'
      - 'packages/quality/testing/playwright/fixtures/cli.ts'
      - 'packages/quality/testing/playwright/utils/metrics.ts'
      - 'packages/quality/testing/playwright/reporters/**'
      - '.github/workflows/docker-build-smoke.yml'
      - 'package.json'
      - '.github/scripts/docker/kafka-native-smoke-check.mjs'
      - '.github/scripts/docker/should-smoke-build.mjs'
      # These drive the build and the image distribution, so a change here can
      # break the chain without touching a Dockerfile.
      - '.github/actions/build-n8n-docker/action.yml'
      - '.github/actions/load-n8n-docker/action.yml'
      - '.github/actions/setup-nodejs/action.yml'
      - '.github/workflows/docker-build-push.yml'
      - 'patches/**'
      # Pins the native deps this build compiles, but changes far more often
      # than they do — the gate job narrows it to the pins that matter.
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: docker-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 'Check for relevant changes'
    runs-on: ubuntu-slim
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD is the PR merge commit, so HEAD^1 is the base tip.
          fetch-depth: 2

      - id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != 'pull_request' ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed-files"
          node .github/scripts/docker/should-smoke-build.mjs \
            --base HEAD^1 --changed-files "$RUNNER_TEMP/changed-files"

  docker-smoke-test:
    name: 'Docker Build (no cache, ${{ matrix.platform }})'
    # Both architectures build natively: the runtime images assemble binaries
    # across images with arch-specific paths (e.g. the ELF interpreter lives at
    # /lib/ld-linux-aarch64.so.1 only on arm64), so amd64 alone can miss
    # arm64-only runtime breaks.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: blacksmith-4vcpu-ubuntu-2204
          - platform: arm64
            runner: blacksmith-8vcpu-ubuntu-2204-arm
    runs-on: ${{ matrix.runner }}
    needs: gate
    if: ${{ !github.event.pull_request.head.repo.fork && needs.gate.outputs.build == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to DHI Registry (for base image)
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: 'false'
          login-dhi: 'true'
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build full chain (no cache)
        uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-command: 'pnpm build:docker:clean'
          enable-docker-cache: true
          # Use a separate key. This job builds with --no-cache. A shared key
          # would write an empty snapshot over the release layers.
          docker-cache-key: docker-smoke

      - name: Install Dive
        shell: bash
        run: |
          set -euo pipefail
          # Keep this version in sync with efficiency/images/dive-results.ts.
          VERSION=0.13.1
          case "$(uname -m)" in
            x86_64) ARCH=amd64; CHECKSUM=0970549eb4a306f8825a84145a2534153badb4d7dcf3febd1967c706367c3d0e ;;
            aarch64) ARCH=arm64; CHECKSUM=2fcd2cf20f634ccdb41efac44048b204bfc867c115641f37a7420693ed480a18 ;;
            *) echo 'Unsupported Dive architecture' >&2; exit 1 ;;
          esac
          DIR=$(mktemp -d "$RUNNER_TEMP/dive.XXXXXX")
          ARCHIVE="$DIR/dive.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/wagoodman/dive/releases/download/v${VERSION}/dive_${VERSION}_linux_${ARCH}.tar.gz" \
            --output "$ARCHIVE"
          echo "$CHECKSUM  $ARCHIVE" | sha256sum --check
          tar -xzf "$ARCHIVE" -C "$DIR" dive
          echo "$DIR" >> "$GITHUB_PATH"

      - name: Measure image layer efficiency
        run: pnpm --filter=@n8n/efficiency test:images
        env:
          CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
          CURRENTS_PROJECT_ID: 'nHHLA5'
          CURRENTS_CI_BUILD_ID: ${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}-images-${{ matrix.platform }}
          QA_METRICS_WEBHOOK_URL: ${{ secrets.QA_METRICS_WEBHOOK_URL }}
          QA_METRICS_WEBHOOK_USER: ${{ secrets.QA_METRICS_WEBHOOK_USER }}
          QA_METRICS_WEBHOOK_PASSWORD: ${{ secrets.QA_METRICS_WEBHOOK_PASSWORD }}

      - name: Upload image efficiency reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: image-efficiency-${{ matrix.platform }}
          path: |
            packages/quality/efficiency/test-results/
            packages/quality/efficiency/test-results.json
            packages/quality/efficiency/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - id: cloud-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}
          owner: n8n-io
          repositories: n8n-cloud

      - name: Verify image against live n8n-cloud helm chart
        env:
          GH_TOKEN: ${{ steps.cloud-token.outputs.token }}
        run: pnpm build:docker:smoke

  notify-on-failure:
    name: Notify on nightly smoke test failure
    runs-on: ubuntu-slim
    needs: [docker-smoke-test]
    if: needs.docker-smoke-test.result == 'failure' && github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts/slack
          sparse-checkout-cone-mode: false
      - name: Notify Slack
        env:
          SLACK_TOKEN: ${{ secrets.QBOT_SLACK_TOKEN }}
        run: |
          node .github/scripts/slack/notify.mjs \
            --channel C0A9RLY8Y20 \
            --text '🚨 Nightly Docker smoke test failed (no-cache build) - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
