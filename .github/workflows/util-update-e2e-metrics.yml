name: 'Util: Update E2E Metrics'

on:
  schedule:
    # Run every Monday at 01:00 UTC, after a full week of PR-CI data.
    - cron: '0 1 * * 1'
  workflow_dispatch: # Allow a manual run for testing.

concurrency:
  group: update-e2e-metrics
  cancel-in-progress: true

permissions: {}

jobs:
  update-metrics:
    name: Refresh E2E duration metrics
    # A dispatch from a feature branch must not create an update PR from that branch.
    if: |
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.repository == 'n8n-io/n8n'))
    runs-on: ${{ vars.RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2204' }}
    permissions:
      contents: read
    outputs:
      pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-nodejs
        with:
          # Playwright test discovery reads source files and does not need build outputs.
          build-command: ''

      - name: Preserve current metrics
        run: cp .github/test-metrics/playwright.json '${{ runner.temp }}/playwright-metrics-before.json'

      - name: Fetch E2E metrics from Currents
        env:
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
        run: node packages/quality/testing/playwright/scripts/fetch-currents-metrics.mjs --project=nHHLA5

      - name: Validate refreshed metrics
        env:
          BEFORE: ${{ runner.temp }}/playwright-metrics-before.json
          AFTER: .github/test-metrics/playwright.json
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const before = JSON.parse(fs.readFileSync(process.env.BEFORE, 'utf8'));
          const after = JSON.parse(fs.readFileSync(process.env.AFTER, 'utf8'));
          const beforeSpecs = Object.values(before.specs ?? {});
          const afterSpecs = Object.values(after.specs ?? {});
          const beforeMeasured = beforeSpecs.filter((spec) => spec.testCount > 0).length;
          const afterMeasured = afterSpecs.filter((spec) => spec.testCount > 0).length;
          const specFloor = Math.floor(beforeSpecs.length * 0.96);
          const measuredFloor = Math.floor(beforeMeasured * 0.8);

          if (after.source !== 'currents' || after.projectId !== 'nHHLA5') {
            throw new Error('Refreshed metrics have an unexpected source or project ID');
          }
          if (afterSpecs.length < specFloor) {
            throw new Error(`Refreshed metrics have ${afterSpecs.length} specs. Expected at least ${specFloor}.`);
          }
          if (afterMeasured < measuredFloor) {
            throw new Error(`Only ${afterMeasured} specs have Currents data. Expected at least ${measuredFloor}.`);
          }

          console.log(`Metrics are complete: ${afterSpecs.length} specs, ${afterMeasured} with Currents data.`);
          NODE

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet .github/test-metrics/playwright.json; then
            echo 'E2E metrics are unchanged'
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          else
            echo 'E2E metrics have changed'
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: 'chore: Update E2E duration metrics (no-changelog)'
          labels: 'automation:scheduled-update'
          title: 'chore: Update E2E duration metrics (no-changelog)'
          body: |
            This automated PR refreshes the E2E duration and flakiness metrics
            from the last seven days of PR CI runs in Currents.

            The E2E orchestrator uses these metrics to balance specs across CI
            shards. A weekly refresh reduces slow shard tails as test durations
            change.

            _Generated by the weekly E2E metrics update workflow._
          branch: update-e2e-metrics
          base: master
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

  approve-and-automerge:
    needs: [update-metrics]
    if: needs.update-metrics.outputs.pull-request-number != ''
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/util-approve-and-set-automerge.yml # zizmor: ignore[secrets-inherit]
    secrets: inherit
    with:
      pull-request-number: ${{ needs.update-metrics.outputs.pull-request-number }}
