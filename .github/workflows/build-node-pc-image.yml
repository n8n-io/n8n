name: 'Build: Node PC Image'

# Publishes n8nio/node-pc, the pointer-compressed Node runtime consumed by the
# n8n `-pc` image variant. Compiling Node from source is too slow under QEMU,
# so each architecture builds on its native runner and a manifest job stitches
# the per-arch images, following docker-build-push.yml.

on:
  push:
    branches:
      - master
    paths:
      - 'docker/docker-bake.hcl'
      - 'docker/images/node-pc/Dockerfile'
      - '.github/workflows/build-node-pc-image.yml'
  pull_request:
    paths:
      - 'docker/docker-bake.hcl'
      - 'docker/images/node-pc/Dockerfile'
      - '.github/scripts/docker/bake-inputs-changed.mjs'
      - '.github/workflows/build-node-pc-image.yml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to registries'
        required: false
        default: false
        type: boolean

jobs:
  # A rebuild compiles Node and moves the tags to new digests. So master builds
  # only when the inputs (the node-pc bake target) changed.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
      node_version: ${{ steps.resolve.outputs.node_version }}
      build_args: ${{ steps.resolve.outputs.build_args }}
    steps:
      # A pin must point at an image that master built. See docker/AGENTS.md.
      - name: Publish from master only
        if: github.event_name == 'workflow_dispatch' && inputs.push && github.ref != 'refs/heads/master'
        run: |
          echo "::error::Publish from master only. Merge the input change, and master publishes the image. See docker/AGENTS.md."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether the inputs changed
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          node .github/scripts/docker/bake-inputs-changed.mjs --event "$EVENT" --base "$BASE_COMMIT" \
            --targets node-pc --pr-paths .github/workflows/build-node-pc-image.yml

      - name: Read the build args from docker-bake.hcl
        id: resolve
        if: steps.gate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          plan=$(docker buildx bake -f docker/docker-bake.hcl --print node-pc)
          {
            echo "node_version=$(jq -r '.target["node-pc"].args.NODE_VERSION' <<<"$plan")"
            echo "build_args<<BUILD_ARGS_EOF"
            jq -r '.target["node-pc"].args | to_entries[] | "\(.key)=\(.value)"' <<<"$plan"
            echo "BUILD_ARGS_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: blacksmith-32vcpu-ubuntu-2204
            arch: amd64
          - platform: linux/arm64
            runner: blacksmith-32vcpu-ubuntu-2204-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to Docker registries (for pushing)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true)
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: 'true'
          login-dockerhub: 'true'
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push runtime target
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: .
          file: ./docker/images/node-pc/Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: ${{ needs.prepare.outputs.build_args }}
          provenance: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          sbom: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/node-pc:${{ needs.prepare.outputs.node_version }}-${{ matrix.arch }}
            ${{ secrets.DOCKER_USERNAME }}/node-pc:${{ needs.prepare.outputs.node_version }}-${{ github.sha }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository_owner }}/node-pc:${{ needs.prepare.outputs.node_version }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository_owner }}/node-pc:${{ needs.prepare.outputs.node_version }}-${{ github.sha }}-${{ matrix.arch }}
          no-cache: true

      # No no-cache here: reuses the compile layers from the runtime build
      # above, so Node compiles once per architecture
      - name: Build and push dev target
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: .
          file: ./docker/images/node-pc/Dockerfile
          target: dev
          platforms: ${{ matrix.platform }}
          build-args: ${{ needs.prepare.outputs.build_args }}
          provenance: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          sbom: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/node-pc:${{ needs.prepare.outputs.node_version }}-dev-${{ matrix.arch }}
            ${{ secrets.DOCKER_USERNAME }}/node-pc:${{ needs.prepare.outputs.node_version }}-${{ github.sha }}-dev-${{ matrix.arch }}
            ghcr.io/${{ github.repository_owner }}/node-pc:${{ needs.prepare.outputs.node_version }}-dev-${{ matrix.arch }}
            ghcr.io/${{ github.repository_owner }}/node-pc:${{ needs.prepare.outputs.node_version }}-${{ github.sha }}-dev-${{ matrix.arch }}

  create-multi-arch-manifest:
    needs: [prepare, build]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker registries
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: 'true'
          login-dockerhub: 'true'
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create multi-arch manifests
        env:
          NODE_VERSION: ${{ needs.prepare.outputs.node_version }}
        run: |
          for REPO in \
            "${{ secrets.DOCKER_USERNAME }}/node-pc" \
            "ghcr.io/${{ github.repository_owner }}/node-pc" \
          ; do
            for DEV in "" "-dev"; do
              AMD64="$REPO:$NODE_VERSION-${{ github.sha }}$DEV-amd64"
              ARM64="$REPO:$NODE_VERSION-${{ github.sha }}$DEV-arm64"
              for TAG in \
                "$REPO:$NODE_VERSION$DEV" \
                "$REPO:$NODE_VERSION-${{ github.sha }}$DEV" \
              ; do
                echo "Creating manifest $TAG"
                docker buildx imagetools create --tag "$TAG" "$AMD64" "$ARM64"
              done
            done
          done
