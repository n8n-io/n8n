name: 'Build: Node PC Image'

# Publishes the Node runtimes that n8n compiles from source:
#   n8nio/node-pc      - pointer-compressed Node 26, consumed by the n8n `-pc`
#                        image variant
#   n8nio/node-patched - stock-configured Node 24 with the same V8 patches,
#                        consumed by the 1.x image
# Compiling Node from source is too slow under QEMU, so each architecture
# builds on its native runner and a manifest job stitches the per-arch images,
# following docker-build-push.yml.

on:
  push:
    branches:
      - master
    paths:
      - 'docker/docker-bake.hcl'
      - 'docker/images/node-pc/**'
      - '.github/workflows/build-node-pc-image.yml'
  pull_request:
    paths:
      - 'docker/docker-bake.hcl'
      - 'docker/images/node-pc/**'
      - '.github/scripts/docker/bake-inputs-changed.mjs'
      - '.github/workflows/build-node-pc-image.yml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to registries'
        required: false
        default: false
        type: boolean

jobs:
  # A rebuild compiles Node and moves the tags to new digests. So master builds
  # an image only when its own inputs (its bake target, the Dockerfile and the
  # files it copies in) changed. `images` lists the images to build.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.images.outputs.changed }}
      images: ${{ steps.images.outputs.images }}
      node_version_node_pc: ${{ steps.resolve.outputs.node_version_node_pc }}
      build_args_node_pc: ${{ steps.resolve.outputs.build_args_node_pc }}
      node_version_node_patched_24: ${{ steps.resolve.outputs.node_version_node_patched_24 }}
      build_args_node_patched_24: ${{ steps.resolve.outputs.build_args_node_patched_24 }}
    env:
      EVENT: ${{ github.event_name }}
      BASE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      # A pin must point at an image that master built. See docker/AGENTS.md.
      - name: Publish from master only
        if: github.event_name == 'workflow_dispatch' && inputs.push && github.ref != 'refs/heads/master'
        run: |
          echo "::error::Publish from master only. Merge the input change, and master publishes the image. See docker/AGENTS.md."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether the node-pc inputs changed
        id: gate-node-pc
        run: |
          node .github/scripts/docker/bake-inputs-changed.mjs --event "$EVENT" --base "$BASE_COMMIT" \
            --targets node-pc --paths docker/images/node-pc --pr-paths .github/workflows/build-node-pc-image.yml

      - name: Check whether the node-patched-24 inputs changed
        id: gate-node-patched-24
        run: |
          node .github/scripts/docker/bake-inputs-changed.mjs --event "$EVENT" --base "$BASE_COMMIT" \
            --targets node-patched-24 --paths docker/images/node-pc --pr-paths .github/workflows/build-node-pc-image.yml

      # The build matrix. key: the prepare output suffix; repo: the image name
      # in each registry.
      - name: List the images to build
        id: images
        env:
          NODE_PC: ${{ steps.gate-node-pc.outputs.changed }}
          NODE_PATCHED_24: ${{ steps.gate-node-patched-24.outputs.changed }}
        run: |
          set -euo pipefail
          images=$(jq -cn --arg pc "$NODE_PC" --arg p24 "$NODE_PATCHED_24" '[
            (if $pc == "true" then { target: "node-pc", key: "node_pc", repo: "node-pc" } else empty end),
            (if $p24 == "true" then { target: "node-patched-24", key: "node_patched_24", repo: "node-patched" } else empty end)
          ]')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          if [ "$images" = "[]" ]; then echo "changed=false"; else echo "changed=true"; fi >> "$GITHUB_OUTPUT"
          echo "Images to build: $images"

      # One output pair per target, named after the target with `-` as `_`.
      - name: Read the build args from docker-bake.hcl
        id: resolve
        if: steps.images.outputs.changed == 'true'
        run: |
          set -euo pipefail
          plan=$(docker buildx bake -f docker/docker-bake.hcl --print node-pc node-patched-24)
          for target in node-pc node-patched-24; do
            key=${target//-/_}
            {
              echo "node_version_$key=$(jq -r --arg t "$target" '.target[$t].args.NODE_VERSION' <<<"$plan")"
              echo "build_args_$key<<BUILD_ARGS_EOF"
              jq -r --arg t "$target" '.target[$t].args | to_entries[] | "\(.key)=\(.value)"' <<<"$plan"
              echo "BUILD_ARGS_EOF"
            } >> "$GITHUB_OUTPUT"
          done

  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}
        platform:
          - { name: linux/amd64, runner: blacksmith-32vcpu-ubuntu-2204, arch: amd64 }
          - { name: linux/arm64, runner: blacksmith-32vcpu-ubuntu-2204-arm, arch: arm64 }
    env:
      NODE_VERSION: ${{ needs.prepare.outputs[format('node_version_{0}', matrix.image.key)] }}
      BUILD_ARGS: ${{ needs.prepare.outputs[format('build_args_{0}', matrix.image.key)] }}
      REPO: ${{ matrix.image.repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to Docker registries (for pushing)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true)
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: 'true'
          login-dockerhub: 'true'
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push runtime target
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: .
          file: ./docker/images/node-pc/Dockerfile
          target: runtime
          platforms: ${{ matrix.platform.name }}
          build-args: ${{ env.BUILD_ARGS }}
          provenance: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          sbom: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.REPO }}:${{ env.NODE_VERSION }}-${{ matrix.platform.arch }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.REPO }}:${{ env.NODE_VERSION }}-${{ github.sha }}-${{ matrix.platform.arch }}
            ghcr.io/${{ github.repository_owner }}/${{ env.REPO }}:${{ env.NODE_VERSION }}-${{ matrix.platform.arch }}
            ghcr.io/${{ github.repository_owner }}/${{ env.REPO }}:${{ env.NODE_VERSION }}-${{ github.sha }}-${{ matrix.platform.arch }}
          no-cache: true

      # No no-cache here: reuses the compile layers from the runtime build
      # above, so Node compiles once per architecture
      - name: Build and push dev target
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: .
          file: ./docker/images/node-pc/Dockerfile
          target: dev
          platforms: ${{ matrix.platform.name }}
          build-args: ${{ env.BUILD_ARGS }}
          provenance: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          sbom: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.REPO }}:${{ env.NODE_VERSION }}-dev-${{ matrix.platform.arch }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.REPO }}:${{ env.NODE_VERSION }}-${{ github.sha }}-dev-${{ matrix.platform.arch }}
            ghcr.io/${{ github.repository_owner }}/${{ env.REPO }}:${{ env.NODE_VERSION }}-dev-${{ matrix.platform.arch }}
            ghcr.io/${{ github.repository_owner }}/${{ env.REPO }}:${{ env.NODE_VERSION }}-${{ github.sha }}-dev-${{ matrix.platform.arch }}

  # Runs even when a build leg failed, so one image's failure does not hold
  # back the manifests of the other. A missing per-arch image fails only its
  # own image's manifest.
  create-multi-arch-manifest:
    needs: [prepare, build]
    if: always() && needs.prepare.outputs.changed == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker registries
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: 'true'
          login-dockerhub: 'true'
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create multi-arch manifests
        env:
          NODE_VERSION: ${{ needs.prepare.outputs[format('node_version_{0}', matrix.image.key)] }}
        run: |
          for REPO in \
            "${{ secrets.DOCKER_USERNAME }}/${{ matrix.image.repo }}" \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.image.repo }}" \
          ; do
            for DEV in "" "-dev"; do
              AMD64="$REPO:$NODE_VERSION-${{ github.sha }}$DEV-amd64"
              ARM64="$REPO:$NODE_VERSION-${{ github.sha }}$DEV-arm64"
              for TAG in \
                "$REPO:$NODE_VERSION$DEV" \
                "$REPO:$NODE_VERSION-${{ github.sha }}$DEV" \
              ; do
                echo "Creating manifest $TAG"
                docker buildx imagetools create --tag "$TAG" "$AMD64" "$ARM64"
              done
            done
          done
