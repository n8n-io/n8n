name: 'CI: Pull Request Review'

# "CI: Owners Required Reviews" listens to this workflow's completion
# (workflow_run) to re-evaluate fork PRs: a fork's review event runs without
# secrets, a workflow_run does not. Keep the trigger on every review event.
on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

concurrency:
  group: ci-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Required by GitHub branch protection rules.
  # PRs cannot be merged unless this job passes.
  required-review-checks:
    name: Required Review Checks
    runs-on: ubuntu-slim
    steps:
      - name: Complete review workflow
        run: echo "Review event received."
