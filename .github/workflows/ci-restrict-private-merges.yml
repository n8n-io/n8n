name: 'CI: Check merge source and destination'

on:
  pull_request:
    branches:
      - master
      - 1.x
      - 2.x

permissions:
  pull-requests: write
  contents: read

jobs:
  check_branch:
    if: ${{ github.repository == 'n8n-io/n8n-private' }}
    name: enforce-bundle-branches-only-in-private
    runs-on: ubuntu-latest

    steps:
      - name: Validate head branch
        id: validate
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          case "$BASE_REF" in
            master) expected_head='bundle/3.x' ;;
            2.x) expected_head='bundle/2.x' ;;
            1.x) expected_head='bundle/1.x' ;;
            *) exit 1 ;;
          esac
          echo "expected_head=$expected_head" >> "$GITHUB_OUTPUT"
          if [[ "$HEAD_REF" == "$expected_head" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR (blocked)
        if: ${{ steps.validate.outputs.allowed == 'false' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_HEAD: ${{ steps.validate.outputs.expected_head }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const head = context.payload.pull_request.head.ref;
            const base = context.payload.pull_request.base.ref;

            const marker = "<!-- bundle-branch-only -->";
            const body =
              `${marker}\n` +
              `🚫 **Merge blocked**: PRs into \`${base}\` must come from \`${process.env.EXPECTED_HEAD}\`.\n\n` +
              `Current source branch: \`${head}\`.`;

            // Find an existing marker comment (to update instead of spamming)
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail (blocked)
        if: ${{ steps.validate.outputs.allowed == 'false' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          EXPECTED_HEAD: ${{ steps.validate.outputs.expected_head }}
        run: |
          echo "::error::PRs into '$BASE_REF' must come from '$EXPECTED_HEAD'. Got '$HEAD_REF'."
          exit 1

      - name: Allowed
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "OK: '$HEAD_REF' can merge into '$BASE_REF'"
