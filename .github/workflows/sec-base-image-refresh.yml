name: 'Security: Base Image Refresh'

# Finds the base image digests that remove fixable OS findings from the release
# images. See .github/scripts/docker/base-image-candidates.mjs.

on:
  schedule:
    - cron: '0 2 * * *'
  # Runs a change to the workflow before it merges. A dispatch needs the file
  # on master first.
  pull_request:
    paths:
      - '.github/workflows/sec-base-image-refresh.yml'
      - '.github/scripts/docker/base-image-candidates.mjs'
      - '.github/scripts/docker/base-image-publisher.mjs'
      - 'security/keys/dhi.pub'
  workflow_dispatch:

permissions:
  contents: read

# A PR run has its own group, so it does not wait for the scheduled run.
concurrency:
  group: sec-base-image-refresh-${{ github.event_name == 'pull_request' && github.ref || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Find candidate digests
    # A fork PR gets no secrets, so the registry login would fail.
    if: >-
      github.repository == 'n8n-io/n8n' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trivy reads the registry logins from the Docker config. The Docker Hub
      # login also raises the pull rate limit.
      - name: Login to Docker registries
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: 'false'
          login-dockerhub: 'true'
          login-dhi: 'true'
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # A manual run skips the 24-hour gate.
      - name: Find candidate digests
        env:
          EVENT: ${{ github.event_name }}
        run: |
          args=(--out base-image-candidates.json)
          if [ "$EVENT" = workflow_dispatch ]; then args+=(--skip-gate); fi
          node .github/scripts/docker/base-image-candidates.mjs "${args[@]}"

      - name: Upload candidates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-image-candidates
          path: base-image-candidates.json
          if-no-files-found: ignore
          retention-days: 14
