name: 'Test: Dev-server boot smoke'

on:
  workflow_call:
    inputs:
      runner-provider:
        description: 'Optional runner provider override'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref to test'
        required: true
        type: string

env:
  NODE_OPTIONS: '--max-old-space-size=6144'
  PLAYWRIGHT_BROWSERS_PATH: packages/quality/testing/playwright/.playwright-browsers

jobs:
  smoke:
    name: Dev-server smoke
    runs-on: ${{ inputs.runner-provider == 'namespace' && 'namespace-profile-n8n-ci-tools;overrides.cache-tag=github-namespace-profile-n8n-ci-tests-n8n-io-n8n' || (inputs.runner-provider || vars.RUNNER_PROVIDER) == 'github' && 'ubuntu-latest' || inputs.runner-provider == 'blacksmith-bmi' && 'blacksmith-4vcpu-bmi-n8n' || 'blacksmith-4vcpu-ubuntu-2204' }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: useblacksmith/checkout@bcec731f1eb1367240608d1c889a75b96db6ec53 # v1.5.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Setup and Build
        uses: ./.github/actions/setup-nodejs

      - name: Use preinstalled browsers
        id: preinstalled-browsers
        run: |
          expected="$(tr -d '[:space:]' < packages/quality/testing/playwright/.playwright-version)"
          for dir in /opt/ms-playwright /opt/playwright-browsers; do
            if [ -f "$dir/.playwright-version" ] \
              && [ "$(tr -d '[:space:]' < "$dir/.playwright-version")" = "$expected" ]; then
              mkdir -p "$(dirname "$PLAYWRIGHT_BROWSERS_PATH")"
              rm -rf "$PLAYWRIGHT_BROWSERS_PATH"
              ln -s "$dir" "$PLAYWRIGHT_BROWSERS_PATH"
              echo "hit=true" >> "$GITHUB_OUTPUT"
              echo "Using preinstalled Playwright browsers (${expected}) from ${dir}"
              break
            fi
          done

      - name: Install Browsers
        if: steps.preinstalled-browsers.outputs.hit != 'true'
        run: pnpm turbo run install-browsers --filter=n8n-playwright

      # Both steps run from repo root so PLAYWRIGHT_BROWSERS_PATH (relative)
      # resolves correctly. cd-ing into the playwright package double-nests it.
      - name: Run dev-server smoke spec (non-default ports)
        # Runs FIRST, while nothing has ever listened on 5678, so a regression
        # to the 5678 fallback fails with a connection error instead of being
        # satisfied by a server leaked from the default run. The broker moves
        # too, so it cannot squat on 5679 for the run below.
        run: pnpm --filter=n8n-playwright test:dev-server-smoke:alt-port --reporter=list

      - name: Run dev-server smoke spec
        # Always run: a flake above must not cost the default-port signal.
        if: ${{ !cancelled() }}
        run: pnpm --filter=n8n-playwright test:dev-server-smoke --reporter=list

      - name: Upload Failure Artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dev-server-smoke-report
          path: |
            packages/quality/testing/playwright/test-results/
            packages/quality/testing/playwright/playwright-report/
          retention-days: 7
