name: 'Test: Dev-server boot smoke'

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test'
        required: true
        type: string

env:
  NODE_OPTIONS: '--max-old-space-size=6144'

jobs:
  smoke:
    name: Dev-server smoke
    runs-on: ${{ vars.RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'blacksmith-4vcpu-bmi-n8n' }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: useblacksmith/checkout@bcec731f1eb1367240608d1c889a75b96db6ec53 # v1.5.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Setup and Build
        uses: ./.github/actions/setup-nodejs

      - name: Resolve Playwright browsers
        id: preinstalled-browsers
        run: |
          EXPECTED="$(tr -d '[:space:]' < packages/quality/testing/playwright/.playwright-version)"
          BAKED_DIR="/opt/playwright-browsers"
          if [ -f "$BAKED_DIR/.playwright-version" ] \
            && [ "$(tr -d '[:space:]' < "$BAKED_DIR/.playwright-version")" = "$EXPECTED" ]; then
            echo "PLAYWRIGHT_BROWSERS_PATH=$BAKED_DIR" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Using preinstalled Playwright browsers (${EXPECTED}) at ${BAKED_DIR}"
          else
            echo "PLAYWRIGHT_BROWSERS_PATH=$GITHUB_WORKSPACE/packages/quality/testing/playwright/.playwright-browsers" >> "$GITHUB_ENV"
          fi

      - name: Install Browsers
        if: steps.preinstalled-browsers.outputs.ready != 'true'
        run: pnpm turbo run install-browsers --filter=n8n-playwright

      - name: Run dev-server smoke spec (non-default ports)
        # Runs FIRST, while nothing has ever listened on 5678, so a regression
        # to the 5678 fallback fails with a connection error instead of being
        # satisfied by a server leaked from the default run. The broker moves
        # too, so it cannot squat on 5679 for the run below.
        run: pnpm --filter=n8n-playwright test:dev-server-smoke:alt-port --reporter=list

      - name: Run dev-server smoke spec
        # Always run: a flake above must not cost the default-port signal.
        if: ${{ !cancelled() }}
        run: pnpm --filter=n8n-playwright test:dev-server-smoke --reporter=list

      - name: Upload Failure Artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dev-server-smoke-report
          path: |
            packages/quality/testing/playwright/test-results/
            packages/quality/testing/playwright/playwright-report/
          retention-days: 7
