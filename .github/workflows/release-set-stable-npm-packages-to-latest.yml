name: 'Release: Set stable npm packages to latest'

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  promote-github-releases:
    permissions:
      contents: write
    name: Promote current stable releases as latest
    runs-on: ubuntu-slim
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/stable
          fetch-depth: 1

      - name: Setup NodeJS
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: ''
          install-command: pnpm install --frozen-lockfile --dir ./.github/scripts --lockfile-dir ${{ github.workspace }}/.github/scripts --ignore-workspace
          cache-dependency-path: .github/scripts/pnpm-lock.yaml

      - name: Set npm packages to latest
        run: node ./.github/scripts/set-latest-for-monorepo-packages.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_DIST_TAG_AND_INITIAL_PUBLISH_TOKEN }}
