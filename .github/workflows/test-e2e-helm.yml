name: 'Test: E2E Helm Chart'
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Test: E2E Helm Chart (branch={0}, chart={1})', inputs.branch || 'default', inputs['helm-chart-ref'] || 'pinned') || '' }}"

# Scope and design: packages/quality/environments/containers/HELM-TESTING.md

on:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - '.github/workflows/test-e2e-helm.yml'
      - 'packages/quality/environments/containers/helm-stack.ts'
      - 'packages/quality/environments/containers/helm-start-stack.ts'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: false
        default: ''
      helm-chart-ref:
        description: 'n8n-hosting branch/tag for Helm chart. Empty uses the tag pinned in helm-stack.ts.'
        required: false
        default: ''

permissions:
  contents: read

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}
  HELM_CHART_REF: ${{ inputs.helm-chart-ref }}

jobs:
  build:
    name: 'Build Docker Image'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 1

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: 'pnpm build:docker'
          enable-docker-cache: true
          docker-cache-key: n8n-io/n8n
        env:
          INCLUDE_TEST_CONTROLLER: 'true'
          IMAGE_BASE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ci-${{ github.run_id }}
          RUNNERS_IMAGE_BASE_NAME: ghcr.io/${{ github.repository_owner }}/runners

  helm-e2e:
    name: 'Helm E2E (${{ matrix.example }})'
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example: [standalone, minimal]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 1

      - name: Setup Environment
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: 'pnpm build'

      - name: Install Browsers
        working-directory: packages/quality/testing/playwright
        run: pnpm exec playwright install chromium

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Start K3s + Helm stack
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: |
          # tsx is a devDependency of n8n-containers, not the repo root, so it
          # must run via that package (root `npx tsx` stopped resolving when
          # shamefully-hoist was removed).
          pnpm --filter n8n-containers exec tsx helm-start-stack.ts \
            --env E2E_TESTS=true --env NODE_ENV=development \
            --example "${{ matrix.example }}" \
            --image "${{ env.DOCKER_IMAGE }}" \
            ${HELM_CHART_REF:+--chart-ref "$HELM_CHART_REF"} \
            --url-file /tmp/n8n-helm-url.txt \
            --kubeconfig-file /tmp/n8n-helm-kubeconfig.txt

          N8N_URL=$(cat /tmp/n8n-helm-url.txt)
          echo "n8n URL: ${N8N_URL}"
          echo "N8N_BASE_URL=${N8N_URL}" >> "$GITHUB_ENV"

          KUBECONFIG_PATH=$(cat /tmp/n8n-helm-kubeconfig.txt)
          echo "KUBECONFIG=${KUBECONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Run Code node execution test
        working-directory: packages/quality/testing/playwright
        run: |
          N8N_BASE_URL="${{ env.N8N_BASE_URL }}" \
          RESET_E2E_DB=true \
          npx playwright test \
            --project=e2e \
            tests/e2e/nodes/code-node-api.spec.ts \
            --workers=1 \
            --retries=2 \
            --reporter=list

      - name: Debug K8s State
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -o wide
          echo ""
          echo "=== Pod Descriptions ==="
          kubectl describe pods -l app.kubernetes.io/name=n8n
          echo ""
          echo "=== Recent Events ==="
          kubectl get events --sort-by=.lastTimestamp | tail -30
          echo ""
          echo "=== n8n Pod Logs (last 100 lines) ==="
          kubectl logs -l app.kubernetes.io/name=n8n --all-containers --tail=100 || true
          echo ""
          echo "=== Health Check ==="
          curl -s -o /dev/null -w "HTTP %{http_code}" "${{ env.N8N_BASE_URL }}/healthz/readiness" || echo "UNREACHABLE"

      - name: Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: helm-e2e-report-${{ matrix.example }}
          path: |
            packages/quality/testing/playwright/test-results/
            packages/quality/testing/playwright/playwright-report/
          retention-days: 7

  cleanup-ghcr:
    name: 'Cleanup GHCR Image'
    needs: [build, helm-e2e]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2204
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Delete images from GHCR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ORG: ${{ github.repository_owner }}
          GHCR_REPO: ${{ github.event.repository.name }}
        run: node .github/scripts/cleanup-ghcr-images.mjs --tag ci-${{ github.run_id }}

  notify-on-failure:
    name: Notify Slack on nightly failure
    needs: [build, helm-e2e]
    if: always() && contains(needs.*.result, 'failure') && github.event_name == 'schedule'
    runs-on: blacksmith-2vcpu-ubuntu-2204
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/slack
          sparse-checkout-cone-mode: false
      - name: Notify Slack
        env:
          SLACK_TOKEN: ${{ secrets.QBOT_SLACK_TOKEN }}
        run: |
          node .github/scripts/slack/notify.mjs \
            --channel '#team-catalysts' \
            --text 'Nightly Helm chart E2E failed - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
