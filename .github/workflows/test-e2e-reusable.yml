name: 'Test: E2E'

on:
  workflow_call:
    inputs:
      branch:
        description: 'GitHub branch to test.'
        required: false
        type: string
      test-mode:
        description: 'Test mode: local or docker-artifact'
        required: false
        default: 'local'
        type: string
      test-command:
        description: 'Test command to run'
        required: false
        default: 'pnpm --filter=n8n-playwright test:local'
        type: string
      workers:
        description: 'Number of parallel workers'
        required: false
        default: ''
        type: string
      runner:
        description: 'GitHub runner to use'
        required: false
        default: 'blacksmith-2vcpu-ubuntu-2204'
        type: string
      timeout-minutes:
        description: 'Job timeout in minutes'
        required: false
        default: 30
        type: number
      currents-project-id:
        description: 'Currents project ID for reporting'
        required: false
        default: 'nHHLA5'
        type: string
      currents-record-key:
        description: 'Currents record key. When set, Currents keeps the run artifacts and the shards do not upload their own.'
        required: false
        default: ''
        type: string
      pre-generated-matrix:
        description: 'Pre-generated shard matrix JSON. Defaults to 1 shard; multi-shard callers pass their own.'
        required: false
        default: '[{"shard":1,"images":""}]'
        type: string
      n8n-env:
        description: 'JSON string of n8n env vars to inject into test containers, e.g. {"N8N_EXPRESSION_ENGINE":"legacy"}'
        required: false
        default: ''
        type: string
      artifact-prefix:
        description: 'Prefix for uploaded shard artifacts'
        required: false
        default: 'e2e'
        type: string
      build-variant:
        description: 'Build variant for docker-artifact mode. Must match the variant used by prepare-docker (standard, coverage, or pc).'
        required: false
        default: 'standard'
        type: string
      use-toolchain-pilot:
        description: 'Use the CI toolchain image on all shards.'
        required: false
        default: false
        type: boolean

env:
  NODE_OPTIONS: ${{ inputs.use-toolchain-pilot && (contains(inputs.runner, '2vcpu') && '--max-old-space-size=6144 --dns-result-order=ipv4first' || '--dns-result-order=ipv4first') || (contains(inputs.runner, '2vcpu') && '--max-old-space-size=6144' || '') }}
  PLAYWRIGHT_WORKERS: ${{ inputs.workers != '' && inputs.workers || '2' }}
  # docker-artifact loads the image locally as n8nio/n8n:local; unused in local mode.
  TEST_IMAGE_N8N: 'n8nio/n8n:local'
  N8N_SKIP_LICENSES: 'true'
  CURRENTS_CI_BUILD_ID: ${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
  CURRENTS_PROJECT_ID: ${{ inputs.currents-project-id }}

jobs:
  test:
    runs-on: ${{ vars.RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || inputs.runner }}
    container: ${{ inputs.use-toolchain-pilot && fromJSON(format('{{"image":"ghcr.io/n8n-io/ci-toolchain:node26.5.1-pnpm12.4.2-pw1.62.1-sc1.5.20-v2","credentials":{{"username":"{0}","password":"{1}"}}}}', github.actor, github.token)) || null }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.pre-generated-matrix) }}
    name: Shard ${{ matrix.shard }}
    env:
      # Use the image browser in pilot jobs and the package cache path otherwise.
      PLAYWRIGHT_BROWSERS_PATH: ${{ inputs.use-toolchain-pilot && '/ms-playwright' || format('{0}/packages/testing/playwright/.playwright-browsers', github.workspace) }}

    steps:
      - name: Mark first pilot step
        if: inputs.use-toolchain-pilot
        run: |
          {
            echo "CI_FIRST_STEP=$(date +%s)"
            echo 'GIT_CONFIG_COUNT=1'
            echo 'GIT_CONFIG_KEY_0=safe.directory'
            echo "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: useblacksmith/checkout@bcec731f1eb1367240608d1c889a75b96db6ec53 # v1.5.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup-nodejs
        with:
          preinstalled-toolchain: ${{ inputs.use-toolchain-pilot }}
        env:
          QA_METRICS_WEBHOOK_URL: ${{ secrets.QA_METRICS_WEBHOOK_URL }}
          QA_METRICS_WEBHOOK_USER: ${{ secrets.QA_METRICS_WEBHOOK_USER }}
          QA_METRICS_WEBHOOK_PASSWORD: ${{ secrets.QA_METRICS_WEBHOOK_PASSWORD }}

      - name: Install Browsers
        if: ${{ !inputs.use-toolchain-pilot }}
        run: pnpm turbo run install-browsers --filter=n8n-playwright

      - name: Verify pilot browser, Turbo cache and Docker
        if: ${{ inputs.use-toolchain-pilot }}
        working-directory: packages/testing/playwright
        run: |
          node -e 'const { chromium } = require("@playwright/test"); const fs = require("node:fs"); const path = chromium.executablePath(); if (!path.startsWith(process.env.PLAYWRIGHT_BROWSERS_PATH + "/") || !fs.existsSync(path)) process.exit(1); console.log(path)'
          test -n "$TURBO_API"
          docker info --format '{{.ServerVersion}}'
          docker buildx version

      - name: Load n8n image from cache
        if: ${{ inputs.test-mode == 'docker-artifact' }}
        uses: ./.github/actions/load-n8n-docker
        with:
          build-variant: ${{ inputs.build-variant }}

      - name: Pre-pull Test Container Images
        if: ${{ !contains(inputs.test-command, 'test:local') }}
        run: pnpm --filter n8n-containers exec tsx pull-test-images.ts ${{ matrix.images }} || true

      - name: Filter specs to previous-attempt failures
        if: github.run_attempt > 1 && matrix.specs != ''
        id: filter-shard
        env:
          CANDIDATES: ${{ matrix.specs }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          FILTERED=$(echo "$CANDIDATES" | node packages/testing/janitor/dist/cli.js filter-shard | tr '\n' ' ' | sed 's/ *$//')
          echo "specs=$FILTERED" >> "$GITHUB_OUTPUT"

      - name: Resolve shard args
        id: shard-args
        env:
          # On retry, prefer the filtered subset (failed specs from previous attempt)
          RETRY_SPECS: ${{ steps.filter-shard.outputs.specs }}
          MATRIX_SPECS: ${{ matrix.specs }}
          # toJSON distinguishes an orchestrated-but-empty spec list ("") from a
          # non-orchestrated matrix entry that never set `specs` (null). Only the
          # latter may fall back to Playwright's own --shard splitting; an empty
          # orchestrated list means "nothing to run", never "run everything".
          MATRIX_SPECS_JSON: ${{ toJSON(matrix.specs) }}
          SHARD: ${{ matrix.shard }}
          JOB_TOTAL: ${{ strategy.job-total }}
        run: |
          if [ -n "$RETRY_SPECS" ]; then
            echo "args=$RETRY_SPECS" >> "$GITHUB_OUTPUT"
          elif [ "$MATRIX_SPECS_JSON" = "null" ]; then
            echo "args=--shard=$SHARD/$JOB_TOTAL" >> "$GITHUB_OUTPUT"
          elif [ -z "$MATRIX_SPECS" ]; then
            echo "This shard's spec list is empty — nothing to run, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "args=$MATRIX_SPECS" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Tests
        if: steps.shard-args.outputs.skip != 'true'
        run: |
          if [ -n "${CI_FIRST_STEP:-}" ]; then
            echo "Time from first step to tests: $(($(date +%s) - CI_FIRST_STEP))s" >> "$GITHUB_STEP_SUMMARY"
          fi
          # --pass-with-no-tests makes Playwright exit 0 when the selected specs
          # resolve to zero runnable tests. Covers the impact-map vs current-suite
          # skew window: a spec the committed coverage map points at may have been
          # quarantined (test.skip/fixme) since the map was built, or a capability
          # --grep on the test-command may filter every test on a shard. The
          # selector is doing the right thing; the run shouldn't treat "nothing
          # to run" as failure.
          # shellcheck disable=SC2086
          $TEST_COMMAND --workers="$WORKERS" $SHARD_ARGS --pass-with-no-tests
        env:
          # Protect args from template injections
          TEST_COMMAND: ${{ inputs.test-command }}
          # Uses pre-distributed specs if orchestration enabled, otherwise falls back to Playwright sharding
          WORKERS: ${{ env.PLAYWRIGHT_WORKERS }}
          SHARD_ARGS: ${{ steps.shard-args.outputs.args }}
          # Args for actual test command runner
          CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
          QA_METRICS_WEBHOOK_URL: ${{ secrets.QA_METRICS_WEBHOOK_URL }}
          QA_METRICS_WEBHOOK_USER: ${{ secrets.QA_METRICS_WEBHOOK_USER }}
          QA_METRICS_WEBHOOK_PASSWORD: ${{ secrets.QA_METRICS_WEBHOOK_PASSWORD }}
          N8N_LICENSE_ACTIVATION_KEY: ${{ secrets.N8N_LICENSE_ACTIVATION_KEY }}
          N8N_LICENSE_CERT: ${{ secrets.N8N_LICENSE_CERT }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          # Hosted sandbox service for the instance-ai specs. When both are set the
          # `sandbox` test service skips its local dind stack and points n8n here.
          # Unset (fork PRs get no secrets) falls back to the local containers.
          N8N_SANDBOX_SERVICE_URL: ${{ secrets.N8N_SANDBOX_SERVICE_URL }}
          N8N_SANDBOX_SERVICE_API_KEY: ${{ secrets.N8N_SANDBOX_SERVICE_API_KEY }}
          N8N_TEST_ENV: ${{ inputs.n8n-env }}
          # Opt in to the a11y reporter here rather than in playwright.config.ts,
          # so a local run stays quiet unless it is asked for.
          PLAYWRIGHT_A11Y_REPORT: '1'

      # Currents already keeps these artifacts for the runs it records, so the
      # shard upload is only needed when no record key is passed.
      - name: Upload Shard Artifacts
        if: ${{ always() && inputs.currents-record-key == '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.artifact-prefix }}-shard-${{ matrix.shard }}
          path: |
            packages/testing/playwright/test-results/
            packages/testing/playwright/test-results.json
            packages/testing/playwright/playwright-report/
            packages/testing/playwright/coverage/lcov.info
            packages/testing/playwright/coverage/by-spec/
            packages/testing/playwright/coverage/index.html
            packages/testing/playwright/coverage/assets/
          retention-days: 1
          if-no-files-found: ignore

      # Only on a red run: the per-test axe scans are already attached to their
      # test in Currents, and a green run still gets the violation table in the
      # job summary, so uploading the full report every time would be a third
      # copy of the same data per shard.
      - name: Upload Accessibility Report
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.artifact-prefix }}-a11y-report-shard-${{ matrix.shard }}
          path: packages/testing/playwright/a11y-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Cancel Currents run if workflow is cancelled
        if: ${{ cancelled() }}
        env:
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
        run: |
          if [ -n "$CURRENTS_API_KEY" ]; then
            curl --location --request PUT \
              "https://api.currents.dev/v1/runs/cancel-ci/github" \
              --header "Authorization: Bearer $CURRENTS_API_KEY" \
              --header "Content-Type: application/json" \
              --data "{\"githubRunId\": \"${{ github.run_id }}\", \"githubRunAttempt\": \"${{ github.run_attempt }}\"}"
          fi
