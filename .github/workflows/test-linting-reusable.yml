name: 'Test: Linting'

on:
  workflow_call:
    inputs:
      ref:
        description: GitHub ref to lint.
        required: false
        type: string
        default: ''
      nodeVersion:
        description: Version of node to use.
        required: false
        type: string
        default: 26.5.1

env:
  # NODE_OPTIONS is per process and is inherited by every worker turbo spawns,
  # so the budget that matters is concurrency x cap, not the cap alone. 2
  # concurrent turbo tasks (see lint:ci) x 6 GB is about 12 GB of the 15.2 GB
  # on a 4vcpu runner. Keep the product under ~12 GB when changing either
  # factor, and trade one against the other rather than raising the total:
  # linting packages/cli alone needs more than 4 GB of heap.
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  lint:
    name: Lint
    runs-on: ${{ vars.RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ inputs.ref }}

      - name: Build and Test
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: pnpm lint:ci
          node-version: ${{ inputs.nodeVersion }}
