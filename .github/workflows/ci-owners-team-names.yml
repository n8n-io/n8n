name: 'CI: Validate OWNERS team names'

on:
  pull_request_target:
    paths:
      - 'OWNERS'
      - 'GROUPS.json'
      - '.github/scripts/owners/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  reject-fork-changes:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject protected ownership file changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          protected=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | select(.filename == "OWNERS" or .filename == "GROUPS.json") | .filename')
          if [ -n "$protected" ]; then
            echo "Fork PRs cannot modify OWNERS or GROUPS.json:"
            echo "$protected"
            exit 1
          fi

  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}
          permission-members: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validate team names
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/scripts/owners/validate-team-names.mjs
