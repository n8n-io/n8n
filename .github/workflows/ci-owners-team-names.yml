name: 'CI: Validate OWNERS team names'

# This workflow must use pull_request_target so forks cannot change the guard
# that rejects OWNERS and GROUPS.json edits. It checks out only the trusted base
# revision. Proposed ownership files are read as data and written outside the
# checkout. No PR-controlled code runs with the app token.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    paths:
      - 'OWNERS'
      - 'GROUPS.json'
      - '.github/scripts/owners/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  reject-fork-changes:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject protected ownership file changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          protected=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | select(.filename == "OWNERS" or .filename == "GROUPS.json") | .filename')
          if [ -n "$protected" ]; then
            echo "Fork PRs cannot modify OWNERS or GROUPS.json:"
            echo "$protected"
            exit 1
          fi

  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}
          permission-contents: read
          permission-members: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read proposed ownership files
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/OWNERS?ref=${HEAD_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/OWNERS"
          gh api "repos/${GITHUB_REPOSITORY}/contents/GROUPS.json?ref=${HEAD_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/GROUPS.json"

      - name: Validate team names
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNERS_FILE: ${{ runner.temp }}/OWNERS
          GROUPS_FILE: ${{ runner.temp }}/GROUPS.json
        run: node .github/scripts/owners/validate-team-names.mjs
