name: 'Docker: Shared app build architecture canary'

# Builds the application once on AMD64. Native AMD64 and ARM64 jobs then use
# that same deployment closure as their Docker build context. This prevents
# two application builds from writing competing Turbo cache entries.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/docker-cross-arch-cache-canary.yml'

permissions:
  contents: read

concurrency:
  group: shared-app-build-canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26.7.0'

jobs:
  build-app:
    name: Install and build application
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: blacksmith-8vcpu-ubuntu-2204
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install and build
        uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-command: pnpm build:n8n

      # Keep pnpm symlinks and executable modes intact across the job boundary.
      - name: Package the shared Docker context
        run: |
          tar -cf "$RUNNER_TEMP/build-context.tar" \
            compiled \
            dist/task-runner-javascript

      - name: Upload the shared Docker context
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: shared-build-context
          path: ${{ runner.temp }}/build-context.tar
          if-no-files-found: error
          retention-days: 1

  build-images:
    name: Build and verify images (${{ matrix.target }})
    needs: build-app
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            runner: blacksmith-8vcpu-ubuntu-2204
          - target: arm64
            runner: blacksmith-8vcpu-ubuntu-2204-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET_PLATFORM: linux/${{ matrix.target }}
      N8N_IMAGE: n8nio/n8n:shared-build-canary-${{ matrix.target }}
      N8N_PC_IMAGE: n8nio/n8n:shared-build-canary-${{ matrix.target }}-pc
      RUNNERS_IMAGE: n8nio/runners:shared-build-canary-${{ matrix.target }}
      RUNNERS_DISTROLESS_IMAGE: n8nio/runners:shared-build-canary-${{ matrix.target }}-distroless
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Docker smoke-test dependencies
        uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-command: ''
          enable-docker-cache: 'true'
          # Blacksmith stores a separate Sticky Disk variant per architecture.
          docker-cache-key: n8n-io/n8n

      - name: Download the shared Docker context
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: shared-build-context
          path: ${{ runner.temp }}/build-context

      - name: Restore the shared Docker context
        run: tar -xf "$RUNNER_TEMP/build-context/build-context.tar"

      # docker-build-smoke.yml remains the no-cache guard for native builds.
      - name: Build every image variant with Docker cache
        env:
          PLATFORMS: ${{ env.TARGET_PLATFORM }}
          N8N_TAGS: ${{ env.N8N_IMAGE }}
          N8N_PC_TAGS: ${{ env.N8N_PC_IMAGE }}
          RUNNERS_TAGS: ${{ env.RUNNERS_IMAGE }}
          RUNNERS_DISTROLESS_TAGS: ${{ env.RUNNERS_DISTROLESS_IMAGE }}
        run: |
          docker buildx bake -f docker/docker-bake.hcl \
            n8n n8n-pc runners runners-distroless \
            --load \
            --provenance=false \
            --sbom=false

      - name: Create a token for the Cloud chart smoke check
        id: cloud-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}
          owner: n8n-io
          repositories: n8n-cloud
          permission-contents: read

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Verify both n8n image variants against Cloud
        env:
          GH_TOKEN: ${{ steps.cloud-token.outputs.token }}
          SMOKE_RUNNERS_IMAGES: ${{ env.RUNNERS_IMAGE }},${{ env.RUNNERS_DISTROLESS_IMAGE }}
        run: |
          for image in "$N8N_IMAGE" "$N8N_PC_IMAGE"; do
            SMOKE_IMAGE="$image" pnpm build:docker:smoke
          done

      - name: Execute native modules and agent-browser
        run: |
          for image in "$N8N_IMAGE" "$N8N_PC_IMAGE"; do
            docker run --rm --entrypoint node "$image" -e \
              "require('/usr/local/lib/node_modules/n8n/node_modules/isolated-vm'); require('/usr/local/lib/node_modules/n8n/node_modules/sqlite3')"

            # The package expects its postinstall to set the executable bit.
            # Run as root so this check tests binary compatibility only.
            docker run --rm --user root --entrypoint sh "$image" -c '
              set -- $(find /usr/local/lib/node_modules/n8n -type f -path "*/agent-browser/bin/agent-browser.js")
              if [ "$#" -eq 0 ]; then
                echo "agent-browser launcher not found" >&2
                exit 1
              fi
              node "$1" --version
            '
          done

      - name: Execute both task runner launchers
        run: |
          for image in "$RUNNERS_IMAGE" "$RUNNERS_DISTROLESS_IMAGE"; do
            output="$(docker run --rm \
              --env N8N_RUNNERS_AUTH_TOKEN=cache-canary \
              --entrypoint /usr/local/bin/task-runner-launcher \
              "$image" cache-canary-invalid-runner 2>&1 || true)"
            if ! grep -q 'does not contain requested runner type: cache-canary-invalid-runner' <<< "$output"; then
              echo "::error::Task runner launcher did not start in $image"
              echo "$output"
              exit 1
            fi
          done

      - name: Verify every image has the target architecture
        run: |
          for image in \
            "$N8N_IMAGE" \
            "$N8N_PC_IMAGE" \
            "$RUNNERS_IMAGE" \
            "$RUNNERS_DISTROLESS_IMAGE"
          do
            actual="$(docker image inspect --format '{{.Architecture}}' "$image")"
            if [ "$actual" != "${TARGET_PLATFORM#linux/}" ]; then
              echo "::error::$image has architecture $actual, expected ${TARGET_PLATFORM#linux/}"
              exit 1
            fi
          done

  verify:
    name: Verify architecture fan-out
    needs: build-images
    runs-on: ubuntu-slim
    steps:
      - name: Report success
        run: |
          echo '### Shared application build canary' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'The AMD64 and ARM64 image builds passed all runtime checks.' >> "$GITHUB_STEP_SUMMARY"
