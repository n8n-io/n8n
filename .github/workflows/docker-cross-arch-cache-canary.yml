name: 'Docker: Cross-architecture Turbo cache canary'

# Proves that one architecture can restore package build outputs from the
# other architecture without sharing the deployment closure or Docker layers.
# Each target runner installs and deploys its own dependencies before it builds
# and executes all published image variants.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/docker-cross-arch-cache-canary.yml'

permissions:
  contents: read

concurrency:
  group: cross-arch-turbo-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26.7.0'

jobs:
  prime-cache:
    name: Prime Turbo cache (${{ matrix.source }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    strategy:
      fail-fast: false
      matrix:
        include:
          - direction: amd64-to-arm64
            source: amd64
            runner: blacksmith-8vcpu-ubuntu-2204
          - direction: arm64-to-amd64
            source: arm64
            runner: blacksmith-8vcpu-ubuntu-2204-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CROSS_ARCH_CACHE_CANARY: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.direction }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Add the canary value to the Turbo cache key
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const path = 'turbo.json';
          const config = fs.readFileSync(path, 'utf8');
          const before = '"globalEnv": ["CI", "BUILD_WITH_COVERAGE"]';
          const after = '"globalEnv": ["CI", "BUILD_WITH_COVERAGE", "CROSS_ARCH_CACHE_CANARY"]';

          if (!config.includes(before)) {
            throw new Error('turbo.json no longer has the expected globalEnv value');
          }

          fs.writeFileSync(path, config.replace(before, after));
          NODE

      - name: Install and prime the Turbo cache
        uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-command: pnpm build:n8n
          turbo-use-relative-cache-path: 'true'

      - name: Verify the prime build used a fresh cache key
        env:
          EXPECTED_CACHE_STATUS: MISS
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const directory = '.turbo/runs';
          const reports = fs
            .readdirSync(directory)
            .map((name) => ({ name, mtime: fs.statSync(path.join(directory, name)).mtimeMs }))
            .sort((left, right) => right.mtime - left.mtime);
          if (reports.length === 0) throw new Error('Turbo did not write a run summary');

          const report = JSON.parse(fs.readFileSync(path.join(directory, reports[0].name), 'utf8'));
          const tasks = report.tasks.filter((task) => task.task === 'build');
          if (tasks.length === 0) throw new Error('The Turbo summary contains no build tasks');

          const unexpected = tasks.filter((task) => task.cache.status !== process.env.EXPECTED_CACHE_STATUS);
          const counts = Object.groupBy(tasks, (task) => `${task.cache.status}:${task.cache.source ?? 'NONE'}`);
          const summary = Object.entries(counts)
            .map(([key, entries]) => `${key}=${entries.length}`)
            .join(', ');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Prime cache\n\n${summary}\n`);

          if (unexpected.length > 0) {
            console.error(`Expected every build task to miss. Unexpected tasks: ${unexpected.map((task) => task.taskId).join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Upload the Turbo prime report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: turbo-prime-${{ matrix.direction }}
          path: .turbo/runs/*.json
          if-no-files-found: error
          retention-days: 7

  consume-cache-and-build:
    name: Consume cache and build images (${{ matrix.target }})
    needs: prime-cache
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    strategy:
      fail-fast: false
      matrix:
        include:
          - direction: amd64-to-arm64
            target: arm64
            runner: blacksmith-8vcpu-ubuntu-2204-arm
          - direction: arm64-to-amd64
            target: amd64
            runner: blacksmith-8vcpu-ubuntu-2204
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CROSS_ARCH_CACHE_CANARY: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.direction }}
      TARGET_PLATFORM: linux/${{ matrix.target }}
      N8N_IMAGE: n8nio/n8n:cross-arch-canary-${{ matrix.target }}
      N8N_PC_IMAGE: n8nio/n8n:cross-arch-canary-${{ matrix.target }}-pc
      RUNNERS_IMAGE: n8nio/runners:cross-arch-canary-${{ matrix.target }}
      RUNNERS_DISTROLESS_IMAGE: n8nio/runners:cross-arch-canary-${{ matrix.target }}-distroless
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Add the canary value to the Turbo cache key
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const path = 'turbo.json';
          const config = fs.readFileSync(path, 'utf8');
          const before = '"globalEnv": ["CI", "BUILD_WITH_COVERAGE"]';
          const after = '"globalEnv": ["CI", "BUILD_WITH_COVERAGE", "CROSS_ARCH_CACHE_CANARY"]';

          if (!config.includes(before)) {
            throw new Error('turbo.json no longer has the expected globalEnv value');
          }

          fs.writeFileSync(path, config.replace(before, after));
          NODE

      - name: Install and consume the Turbo cache
        uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-command: pnpm build:n8n
          turbo-use-relative-cache-path: 'true'

      - name: Verify every build task used the remote cache
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const directory = '.turbo/runs';
          const reports = fs
            .readdirSync(directory)
            .map((name) => ({ name, mtime: fs.statSync(path.join(directory, name)).mtimeMs }))
            .sort((left, right) => right.mtime - left.mtime);
          if (reports.length === 0) throw new Error('Turbo did not write a run summary');

          const report = JSON.parse(fs.readFileSync(path.join(directory, reports[0].name), 'utf8'));
          const tasks = report.tasks.filter((task) => task.task === 'build');
          if (tasks.length === 0) throw new Error('The Turbo summary contains no build tasks');

          const unexpected = tasks.filter(
            (task) => task.cache.status !== 'HIT' || task.cache.source !== 'REMOTE',
          );
          const counts = Object.groupBy(tasks, (task) => `${task.cache.status}:${task.cache.source ?? 'NONE'}`);
          const summary = Object.entries(counts)
            .map(([key, entries]) => `${key}=${entries.length}`)
            .join(', ');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Consume cache\n\n${summary}\n`);

          if (unexpected.length > 0) {
            console.error(`Expected every build task to hit the remote cache. Unexpected tasks: ${unexpected.map((task) => task.taskId).join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Upload the Turbo consumer report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: turbo-consumer-${{ matrix.direction }}
          path: .turbo/runs/*.json
          if-no-files-found: error
          retention-days: 7

      # Use a fresh builder. Docker caching must not hide a bad native build in
      # a canary that is testing the host-side Turbo cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build every image variant without Docker cache
        env:
          PLATFORMS: ${{ env.TARGET_PLATFORM }}
          N8N_TAGS: ${{ env.N8N_IMAGE }}
          N8N_PC_TAGS: ${{ env.N8N_PC_IMAGE }}
          RUNNERS_TAGS: ${{ env.RUNNERS_IMAGE }}
          RUNNERS_DISTROLESS_TAGS: ${{ env.RUNNERS_DISTROLESS_IMAGE }}
        run: |
          docker buildx bake -f docker/docker-bake.hcl \
            n8n n8n-pc runners runners-distroless \
            --load \
            --no-cache \
            --provenance=false \
            --sbom=false

      - name: Create a token for the Cloud chart smoke check
        id: cloud-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}
          owner: n8n-io
          repositories: n8n-cloud

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Verify both n8n image variants against Cloud
        env:
          GH_TOKEN: ${{ steps.cloud-token.outputs.token }}
          SMOKE_RUNNERS_IMAGES: ${{ env.RUNNERS_IMAGE }},${{ env.RUNNERS_DISTROLESS_IMAGE }}
        run: |
          for image in "$N8N_IMAGE" "$N8N_PC_IMAGE"; do
            SMOKE_IMAGE="$image" pnpm build:docker:smoke
          done

      - name: Execute native modules and agent-browser
        run: |
          for image in "$N8N_IMAGE" "$N8N_PC_IMAGE"; do
            docker run --rm --entrypoint node "$image" -e \
              "require('/usr/local/lib/node_modules/n8n/node_modules/isolated-vm'); require('/usr/local/lib/node_modules/n8n/node_modules/sqlite3')"

            docker run --rm --entrypoint sh "$image" -c '
              set -- $(find /usr/local/lib/node_modules/n8n -type f -path "*/agent-browser/bin/agent-browser.js")
              if [ "$#" -eq 0 ]; then
                echo "agent-browser launcher not found" >&2
                exit 1
              fi
              node "$1" --version
            '
          done

      - name: Execute both task runner launchers
        run: |
          for image in "$RUNNERS_IMAGE" "$RUNNERS_DISTROLESS_IMAGE"; do
            output="$(docker run --rm \
              --env N8N_RUNNERS_AUTH_TOKEN=cache-canary \
              --entrypoint /usr/local/bin/task-runner-launcher \
              "$image" cache-canary-invalid-runner 2>&1 || true)"
            if ! grep -q 'does not contain requested runner type: cache-canary-invalid-runner' <<< "$output"; then
              echo "::error::Task runner launcher did not start in $image"
              echo "$output"
              exit 1
            fi
          done

      - name: Verify every image has the target architecture
        run: |
          for image in \
            "$N8N_IMAGE" \
            "$N8N_PC_IMAGE" \
            "$RUNNERS_IMAGE" \
            "$RUNNERS_DISTROLESS_IMAGE"
          do
            actual="$(docker image inspect --format '{{.Architecture}}' "$image")"
            if [ "$actual" != "${TARGET_PLATFORM#linux/}" ]; then
              echo "::error::$image has architecture $actual, expected ${TARGET_PLATFORM#linux/}"
              exit 1
            fi
          done
