name: Testbox Evidence Spike

on:
  workflow_dispatch:
    inputs:
      testbox_id:
        description: 'Blacksmith Testbox session ID'
        required: false
        type: string

permissions:
  contents: read

jobs:
  testbox:
    name: Evidence Testbox
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@ad4fbed427d8251a90e589c0886dd3d07ec7727f # main
        with:
          testbox_id: ${{ inputs.testbox_id }}

      - name: Set up repository
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: ''

      - name: Run Testbox
        uses: useblacksmith/run-testbox@3f60ff9ceb2c10c3feefa87dc0c6490cffae059d # main
