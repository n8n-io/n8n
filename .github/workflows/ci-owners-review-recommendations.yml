name: 'CI: Owners Review Recommendations'

# Posts or updates the PR review overview comment through DevHub: owning
# teams, changed lines, and required teams. DevHub writes the comment as its
# own GitHub App. See n8n-io/github-actions ownership-checks/README.md.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - master

permissions: {}

jobs:
  ownership-comment:
    uses: n8n-io/github-actions/.github/workflows/ownership-checks.yml@be626e7b43cf88fe6d1404a29ed4e2b4f9cbb294 # ownership-checks/v1.0.0
    permissions:
      id-token: write
      # The shared workflow's single job declares both permissions, also when only the comment step runs.
      pull-requests: read
    with:
      required-reviews: false
      devhub-url: https://devhub.services.n8n.cloud
