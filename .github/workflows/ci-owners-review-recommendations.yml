name: 'CI: Owners Review Recommendations'

# Posts or updates the PR review overview comment through DevHub: owning
# teams, changed lines, and required teams. DevHub writes the comment as its
# own GitHub App. See n8n-io/github-actions ownership-checks/README.md.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - master

permissions: {}

jobs:
  ownership-comment:
    uses: n8n-io/github-actions/.github/workflows/ownership-checks.yml@fecf3cb96940e5d483bdc58ddb6936a642f87570 # TODO: pin to ownership-checks/v1.0.0
    permissions:
      id-token: write
      # Every job of the shared workflow is validated against these permissions, also the skipped ones.
      pull-requests: read
    with:
      required-reviews: false
