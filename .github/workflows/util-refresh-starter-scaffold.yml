# n8n-nodes-starter vendors the output of `n8n-node new` as its example
# scaffold — nodes/Example, nodes/GithubIssues, credentials/, icons/, plus
# everything else a fresh `n8n-node new` run generates at the project root
# (CI/publish workflows, .agents/, AGENTS.md, CLAUDE.md, tooling config, ...).
# That output is entirely determined by the templates this package ships —
# n8n-nodes-starter has no scaffold logic of its own, it's just where the
# generated bytes live — so this workflow builds @n8n/node-cli from source
# here, regenerates n8n-nodes-starter's scaffold with it, and opens a PR
# there directly whenever the templates change.

name: 'Util: Refresh starter scaffold'

on:
  push:
    branches: [master]
    paths:
      - 'packages/@n8n/node-cli/src/template/templates/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh n8n-nodes-starter scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every write goes through the scoped app token below, so this job's own
    # GITHUB_TOKEN only needs to read for checkout.
    permissions:
      contents: read
    steps:
      - name: Checkout n8n
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and build @n8n/node-cli
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: pnpm turbo run build --filter=@n8n/node-cli

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}
          owner: n8n-io
          repositories: n8n-nodes-starter
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout n8n-nodes-starter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: n8n-io/n8n-nodes-starter
          token: ${{ steps.generate-token.outputs.token }}
          path: starter
          # create-pull-request unsets any persisted credential and configures
          # its own from `token`, so nothing here needs to survive checkout.
          persist-credentials: false

      - name: Install n8n-nodes-starter dependencies
        working-directory: starter
        run: npm ci

      - name: Refresh scaffold from n8n-node new
        run: node .github/scripts/node-cli/refresh-starter-scaffold.mjs --starter-root starter

      - name: Format synced files
        working-directory: starter
        run: npx prettier --write nodes credentials icons .github/workflows/ci.yml .github/workflows/publish.yml .agents AGENTS.md CLAUDE.md tsconfig.json eslint.config.mjs .prettierrc.js .vscode/launch.json package.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          path: starter
          add-paths: |
            nodes
            credentials
            icons
            .github/workflows/ci.yml
            .github/workflows/publish.yml
            .agents
            AGENTS.md
            CLAUDE.md
            .gitignore
            tsconfig.json
            eslint.config.mjs
            .prettierrc.js
            .vscode/launch.json
            package.json
          commit-message: 'Refresh scaffold from n8n-node new'
          title: 'Refresh scaffold from n8n-node new'
          body: |
            Regenerates `nodes/Example`, `nodes/GithubIssues`, `credentials/`,
            `icons/`, and everything else `n8n-node new` generates at the
            project root (`.github/workflows/ci.yml` and `publish.yml`,
            `.agents/`, `AGENTS.md`, `CLAUDE.md`, `.gitignore`, `tsconfig.json`,
            eslint/prettier config, `.vscode/launch.json`, `package.json`
            scripts) from the `@n8n/node-cli` templates, built from source at
            `${{ github.sha }}` in n8n-io/n8n. Review the diff before merging —
            files outside the template's output (README, LICENSE,
            `.github/dependabot.yml`, `.github/workflows/ci-cla-check.yml`,
            `.vscode/extensions.json`, package.json identity fields) are
            untouched.

            _Opened automatically by `util-refresh-starter-scaffold.yml` in
            n8n-io/n8n._
          branch: refresh-scaffold
          base: master
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
