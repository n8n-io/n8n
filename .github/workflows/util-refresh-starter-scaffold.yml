# n8n-nodes-starter is the committed output of `n8n-node new`. It has no scaffold
# logic of its own. This workflow runs after every n8n release, which is when
# `@n8n/node-cli` reaches npm, installs that CLI into a checkout of the starter,
# regenerates the scaffold with it, and opens a PR on the starter when anything
# changed. The starter's own CI is the check on that PR.

name: 'Util: Refresh starter scaffold'

on:
  # The release run moves the `latest` dist-tag of `@n8n/node-cli` before it
  # completes, so `npm view @n8n/node-cli@latest` is current here. A beta
  # release leaves `latest` alone and the version gate below skips the run.
  workflow_run: # zizmor: ignore[dangerous-triggers] nothing from the triggering run is checked out or reaches a shell
    workflows: ['Release: Publish']
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate even when @n8n/node-cli@latest already matches the starter lockfile'
        type: boolean
        default: false

permissions:
  contents: read

# Both triggers push the same fixed branch on n8n-nodes-starter. Queue runs
# instead of cancelling: a cancelled run can leave a half-pushed branch.
concurrency:
  group: refresh-starter-scaffold
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh n8n-nodes-starter scaffold
    if: |
      github.repository == 'n8n-io/n8n' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every write goes through the scoped app token below, so the job's own
    # GITHUB_TOKEN only needs to read for checkout.
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}
          owner: n8n-io
          repositories: n8n-nodes-starter
          # Scope the token to what create-pull-request does: push the branch,
          # open the PR, and push the regenerated `.github/workflows/*` files, which
          # GitHub rejects from an app token without the workflows permission.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout n8n
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the refresh script is needed from this repo.
          persist-credentials: false

      # No install and no build: the script uses Node built-ins only, and the
      # CLI comes from the starter's own node_modules. SafeChain wraps npm too.
      - name: Setup Node.js
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: ''
          install-command: ''

      - name: Checkout n8n-nodes-starter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: n8n-io/n8n-nodes-starter
          token: ${{ steps.generate-token.outputs.token }}
          path: starter
          # create-pull-request configures its own credential from `token`.
          persist-credentials: false

      - name: Compare the published CLI with the starter lockfile
        id: gate
        working-directory: starter
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          LATEST="$(npm view @n8n/node-cli@latest version)"
          LOCKED="$(node -p "require('./package-lock.json').packages['node_modules/@n8n/node-cli']?.version ?? ''")"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" = "$LOCKED" ] && [ "$FORCE" != "true" ]; then
            echo "::notice::@n8n/node-cli@$LATEST is already in the starter lockfile; nothing to refresh"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # `npm update` keeps the `"*"` ranges in package.json and only moves the
      # lockfile. `npm install @n8n/node-cli@latest` would rewrite the range.
      # `n8n-workflow` is the peer dependency every community node declares as
      # `*`; refreshing it keeps the starter on the current `latest` build.
      # The assertion guards against a pre-release tag winning the resolution.
      - name: Refresh the @n8n/node-cli and n8n-workflow pins in the starter lockfile
        if: steps.gate.outputs.skip != 'true'
        working-directory: starter
        env:
          LATEST: ${{ steps.gate.outputs.latest }}
        run: |
          npm update @n8n/node-cli n8n-workflow --package-lock-only --no-audit --no-fund
          LOCKED="$(node -p "require('./package-lock.json').packages['node_modules/@n8n/node-cli'].version")"
          if [ "$LOCKED" != "$LATEST" ]; then
            echo "::error::Lockfile resolved @n8n/node-cli@$LOCKED, expected $LATEST"
            exit 1
          fi

      # The job only generates files; it never runs a node. Skipping install
      # scripts avoids compiling native modules such as isolated-vm, which has
      # no prebuilt binary for every Node version the runner may pin.
      - name: Install n8n-nodes-starter dependencies
        if: steps.gate.outputs.skip != 'true'
        working-directory: starter
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The CLI detects the package manager from `npm_config_user_agent` and
      # writes it into the generated CI workflows, so pin it to npm. The git
      # identity fills author placeholders that the script never syncs; pin it
      # to empty so the runner image cannot leak into the output.
      - name: Refresh scaffold from n8n-node new
        if: steps.gate.outputs.skip != 'true'
        env:
          npm_config_user_agent: 'npm/0.0.0 (refresh-starter-scaffold)'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
        run: node .github/scripts/node-cli/refresh-starter-scaffold.mjs --starter-root starter

      - name: Format synced files
        if: steps.gate.outputs.skip != 'true'
        working-directory: starter
        run: |
          node -p "require('./.github/scaffold-manifest.json').files.join('\n')" \
            | xargs npx prettier --write --ignore-unknown package.json

      - name: Create Pull Request
        if: steps.gate.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          path: starter
          # No add-paths: deletions must be staged too, and only the steps
          # above touch tracked files in the starter checkout.
          commit-message: 'chore: Refresh scaffold from @n8n/node-cli@${{ steps.gate.outputs.latest }}'
          title: 'chore: Refresh scaffold from @n8n/node-cli@${{ steps.gate.outputs.latest }}'
          body: |
            Regenerates the scaffold from `@n8n/node-cli@${{ steps.gate.outputs.latest }}`
            and moves the lockfile to that version.

            Files the templates own are listed in `.github/scaffold-manifest.json`.
            Files the templates do not own are untouched: `README.md`,
            `README_TEMPLATE.md`, `CHANGELOG.md`, `CODE_OF_CONDUCT.md`,
            `LICENSE.md`, `.github/workflows/ci-cla-check.yml`, and the identity
            fields of `package.json`.

            Review the diff. The CI of this repository is the check.

            Triggered by: ${{ github.event.workflow_run.html_url || 'manual dispatch' }}

            _Opened automatically by `util-refresh-starter-scaffold.yml` in n8n-io/n8n._
          branch: refresh-scaffold
          base: master
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
