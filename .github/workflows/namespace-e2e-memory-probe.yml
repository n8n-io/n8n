name: 'Trial: paired E2E memory probe'

on:
  workflow_call:

permissions:
  contents: read

jobs:
  image:
    runs-on: namespace-profile-n8n-ci-tools
    timeout-minutes: 10
    steps:
      # Share one archive through artifacts to avoid provider-specific cache backends.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: n8n-docker-image-v2-standard-9223713c22e9ac73b139a8c74c766f3e60423ace
          path: /tmp/n8n-images
          fail-on-cache-miss: true
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: memory-probe-images
          path: /tmp/n8n-images/*.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  probe:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: blacksmith
            runner: blacksmith-2vcpu-ubuntu-2204
          - provider: namespace
            runner: namespace-profile-n8n-ci-e2e-memory-probe
    name: '8-GB probe: ${{ matrix.provider }}'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/packages/quality/testing/playwright/.playwright-browsers
      PLAYWRIGHT_WORKERS: '1'
      TEST_IMAGE_N8N: n8nio/n8n:local
      N8N_SKIP_LICENSES: 'true'
      CURRENTS_CI_BUILD_ID: memory-probe-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.provider }}
      CURRENTS_PROJECT_ID: nHHLA5
    steps:
      - uses: useblacksmith/checkout@bcec731f1eb1367240608d1c889a75b96db6ec53 # v1.5.0
      - uses: ./.github/actions/setup-nodejs
      - run: pnpm turbo run install-browsers --filter=n8n-playwright
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: memory-probe-images
          path: /tmp/n8n-images
      - name: Load shared images
        run: |
          sha256sum /tmp/n8n-images/*.tar
          for image in /tmp/n8n-images/*.tar; do docker load -i "$image"; done
          docker image inspect n8nio/n8n:local n8nio/runners:local --format '{{.Id}}'
      - name: Pre-pull test images
        run: pnpm --filter n8n-containers exec tsx pull-test-images.ts caddy mockserver n8n postgres redis taskRunner sandboxApi sandboxRunner sandboxSandbox victoriaLogs victoriaMetrics vector
      - name: Run matched shard with memory samples
        env:
          CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
          N8N_LICENSE_ACTIVATION_KEY: ${{ secrets.N8N_LICENSE_ACTIVATION_KEY }}
          N8N_LICENSE_CERT: ${{ secrets.N8N_LICENSE_CERT }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_SANDBOX_SERVICE_URL: ${{ secrets.N8N_SANDBOX_SERVICE_URL }}
          N8N_SANDBOX_SERVICE_API_KEY: ${{ secrets.N8N_SANDBOX_SERVICE_API_KEY }}
          PLAYWRIGHT_A11Y_REPORT: '1'
        run: |
          export MEMORY_PROBE_DIR="$RUNNER_TEMP/memory-probe"
          mkdir -p "$MEMORY_PROBE_DIR"
          {
            node --version
            pnpm --version
            uname -r
            free -b
            swapon --show --bytes
            ulimit -a
          } > "$MEMORY_PROBE_DIR/environment.txt"
          (
            while true; do
              date -u +%FT%TZ
              free -b
              ps -eo pid,ppid,uid,rss,comm --sort=-rss | head -n 20
              docker stats --no-stream --format '{{json .}}'
              sleep 5
            done
          ) > "$MEMORY_PROBE_DIR/host.log" 2>&1 &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          export NODE_OPTIONS="$NODE_OPTIONS --require=$GITHUB_WORKSPACE/.github/namespace/memory-probe.cjs"
          pnpm --filter=n8n-playwright test:container:multi-main:e2e --workers=1 \
            tests/e2e/workflows/editor/ndv/ndv-floating-nodes.spec.ts \
            tests/e2e/ai/assistant-credential-help.spec.ts \
            tests/e2e/ai/workflow-builder-smoke.spec.ts \
            tests/e2e/api/engine-v2-binary-data.spec.ts \
            tests/e2e/instance-ai/instance-ai-workflow-preview.spec.ts \
            tests/e2e/instance-ai/instance-ai-artifacts.spec.ts \
            tests/e2e/settings/log-streaming/log-streaming-observability.spec.ts \
            tests/e2e/settings/log-streaming/log-streaming-ui-e2e.spec.ts \
            tests/e2e/instance-ai/thread-launcher.spec.ts \
            tests/e2e/instance-ai/instance-ai-workflow-setup.spec.ts \
            tests/e2e/instance-ai/instance-ai-out-of-credits.spec.ts \
            tests/e2e/instance-ai/instance-ai-background-lifecycle.spec.ts \
            tests/e2e/ai/ai-2505-pdf-embed.spec.ts
      - name: Upload memory samples
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: memory-probe-${{ matrix.provider }}
          path: ${{ runner.temp }}/memory-probe
          retention-days: 3
          if-no-files-found: warn
