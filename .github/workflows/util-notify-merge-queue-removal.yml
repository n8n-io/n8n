name: 'Util: Notify Merge Queue Removal'

# GitHub rejects pull_request_target for the dequeued type at startup.
on:
  pull_request:
    types: [dequeued]

permissions: {}

# Serializes find-or-create of the comment; only the latest pending run matters.
concurrency:
  group: notify-merge-queue-removal-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # MERGE/ALREADY_MERGED are successful exits, MANUAL is the author's own doing
    if: ${{ !contains(fromJSON('["MERGE", "ALREADY_MERGED", "MANUAL"]'), github.event.reason) }}
    steps:
      # A failing PR can dequeue others behind it, so the reason may not be this PR's fault
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REASON: ${{ github.event.reason }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- merge-queue-removal -->';
            const body =
              `${marker}\n` +
              `This PR was removed from the merge queue (reason: \`${process.env.REASON}\`, last at ${new Date().toISOString()}). ` +
              `Check the merge-queue run's failing checks and re-queue when ready.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
