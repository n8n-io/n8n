name: 'CI: Credential Scopes'

# Narrowing an OAuth scope is a breaking change that cannot be undone: existing
# credentials keep the token they were issued, so the node starts failing for
# them and restoring the scope later does not repair them. This compares the
# credential metadata built from the PR against the released packages and fails
# on a removed scope. Only runs when a credential changes.
#
# It also runs on master, because the baseline is the released package rather
# than master: without that, a removal that merges is not reported until some
# later unrelated PR happens to touch a credential, which names the wrong
# author. On master it fails the merge that introduced it instead.
on:
  pull_request:
    paths:
      - 'packages/nodes-base/credentials/**'
      - 'packages/@n8n/nodes-langchain/credentials/**'
  push:
    branches:
      - master
    paths:
      - 'packages/nodes-base/credentials/**'
      - 'packages/@n8n/nodes-langchain/credentials/**'

permissions:
  contents: read

concurrency:
  group: credential-scopes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-scopes:
    name: Check for removed OAuth scopes
    runs-on: ${{ vars.RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js and build the node packages
        uses: ./.github/actions/setup-nodejs
        with:
          # Turbo pulls in each package's dependencies through `dependsOn: ^build`.
          # The action appends its own flags, so this has to stay a turbo command.
          build-command: pnpm build --filter=n8n-nodes-base --filter=@n8n/n8n-nodes-langchain

      - name: Compare scopes against the released packages
        run: node packages/nodes-base/scripts/check-released-scopes.mjs
