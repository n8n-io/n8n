name: 'Build: CI Toolchain Image'

on:
  push:
    branches: [master, ci/toolchain-image-pilot]
    paths:
      - .github/ci-toolchain/Dockerfile
      - .github/workflows/build-ci-toolchain-image.yml
  pull_request:
    paths:
      - .github/ci-toolchain/Dockerfile
      - .github/workflows/build-ci-toolchain-image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/n8n-io/ci-toolchain:node26.5.1-pnpm12.4.2-pw1.62.1-sc1.5.20-v1

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.repository == 'n8n-io/n8n'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: .github/ci-toolchain/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.repository == 'n8n-io/n8n' }}
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  seed-blacksmith:
    if: github.event_name == 'push' && github.repository == 'n8n-io/n8n'
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2204
    permissions:
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Seed shared Docker image cache
        run: docker pull "$IMAGE"

  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-2vcpu-ubuntu-2204
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/n8n-io/ci-toolchain:node26.5.1-pnpm12.4.2-pw1.62.1-sc1.5.20-v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Mark first step
        run: echo "CI_FIRST_STEP=$(date +%s)" >> "$GITHUB_ENV"
      - uses: useblacksmith/checkout@bcec731f1eb1367240608d1c889a75b96db6ec53 # v1.5.0
      - name: Install format tools
        uses: ./.github/actions/setup-nodejs
        with:
          preinstalled-toolchain: 'true'
          install-command: pnpm install --frozen-lockfile --filter n8n-monorepo --ignore-scripts
          build-command: ''
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      - name: Verify browser, Turbo cache and Docker
        run: |
          node -e 'const { chromium } = require("/opt/ci-playwright/node_modules/playwright"); chromium.launch().then(async browser => { console.log(await browser.version()); await browser.close(); }).catch(error => { console.error(error); process.exitCode = 1; });'
          test -n "$TURBO_API"
          docker info --format '{{.ServerVersion}}'
          docker buildx version
      - name: Run format check
        run: |
          echo "Time from first step to format check: $(($(date +%s) - CI_FIRST_STEP))s" >> "$GITHUB_STEP_SUMMARY"
          pnpm format:check
