name: 'Release: Setup Trusted Publishing for Package'
run-name: "Release: Setup Trusted Publishing (${{ inputs['package-path'] }})"

on:
  workflow_call:
    inputs:
      package-path:
        description: 'Path to the package to configure'
        required: true
        type: string
    secrets:
      NPM_DIST_TAG_AND_INITIAL_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      package-path:
        description: 'Path to the package to publish (e.g. packages/@n8n/my-new-package)'
        required: true
        type: string

concurrency:
  group: release-new-package-${{ inputs.package-path }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-to-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release

    steps:
      - name: Check branch
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/master' && "$GITHUB_REF" != refs/heads/release/* ]]; then
            echo "::error::This workflow can only run from master or a release branch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup and Build
        uses: ./.github/actions/setup-nodejs

      - name: Read package metadata
        id: package
        working-directory: ${{ inputs.package-path }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_PRIVATE=$(node -p "Boolean(require('./package.json').private)")
          if [ "$PACKAGE_NAME" = "n8n-monorepo" ] || [ "$PACKAGE_PRIVATE" = "true" ]; then
            echo "::error::Package '$PACKAGE_NAME' is private and cannot be published."
            exit 1
          fi
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Configure NPM token
        env:
          NPM_TOKEN: ${{ secrets.NPM_DIST_TAG_AND_INITIAL_PUBLISH_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc

      - name: Check package on NPM
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          ENCODED_NAME=$(node -p "encodeURIComponent(process.env.PACKAGE_NAME)")
          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/$ENCODED_NAME")
          case "$STATUS" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::The npm registry returned HTTP $STATUS for '$PACKAGE_NAME'."
              exit 1
              ;;
          esac

      - name: Publish throwaway package version
        if: steps.registry.outputs.exists == 'false'
        working-directory: ${{ inputs.package-path }}
        run: |
          npm pkg set version=0.0.0-tp
          pnpm publish --access public --tag rc --no-git-checks

      - name: Check existing trusted publishers
        id: trust
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          TRUST_CONFIGS=$(npm trust list "$PACKAGE_NAME" --json)
          echo "$TRUST_CONFIGS"
          if TRUST_CONFIGS="$TRUST_CONFIGS" node -e '
            if (!process.env.TRUST_CONFIGS.trim()) process.exit(1);
            const config = JSON.parse(process.env.TRUST_CONFIGS);
            const isConfigured = config.repository === "n8n-io/n8n" &&
              config.file === "release-publish.yml" &&
              config.environment === "npm" &&
              config.permissions?.includes("createPackage");
            process.exit(isConfigured ? 0 : 1);
          '; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure trusted publishing
        if: steps.trust.outputs.configured == 'false'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: npm trust github "$PACKAGE_NAME" --repo n8n-io/n8n --file release-publish.yml --env npm --allow-publish --yes

      - name: Summarize trusted publishing setup
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: echo "Trusted publishing for $PACKAGE_NAME must complete its first release-publish.yml publish within two days." >> "$GITHUB_STEP_SUMMARY"
