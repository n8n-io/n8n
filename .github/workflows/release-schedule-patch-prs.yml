name: 'Release: Schedule Patch Release PRs'

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 8 * * 3-5,1' # 9am CET (UTC+1), Wednesday - Friday and Monday. (Minor release on tuesday)

jobs:
  create-patch-prs:
    name: Create patch release PR (${{ matrix.track }})
    strategy:
      matrix:
        track: [stable, beta, v1]
    uses: ./.github/workflows/release-create-patch-pr.yml
    secrets: inherit
    with:
      track: ${{ matrix.track }}
      force: ${{ github.event_name == 'workflow_dispatch' }}

  notify-on-failure:
    name: Notify Slack on failure
    runs-on: ubuntu-latest
    needs: [create-patch-prs]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts/slack
          sparse-checkout-cone-mode: false
      - name: Notify Slack
        env:
          SLACK_TOKEN: ${{ secrets.QBOT_SLACK_TOKEN }}
        run: |
          node .github/scripts/slack/notify.mjs \
            --channel '#alerts-build' \
            --text "${GITHUB_WORKFLOW} failed - ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
