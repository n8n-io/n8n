name: 'Test: E2E community node compatibility'

# Runs the community node API compatibility specs against one branch per run,
# building the image from that branch (published images lack the e2e controller).
# The resolve job pins the branch head, because scheduled and dispatched runs
# execute on master and github.sha would key the image cache on the wrong commit.
# The build job repeats the steps of build-n8n-docker with that key, because the
# branch's own copy of the action keys on github.sha.

on:
  schedule:
    # One entry per branch; resolve maps the cron expression back to a ref.
    - cron: '0 3 * * 1' # master
    - cron: '20 3 * * 1' # 3.x
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build and test (master, 3.x, release-candidate/2.42.x, ...)'
        required: true
        default: 'master'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.event.schedule }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve branch
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      sha: ${{ steps.pick.outputs.sha }}
      label: ${{ steps.pick.outputs.label }}
    steps:
      - id: pick
        env:
          INPUT_REF: ${{ inputs.ref }}
          SCHEDULE: ${{ github.event.schedule }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          case "${INPUT_REF:-$SCHEDULE}" in
            '0 3 * * 1') REF=master ;;
            '20 3 * * 1') REF=3.x ;;
            *) REF="$INPUT_REF" ;;
          esac
          if ! SHA=$(git ls-remote --exit-code "$REPO_URL" "refs/heads/$REF" | cut -f1); then
            echo "::error::branch '$REF' does not exist in $REPO_URL"
            exit 1
          fi
          echo "Testing $REF at $SHA"
          {
            echo "ref=$REF"
            echo "sha=$SHA"
            echo "label=${REF//\//-}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build image from ${{ needs.resolve.outputs.ref }}
    needs: resolve
    runs-on: blacksmith-8vcpu-ubuntu-2204
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@bcec731f1eb1367240608d1c889a75b96db6ec53 # v1.5.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1

      - name: Build image
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: pnpm build:docker
          enable-docker-cache: true
          docker-cache-key: n8n-io/n8n
        env:
          INCLUDE_TEST_CONTROLLER: 'true'
          DOCKER_BUILD_TARBALL_DIR: /tmp/n8n-images
          QA_METRICS_WEBHOOK_URL: ${{ secrets.QA_METRICS_WEBHOOK_URL }}
          QA_METRICS_WEBHOOK_USER: ${{ secrets.QA_METRICS_WEBHOOK_USER }}
          QA_METRICS_WEBHOOK_PASSWORD: ${{ secrets.QA_METRICS_WEBHOOK_PASSWORD }}

      - name: Publish image tarball to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: n8n-docker-image-v2-standard-${{ needs.resolve.outputs.sha }}
          path: /tmp/n8n-images

  e2e:
    name: Compatibility specs on ${{ needs.resolve.outputs.ref }}
    needs: [resolve, build]
    uses: ./.github/workflows/test-e2e-reusable.yml
    with:
      branch: ${{ needs.resolve.outputs.sha }}
      cache-sha: ${{ needs.resolve.outputs.sha }}
      test-mode: docker-artifact
      test-command: pnpm --filter=n8n-playwright test:community-packages
      workers: '1'
      timeout-minutes: 40
      artifact-prefix: community-node-compat-${{ needs.resolve.outputs.label }}
    secrets:
      QA_METRICS_WEBHOOK_URL: ${{ secrets.QA_METRICS_WEBHOOK_URL }}
      QA_METRICS_WEBHOOK_USER: ${{ secrets.QA_METRICS_WEBHOOK_USER }}
      QA_METRICS_WEBHOOK_PASSWORD: ${{ secrets.QA_METRICS_WEBHOOK_PASSWORD }}
      CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
      CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
      N8N_LICENSE_ACTIVATION_KEY: ${{ secrets.N8N_LICENSE_ACTIVATION_KEY }}
      N8N_LICENSE_CERT: ${{ secrets.N8N_LICENSE_CERT }}
      N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
      N8N_SANDBOX_SERVICE_URL: ${{ secrets.N8N_SANDBOX_SERVICE_URL }}
      N8N_SANDBOX_SERVICE_API_KEY: ${{ secrets.N8N_SANDBOX_SERVICE_API_KEY }}
