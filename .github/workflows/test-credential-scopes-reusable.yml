name: 'Test: Credential scopes'

# Narrowing an OAuth scope is a breaking change that cannot be undone: existing
# credentials keep the token they were issued, so the node starts failing for
# them and restoring the scope later does not repair them. Rationale and the
# baseline choice are in packages/nodes-base/scripts/check-released-scopes.mjs.
on:
  workflow_call:
    inputs:
      ref:
        description: GitHub ref to check.
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=7168

jobs:
  check-scopes:
    name: Check for removed OAuth scopes
    runs-on: ${{ vars.RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js and build the node packages
        uses: ./.github/actions/setup-nodejs
        with:
          # Turbo pulls in each package's dependencies through `dependsOn: ^build`.
          # The action appends its own flags, so this has to stay a turbo command.
          build-command: pnpm turbo run build --filter=n8n-nodes-base --filter=@n8n/n8n-nodes-langchain

      - name: Compare scopes against the released packages
        run: pnpm --filter n8n-nodes-base check-released-scopes
