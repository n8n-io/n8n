<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title></title>
		<script type="module" nonce="{{CSP_NONCE}}" src="/workflow-portal/assets/app.js"></script>
	</head>
	<body>
		<main>
			<h1 data-i18n="title"></h1>
			<button id="refresh" type="button" data-i18n="refresh" disabled></button>
			<p id="status" role="status"></p>
			<table hidden>
				<thead>
					<tr>
						<th scope="col" data-i18n="id"></th>
						<th scope="col" data-i18n="workflowName"></th>
						<th scope="col" data-i18n="publication"></th>
						<th scope="col" data-i18n="updatedAt"></th>
					</tr>
				</thead>
				<tbody id="workflows"></tbody>
			</table>
			<nav>
				<button id="previous" type="button" data-i18n="previous" disabled></button>
				<span id="page"></span>
				<button id="next" type="button" data-i18n="next" disabled></button>
			</nav>
		</main>
	</body>
</html>
