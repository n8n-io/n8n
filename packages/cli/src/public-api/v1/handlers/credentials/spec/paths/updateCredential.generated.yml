operationId: updateCredential
tags:
  - Credential
summary: Update credential by ID
description: Updates an existing credential. You must be the owner of the credential.
x-required-scope: credential:update
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the credential.
    name: credentialId
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The name of the credential
            example: Updated Credential Name
          type:
            type: string
            description: The credential type. If changing type, data must also be provided.
            example: githubApi
          data:
            type: object
            additionalProperties:
              nullable: true
            description: The credential data. Required when changing credential type.
            writeOnly: true
            example:
              accessToken: new_token_value
          isGlobal:
            type: boolean
            description: Whether this credential is available globally
            example: false
          isResolvable:
            type: boolean
            description: Whether this credential has resolvable fields
            example: false
          isPartialData:
            type: boolean
            default: false
            description: If true, unredacts and merges existing credential data with the provided data. If false, replaces the entire data object.
            example: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/credentialPublicDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
