operationId: deleteCredential
tags:
  - Credential
summary: Delete credential by ID
description: Deletes a credential from your instance. You must be the owner of the credentials
x-required-scope: credential:delete
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the credential.
    name: credentialId
    in: path
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            type:
              type: string
            isManaged:
              type: boolean
            isGlobal:
              type: boolean
            isResolvable:
              type: boolean
            resolvableAllowFallback:
              type: boolean
            resolverId:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            usageScope:
              type: string
              enum:
                - project
                - instance
          required:
            - id
            - name
            - type
            - isManaged
            - isGlobal
            - isResolvable
            - resolvableAllowFallback
            - resolverId
            - createdAt
            - updatedAt
            - usageScope
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
