                properties:
                  id:
                    type: string
                  name:
                    type: string
                  type:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  shared:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        role:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - name
                        - role
                        - createdAt
                        - updatedAt
                required:
                  - id
                  - name
                  - type
                  - createdAt
                  - updatedAt
                  - shared
            nextCursor:
              type: string
              nullable: true
          required:
            - data
            - nextCursor
