operationId: getCredentialType
tags:
  - Credential
summary: Show credential data schema
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    description: The credential type name that you want to get the schema for
    name: credentialTypeName
    in: path
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            additionalProperties:
              type: boolean
              enum:
                - false
            type:
              type: string
              enum:
                - object
            properties:
              type: object
              additionalProperties:
                nullable: true
              description: JSON Schema fragment for each of the credential type's fields, keyed by field name.
              example:
                apiKey:
                  type: string
                domain:
                  type: string
            required:
              type: array
              items:
                type: string
              description: Names of the fields that are required for this credential type.
              example:
                - apiKey
                - domain
            allOf:
              type: array
              items:
                nullable: true
          required:
            - additionalProperties
            - type
            - properties
            - required
          additionalProperties: false
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
