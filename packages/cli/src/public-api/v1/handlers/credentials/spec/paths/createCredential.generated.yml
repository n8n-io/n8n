operationId: createCredential
tags:
  - Credential
summary: Create a credential
description: Creates a credential that can be used by nodes of the specified type.
x-required-scope: credential:create
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          id:
            type: string
            readOnly: true
            example: R2DjclaysHbqn778
          name:
            type: string
            example: Joe's Github Credentials
          type:
            type: string
            example: githubApi
          data:
            type: object
            additionalProperties:
              nullable: true
            writeOnly: true
            example:
              accessToken: ada612vad6fa5df4adf5a5dsf4389adsf76da7s
          isResolvable:
            type: boolean
            description: Whether this credential has resolvable fields
            example: false
          createdAt:
            type: string
            format: date-time
            readOnly: true
            example: 2022-04-29T11:02:29.842Z
          updatedAt:
            type: string
            format: date-time
            readOnly: true
            example: 2022-04-29T11:02:29.842Z
          projectId:
            type: string
            description: Project to create the credential in. Defaults to the user's personal project.
            example: VmwOO9HeTEj20kxM
        required:
          - name
          - type
          - data
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/credentialPublicDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
