operationId: shareCredential
tags:
  - Credential
summary: Share a credential with projects
description: Replaces the set of projects a credential is shared with. Projects in `shareWithIds` that the credential is not yet shared with are added, and projects it is currently shared with that are absent from `shareWithIds` are removed. The owning project is unaffected. Adding projects requires the `credential:share` scope, removing them requires `credential:unshare`.
x-required-scope: credential:share,credential:unshare
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    name: credentialId
    in: path
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          shareWithIds:
            type: array
            items:
              type: string
              minLength: 1
        required:
          - shareWithIds
responses:
  '204':
    description: Operation successful.
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
