operationId: replaceCredentialTypePolicyAttachments
tags:
  - CredentialTypePolicy
summary: "Preview: Replace a scope's attached policy documents"
description: |-
  **Preview** — breaking changes may still occur without major version bump.

  Replaces every attachment on a scope. `scopeId` comes from the scope's `GET` response once it has been written. Each `policyId` and each `(isFloor, priority)` pair must be unique within the list. `version` must match the current scope version. A stale version returns 409 without changes. A successful write bumps the scope's version.
x-required-scope: credentialTypePolicy:manage
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the credential type policy scope.
    name: scopeId
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          attachments:
            type: array
            items:
              type: object
              properties:
                policyId:
                  type: string
                  minLength: 1
                priority:
                  type: integer
                isFloor:
                  type: boolean
              required:
                - policyId
                - priority
                - isFloor
          version:
            type: integer
            minimum: 0
        required:
          - attachments
          - version
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/credentialTypePolicyAttachmentsPublicDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
