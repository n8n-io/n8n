operationId: getRequestFedCredentialTypeInstancePolicy
tags:
  - RuntimeCredentialRule
summary: 'Preview: Retrieve the instance request-fed credential type policy'
description: |-
  **Preview.** Breaking changes may still occur without a major version bump.

  Returns the composed instance policy for credential types that may receive a value from the incoming request. An instance that was never configured reports `scopeId: null`, no rules, `defaultAction: allow`, and `version: 0`.

  Requires the `credentialTypePolicy:manageRequestFed` API key scope.
x-required-scope: credentialTypePolicy:manageRequestFed
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/credentialTypePolicyEffectivePublicDto.generated.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
