operationId: getInstancePolicy
tags:
  - NodeTypePolicy
summary: Retrieve the instance node type policy
description: 'Returns the composed instance-scope policy: its default action and the rules of every attached policy document in evaluation order. An instance that was never configured reports `scopeId: null`, no rules, `defaultAction: allow`, and `version: 0`.'
x-required-scope: nodeTypePolicy:manage
