operationId: deleteRuntimeCredentialRule
tags:
  - RuntimeCredentialRule
summary: 'Preview: Delete a run-time input rule'
description: |-
  **Preview.** Breaking changes may still occur without a major version bump.

  Deletes a rule from the database. The stub credential stays, because workflows reference it. A rule from the environment is rejected with 403.

  Requires the `securitySettings:manage` API key scope.
x-required-scope: securitySettings:manage
parameters:
  - schema:
      type: string
    required: true
    description: The alias of the run-time input rule.
    name: ruleAlias
    in: path
responses:
  '204':
    description: Operation successful.
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
