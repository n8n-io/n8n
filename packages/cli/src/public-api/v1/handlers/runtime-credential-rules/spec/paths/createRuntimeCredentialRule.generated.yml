operationId: createRuntimeCredentialRule
tags:
  - RuntimeCredentialRule
summary: 'Preview: Create a run-time input rule'
description: |-
  **Preview.** Breaking changes may still occur without a major version bump.

  Creates a rule in the database and its stub credential. The alias is the identity of the rule. It cannot change later.

  Requires the `securitySettings:manage` API key scope.
x-required-scope: securitySettings:manage
parameters:
  - $ref: ../../../../shared/spec/parameters/idempotencyKey.yml
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          alias:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,128}$
          nodeType:
            type: string
            minLength: 1
            maxLength: 255
          path:
            type: string
            minLength: 1
            maxLength: 1000
          credentialType:
            type: string
            minLength: 1
            maxLength: 255
          transform:
            anyOf:
              - type: string
                enum:
                  - bearer
              - type: string
                pattern: ^field:[A-Za-z0-9_]+$
          allowedDomains:
            type: string
            maxLength: 2000
        required:
          - alias
          - nodeType
          - path
          - credentialType
responses:
  '201':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/runtimeCredentialRulePublicDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    $ref: ../../../../shared/spec/responses/unprocessableEntity.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
