operationId: checkRuntimeCredentialRuleImpact
tags:
  - RuntimeCredentialRule
summary: 'Preview: Check which workflows a run-time input rule affects'
description: |-
  **Preview.** Breaking changes may still occur without a major version bump.

  Finds the workflows that read the value which a rule with this `nodeType` and `path` removes from the trigger output. The result is a hint. It can show a workflow that does not break, and it can miss a read that an expression builds at run time.

  Requires the `securitySettings:manage` API key scope.
x-required-scope: securitySettings:manage
parameters:
  - $ref: ../../../../shared/spec/parameters/idempotencyKey.yml
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          nodeType:
            type: string
            minLength: 1
            maxLength: 255
          path:
            type: string
            minLength: 1
            maxLength: 1000
        required:
          - nodeType
          - path
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            workflows:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  projectId:
                    type: string
                  projectName:
                    type: string
                  nodeNames:
                    type: array
                    items:
                      type: string
                    description: At most 20 names.
                required:
                  - id
                  - name
                  - projectId
                  - projectName
                  - nodeNames
            truncated:
              type: boolean
              description: True when the list is not complete.
          required:
            - workflows
            - truncated
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    $ref: ../../../../shared/spec/responses/unprocessableEntity.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
