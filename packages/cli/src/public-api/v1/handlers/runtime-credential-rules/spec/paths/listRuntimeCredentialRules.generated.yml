operationId: listRuntimeCredentialRules
tags:
  - RuntimeCredentialRule
summary: 'Preview: List run-time input rules'
description: |-
  **Preview.** Breaking changes may still occur without a major version bump.

  Returns every rule, from the environment and from the database, in a cursor-paginated list. A rule moves the value at `path` out of the trigger output and into a stub credential of type `credentialType`.

  Requires the `securitySettings:manage` API key scope.
x-required-scope: securitySettings:manage
parameters:
  - $ref: ../../../../shared/spec/parameters/limit.yml
  - $ref: ../../../../shared/spec/parameters/cursor.yml
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  alias:
                    type: string
                    example: gmail_token
                  nodeType:
                    type: string
                    description: The trigger node type that the rule applies to. `*` means any trigger.
                    example: n8n-nodes-base.webhook
                  path:
                    type: string
                    description: Dot path to the value in the trigger item.
                    example: headers.authorization
                  credentialType:
                    type: string
                    example: gmailOAuth2
                  transform:
                    anyOf:
                      - type: string
                        enum:
                          - bearer
                      - type: string
                        pattern: ^field:[A-Za-z0-9_]+$
                    description: '`bearer` or `field:<name>`. Absent means `bearer`.'
                  allowedDomains:
                    type: string
                    description: Hosts that the secret can be sent to, comma separated. Absent means no limit.
                  source:
                    type: string
                    enum:
                      - environment
                      - database
                    description: Rules from the environment are read-only.
                  stubCredentialId:
                    type: string
                    description: The ID of the stub credential that workflows reference.
                required:
                  - alias
                  - nodeType
                  - path
                  - credentialType
                  - source
                  - stubCredentialId
            nextCursor:
              type: string
              nullable: true
          required:
            - data
            - nextCursor
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
