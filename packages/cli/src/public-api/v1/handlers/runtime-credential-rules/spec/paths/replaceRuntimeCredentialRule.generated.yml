operationId: replaceRuntimeCredentialRule
tags:
  - RuntimeCredentialRule
summary: 'Preview: Replace a run-time input rule'
description: |-
  **Preview.** Breaking changes may still occur without a major version bump.

  Replaces every editable value of a rule from the database. An absent `transform` or `allowedDomains` clears the value. The alias and the credential type cannot change. A rule from the environment is rejected with 403.

  Requires the `securitySettings:manage` API key scope.
x-required-scope: securitySettings:manage
parameters:
  - schema:
      type: string
    required: true
    description: The alias of the run-time input rule.
    name: ruleAlias
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          nodeType:
            type: string
            minLength: 1
            maxLength: 255
          path:
            type: string
            minLength: 1
            maxLength: 1000
          transform:
            anyOf:
              - type: string
                enum:
                  - bearer
              - type: string
                pattern: ^field:[A-Za-z0-9_]+$
              - {}
          allowedDomains:
            type: string
            nullable: true
            maxLength: 2000
          alias:
            type: string
            description: Must equal the alias in the path.
          credentialType:
            type: string
            description: Must equal the stored credential type. It cannot change.
          source:
            type: string
            description: Ignored.
            readOnly: true
          stubCredentialId:
            type: string
            description: Ignored.
            readOnly: true
        required:
          - nodeType
          - path
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/runtimeCredentialRulePublicDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
