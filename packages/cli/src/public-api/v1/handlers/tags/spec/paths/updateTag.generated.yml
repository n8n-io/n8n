operationId: updateTag
tags:
  - Tags
summary: Update a tag
description: Update a tag.
x-required-scope: tag:update
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the tag.
    name: id
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          id:
            type: string
            readOnly: true
            example: 2tUt1wbLX592XDdX
          name:
            type: string
            example: Production
          createdAt:
            type: string
            readOnly: true
            format: date-time
          updatedAt:
            type: string
            readOnly: true
            format: date-time
        required:
          - name
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              readOnly: true
              example: 2tUt1wbLX592XDdX
            name:
              type: string
              example: Production
            createdAt:
              type: string
              format: date-time
              description: Absent in the answer to an update, which does not read the tag back.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
          required:
            - id
            - name
            - updatedAt
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
