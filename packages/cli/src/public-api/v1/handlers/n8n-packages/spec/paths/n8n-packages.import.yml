post:
  x-eov-operation-id: importPackage
  x-required-scope: workflow:import
  x-eov-operation-handler: v1/handlers/n8n-packages/n8n-packages.handler
  tags:
    - N8nPackage
  summary: 'Beta: Import an n8n package into a project'
  description: |
    **Beta** — breaking changes may still occur without major version bump.

    Imports a gzip-compressed tar package (`.n8np`) into the target project. Send the
    archive as the multipart field `package`. Optional routing uses form fields
    `projectId` and `folderId` (omit or send empty for defaults). Every optional
    mode/policy field (credential, workflow, project, folder, data table, variable,
    and tag) takes its default when omitted; the one non-fixed default is
    `folderConflictPolicy`, which follows `projectConflictPolicy` on a project
    package (see its description). The required
    `workflowConflictPolicy` field controls what happens when a package workflow
    matches an existing workflow by source id in the target project. Maximum upload
    size is `N8N_ENDPOINTS_PAYLOAD_SIZE_MAX` MB (default 16).

    The package must declare its manifest at `manifest.json` and include every file
    referenced by the manifest. The caller is authorised through the `workflow:import`
    scope. With the default `workflowIdPolicy=new`, newly created workflows receive a
    fresh local id; imported workflows arrive inactive unless `workflowPublishingPolicy`
    publishes them after import.

    Credential references are resolved before any workflow is written. Credentials owned by,
    shared with, or global to the target project (with `credential:read`) match.
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - package
            - workflowConflictPolicy
          properties:
            package:
              type: string
              format: binary
              description: Gzip-compressed tar package (`.n8np`).
            projectId:
              type: string
              description: >
                Target project id. Omit or send empty to import into the caller's
                personal project.
            folderId:
              type: string
              description: >
                Optional folder within the target project. Omit or send empty for
                project root.
            credentialMatchingMode:
              type: string
              enum:
                - id-only
                - name-and-type
                - type-only
              default: id-only
              description: >
                How credential references in `requirements.credentials` are matched on
                the target instance. `id-only` (default) matches by id. `name-and-type`
                matches credentials with the exact same name and type. `type-only`
                matches any credential of the same type. For `name-and-type` and
                `type-only`, candidates are ranked by scope — a credential owned by
                the target project wins over one merely shared into it, which in
                turn wins over a global credential; if several candidates remain
                in the winning scope, the most recently updated one is chosen.
            credentialMissingMode:
              type: string
              enum:
                - must-preexist
                - create-stub
              default: create-stub
              description: >
                What to do when a credential reference cannot be resolved.
                `create-stub` (default) creates empty credential placeholders in
                the target project for missing references. `must-preexist`
                requires every referenced credential to already exist.
            bindings:
              type: string
              default: '{}'
              description: >
                Optional JSON object of explicit source→target id bindings, keyed
                by entity type. Only `credentials` is supported today: send
                `{"credentials":{"<packageCredentialId>":"<targetCredentialId>"}}`
                to map credential ids from the package to credential ids
                on the target instance. These explicit bindings are validated on type and
                applied before `credentialMatchingMode` resolution runs.
            workflowConflictPolicy:
              type: string
              enum:
                - new-version
                - fail
                - skip
              description: >
                `new-version` updates matching workflows and creates a new version,
                `fail` rejects the import when any matching workflow exists, and
                `skip` leaves matching workflows unchanged.
            workflowIdPolicy:
              type: string
              enum:
                - new
                - source
              default: source
              description: >
                Controls the id each newly created workflow receives. `source`
                (default) reuses the package's own workflow id on the target
                instance, which best fits promotion use cases where the same
                workflow moves between environments. `new` mints a fresh id and
                records the package id as `sourceWorkflowId`, so the same
                package can be imported repeatedly without id collisions — best
                suited to marketplace imports. Workflows matched to an existing
                workflow in the target project (status `updated` or `skipped`)
                always keep that workflow's current id, regardless of policy.
            missingNodeTypeMode:
              type: string
              enum:
                - fail
                - import-anyway
              default: fail
              description: >
                What to do when a workflow in the package uses a node type — or a
                version of a node type — this instance does not have. `fail`
                (default) rejects the import before anything is written, listing
                every missing `(nodeType, typeVersion)` pair and the workflows
                that use it. `import-anyway` imports the package; workflows
                containing missing node types are never published by this import,
                regardless of `workflowPublishingPolicy`.
            workflowPublishingPolicy:
              type: string
              enum:
                - preserve-published-state
                - match-source
                - publish-all
                - unpublish-all
              default: preserve-published-state
              description: >
                Controls whether imported workflows are published after content is
                written. `preserve-published-state` keeps new workflows inactive and
                republishes an updated workflow only when it was already published and
                the package workflow is published too, so drafts are never published.
                `match-source` follows the package workflow's published flag.
                `publish-all` publishes every imported workflow.
                `unpublish-all` leaves new workflows inactive and unpublishes
                updated workflows that were published.
            projectConflictPolicy:
              type: string
              enum:
                - merge
                - fail
                - overwrite
              default: merge
              description: >
                What to do when a project the package defines already exists here
                (matched by id), and — unless `folderConflictPolicy` overrides it — how
                its contents are treated. `merge` (default) leaves the existing
                project's name, description, icon and custom span attributes untouched
                and adds the package's contents alongside. `overwrite` replaces those
                details with the package's; a detail the package omits is left as it is,
                not cleared. `fail` rejects the import before anything is written, with
                one `project-conflict` issue per existing project. A package project id
                belonging to a personal project, or to a team project the caller cannot
                update, always rejects the import. Ignored for workflow packages.
            folderConflictPolicy:
              type: string
              enum:
                - merge
                - fail
                - overwrite
              description: >
                What to do when a package folder already exists at the same position in
                the target project. Defaults to whatever `projectConflictPolicy` is, so
                the intent is stated once; a workflow package defines no projects, so it
                defaults to `merge` there. `merge` reuses the existing folder and merges
                the package's children into it. `fail` rejects the import. `overwrite`
                reuses folders as `merge` does and additionally removes workflows the
                package does not contain — at a project's root and in folders the
                package defines, leaving target-only folders and their contents alone.
                Folders it does not define are then removed too, but only once nothing is
                left inside them. Removals are listed under `removedWorkflows` and
                `removedFolders`; see `overwriteDeletionPolicy`. A folder whose id sits under a different
                parent, or belongs to another project, always blocks the import.


                `overwrite` is project-packages-only, needs the `workflow:delete` and
                `folder:delete` scopes,
                is rejected against a `projectConflictPolicy` other than `overwrite`,
                and blocks up front if the caller cannot delete something it would
                remove. Folders need the `folder:create` scope and a folders-enabled
                licence.
            overwriteDeletionPolicy:
              type: string
              enum:
                - archive
                - hard-delete
              default: archive
              description: >
                How `folderConflictPolicy=overwrite` removes a workflow the package does
                not contain. `archive` (default) archives it, so it stays recoverable
                along with its execution history. `hard-delete` archives it — the step
                that unpublishes it, which a delete will not do on its own — and then
                deletes the workflow and its executions permanently. Each entry in
                `removedWorkflows` reports what actually happened in its `deletion`
                field: a `hard-delete` whose row cannot be dropped yet, because
                unpublishing defers trigger teardown, is left `archived` rather than
                failing an import whose content is already written. Ignored unless
                `folderConflictPolicy` is `overwrite`.
            dataTableMatchingMode:
              type: string
              enum:
                - by-id
              default: by-id
              description: >
                How data tables referenced by the package's workflows are matched
                against the target project. `by-id` matches the target-project table
                with the same id (imported tables keep their source id) and never
                falls back to name matching, so a match survives a rename on the
                target. Currently the only mode.
            dataTableMissingMode:
              type: string
              enum:
                - create
                - must-preexist
                - do-nothing
              default: create
              description: >
                Controls what happens when a referenced data table has no match in
                the target project. `create` (default) creates it from the package
                schema, keeping the source id, with no rows; requires the
                `dataTable:create` scope. `must-preexist` rejects the import.
                `do-nothing` skips creation of missing tables — matched tables are
                still validated for schema compatibility and can still block the
                import. Matched tables are always used as-is: never renamed,
                altered, or filled.
            dataTableSchemaConflictPolicy:
              type: string
              enum:
                - keep-existing
                - fail
              default: keep-existing
              description: >
                How strictly a matched data table's schema is compared.
                `keep-existing` (default) accepts a target table that has every
                package column with the same name and type, even when the target table
                also has additional columns of its own. `fail` is the strict
                drift-detection choice: any difference, including such
                target-only columns, rejects the import. A missing package
                column or a type mismatch always rejects. Both policies are
                non-destructive — the matched target table is never altered, and
                package columns are never added to it.
            variableMissingMode:
              type: string
              enum:
                - do-nothing
                - must-preexist
                - create-stub
                - create-with-value
              default: create-with-value
              description: >
                Controls what happens when a variable referenced by the package's
                workflows is absent from the target project and the global scope
                (lookup order: project, then global). `create-with-value` (default)
                creates the variable with its package value and lists its name under
                `variables.created`. When the package carries no value for it — values
                were excluded at export, or the exported value was itself empty — it
                creates an empty stub listed under `variables.stubbed`.
                `do-nothing` imports without creating the variable and
                lists its name under `variables.missing`. `must-preexist` rejects
                the import unless every referenced variable already resolves.
                `create-stub` creates each missing variable with an empty value at
                the placement scope (see `variableParentPolicy`) and lists the
                created names under `variables.stubbed`. An import that actually
                creates a variable requires a license that permits variables and, for
                API key callers, the `variable:create` scope; a package whose
                variables all already resolve creates nothing and needs neither.
            variableConflictPolicy:
              type: string
              enum:
                - keep-existing
                - overwrite
                - fail
              default: keep-existing
              description: >
                What to do when a referenced variable resolves in the target
                project or global scope but the package bundles a *different*
                value for it. `keep-existing` (default) leaves the target value
                untouched and reports the name under `variables.matched`.
                `overwrite` silently replaces the value of the existing variable
                at whichever scope it was found — the target project or the
                global scope, so a global variable other projects also read can
                be rewritten by this import — and reports the name under
                `variables.updated`; it needs a license that permits variables,
                the `variable:update` / `projectVariable:update` permission on
                that scope, and, for API key callers, the `variable:update`
                scope. `fail` rejects the import with a 409 instead. Every
                policy leaves a resolved variable alone when there is nothing
                to change — either the package bundles no value for it (values
                were excluded at export, or the exported value was itself
                empty), or the value it bundles already matches the target's.
                The reverse does not hold: a resolved variable holding an empty
                value — a stub an earlier import created, say — still counts as
                a value, so `overwrite` fills it and `fail` rejects it. Under
                `overwrite`, a project package whose projects hold *different*
                values for a name they all resolve to one row — a global none of
                them shadows, typically — is rejected with a 409: one row cannot
                carry both values, and the import will not pick for you. Give
                the projects their own variables in the target, or import them
                separately.
            variableParentPolicy:
              type: string
              enum:
                - project
                - global
              description: >
                Where `create-with-value` and `create-stub` create missing variables
                for workflow/folder packages. `project` — also the behaviour when the
                field is omitted — creates them in the import target project
                (`projectId`, else the caller's personal project). `global` creates
                them at the global scope. The license and `variable:create`
                requirements described under `variableMissingMode` apply to both
                placements. Must be omitted for project packages, which reject it
                with a 400: their placement follows the package layout, where a
                variable bundled under a project is created in that project and one
                bundled at the top level is created globally.
            tagMissingMode:
              type: string
              enum:
                - create
                - do-nothing
              default: create
              description: >
                What to do when a tag referenced by the package's workflows has no
                tag with the same id on the target instance (tags are matched by
                source id, never by name). `create` (default) creates the tag
                globally with its package (source) id and name; when the import
                would create a tag this needs an API key carrying the
                `tag:create` scope. `do-nothing` imports the workflows without the
                missing tags — nothing is created and the dropped names are listed
                under `tags.skipped`.
            tagConflictPolicy:
              type: string
              enum:
                - skip
                - fail
                - rename
              default: skip
              description: >
                What to do when a referenced tag conflicts on the target instance —
                either the same-id target tag carries a different name (rename
                drift), or the tag's name is already held by a different tag (name
                collision). `skip` (default) drops the conflicted tags from the
                import (not created, not renamed, not attached anywhere; the import
                proceeds and lists them under `tags.skipped`). `fail` rejects the
                import with a 409. `rename` renames a drifted target tag to the
                package name, and reconciles a name collision by re-keying the
                existing tag to the package (source) id — its name, workflow and
                folder taggings follow; both need an API key carrying the
                `tag:update` scope when the import would rename or reconcile a
                tag. A drifted tag whose package name is held by another tag
                still rejects the import (rename degrades to fail).
  responses:
    '200':
      description: Import succeeded; the listed workflows were written to the target project.
      content:
        application/json:
          schema:
            type: object
            required:
              - package
              - workflows
              - removedWorkflows
              - removedFolders
              - folders
              - projects
              - bindings
              - credentials
              - variables
              - tags
            properties:
              package:
                type: object
                required:
                  - sourceN8nVersion
                  - sourceId
                  - exportedAt
                properties:
                  sourceN8nVersion:
                    type: string
                  sourceId:
                    type: string
                  exportedAt:
                    type: string
                    format: date-time
              workflows:
                type: array
                items:
                  type: object
                  required:
                    - sourceWorkflowId
                    - localId
                    - name
                    - projectId
                    - parentFolderId
                    - activeVersionId
                    - publishing
                    - status
                  properties:
                    sourceWorkflowId:
                      type: string
                      description: Workflow id as it appeared in the package.
                    localId:
                      type: string
                      description: >
                        Workflow id on the target instance: newly assigned for
                        `created` (fresh under `workflowIdPolicy=new`, the
                        package id under `source`), the existing workflow's id
                        for `updated`/`skipped`.
                    name:
                      type: string
                    projectId:
                      type: string
                    parentFolderId:
                      type: string
                      nullable: true
                    activeVersionId:
                      type: string
                      nullable: true
                      description: >
                        Published version on the target instance, if any. `null` when the
                        workflow is not published after import.
                    publishing:
                      type: object
                      required:
                        - state
                      description: >
                        Outcome of applying the selected publishing policy to this workflow.
                      properties:
                        state:
                          type: string
                          enum:
                            - published
                            - unpublished
                            - unchanged
                            - blocked
                            - failed
                          description: >
                            `blocked` means the imported version could not be published
                            and no version is active (for example because the workflow
                            uses a stubbed credential, or uses a node type this instance
                            does not have). When a prior published version
                            remains active, `state` is `unchanged` with
                            `skippedPublishReason` instead. `failed` means publish or
                            unpublish was attempted but did not succeed.
                        error:
                          type: string
                          description: >
                            Present when `state` is `failed`. Explains why publish or unpublish
                            could not be applied.
                        blockedReason:
                          type: string
                          enum:
                            - stub-credential
                            - missing-node-type
                          description: >
                            Present when `state` is `blocked`: the imported version
                            could not be published and no version is active.
                        skippedPublishReason:
                          type: string
                          enum:
                            - stub-credential
                            - missing-node-type
                          description: >
                            Present when `state` is `unchanged` but the policy wanted
                            to publish the imported version: a prior published version
                            is still active (for example after an update with stubbed
                            credentials).
                    status:
                      type: string
                      enum:
                        - created
                        - updated
                        - skipped
                      description: Import outcome for this package workflow.
              removedWorkflows:
                type: array
                description: >
                  Workflows the target had that the package does not, removed by
                  `folderConflictPolicy=overwrite`. Empty under every other policy.
                items:
                  type: object
                  required:
                    - workflowId
                    - name
                    - projectId
                    - parentFolderId
                    - deletion
                  properties:
                    workflowId:
                      type: string
                      description: Id of the removed workflow on this instance.
                    name:
                      type: string
                    projectId:
                      type: string
                      description: Project the workflow was reconciled against.
                    parentFolderId:
                      type: string
                      nullable: true
                      description: Folder that held the workflow, or null at the project root.
                    deletion:
                      type: string
                      enum:
                        - archived
                        - deleted
                      description: >
                        What actually happened, not what `overwriteDeletionPolicy` asked
                        for: a `hard-delete` whose row could not be dropped yet is
                        reported as `archived`.
              removedFolders:
                type: array
                description: >
                  Folders the package does not define that reconciliation left empty, removed by
                  `folderConflictPolicy=overwrite`. A folder still holding anything survives, so
                  target-only content is never swept up. Empty under every other policy.
                items:
                  type: object
                  required:
                    - folderId
                    - name
                    - projectId
                    - parentFolderId
                  properties:
                    folderId:
                      type: string
                    name:
                      type: string
                    projectId:
                      type: string
                    parentFolderId:
                      type: string
                      nullable: true
                      description: Folder that held it, or null at the project root.
              folders:
                type: array
                description: Folder shells created or skipped in the target project.
                items:
                  type: object
                  required:
                    - sourceFolderId
                    - localId
                    - name
                    - parentFolderId
                    - status
                  properties:
                    sourceFolderId:
                      type: string
                      description: Folder id as it appeared in the package.
                    localId:
                      type: string
                      description: Folder id on the target instance (equal to `sourceFolderId`; folder ids are reused).
                    name:
                      type: string
                    parentFolderId:
                      type: string
                      nullable: true
                      description: Resolved parent folder on the target, or `null` at the project root.
                    status:
                      type: string
                      enum:
                        - created
                        - skipped
                      description: Import outcome for this package folder.
              projects:
                type: array
                description: >
                  Project shells created, or matched and then updated or left as-is
                  (see `projectConflictPolicy`). Present for project packages; empty
                  when importing loose workflows/folders.
                items:
                  type: object
                  required:
                    - sourceProjectId
                    - localId
                    - name
                    - status
                  properties:
                    sourceProjectId:
                      type: string
                      description: Project id as it appeared in the package.
                    localId:
                      type: string
                      description: Project id on the target instance (equal to `sourceProjectId`; project ids are reused).
                    name:
                      type: string
                      description: >
                        The project's name on the target: the package's under
                        `overwrite`, the pre-existing one under `merge`.
                    status:
                      type: string
                      enum:
                        - created
                        - updated
                        - skipped
                      description: >
                        Import outcome for this package project. `skipped` means the
                        project already existed and `projectConflictPolicy=merge` left
                        its details untouched — its contents were still imported.
              credentials:
                type: object
                description: >
                  Source credential ids grouped by whether they matched an
                  existing credential or were created as stubs. Full
                  source→target id mapping is in `bindings.credentials`.
                required:
                  - matched
                  - stubbed
                properties:
                  matched:
                    type: array
                    items:
                      type: string
                    description: >
                      Source credential ids from the package that matched
                      existing credentials on the target instance.
                  stubbed:
                    type: array
                    items:
                      type: string
                    description: >
                      Source credential ids for which empty placeholder
                      credentials were created in the target project.
              variables:
                type: object
                description: >
                  Resolution of the package's variable requirements. Names only —
                  values never travel in the response. For project packages these
                  arrays are package-level unions of per-destination outcomes and may
                  overlap (for example, a name may be created with a value in one project
                  and stubbed in another); classification under concurrent
                  external writes is best-effort.
                required:
                  - matched
                  - missing
                  - created
                  - stubbed
                  - updated
                properties:
                  matched:
                    type: array
                    items:
                      type: string
                    description: >
                      Variable names that resolved to an existing variable
                      (importing project's scope first, then global) and were
                      left untouched. A resolved variable this import rewrote is
                      listed under `updated` instead.
                  missing:
                    type: array
                    items:
                      type: string
                    description: >
                      Variable names still unresolved after import. Under
                      `variableMissingMode=do-nothing` these are warnings — the import
                      still succeeds and nothing is created. A successful `create-stub`
                      or `create-with-value` import normally leaves this empty.
                  created:
                    type: array
                    items:
                      type: string
                    description: >
                      Variable names created with a package value under
                      `variableMissingMode=create-with-value`. Empty stubs are listed
                      under `stubbed`.
                  stubbed:
                    type: array
                    items:
                      type: string
                    description: >
                      Variable names created with an empty value by this import under
                      `variableMissingMode=create-stub`, or because `create-with-value`
                      had no exported value. Empty for other outcomes.
                  updated:
                    type: array
                    items:
                      type: string
                    description: >
                      Variable names whose existing value this import replaced with
                      the package value under `variableConflictPolicy=overwrite`.
                      Empty for other policies.
              tags:
                type: object
                description: >
                  Resolution of the tags referenced by the imported workflows,
                  matched by source id. Tag names only.
                required:
                  - matched
                  - created
                  - renamed
                  - reconciled
                  - skipped
                properties:
                  matched:
                    type: array
                    items:
                      type: string
                    description: >
                      Tags that resolved to an existing tag with the same id and
                      name; attached as-is.
                  created:
                    type: array
                    items:
                      type: string
                    description: >
                      Tags created by this import with their package (source) id
                      and name, under `tagMissingMode=create`.
                  renamed:
                    type: array
                    items:
                      type: string
                    description: >
                      Target tags renamed to the package name under
                      `tagConflictPolicy=rename`; listed by their new name.
                  reconciled:
                    type: array
                    items:
                      type: string
                    description: >
                      Existing target tags re-keyed to the package (source) id on
                      a name collision under `tagConflictPolicy=rename`; their
                      name, workflow and folder taggings are kept.
                  skipped:
                    type: array
                    items:
                      type: string
                    description: >
                      Tags dropped from the import — not created, not renamed, and
                      not attached to any imported workflow — under
                      `tagMissingMode=do-nothing` or `tagConflictPolicy=skip`.
              bindings:
                type: object
                description: >
                  Source id → target id mappings produced during import, one map per
                  entity type. Each value maps an id as it appeared in the package to
                  the id on the target instance.
                required:
                  - workflows
                  - credentials
                properties:
                  workflows:
                    type: object
                    additionalProperties:
                      type: string
                  credentials:
                    type: object
                    description: >
                      Credential id from `requirements.credentials` in the package
                      manifest → matched credential id on the target instance.
                    additionalProperties:
                      type: string
    '409':
      description: >
        Import blocked by at least one conflict among the issues — a workflow
        source-id conflict, a folder conflict (id under a different parent, id
        owned by another project, or a `fail`-policy match), a tag conflict
        (rename drift or name collision), a variable whose bundled value
        differs from the resolved target's under
        `variableConflictPolicy=fail`, or one row two projects of a package
        would overwrite with different values.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
              - issues
            properties:
              message:
                type: string
              issues:
                type: array
                items:
                  $ref: '../schemas/importBlockingIssue.yml'
    '422':
      description: >
        Import blocked by non-conflict issues only (e.g. unresolved credentials or
        variables, node types this instance does not have under
        `missingNodeTypeMode=fail`, or variable stubs whose creation would exceed
        the instance variable quota).
      content:
        application/json:
          schema:
            type: object
            required:
              - message
              - issues
            properties:
              message:
                type: string
              issues:
                type: array
                items:
                  $ref: '../schemas/importBlockingIssue.yml'
    '400':
      $ref: '../../../../shared/spec/responses/badRequest.yml'
    '401':
      $ref: '../../../../shared/spec/responses/unauthorized.yml'
    '403':
      $ref: '../../../../shared/spec/responses/forbidden.yml'
    '404':
      $ref: '../../../../shared/spec/responses/notFound.yml'
