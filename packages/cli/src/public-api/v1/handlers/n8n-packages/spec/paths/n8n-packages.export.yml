post:
  x-eov-operation-id: exportPackage
  x-required-scope: project:export,workflow:export,agent:export
  x-eov-operation-handler: v1/handlers/n8n-packages/n8n-packages.handler
  tags:
    - N8nPackage
  summary: 'Beta: Export agents, workflows, folders, or projects as an n8n package'
  description: |
    **Beta** — breaking changes may still occur without major version bump.

    Export agents, workflows and/or folders, or projects, as a gzipped tar archive
    (.n8np). Provide `agentIds`/`workflowIds`/`folderIds`, or `projectIds`, but not both
    groups. Whole projects include their agents when the agents module is available.
    Each exported folder includes its nested folders. Empty projects export project
    metadata only. The dependency policies control which referenced agents and
    workflows must be included. Both policies default to `fail`. The
    response is streamed as `application/gzip` with a `Content-Disposition`
    attachment header. Requires the n8n Packages feature to be licensed.
    Packages containing agents cannot yet be imported.

    API keys need `agent:export` for selected agents, `workflow:export` for selected
    workflows or folders, and `project:export` for whole projects. Mixed selections
    need each applicable scope. When exported entities reference variables,
    `includeVariableValues: true` also requires `variable:list`.
  requestBody:
    description: Agents, workflows, folders, or projects to include in the exported package.
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/exportPackageRequest.yml'
  responses:
    '200':
      description: A gzipped tar archive containing the exported package contents.
      headers:
        X-N8n-Export-Counts:
          description: |
            JSON-serialized per-entity counts of what actually ended up in the
            package (after folder bundling and auto-inclusion), e.g.
            `{"agents":1,"workflows":2,"folders":1,"credentials":0,"dataTables":0,"variables":0}`.
          schema:
            type: string
      content:
        application/gzip:
          schema:
            type: string
            format: binary
    '400':
      $ref: '../../../../shared/spec/responses/badRequest.yml'
    '401':
      $ref: '../../../../shared/spec/responses/unauthorized.yml'
    '403':
      $ref: '../../../../shared/spec/responses/forbidden.yml'
    '404':
      $ref: '../../../../shared/spec/responses/notFound.yml'
