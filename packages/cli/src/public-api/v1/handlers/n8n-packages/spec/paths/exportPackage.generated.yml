operationId: exportPackage
tags:
  - N8nPackage
summary: 'Beta: Export agents, workflows, folders, or projects as an n8n package'
description: |
  **Beta** — breaking changes may still occur without major version bump.

  Export agents, workflows, and folders, or whole projects, as a gzipped tar
  archive (.n8np). Provide `agentIds`/`workflowIds`/`folderIds`, or `projectIds`.
  Do not combine these two groups. Each exported folder includes its nested
  folders. Whole projects include their agents when the agents module is enabled.
  Explicit agent selections require the agents module. Empty projects export
  project metadata only. `versionPolicy` selects the version for both agents and
  workflows and defaults to `latest`. `dependencyPolicy` applies to both entity
  types and defaults to `fail` when a required definition is absent from the
  package. The response is streamed as `application/gzip` with a `Content-Disposition`
  attachment header. Requires the n8n Packages feature to be licensed.

  API key scopes: `agent:export` is required for explicitly selected agents.
  `workflow:export` is required for explicitly selected workflows or folders.
  `project:export` is sufficient for whole-project exports, including their
  agents and workflows. Included dependencies need no additional API key scope.
  The caller's project permissions apply to all included entities. When
  `includeVariableValues` is true (the default) and exported entities reference
  variables, `variable:list` is also required. Exports that reference no variables
  do not need it.

  Agent definitions include referenced skills, custom tools, and schedules.
  Knowledge base files and runtime data are excluded. Agent package imports
  remain unavailable.
x-required-scope: project:export,workflow:export,agent:export
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          agentIds:
            type: array
            items:
              type: string
              minLength: 1
            minItems: 1
            maxItems: 300
            description: IDs of the agents to include. Requires the agents module.
            example:
              - uT9LdQx7rK2MvB4f
          workflowIds:
            type: array
            items:
              type: string
              minLength: 1
            minItems: 1
            maxItems: 300
            description: IDs of the workflows to include in the exported package.
            example:
              - 2tUt1wbLX592XDdX
          folderIds:
            type: array
            items:
              type: string
              minLength: 1
            minItems: 1
            maxItems: 300
            description: IDs of the folders to include in the exported package. Each folder is exported with its nested folders.
            example:
              - 9xKp2mNqRzAbCdEf
          projectIds:
            type: array
            items:
              type: string
              minLength: 1
            minItems: 1
            maxItems: 300
            description: IDs of the projects to include in the exported package. Includes their agents when the agents module is enabled.
            example:
              - Ox8O54VQrmBrb4qL
          includeVariableValues:
            type: boolean
            default: true
            description: Whether values of variables referenced by the exported entities are bundled into the package. When `false`, variables still travel as name/type files and are listed in the package requirements, but no values travel with the package.
          includeTags:
            type: boolean
            default: true
            description: Whether tags assigned to the exported workflows are bundled into the package. When `false`, no tag files, tag references, or tag requirements travel with the package.
          dependencyPolicy:
            type: string
            enum:
              - fail
              - reference-only
              - include-in-package
            default: fail
            description: Policy for workflow and agent dependencies outside the selected package contents. Includes static workflow references and disabled agent references. `fail` aborts when a required workflow or agent is absent from the package. `include-in-package` adds accessible dependencies recursively. `reference-only` records external requirements without including those definitions. The same policy applies to workflows and agents.
            example: fail
          versionPolicy:
            type: string
            enum:
              - published-strict
              - prefer-published
              - ignore-unpublished
              - latest
            default: latest
            description: Which version of each workflow and agent travels in the package. `latest` exports the current draft. `published-strict` requires a published version. `prefer-published` uses the published version when available and the draft otherwise. `ignore-unpublished` skips unpublished selections. Dependencies that cannot be included cause the export to fail only when `dependencyPolicy` is `fail` or `include-in-package`. With `reference-only`, the export records them as external requirements. The selected version supplies the definition and its references. Workflow names, settings, and tags always use their current values. Agent IDs, names, and MCP availability always use their current values.
            example: latest
          credentialExportPolicy:
            type: string
            enum:
              - expression-values-only
              - no-values
            default: expression-values-only
            description: Whether expression values from credential data are bundled into the package. `expression-values-only` includes credential fields whose value is an n8n expression (for example `={{ $secrets.apiKey }}`); literal values never travel either way. `no-values` keeps credential data out of the package entirely, so each credential file carries only its id, name and type.
            example: expression-values-only
          includeArchivedWorkflows:
            type: boolean
            default: false
            description: 'Whether folder and project exports include their archived workflows. When `false` (default) they are left out. When `true` they travel with `isArchived: true` and are archived on import. Workflows listed in `workflowIds` always export, also when archived.'
            example: false
        additionalProperties: false
responses:
  '200':
    description: A gzipped tar archive containing the exported package contents.
    headers:
      X-N8n-Export-Counts:
        description: |
          JSON-serialized per-entity counts of what actually ended up in the
          package (after folder bundling and auto-inclusion), e.g.
          `{"agents":1,"workflows":2,"folders":1,"credentials":0,"dataTables":0,"variables":0,"tags":0}`.
        required: true
        schema:
          type: string
    content:
      application/gzip:
        schema:
          type: string
          format: binary
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
