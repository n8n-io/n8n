operationId: importPackage
tags:
  - N8nPackage
summary: 'Beta: Import an n8n package into a project'
description: '**Beta** — breaking changes may still occur without major version bump. Imports a gzip-compressed tar package (`.n8np`) into the target project. Send the archive as the multipart field `package`. Optional routing uses form fields `projectId` and `folderId` (omit or send empty for defaults). Every optional mode/policy field (credential, workflow, project, folder, data table, variable, and tag) takes its default when omitted; the one non-fixed default is `folderConflictPolicy`, which follows `projectConflictPolicy` on a project package. The required `workflowConflictPolicy` field controls what happens when a package workflow matches an existing workflow by source id in the target project. Maximum upload size is `N8N_ENDPOINTS_PAYLOAD_SIZE_MAX` MB (default 16). The package must declare its manifest at `manifest.json` and include every file the manifest references. Credential references are resolved before any workflow is written.'
x-required-scope: workflow:import
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          package:
            type: string
            description: Gzip-compressed tar package (`.n8np`).
            format: binary
          projectId:
            type: string
            description: Target project id. Omit or send empty to import into the caller's personal project.
          folderId:
            type: string
            description: Optional folder within the target project. Omit or send empty for project root.
          credentialMatchingMode:
            type: string
            enum:
              - id-only
              - name-and-type
              - type-only
            default: id-only
            description: How credential references in `requirements.credentials` are matched on the target instance. `id-only` (default) matches by id. `name-and-type` matches credentials with the exact same name and type. `type-only` matches any credential of the same type.
          credentialMissingMode:
            type: string
            enum:
              - must-preexist
              - create-stub
            default: create-stub
            description: What to do when a credential reference cannot be resolved. `create-stub` (default) creates empty credential placeholders in the target project for missing references. `must-preexist` requires every referenced credential to already exist.
          bindings:
            type: string
            description: 'Optional JSON object of explicit source→target id bindings, keyed by entity type. Only `credentials` is supported today: send `{"credentials":{"<packageCredentialId>":"<targetCredentialId>"}}` to map credential ids from the package to credential ids on the target instance.'
            default: '{}'
          workflowConflictPolicy:
            type: string
            enum:
              - new-version
              - fail
              - skip
            description: '`new-version` updates matching workflows and creates a new version; the archived state follows the package, so a matching workflow is archived or unarchived to match it. `fail` rejects the import when any matching workflow exists, and `skip` leaves matching workflows unchanged. An archive state change also needs the `workflow:delete` scope.'
          workflowPublishingPolicy:
            type: string
            enum:
              - preserve-published-state
              - match-source
              - publish-all
              - unpublish-all
            default: preserve-published-state
            description: Controls whether imported workflows are published after content is written. `preserve-published-state` (default) keeps new workflows inactive, and republishes an updated workflow only when it was already published and the package carries the version the source publishes.
          workflowIdPolicy:
            type: string
            enum:
              - new
              - source
            default: source
            description: Controls the id each newly created workflow receives. `source` (default) reuses the package's own workflow id on the target instance; `new` mints a fresh id and records the package id as `sourceWorkflowId`. A workflow matched to an existing one always keeps that workflow's current id, regardless of policy.
          missingNodeTypeMode:
            type: string
            enum:
              - fail
              - import-anyway
            default: fail
            description: What to do when a workflow in the package uses a node type (or version) this instance does not have. `fail` (default) rejects the import before anything is written. `import-anyway` imports the package; affected workflows are never published, regardless of `workflowPublishingPolicy`.
          projectConflictPolicy:
            type: string
            enum:
              - merge
              - fail
              - overwrite
            default: merge
            description: What to do when a project the package defines already exists here (matched by id). `merge` (default) imports into the existing project. `fail` rejects the import before anything is written. Ignored for workflow packages.
          folderConflictPolicy:
            type: string
            enum:
              - merge
              - fail
              - overwrite
            description: What to do when a package folder already exists at the same position in the target project. Defaults to whatever `projectConflictPolicy` is. `overwrite` is project-packages-only and needs the `workflow:delete` and `folder:delete` scopes.
          overwriteDeletionPolicy:
            type: string
            enum:
              - archive
              - hard-delete
            default: archive
            description: How `folderConflictPolicy=overwrite` removes a workflow the package does not contain. `archive` (default) archives it. `hard-delete` archives it and then permanently deletes the workflow and its executions. Ignored unless `folderConflictPolicy` is `overwrite`.
          dataTableMatchingMode:
            type: string
            enum:
              - by-id
            default: by-id
            description: Matches on id (imported tables keep their source id); currently the only mode.
          dataTableMissingMode:
            type: string
            enum:
              - create
              - must-preexist
              - do-nothing
            default: create
            description: '`create` (default) creates it from the package schema, keeping the source id, with no rows. `must-preexist` rejects the import. `do-nothing` skips creation of missing tables.'
          dataTableSchemaConflictPolicy:
            type: string
            enum:
              - keep-existing
              - fail
              - overwrite
              - overwrite-non-destructive
            default: keep-existing
            description: '`keep-existing` (default) accepts a target table that has every package column with the same name and type. `fail` is the strict drift-detection choice. `overwrite` changes the matched target table to match the package schema. `overwrite-non-destructive` does the same but only when no change deletes data.'
          variableMissingMode:
            type: string
            enum:
              - do-nothing
              - must-preexist
              - create-stub
              - create-with-value
            default: create-with-value
            description: 'Controls what happens when a variable referenced by the package is absent from the target project and the global scope (lookup order: project, then global).'
          variableConflictPolicy:
            type: string
            enum:
              - keep-existing
              - overwrite
              - fail
            default: keep-existing
            description: What to do when a referenced variable resolves, but the package bundles a different value for it.
          variableParentPolicy:
            type: string
            enum:
              - project
              - global
            description: Where `create-with-value` and `create-stub` create missing variables for workflow/folder packages. Must be omitted for project packages, which reject it with a 400.
          tagMissingMode:
            type: string
            enum:
              - create
              - do-nothing
            default: create
            description: What to do when a tag referenced by the package has no tag with the same source id on the target instance.
          tagConflictPolicy:
            type: string
            enum:
              - skip
              - fail
              - rename
            default: skip
            description: What to do when a referenced tag conflicts on the target instance — either rename drift or a name collision.
        required:
          - package
          - workflowConflictPolicy
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            package:
              type: object
              properties:
                sourceN8nVersion:
                  type: string
                sourceId:
                  type: string
                exportedAt:
                  type: string
                  format: date-time
              required:
                - sourceN8nVersion
                - sourceId
                - exportedAt
            workflows:
              type: array
              items:
                type: object
                properties:
                  sourceWorkflowId:
                    type: string
                  localId:
                    type: string
                  name:
                    type: string
                  projectId:
                    type: string
                  parentFolderId:
                    type: string
                    nullable: true
                  activeVersionId:
                    type: string
                    nullable: true
                  isArchived:
                    type: boolean
                  publishing:
                    type: object
                    properties:
                      state:
                        type: string
                        enum:
                          - published
                          - unpublished
                          - unchanged
                          - blocked
                          - failed
                      error:
                        type: string
                      blockedReason:
                        type: string
                        enum:
                          - stub-credential
                          - missing-node-type
                      skippedPublishReason:
                        type: string
                        enum:
                          - stub-credential
                          - missing-node-type
                    required:
                      - state
                  status:
                    type: string
                    enum:
                      - created
                      - updated
                      - skipped
                required:
                  - sourceWorkflowId
                  - localId
                  - name
                  - projectId
                  - parentFolderId
                  - activeVersionId
                  - isArchived
                  - publishing
                  - status
            removedWorkflows:
              type: array
              items:
                type: object
                properties:
                  workflowId:
                    type: string
                  name:
                    type: string
                  projectId:
                    type: string
                  parentFolderId:
                    type: string
                    nullable: true
                  deletion:
                    type: string
                    enum:
                      - archived
                      - deleted
                required:
                  - workflowId
                  - name
                  - projectId
                  - parentFolderId
                  - deletion
            removedFolders:
              type: array
              items:
                type: object
                properties:
                  folderId:
                    type: string
                  name:
                    type: string
                  projectId:
                    type: string
                  parentFolderId:
                    type: string
                    nullable: true
                required:
                  - folderId
                  - name
                  - projectId
                  - parentFolderId
            folders:
              type: array
              items:
                type: object
                properties:
                  sourceFolderId:
                    type: string
                  localId:
                    type: string
                  name:
                    type: string
                  parentFolderId:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                      - created
                      - skipped
                required:
                  - sourceFolderId
                  - localId
                  - name
                  - parentFolderId
                  - status
            projects:
              type: array
              items:
                type: object
                properties:
                  sourceProjectId:
                    type: string
                  localId:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                      - created
                      - updated
                      - skipped
                required:
                  - sourceProjectId
                  - localId
                  - name
                  - status
            bindings:
              type: object
              properties:
                workflows:
                  type: object
                  additionalProperties:
                    type: string
                credentials:
                  type: object
                  additionalProperties:
                    type: string
              required:
                - workflows
                - credentials
            credentials:
              type: object
              properties:
                matched:
                  type: array
                  items:
                    type: string
                stubbed:
                  type: array
                  items:
                    type: string
              required:
                - matched
                - stubbed
            dataTables:
              type: object
              properties:
                matched:
                  type: integer
                  minimum: 0
                created:
                  type: integer
                  minimum: 0
              required:
                - matched
                - created
            variables:
              type: object
              properties:
                matched:
                  type: array
                  items:
                    type: string
                missing:
                  type: array
                  items:
                    type: string
                created:
                  type: array
                  items:
                    type: string
                stubbed:
                  type: array
                  items:
                    type: string
                updated:
                  type: array
                  items:
                    type: string
              required:
                - matched
                - missing
                - created
                - stubbed
                - updated
            tags:
              type: object
              properties:
                matched:
                  type: array
                  items:
                    type: string
                created:
                  type: array
                  items:
                    type: string
                renamed:
                  type: array
                  items:
                    type: string
                reconciled:
                  type: array
                  items:
                    type: string
                skipped:
                  type: array
                  items:
                    type: string
              required:
                - matched
                - created
                - renamed
                - reconciled
                - skipped
          required:
            - package
            - workflows
            - removedWorkflows
            - removedFolders
            - folders
            - projects
            - bindings
            - credentials
            - dataTables
            - variables
            - tags
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '409':
    description: Import blocked by at least one conflict among the issues — a workflow source-id conflict, a folder conflict, a tag conflict (rename drift or name collision), a variable whose bundled value differs from the resolved target, or a selected destination also named for deletion.
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
            issues:
              type: array
              items:
                $ref: ../../../../shared/spec/schemas/importBlockingIssue.generated.yml
          required:
            - message
            - issues
  '413':
    $ref: ../../../../shared/spec/responses/contentTooLarge.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    description: Import blocked by non-conflict issues only — for example unresolved credentials or variables, node types this instance does not have, a delete the caller may not perform, or variable stubs whose creation would exceed the instance variable quota.
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
            issues:
              type: array
              items:
                $ref: ../../../../shared/spec/schemas/importBlockingIssue.generated.yml
          required:
            - message
            - issues
  '500':
    $ref: ../../../../shared/spec/responses/internalServerError.yml
