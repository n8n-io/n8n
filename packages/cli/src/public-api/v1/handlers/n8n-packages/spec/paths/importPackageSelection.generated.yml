operationId: importPackageSelection
tags:
  - N8nPackage
summary: 'Beta: Import selected workflows and Skills from an n8n package'
description: |-
  **Beta** — breaking changes may still occur without major version bump.

  Imports chosen workflows and Skills from one source project of a gzip-compressed tar package (`.n8np`), instead of the whole package. Send the archive as the multipart field `package`. The import is **additive** (cherry-pick): it never removes a workflow the selection omits. It creates or updates only the workflows named in `selectedWorkflowIds`, and deletes only the destination workflows named in `deletedWorkflowIds`. Use `selectedSkillIds` to import standalone Skills and `deletedSkillIds` for explicit removals. These fields are JSON arrays. Omitted Skill lists leave Skills unchanged. Skill actions require `skill:create`, `skill:update`, or `skill:delete`. Unchanged Skills need no write scope. No workflow grant is needed for a Skill-only selection. Instance Skills keep instance scope. Project Skills must belong to the selected project.

  `selectedProjectId` names the single source project the selection is scoped to (its id as it appears in the package). The selected workflows are written into the instance project whose id matches that source project, which is created if it does not yet exist; there is no separate target-project field. `selectedWorkflowIds` are source ids within that project; ids that belong to another project are dropped. `deletedWorkflowIds` are destination ids in the same project; an absent id is a tolerated no-op, and a delete needs the `workflow:delete` scope. A delete id must not match the destination id of a selected workflow, including when `conflictPolicy=skip`. This overlap returns a 409 before any writes.

  The package must be a project package (a workflow package is rejected with a 400). The cherry-pick conflict policies (folder, tag, and project) are fixed and are not accepted here; only `conflictPolicy`, `idPolicy`, and `overwriteDeletionPolicy` are configurable. Maximum upload size is `N8N_ENDPOINTS_PAYLOAD_SIZE_MAX` MB (default 16). The API key also needs `project:create` when the selected project does not exist. The import never changes an existing project, so it never needs `project:update`. It needs `folder:create` and a license that supports folders only when it creates a folder for a selected workflow, or a folder above it. Packages that contain Agents are rejected before writes. Use the ordinary import endpoint for selected-Agent exports. `conflictPolicy` replaces `workflowConflictPolicy`, and `idPolicy` replaces `workflowIdPolicy`. The old fields are rejected. Publication remains fixed to `match-source`. When `match-source` publishes a selected workflow, the API key also needs `workflow:activate`. When it unpublishes one, the key needs `workflow:deactivate`. Archiving or restoring a matched workflow also needs `workflow:delete`. Restoring and publishing a workflow requires both `workflow:delete` and `workflow:activate`.

  Requires one of these API key scopes: `workflow:import`, `skill:create`, `skill:update`, `skill:delete`, `skill:read`.
x-required-scope: workflow:import,skill:create,skill:update,skill:delete,skill:read
parameters:
  - $ref: ../../../../shared/spec/parameters/idempotencyKey.yml
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          package:
            type: string
            description: Gzip-compressed tar package (`.n8np`).
            format: binary
          selectedSkillIds:
            type: string
            description: Source Skill IDs to import as a JSON array. Omit or send an empty array to leave Skills unselected.
          deletedSkillIds:
            type: string
            description: Destination Skill IDs to remove as a JSON array. Consumer references and source-managed destinations block removal.
          selectedProjectId:
            type: string
            minLength: 1
            description: Id of the single source project the selection is scoped to, as it appears in the package.
          selectedWorkflowIds:
            type: string
            description: JSON-encoded array of source workflow ids to import from `selectedProjectId`, e.g. `["wf-1","wf-2"]`. An empty array (`[]`) is allowed — useful for a delete-only request. Ids outside the scoped project are dropped.
          deletedWorkflowIds:
            type: string
            description: Optional JSON-encoded array of destination workflow ids to remove from the scoped project, e.g. `["wf-3"]`. Removal happens even under the additive profile, and the manner of removal follows `overwriteDeletionPolicy` (archive by default). An absent id is a no-op unless it is also a selected destination. Must not contain a selected workflow's destination id. Needs the `workflow:delete` scope.
          conflictPolicy:
            type: string
            enum:
              - new-version
              - fail
              - skip
            default: new-version
            description: What happens when a selected workflow matches an existing workflow by source id in the target project. `new-version` (default) updates it and creates a new version; `fail` rejects the import when any matching workflow exists; `skip` leaves matching workflows unchanged. An archive state change also needs the `workflow:delete` scope.
          idPolicy:
            type: string
            enum:
              - source
            default: source
            description: Controls IDs for newly created workflows. Only `source` is supported. It uses the package ID. An ID already used by an unmatched workflow, in any project, blocks the import. Matched workflows keep their destination ID.
          overwriteDeletionPolicy:
            type: string
            enum:
              - archive
              - hard-delete
            default: archive
            description: 'How the ids in `deletedWorkflowIds` are removed. `archive` (default) archives each one, so it stays recoverable along with its execution history. `hard-delete` archives it — the step that unpublishes it, which a delete will not do on its own — and then deletes the workflow and its executions permanently. Each entry in `removedWorkflows` reports what actually happened in its `deletion` field: a `hard-delete` whose row cannot be dropped yet, because unpublishing defers trigger teardown, is left `archived` rather than failing an import whose content is already written.'
        required:
          - package
          - selectedProjectId
          - selectedWorkflowIds
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/importResultDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    description: Import blocked by at least one conflict among the issues — for example a workflow source-id conflict under `conflictPolicy=fail`, or a selected destination also named for deletion (`workflow-removal-conflict`).
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
            issues:
              type: array
              items:
                $ref: ../../../../shared/spec/schemas/importBlockingIssue.generated.yml
            skills:
              type: array
              items:
                type: object
                properties:
                  sourceSkillId:
                    type: string
                  localId:
                    type: string
                  name:
                    type: string
                  projectId:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                      - created
                      - updated
                      - unchanged
                      - skipped
                      - deleted
                  followingAgentCount:
                    type: integer
                    minimum: 0
                required:
                  - sourceSkillId
                  - localId
                  - name
                  - projectId
                  - status
                  - followingAgentCount
            counts:
              type: object
              properties:
                skills:
                  type: object
                  properties:
                    created:
                      type: integer
                      minimum: 0
                    updated:
                      type: integer
                      minimum: 0
                    unchanged:
                      type: integer
                      minimum: 0
                    skipped:
                      type: integer
                      minimum: 0
                    deleted:
                      type: integer
                      minimum: 0
                  required:
                    - created
                    - updated
                    - unchanged
                    - skipped
                    - deleted
              required:
                - skills
          required:
            - message
            - issues
  '413':
    $ref: ../../../../shared/spec/responses/contentTooLarge.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    description: Import blocked by non-conflict issues only — for example a delete the caller may not perform (`workflow-removal-forbidden`), unresolved credentials, or node types this instance does not have.
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
            issues:
              type: array
              items:
                $ref: ../../../../shared/spec/schemas/importBlockingIssue.generated.yml
            skills:
              type: array
              items:
                type: object
                properties:
                  sourceSkillId:
                    type: string
                  localId:
                    type: string
                  name:
                    type: string
                  projectId:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                      - created
                      - updated
                      - unchanged
                      - skipped
                      - deleted
                  followingAgentCount:
                    type: integer
                    minimum: 0
                required:
                  - sourceSkillId
                  - localId
                  - name
                  - projectId
                  - status
                  - followingAgentCount
            counts:
              type: object
              properties:
                skills:
                  type: object
                  properties:
                    created:
                      type: integer
                      minimum: 0
                    updated:
                      type: integer
                      minimum: 0
                    unchanged:
                      type: integer
                      minimum: 0
                    skipped:
                      type: integer
                      minimum: 0
                    deleted:
                      type: integer
                      minimum: 0
                  required:
                    - created
                    - updated
                    - unchanged
                    - skipped
                    - deleted
              required:
                - skills
          required:
            - message
            - issues
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '500':
    $ref: ../../../../shared/spec/responses/internalServerError.yml
