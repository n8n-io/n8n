operationId: updateVariable
tags:
  - Variables
summary: Update a variable
description: Update a variable from your instance.
x-required-scope: variable:update
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the variable.
    name: id
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          id:
            type: string
            readOnly: true
          key:
            type: string
            minLength: 1
            maxLength: 50
            pattern: ^[A-Za-z0-9_]+$
          value:
            type: string
            maxLength: 1000
            example: test
          type:
            type: string
            readOnly: true
          projectId:
            type: string
            nullable: true
            maxLength: 36
            example: VmwOO9HeTEj20kxM
        required:
          - key
          - value
        additionalProperties: false
responses:
  '204':
    description: Operation successful.
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
