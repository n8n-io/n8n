operationId: deleteSkill
tags:
  - Skill
summary: Delete a skill
description: |-
  Delete a skill with all its versions. A skill that an agent uses cannot be deleted.

  Requires the `skill:delete` API key scope.
x-required-scope: skill:delete
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the skill.
    name: skillId
    in: path
responses:
  '204':
    description: Operation successful.
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
