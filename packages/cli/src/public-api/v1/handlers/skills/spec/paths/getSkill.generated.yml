operationId: getSkill
tags:
  - Skill
summary: Retrieve a skill
description: |-
  Retrieve one skill by ID with the content of its latest version.

  Requires the `skill:read` API key scope.
x-required-scope: skill:read
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the skill.
    name: skillId
    in: path
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/skillPublicDto.generated.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
