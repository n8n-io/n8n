operationId: getTestCases
tags:
  - Evaluation
summary: Retrieve test run cases
description: Retrieve the per-case results of an evaluation test run.
x-required-scope: testRun:read
parameters:
  - $ref: ../../../../shared/spec/parameters/limit.yml
  - $ref: ../../../../shared/spec/parameters/cursor.yml
  - schema:
      type: string
    required: true
    description: The ID of the workflow.
    name: workflowId
    in: path
  - schema:
      type: string
    required: true
    description: The ID of the test run.
    name: runId
    in: path
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: 1a2b3c4d5e6f7080
                  status:
                    type: string
                    enum:
                      - new
                      - running
                      - evaluation_running
                      - success
                      - error
                      - warning
                      - cancelled
                  runAt:
                    type: string
                    nullable: true
                    format: date-time
                  completedAt:
                    type: string
                    nullable: true
                    format: date-time
                  metrics:
                    type: object
                    description: Metrics produced by this test case.
                    additionalProperties: true
                    nullable: true
                  errorCode:
                    type: string
                    nullable: true
                  errorDetails:
                    type: object
                    additionalProperties: true
                    nullable: true
                  inputs:
                    type: object
                    description: Input data for this test case.
                    additionalProperties: true
                    nullable: true
                  outputs:
                    type: object
                    description: Output data produced by this test case.
                    additionalProperties: true
                    nullable: true
                  executionId:
                    type: integer
                    nullable: true
                    description: ID of the underlying workflow execution, if still retained.
                required:
                  - id
                  - status
                  - runAt
                  - completedAt
                  - metrics
                  - errorCode
                  - errorDetails
                  - inputs
                  - outputs
                  - executionId
            nextCursor:
              type: string
              nullable: true
              description: Paginate through test cases by setting the cursor parameter to the nextCursor attribute returned by a previous request. Default value fetches the first "page" of the collection.
              example: MTIzZTQ1NjctZTg5Yi0xMmQzLWE0NTYtNDI2NjE0MTc0MDA
          required:
            - data
            - nextCursor
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
