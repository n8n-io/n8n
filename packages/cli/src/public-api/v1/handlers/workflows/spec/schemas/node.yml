type: object
additionalProperties: false
properties:
  id:
    type: string
    example: 0f5532f9-36ba-4bef-86c7-30d607400b15
  name:
    type: string
    example: Jira
  webhookId:
    type: string
  disabled:
    type: boolean
  notesInFlow:
    type: boolean
  notes:
    type: string
  type:
    type: string
    example: n8n-nodes-base.jira
  typeVersion:
    type: number
    example: 1
  contract:
    description: The exact contract version that a contract node runs, and the semver range that it may update in. n8n writes it at save when node contracts are enabled. Send only `range` to let the save lock the newest version in the range.
    oneOf:
      - type: object
        additionalProperties: false
        required:
          - version
          - digest
        properties:
          version:
            type: string
            example: 1.0.0
          digest:
            type: string
            example: 'sha256:<64 hex characters>'
          range:
            type: string
            example: ^1.0.0
      - type: object
        additionalProperties: false
        required:
          - range
        properties:
          range:
            type: string
            example: ^1.0.0
  executeOnce:
    type: boolean
    example: false
  alwaysOutputData:
    type: boolean
    example: false
  retryOnFail:
    type: boolean
    example: false
  maxTries:
    type: number
  waitBetweenTries:
    type: number
  continueOnFail:
    type: boolean
    example: false
    description: 'use onError instead'
    deprecated: true
  onError:
    type: string
    example: 'stopWorkflow'
  position:
    type: array
    items:
      type: number
    example: [-100, 80]
  parameters:
    type: object
    additionalProperties: true
    example: { additionalProperties: {} }
  credentials:
    type: object
    example: { jiraSoftwareCloudApi: { id: '35', name: 'jiraApi' } }
  customTelemetryTags:
    type: object
    additionalProperties: false
    properties:
      tag:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - key
            - value
          properties:
            key:
              type: string
            value:
              type: string
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
