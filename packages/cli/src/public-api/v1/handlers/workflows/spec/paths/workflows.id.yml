delete:
  x-eov-operation-id: deleteWorkflow
  x-required-scope: workflow:delete
  x-eov-operation-handler: v1/handlers/workflows/workflows.handler
  tags:
    - Workflow
  summary: Delete a workflow
  description: Delete a workflow.
  parameters:
    - $ref: '../schemas/parameters/workflowId.yml'
  responses:
    '200':
      description: Operation successful.
      content:
        application/json:
          schema:
            $ref: '../schemas/workflow.yml'
    '401':
      $ref: '../../../../shared/spec/responses/unauthorized.yml'
    '404':
      $ref: '../../../../shared/spec/responses/notFound.yml'
put:
  x-eov-operation-id: updateWorkflow
  x-required-scope: workflow:update
  x-eov-operation-handler: v1/handlers/workflows/workflows.handler
  tags:
    - Workflow
  summary: Update a workflow
  description: >-
    Update a workflow. If the workflow is published, the updated version will
    be automatically re-published unless `publishIfActive` is set to `false`.
    Because that re-publication puts a new version live, it additionally
    requires the `workflow:activate` API key scope and the `workflow:publish`
    project permission. A caller without either can still save: the new version
    is stored as a draft and the response is a `403` naming the missing
    permission, leaving the published version live. Saving an unpublished
    workflow, or saving with `publishIfActive=false`, only needs
    `workflow:update`.
  parameters:
    - $ref: '../schemas/parameters/workflowId.yml'
    - name: publishIfActive
      in: query
      required: false
      description: >-
        Whether to publish the update if the workflow is currently published.
        Set to `false` to save the change as a draft on the existing published
        version instead of releasing it. Has no effect on a workflow that
        isn't currently published.
      schema:
        type: boolean
        default: true
  requestBody:
    description: Updated workflow object.
    content:
      application/json:
        schema:
          $ref: '../schemas/workflow.yml'
    required: true
  responses:
    '200':
      description: Workflow object
      content:
        application/json:
          schema:
            $ref: '../schemas/workflow.yml'
    '400':
      $ref: '../../../../shared/spec/responses/badRequest.yml'
    '401':
      $ref: '../../../../shared/spec/responses/unauthorized.yml'
    '404':
      $ref: '../../../../shared/spec/responses/notFound.yml'
    '403':
      description: >-
        The update would re-publish the workflow, but the API key lacks
        `workflow:activate` or the caller lacks `workflow:publish` on the
        project. The update is still saved as a draft, named by `versionId`, and
        the published version stays live.
      content:
        application/json:
          schema:
            $ref: '../schemas/workflowPublishForbiddenError.yml'
    '409':
      description: >-
        Conflict, e.g. re-publication blocked by an open workflow review (then
        `reason` and `workflowReviewRequestId` are present; the update itself is
        still saved as a draft) or a webhook path conflict.
      content:
        application/json:
          schema:
            $ref: '../schemas/workflowPublishBlockedError.yml'
