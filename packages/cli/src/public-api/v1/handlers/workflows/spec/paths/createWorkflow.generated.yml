operationId: createWorkflow
tags:
  - Workflow
summary: Create a workflow
description: Create a workflow in your instance.
x-required-scope: workflow:create
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
          nodes:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                webhookId:
                  type: string
                disabled:
                  type: boolean
                notesInFlow:
                  type: boolean
                notes:
                  type: string
                type:
                  type: string
                typeVersion:
                  type: number
                executeOnce:
                  type: boolean
                alwaysOutputData:
                  type: boolean
                retryOnFail:
                  type: boolean
                maxTries:
                  type: number
                waitBetweenTries:
                  type: number
                continueOnFail:
                  type: boolean
                onError:
                  type: string
                position:
                  type: array
                  items:
                    type: number
                parameters:
                  type: object
                  additionalProperties:
                    nullable: true
                credentials:
                  type: object
                  additionalProperties:
                    nullable: true
                customTelemetryTags:
                  type: object
                  properties:
                    tag:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          value:
                            type: string
                        required:
                          - key
                          - value
                        additionalProperties: false
                  additionalProperties: false
              additionalProperties: false
          connections:
            type: object
            additionalProperties:
              nullable: true
          nodeGroups:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                nodeIds:
                  type: array
                  items:
                    type: string
                description:
                  type: string
                  maxLength: 155
              required:
                - id
                - name
                - nodeIds
              additionalProperties: false
          settings:
            type: object
            properties:
              saveExecutionProgress:
                type: boolean
              saveManualExecutions:
                type: boolean
              saveDataErrorExecution:
                type: string
                enum:
                  - all
                  - none
              saveDataSuccessExecution:
                type: string
                enum:
                  - all
                  - none
              executionTimeout:
                type: number
              errorWorkflow:
                type: string
              timezone:
                type: string
              executionOrder:
                type: string
              binaryMode:
                type: string
                enum:
                  - separate
                  - combined
              credentialResolverId:
                type: string
              callerPolicy:
                type: string
                enum:
                  - any
                  - none
                  - workflowsFromAList
                  - workflowsFromSameOwner
              callerIds:
                type: string
              timeSavedMode:
                type: string
                enum:
                  - fixed
                  - dynamic
              timeSavedPerExecution:
                type: number
              redactionPolicy:
                type: string
                enum:
                  - none
                  - non-manual
                  - manual-only
                  - all
              availableInMCP:
                type: boolean
              customTelemetryTags:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                  required:
                    - key
                    - value
                  additionalProperties: false
            additionalProperties: false
          staticData:
            anyOf:
              - type: string
              - type: object
                additionalProperties:
                  nullable: true
              - nullable: true
          pinData:
            type: object
            nullable: true
            additionalProperties:
              nullable: true
          parentFolderId:
            type: string
            nullable: true
          shared:
            type: array
            items:
              type: object
              properties:
                role:
                  type: string
                workflowId:
                  type: string
                projectId:
                  type: string
                project:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    type:
                      type: string
              additionalProperties: false
          projectId:
            type: string
        required:
          - name
          - nodes
          - connections
          - settings
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            description:
              type: string
              nullable: true
            active:
              type: boolean
            activeVersionId:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            isArchived:
              type: boolean
            versionId:
              type: string
            versionCounter:
              type: number
            sourceWorkflowId:
              type: string
              nullable: true
            triggerCount:
              type: number
            nodes: {}
            connections: {}
            nodeGroups: {}
            settings:
              nullable: true
            staticData:
              nullable: true
            pinData:
              nullable: true
            meta:
              nullable: true
            tags:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - name
                  - createdAt
                  - updatedAt
            shared:
              type: array
              items:
                type: object
                properties:
                  role:
                    type: string
                  workflowId:
                    type: string
                  projectId:
                    type: string
                  project:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      type:
                        type: string
                        enum:
                          - personal
                          - team
                      icon:
                        type: object
                        nullable: true
                        properties:
                          type:
                            type: string
                            enum:
                              - emoji
                              - icon
                          value:
                            type: string
                        required:
                          - type
                          - value
                      description:
                        type: string
                        nullable: true
                      customTelemetryTags:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            value:
                              type: string
                          required:
                            - key
                            - value
                      creatorId:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - name
                      - type
                      - icon
                      - description
                      - customTelemetryTags
                      - creatorId
                      - createdAt
                      - updatedAt
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - role
                  - workflowId
                  - projectId
                  - project
                  - createdAt
                  - updatedAt
            activeVersion:
              type: object
              nullable: true
              properties:
                versionId:
                  type: string
                workflowId:
                  type: string
                nodes: {}
                connections: {}
                nodeGroups: {}
                authors:
                  type: string
                name:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
                autosaved:
                  type: boolean
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
                workflowPublishHistory:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: number
                      workflowId:
                        type: string
                      versionId:
                        type: string
                        nullable: true
                      event:
                        type: string
                        enum:
                          - activated
                          - deactivated
                      userId:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - workflowId
                      - versionId
                      - event
                      - userId
                      - createdAt
              required:
                - versionId
                - workflowId
                - nodes
                - connections
                - nodeGroups
                - authors
                - name
                - description
                - autosaved
                - createdAt
                - updatedAt
                - workflowPublishHistory
            parentFolder:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                name:
                  type: string
                parentFolderId:
                  type: string
                  nullable: true
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
              required:
                - id
                - name
                - parentFolderId
                - createdAt
                - updatedAt
          required:
            - id
            - name
            - description
            - active
            - activeVersionId
            - createdAt
            - updatedAt
            - isArchived
            - versionId
            - versionCounter
            - sourceWorkflowId
            - triggerCount
            - nodes
            - connections
            - nodeGroups
            - settings
            - staticData
            - meta
            - shared
            - activeVersion
            - parentFolder
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
