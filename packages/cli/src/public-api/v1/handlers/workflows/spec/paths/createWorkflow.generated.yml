operationId: createWorkflow
tags:
  - Workflow
summary: Create a workflow
description: Create a workflow in your instance.
x-required-scope: workflow:create
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
          description:
            type: string
            nullable: true
          nodes: {}
          connections: {}
          nodeGroups: {}
          settings:
            type: object
            additionalProperties:
              nullable: true
          staticData:
            anyOf:
              - type: string
              - type: object
                additionalProperties:
                  nullable: true
              - nullable: true
          pinData:
            type: object
            nullable: true
            additionalProperties:
              nullable: true
          parentFolderId:
            type: string
            nullable: true
          id: {}
          active: {}
          createdAt: {}
          updatedAt: {}
          isArchived: {}
          versionId: {}
          triggerCount: {}
          meta: {}
          tags: {}
          shared: {}
          activeVersion: {}
          projectId:
            type: string
        required:
          - name
          - nodes
          - connections
          - settings
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/workflowPublicDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
