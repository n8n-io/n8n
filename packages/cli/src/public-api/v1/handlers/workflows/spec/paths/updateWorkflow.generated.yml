operationId: updateWorkflow
tags:
  - Workflow
summary: Update a workflow
description: Update a workflow. If the workflow is published, the updated version will be automatically re-published unless `publishIfActive` is set to `false`.
x-required-scope: workflow:update
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    name: workflowId
    in: path
  - schema:
      type: string
      enum:
        - 'true'
        - 'false'
      default: 'true'
      description: Whether to publish the update if the workflow is currently published. Set to `false` to save the change as a draft on the existing published version instead of releasing it. Has no effect on a workflow that isn't currently published.
    required: false
    name: publishIfActive
    in: query
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          id:
            type: string
            readOnly: true
            example: 2tUt1wbLX592XDdX
          name:
            type: string
            example: Workflow 1
          active:
            type: boolean
            readOnly: true
          createdAt:
            type: string
            format: date-time
            readOnly: true
          updatedAt:
            type: string
            format: date-time
            readOnly: true
          isArchived:
            type: boolean
            readOnly: true
          versionId:
            type: string
            description: Current version identifier used for optimistic locking
            readOnly: true
          triggerCount:
            type: integer
            description: Number of active trigger nodes in the workflow
            readOnly: true
          nodes:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  example: 0f5532f9-36ba-4bef-86c7-30d607400b15
                name:
                  type: string
                  example: Jira
                webhookId:
                  type: string
                disabled:
                  type: boolean
                notesInFlow:
                  type: boolean
                notes:
                  type: string
                type:
                  type: string
                  example: n8n-nodes-base.jira
                typeVersion:
                  type: number
                  example: 1
                executeOnce:
                  type: boolean
                  example: false
                alwaysOutputData:
                  type: boolean
                  example: false
                retryOnFail:
                  type: boolean
                  example: false
                maxTries:
                  type: number
                waitBetweenTries:
                  type: number
                continueOnFail:
                  type: boolean
                  description: use onError instead
                  example: false
                  deprecated: true
                onError:
                  type: string
                  example: stopWorkflow
                position:
                  type: array
                  items:
                    type: number
                  example:
                    - -100
                    - 80
                parameters:
                  type: object
                  additionalProperties:
                    nullable: true
                credentials:
                  type: object
                  additionalProperties:
                    nullable: true
                  example:
                    jiraSoftwareCloudApi:
                      name: jiraApi
                customTelemetryTags:
                  type: object
                  properties:
                    tag:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          value:
                            type: string
                        required:
                          - key
                          - value
                        additionalProperties: false
                  additionalProperties: false
                createdAt:
                  type: string
                  format: date-time
                  readOnly: true
                updatedAt:
                  type: string
                  format: date-time
                  readOnly: true
              additionalProperties: false
            description: Nodes that make up the workflow
          connections:
            type: object
            description: Connections between nodes, keyed by source node name
            example:
              Jira:
                main:
                  - - node: Jira
                      type: main
                      index: 0
          settings:
            type: object
            properties:
              saveExecutionProgress:
                type: boolean
              saveManualExecutions:
                type: boolean
              saveDataErrorExecution:
                type: string
                enum:
                  - all
                  - none
              saveDataSuccessExecution:
                type: string
                enum:
                  - all
                  - none
              executionTimeout:
                type: number
                example: 3600
              errorWorkflow:
                type: string
                description: The ID of the workflow that contains the error trigger node.
                example: VzqKEW0ShTXA5vPj
              timezone:
                type: string
                example: America/New_York
              executionOrder:
                type: string
                example: v1
              binaryMode:
                type: string
                enum:
                  - separate
                  - combined
                description: Controls how binary data is resolved from a node's input. This is a derived, internal setting rather than something intended to be set programmatically. It is included in workflow responses for reference, but any value sent when creating or updating a workflow is ignored.
              callerPolicy:
                type: string
                enum:
                  - any
                  - none
                  - workflowsFromAList
                  - workflowsFromSameOwner
                description: |-
                  Controls which workflows are allowed to call this workflow using the Execute Workflow node. Defaults to workflowsFromSameOwner.

                  Available options:
                  - `any`: Any workflow can call this workflow (no restrictions)
                  - `none`: No other workflows can call this workflow (completely blocked)
                  - `workflowsFromSameOwner` (default): Only workflows owned by the same project can call this workflow
                  - `workflowsFromAList`: Only the workflows listed in `callerIds` can call this workflow
                example: workflowsFromSameOwner
              callerIds:
                type: string
                description: Comma-separated list of workflow IDs allowed to call this workflow (only used with the workflowsFromAList policy)
                example: 14, 18, 23
              timeSavedMode:
                type: string
                enum:
                  - fixed
                  - dynamic
                description: |-
                  Controls how the time saved per execution is calculated.

                  Available options:
                  - `fixed`: Uses the value in `timeSavedPerExecution`. Use when the time saved is the same for every execution.
                  - `dynamic`: Calculates the time saved from actual execution metrics. `timeSavedPerExecution` is ignored.
              timeSavedPerExecution:
                type: number
                description: Estimated time saved per execution in minutes
              redactionPolicy:
                type: string
                enum:
                  - none
                  - non-manual
                  - manual-only
                  - all
                description: |-
                  Controls whether execution data is redacted for this workflow.

                  Available options:
                  - `none` (default): No redaction. All execution data is stored.
                  - `non-manual`: Redact production (non-manually triggered) executions only.
                  - `manual-only`: Redact manually triggered executions only.
                  - `all`: Redact all executions, manual and production.
                example: non-manual
              availableInMCP:
                type: boolean
                description: Controls whether this workflow is reachable over the Model Context Protocol (MCP). Defaults to false. The workflow must be active and must hold at least one active Webhook node.
                example: false
              customTelemetryTags:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                  required:
                    - key
                    - value
                  additionalProperties: false
              credentialResolverId:
                type: string
                description: ID of the credential resolver that resolves credentials for this workflow. This is a derived, internal setting managed through the credential resolver configuration rather than something intended to be set programmatically. It is included in workflow responses for reference, but any value sent when creating or updating a workflow is ignored.
            additionalProperties: false
          nodeGroups:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  description: Unique identifier for the node group
                  example: 9b1c8e2a-4d3f-4a6b-8c7d-1e2f3a4b5c6d
                name:
                  type: string
                  description: Display name of the node group
                  example: Data processing
                description:
                  type: string
                  maxLength: 155
                  description: Optional plain-text description of the node group
                  example: Cleans and normalizes incoming records
                nodeIds:
                  type: array
                  items:
                    type: string
                  description: IDs of the nodes that belong to this group
              required:
                - id
                - name
                - nodeIds
              additionalProperties: false
            description: Visual groupings of nodes shown as frames on the canvas
          staticData:
            anyOf:
              - type: string
                format: jsonString
              - type: object
                additionalProperties:
                  nullable: true
              - nullable: true
            description: Data the workflow keeps between executions
            example:
              lastId: 1
          pinData:
            type: object
            nullable: true
            additionalProperties:
              nullable: true
            description: Pinned sample data for nodes, keyed by node name
          parentFolderId:
            type: string
            nullable: true
            description: ID of the folder to move the workflow into. Pass null to move it to the project root; omit to leave its current folder unchanged.
            writeOnly: true
            example: X8ovzm8lTQjcXRZQ
          meta:
            type: object
            description: Workflow metadata such as template information
            readOnly: true
            properties:
              onboardingId:
                type: string
              templateId:
                type: string
              instanceId:
                type: string
              templateCredsSetupCompleted:
                type: boolean
            nullable: true
          tags:
            type: array
            readOnly: true
            items:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                id:
                  type: string
                  readOnly: true
                  example: 2tUt1wbLX592XDdX
                name:
                  type: string
                  example: Production
                createdAt:
                  type: string
                  format: date-time
                  readOnly: true
                updatedAt:
                  type: string
                  format: date-time
                  readOnly: true
          shared:
            type: array
            items:
              type: object
              properties:
                role:
                  type: string
                  example: workflow:owner
                workflowId:
                  type: string
                  example: 2tUt1wbLX592XDdX
                projectId:
                  type: string
                  example: 2tUt1wbLX592XDdX
                project:
                  type: object
                  properties:
                    id:
                      type: string
                      readOnly: true
                    name:
                      type: string
                    type:
                      type: string
                      readOnly: true
                createdAt:
                  type: string
                  format: date-time
                  readOnly: true
                updatedAt:
                  type: string
                  format: date-time
                  readOnly: true
              additionalProperties: false
            description: Accepted for compatibility and ignored. The owner share is derived from the target project.
          activeVersion:
            type: object
            readOnly: true
            nullable: true
            additionalProperties: false
            properties:
              versionId:
                type: string
                readOnly: true
                description: Unique identifier for this workflow version
                example: 7c6b9e3f-8d4a-4b2c-9f1e-6a5d3b8c7e4f
              workflowId:
                type: string
                readOnly: true
                description: The workflow this version belongs to
                example: 2tUt1wbLX592XDdX
              nodes:
                type: array
                description: Nodes that make up the workflow
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: 0f5532f9-36ba-4bef-86c7-30d607400b15
                    name:
                      type: string
                      example: Jira
                    webhookId:
                      type: string
                    disabled:
                      type: boolean
                    notesInFlow:
                      type: boolean
                    notes:
                      type: string
                    type:
                      type: string
                      example: n8n-nodes-base.jira
                    typeVersion:
                      type: number
                      example: 1
                    executeOnce:
                      type: boolean
                      example: false
                    alwaysOutputData:
                      type: boolean
                      example: false
                    retryOnFail:
                      type: boolean
                      example: false
                    maxTries:
                      type: number
                    waitBetweenTries:
                      type: number
                    continueOnFail:
                      type: boolean
                      example: false
                      description: use onError instead
                      deprecated: true
                    onError:
                      type: string
                      example: stopWorkflow
                    position:
                      type: array
                      items:
                        type: number
                      example:
                        - -100
                        - 80
                    parameters:
                      type: object
                      additionalProperties: true
                    credentials:
                      type: object
                      example:
                        jiraSoftwareCloudApi:
                          name: jiraApi
                    customTelemetryTags:
                      type: object
                      additionalProperties: false
                      properties:
                        tag:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required:
                              - key
                              - value
                            properties:
                              key:
                                type: string
                              value:
                                type: string
                    createdAt:
                      type: string
                      format: date-time
                      readOnly: true
                    updatedAt:
                      type: string
                      format: date-time
                      readOnly: true
                  additionalProperties: false
                readOnly: true
              connections:
                type: object
                description: Connections between nodes, keyed by source node name
                example:
                  Jira:
                    main:
                      - - node: Jira
                          type: main
                          index: 0
                readOnly: true
              nodeGroups:
                type: array
                description: Visual groupings of nodes shown as frames on the canvas
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Unique identifier for the node group
                      example: 9b1c8e2a-4d3f-4a6b-8c7d-1e2f3a4b5c6d
                    name:
                      type: string
                      description: Display name of the node group
                      example: Data processing
                    description:
                      type: string
                      maxLength: 155
                      description: Optional plain-text description of the node group
                      example: Cleans and normalizes incoming records
                    nodeIds:
                      type: array
                      description: IDs of the nodes that belong to this group
                      items:
                        type: string
                  required:
                    - id
                    - name
                    - nodeIds
                  additionalProperties: false
                readOnly: true
              authors:
                type: string
                readOnly: true
                description: Comma-separated list of author IDs who contributed to this version
                example: 1,2,3
              name:
                type: string
                nullable: true
                readOnly: true
                description: Optional name for this workflow version
                example: Production release
              description:
                type: string
                nullable: true
                readOnly: true
                description: Optional description for this workflow version
              autosaved:
                type: boolean
                readOnly: true
                description: Whether this version was created by autosave
              createdAt:
                type: string
                format: date-time
                readOnly: true
              updatedAt:
                type: string
                format: date-time
                readOnly: true
          description:
            type: string
            description: Description of the workflow
            example: My workflow description
        required:
          - name
          - nodes
          - connections
          - settings
        additionalProperties: false
