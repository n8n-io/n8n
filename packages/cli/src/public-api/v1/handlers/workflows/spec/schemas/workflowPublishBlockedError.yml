type: object
description: >-
  Conflict response. `reason` is absent for a webhook path conflict;
  `workflowReviewRequestId` is present only when an open workflow review is
  what blocks publication.
required:
  - message
properties:
  message:
    type: string
  reason:
    type: string
    enum:
      - review_pending
      - changes_requested
      - insufficient_api_key_scope
      - insufficient_permissions
  workflowReviewRequestId:
    type: string
