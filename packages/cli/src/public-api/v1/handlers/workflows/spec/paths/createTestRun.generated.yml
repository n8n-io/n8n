operationId: createTestRun
tags:
  - Evaluation
summary: Trigger a test run
description: Start a new evaluation test run for a workflow. The workflow must contain a configured evaluation trigger. Requires the `workflow:execute` project scope in addition to the `testRun:create` API key scope.
x-required-scope: testRun:create
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the workflow.
    name: workflowId
    in: path
responses:
  '201':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              example: 9f8e7d6c5b4a3210
            status:
              type: string
              enum:
                - new
                - running
                - completed
                - error
                - cancelled
            createdAt:
              type: string
              format: date-time
          required:
            - id
            - status
            - createdAt
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '402':
    $ref: ../../../../shared/spec/responses/paymentRequired.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
