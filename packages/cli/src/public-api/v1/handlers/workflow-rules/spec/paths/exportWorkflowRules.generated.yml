operationId: exportWorkflowRules
tags:
  - WorkflowRules
summary: 'Preview: Export the Workflow Rules for offline checks'
description: |-
  **Preview** — breaking changes may still occur without major version bump. Needs `N8N_ENABLED_MODULES=workflow-rules`.

  Returns the instance rules, every project's rules, the exemptions and the instance defaults. Save it as a file and pass it to `n8n-cli workflow-rules check --rules`.

  Requires the `workflowRules:read` API key scope.
x-required-scope: workflowRules:read
responses:
