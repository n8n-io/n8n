operationId: getInstanceWorkflowRules
tags:
  - WorkflowRules
summary: 'Preview: Retrieve the instance Workflow Rules'
description: |-
  **Preview** — breaking changes may still occur without major version bump. Needs `N8N_ENABLED_MODULES=workflow-rules`.

  Returns the instance rule set. An instance that never saved one returns no rules and `version: 0`.

  Requires the `workflowRules:read` API key scope.
x-required-scope: workflowRules:read
