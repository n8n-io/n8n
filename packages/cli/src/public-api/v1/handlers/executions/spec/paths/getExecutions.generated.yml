operationId: getExecutions
tags:
  - Execution
summary: Retrieve all executions
description: Retrieve all executions from your instance.
x-required-scope: execution:list
parameters:
  - $ref: ../../../../shared/spec/parameters/limit.yml
  - $ref: ../../../../shared/spec/parameters/cursor.yml
  - schema:
      type: string
      enum:
        - 'true'
        - 'false'
      default: 'false'
    required: false
    name: includeData
    in: query
  - schema:
      type: string
      enum:
        - 'true'
        - 'false'
      default: 'false'
    required: false
    name: ignoreDataSizeLimit
    in: query
  - schema:
      type: string
      enum:
        - 'true'
        - 'false'
    required: false
    name: redactExecutionData
    in: query
  - schema:
      type: string
      enum:
        - canceled
        - crashed
        - error
        - new
        - running
        - success
        - unknown
        - waiting
    required: false
    name: status
    in: query
  - schema:
      type: string
    required: false
    name: workflowId
    in: query
  - schema:
      type: string
    required: false
    name: projectId
    in: query
  - schema:
      type: string
      format: date-time
    required: false
    name: startedAfter
    in: query
  - schema:
      type: string
      format: date-time
    required: false
    name: startedBefore
    in: query
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: '1000'
                  finished:
                    type: boolean
                    example: true
                  mode:
                    type: string
                    enum:
                      - cli
                      - error
                      - integrated
                      - internal
                      - manual
                      - retry
                      - trigger
                      - webhook
                      - evaluation
                      - chat
                      - agent
                    example: manual
                  retryOf:
                    type: string
                    nullable: true
                    description: ID of the execution this one is a retry of.
                  retrySuccessId:
                    type: string
                    nullable: true
                    description: ID of the retry that succeeded, if this execution failed and a retry did not.
                    example: '2'
                  status:
                    type: string
                    enum:
                      - canceled
                      - crashed
                      - error
                      - new
                      - running
                      - success
                      - unknown
                      - waiting
                  startedAt:
                    type: string
                    nullable: true
                    format: date-time
                    description: Null until the execution leaves the queue and starts running.
                  stoppedAt:
                    type: string
                    nullable: true
                    format: date-time
                    description: The time at which the execution stopped. Null while it has not stopped yet.
                  workflowId:
                    type: string
                    example: '1000'
                  waitTill:
                    type: string
                    nullable: true
                    format: date-time
                    description: The time at which a waiting execution resumes.
                  storedAt:
                    type: string
                    description: Where the execution data is stored.
                    enum:
                      - db
                      - fs
                      - s3
                      - az
                  jsonSizeBytes:
                    type: number
                    description: Size of the stored execution data in bytes. 0 means unknown.
                    example: 0
                  workflowVersionId:
                    type: string
                    nullable: true
                    description: ID of the workflow version this execution ran.
                  data:
                    type: object
                    description: Detailed execution data. Only included when `includeData` is `true`.
                    additionalProperties: true
                    properties:
                      redactionInfo:
                        type: object
                        nullable: true
                        description: Present when execution data has been redacted.
                        properties:
                          isRedacted:
                            type: boolean
                            description: Whether the execution data was redacted.
                          reason:
                            type: string
                            description: The reason for redaction.
                          canReveal:
                            type: boolean
                            description: Whether the current user has permission to reveal the redacted data.
                  workflowData:
                    type: object
                    description: The workflow as it was saved when the execution ran. Only included when `includeData` is `true`. Older executions carry more fields than newer ones.
                    additionalProperties: true
                  customData:
                    type: object
                    description: Execution metadata set by the workflow. Only included when `includeData` is `true`.
                    additionalProperties:
                      type: string
                required:
                  - id
                  - finished
                  - mode
                  - retryOf
                  - retrySuccessId
                  - status
                  - startedAt
                  - stoppedAt
                  - workflowId
                  - waitTill
            nextCursor:
              type: string
              nullable: true
          required:
            - data
            - nextCursor
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
