operationId: runAgent
tags:
  - Agent
summary: Run an agent
description: |-
  Run the latest published version of an agent and wait for the final response. Omit sessionId to start a session. Send the same sessionId to continue that session. The Public API rejects an agent that has no published version, and an agent whose published version uses a tool that needs approval.

  Requires the `agent:execute` API key scope.
x-required-scope: agent:execute
parameters:
  - $ref: ../../../../shared/spec/parameters/idempotencyKey.yml
  - schema:
      type: string
    required: true
    description: The ID of the agent.
    name: agentId
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            minLength: 1
            description: The message to send to the agent.
          sessionId:
            type: string
            minLength: 1
            description: The session to continue.
        required:
          - message
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            response:
              type: string
              description: The final text of the run.
            sessionId:
              type: string
              description: The session this run belongs to.
            executionId:
              type: string
              description: The execution id of this run.
            status:
              type: string
              enum:
                - running
                - success
                - error
                - cancelled
                - interrupted
                - awaiting
            usage:
              type: object
              properties:
                promptTokens:
                  type: number
                  nullable: true
                completionTokens:
                  type: number
                  nullable: true
                totalTokens:
                  type: number
                  nullable: true
                cost:
                  type: number
                  nullable: true
              required:
                - promptTokens
                - completionTokens
                - totalTokens
                - cost
            error:
              type: string
              nullable: true
          required:
            - response
            - sessionId
            - executionId
            - status
            - usage
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    $ref: ../../../../shared/spec/responses/unprocessableEntity.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
