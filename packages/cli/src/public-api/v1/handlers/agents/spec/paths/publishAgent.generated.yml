operationId: publishAgent
tags:
  - Agent
summary: Publish an agent
description: |-
  Publish an agent. Omit versionId to publish the current draft. Send versionId to publish a saved version.

  Requires the `agent:publish` API key scope.
x-required-scope: agent:publish
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the agent.
    name: agentId
    in: path
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          versionId:
            type: string
            minLength: 1
            description: The saved version to publish. Omit this field to publish the current draft.
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/agentPublicDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    $ref: ../../../../shared/spec/responses/unprocessableEntity.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
