operationId: unpublishAgent
tags:
  - Agent
summary: Unpublish an agent
description: |-
  Unpublish an agent. This stops the published version and disconnects its live channels.

  Requires the `agent:unpublish` API key scope.
x-required-scope: agent:unpublish
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the agent.
    name: agentId
    in: path
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/agentPublicDto.generated.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
