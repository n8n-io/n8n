operationId: updateAiPreference
tags:
  - AiPreference
summary: Update an AI preference
description: |-
  Replace an AI preference with the full body: content, scope, and the userId or projectId of the scope. A user preference names its user in userId, and a project preference names its project in projectId. A new scope moves the preference: a move needs the delete permission on the old scope and the create permission on the new one. A move also needs the aiPreference:create and aiPreference:delete API key scopes.

  Requires the `aiPreference:update` API key scope.
x-required-scope: aiPreference:update
parameters:
  - schema:
      type: string
      format: uuid
    required: true
    description: The ID of the AI preference.
    name: aiPreferenceId
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          content:
            type: string
            minLength: 1
            maxLength: 2000
            description: One instruction, written as the user would say it. At most 2000 characters. A scope that already holds 50 preferences refuses a new one, so edit or delete one first.
          scope:
            type: string
            enum:
              - user
              - project
              - instance
          projectId:
            type: string
            nullable: true
            maxLength: 36
          userId:
            type: string
            nullable: true
            format: uuid
        required:
          - content
          - scope
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/aiPreferencePublicDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
