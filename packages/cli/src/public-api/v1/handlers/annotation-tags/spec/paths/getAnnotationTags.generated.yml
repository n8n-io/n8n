operationId: getAnnotationTags
tags:
  - Executions
summary: Retrieve all annotation tags
description: Retrieve all annotation tags from your instance. Use the IDs of these tags to assign them to executions.
x-required-scope: annotationTag:list
parameters:
  - $ref: ../../../../shared/spec/parameters/limit.yml
  - $ref: ../../../../shared/spec/parameters/cursor.yml
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    readOnly: true
                    example: 2tUt1wbLX592XDdX
                  name:
                    type: string
                    example: Production
                  createdAt:
                    type: string
                    format: date-time
                    readOnly: true
                  updatedAt:
                    type: string
                    format: date-time
                    readOnly: true
                required:
                  - id
                  - name
                  - createdAt
                  - updatedAt
            nextCursor:
              type: string
              nullable: true
          required:
            - data
            - nextCursor
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
