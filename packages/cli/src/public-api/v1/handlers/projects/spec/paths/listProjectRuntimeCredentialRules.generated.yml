operationId: listProjectRuntimeCredentialRules
tags:
  - RuntimeCredentialRule
summary: "Preview: List a project's run-time input rules"
description: |-
  **Preview.** Breaking changes may still occur without a major version bump.

  Returns every rule with its effective access in the project. A rule is `blocked` when the request-fed credential type policy of the instance or of the project blocks its credential type. `blockedBy` names the scope that blocks it.

  Requires the `credentialTypePolicy:manageRequestFed` API key scope.
x-required-scope: credentialTypePolicy:manageRequestFed
parameters:
  - $ref: ../../../../shared/spec/parameters/limit.yml
  - $ref: ../../../../shared/spec/parameters/cursor.yml
  - schema:
      type: string
    required: true
    description: The ID of the project.
    name: projectId
    in: path
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  alias:
                    type: string
                    example: gmail_token
                  path:
                    type: string
                    description: Dot path to the value in the trigger item.
                    example: headers.authorization
                  credentialType:
                    type: string
                    example: gmailOAuth2
                  allowedDomains:
                    type: string
                    description: Hosts that the secret can be sent to, comma separated. Absent means no limit.
                  access:
                    type: string
                    enum:
                      - allowed
                      - blocked
                    description: '`blocked` when the request-fed credential type policy of the instance or the project blocks the credential type.'
                  blockedBy:
                    type: string
                    nullable: true
                    enum:
                      - instance
                      - project
                required:
                  - alias
                  - path
                  - credentialType
                  - access
                  - blockedBy
            nextCursor:
              type: string
              nullable: true
          required:
            - data
            - nextCursor
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
