operationId: addUsersToProject
tags:
  - Projects
summary: Add one or more users to a project
description: Add one or more users to a project on your instance.
x-required-scope: project:manageMembers
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    name: projectId
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          relations:
            type: array
            items:
              type: object
              properties:
                userId:
                  type: string
                  minLength: 1
                role:
                  anyOf:
                    - type: string
                      enum:
                        - project:admin
                        - project:editor
                        - project:viewer
                        - project:chatUser
                    - type: string
                      minLength: 1
              required:
                - userId
                - role
            minItems: 1
        required:
          - relations
responses:
  '201':
    description: Operation successful.
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
