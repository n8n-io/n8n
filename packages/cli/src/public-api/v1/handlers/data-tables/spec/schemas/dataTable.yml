type: object
properties:
  id:
    type: string
    description: Unique identifier for the data table
  name:
    type: string
    description: Name of the data table
  columns:
    type: array
    description: Column definitions
    items:
      type: object
      properties:
        id:
          type: string
          description: Column ID
        name:
          type: string
          description: Column name
        type:
          type: string
          enum: [string, number, boolean, date, enum]
          description: Column data type
        index:
          type: integer
          description: Column position
        options:
          type: array
          nullable: true
          description: Allowed enum values
          items:
            type: string
        defaultValue:
          type: string
          nullable: true
          description: Default enum value
  metadata:
    type: object
    description: Extensible Data Table configuration
  projectId:
    type: string
    description: ID of the project this table belongs to
  createdAt:
    type: string
    format: date-time
    description: Timestamp when the table was created
  updatedAt:
    type: string
    format: date-time
    description: Timestamp when the table was last updated
  sizeBytes:
    type: integer
    description: Physical storage in bytes, including indexes and internal overhead. Not reduced immediately by row deletion, and may be a few seconds stale.
required:
  - id
  - name
  - columns
  - metadata
  - projectId
  - createdAt
  - updatedAt
  - sizeBytes
