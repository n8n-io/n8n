type: object
properties:
  name:
    type: string
    description: Name of the data table
    minLength: 1
    maxLength: 128
  columns:
    type: array
    description: Column definitions for the table
    items:
      type: object
      properties:
        name:
          type: string
          description: Column name
          minLength: 1
        type:
          type: string
          enum: [string, number, boolean, date, enum]
          description: Column data type
        options:
          type: array
          minItems: 1
          maxItems: 100
          description: Allowed enum options. Required when type is enum.
          items:
            oneOf:
              - type: string
                maxLength: 128
              - type: object
                properties:
                  id:
                    type: string
                    maxLength: 36
                  text:
                    type: string
                    maxLength: 128
                  color:
                    type: string
                    pattern: '^#(?:[0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$'
                required: [text]
        defaultValue:
          type: string
          maxLength: 128
          description: Default option ID or text. Stored as an option ID.
      required:
        - name
        - type
  projectId:
    type: string
    description: |
      ID of the project to create the table in. When omitted, the table is created in the user's personal project.
required:
  - name
  - columns
