type: object
properties:
  id:
    type: string
    description: Column ID
  name:
    type: string
    description: Column name
  dataTableId:
    type: string
    description: ID of the data table this column belongs to
  type:
    type: string
    enum: [string, number, boolean, date, enum]
    description: Column data type
  options:
    type: array
    nullable: true
    description: Allowed enum options
    items:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        color:
          type: string
      required: [id, text, color]
  defaultValue:
    type: string
    nullable: true
    description: Default enum option ID
  index:
    type: integer
    description: Column position
required:
  - id
  - name
  - dataTableId
  - type
  - index
