type: object
properties:
  id:
    type: string
    description: Column ID
  name:
    type: string
    description: Column name
  dataTableId:
    type: string
    description: ID of the data table this column belongs to
  type:
    type: string
    enum: [string, number, boolean, date, enum]
    description: Column data type
  options:
    type: array
    nullable: true
    description: Allowed enum values
    items:
      type: string
  defaultValue:
    type: string
    nullable: true
    description: Default enum value
  index:
    type: integer
    description: Column position
required:
  - id
  - name
  - dataTableId
  - type
  - index
