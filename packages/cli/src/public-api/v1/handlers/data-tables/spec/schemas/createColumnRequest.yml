type: object
properties:
  name:
    $ref: './dataTableColumnName.yml'
  type:
    type: string
    enum: [string, number, boolean, date, enum]
    description: Column data type
  options:
    type: array
    minItems: 1
    maxItems: 100
    description: Allowed enum options. Required when type is enum.
    items:
      oneOf:
        - type: string
          maxLength: 128
        - type: object
          properties:
            id:
              type: string
              maxLength: 36
            text:
              type: string
              maxLength: 128
            color:
              type: string
              pattern: '^#(?:[0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$'
          required: [text]
  defaultValue:
    type: string
    maxLength: 128
    description: Default option ID or text. Stored as an option ID.
  index:
    type: integer
    minimum: 0
    description: Column position (optional, appended to end if omitted)
required:
  - name
  - type
