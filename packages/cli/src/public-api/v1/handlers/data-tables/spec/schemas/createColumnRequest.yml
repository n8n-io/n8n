type: object
properties:
  name:
    $ref: './dataTableColumnName.yml'
  type:
    type: string
    enum: [string, number, boolean, date, enum]
    description: Column data type
  options:
    type: array
    minItems: 1
    maxItems: 100
    description: Allowed values. Required when type is enum.
    items:
      type: string
      maxLength: 128
  index:
    type: integer
    minimum: 0
    description: Column position (optional, appended to end if omitted)
required:
  - name
  - type
