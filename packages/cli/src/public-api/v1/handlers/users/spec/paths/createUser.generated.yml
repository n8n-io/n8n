operationId: createUser
tags:
  - User
summary: Create multiple users
description: Create one or more users.
x-required-scope: user:create
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            email:
              type: string
              format: email
            role:
              anyOf:
                - type: string
                  enum:
                    - global:admin
                    - global:member
                    - global:chatUser
                - type: string
                  minLength: 1
              default: global:member
          required:
            - email
responses:
  '201':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              user:
                type: object
                properties:
                  id:
                    type: string
                    readOnly: true
                    example: 123e4567-e89b-12d3-a456-426614174000
                  email:
                    type: string
                    format: email
                    example: john.doe@company.com
                  inviteAcceptUrl:
                    type: string
                    description: Link the invited user can open to finish setting up the account. Present only when the instance does not send invite emails.
                    readOnly: true
                  emailSent:
                    type: boolean
                    description: Whether the invite email was sent to the user.
                    readOnly: true
                  role:
                    type: string
                    readOnly: true
                    example: global:member
                required:
                  - id
                  - email
                  - emailSent
                  - role
              error:
                type: string
                description: The reason the invite failed for this user. Empty when the invite succeeded.
                readOnly: true
            required:
              - user
              - error
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
