post:
  x-eov-operation-id: createUser
  x-required-scope: user:create
  x-eov-operation-handler: v1/handlers/users/users.handler.ee
  tags:
    - User
  summary: Create multiple users
  description: Create one or more users.
  requestBody:
    description: Array of users to be created.
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              email:
                type: string
                format: email
              role:
                type: string
                example: global:member
            required:
              - email
  responses:
    '200':
      description: Operation successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              user:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  inviteAcceptUrl:
                    type: string
                  emailSent:
                    type: boolean
              error:
                type: string
    '401':
      $ref: '../../../../shared/spec/responses/unauthorized.yml'
    '403':
      $ref: '../../../../shared/spec/responses/forbidden.yml'
