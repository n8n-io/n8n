operationId: getInstanceExecutionLimit
tags:
  - ExecutionLimits
summary: 'Preview: Retrieve the instance execution limit'
description: |-
  **Preview** — breaking changes may still occur without major version bump.

  Returns the instance execution limit, the calendar period, the current `version`, and `defaultProjectMaxExecutions`. Each new team project gets this limit when it is created. Existing projects keep their limits. A fresh instance returns `periodUnit: "month"`, `maxExecutions: null`, `defaultProjectMaxExecutions: null`, and `version: 0`.

  Requires the `executionLimit:read` API key scope.
x-required-scope: executionLimit:read
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/instanceExecutionLimitDto.generated.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
