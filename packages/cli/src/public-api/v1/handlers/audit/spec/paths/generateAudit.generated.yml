operationId: generateAudit
tags:
  - Audit
summary: Generate an audit
description: Generate a security audit for your n8n instance.
x-required-scope: securityAudit:generate
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          additionalOptions:
            type: object
            properties:
              daysAbandonedWorkflow:
                type: integer
                description: Days for a workflow to be considered abandoned if not executed
              categories:
                type: array
                items:
                  type: string
                  enum:
                    - credentials
                    - database
                    - nodes
                    - filesystem
                    - instance
responses:
  '200':
    description: Operation successful.
