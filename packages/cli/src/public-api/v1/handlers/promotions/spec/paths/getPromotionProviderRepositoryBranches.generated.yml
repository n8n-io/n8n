operationId: getPromotionProviderRepositoryBranches
tags:
  - Promotions
summary: List branches of a promotion repository
description: Lists branches of the selected GitLab repository and identifies its default branch. Pass the URL-encoded fullPath from repository discovery, or the repositoryPath of a saved GitLab environment, as repositoryId. GitLab project IDs are also accepted, but environments do not store them. Supports branch search and cursor pagination. The limit is an upper bound. GitLab returns at most 100 items per page. Follow nextCursor even when a page has fewer items than the requested limit. A saved environment is not required. Invalid credentials and inaccessible repositories return errors, not empty lists. If a response is too large, restart the list with a smaller limit and no cursor.
x-required-scope: gitConnection:discover
parameters:
  - $ref: ../../../../shared/spec/parameters/limit.yml
  - $ref: ../../../../shared/spec/parameters/cursor.yml
  - schema:
      type: string
    required: true
    description: The ID of the promotion provider.
    name: promotionProviderId
    in: path
  - schema:
      type: string
      minLength: 1
      maxLength: 256
    required: true
    description: The URL-encoded fullPath of the repository. A GitLab project ID is also accepted.
    name: repositoryId
    in: path
  - schema:
      type: string
      maxLength: 255
    required: false
    name: search
    in: query
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  isDefault:
                    type: boolean
                required:
                  - name
                  - isDefault
            nextCursor:
              type: string
              nullable: true
          required:
            - data
            - nextCursor
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
