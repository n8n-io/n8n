operationId: continueApplyProjectSelection
tags:
  - Promotions
summary: 'Beta: Continue applying a selection after binding setup'
description: |-
  **Beta** — breaking changes may still occur without major version bump.

  Rechecks the project's Apply source and the current bindings for the selection. Resend the full selection: workflowIds and folderIds. Send the required expectedSource with the environmentId, branchName, and full commitSha from the reviewed Apply result. Optionally send expectedPreviewRevision with the revision of the reviewed Apply preview. Send `confirmDestructiveChanges: true` to also apply destructive data table changes. Send `confirmMissingDependencies: true` to continue without the entries of `check.missingDependencies` that have `blocking: false`. Without it, an Apply that has such an entry returns `blocked` and changes nothing. An entry with `blocking: true` stops the Apply with or without the confirmation. Apply never creates a credential of another project. The workflow keeps its reference to the credential, and the credential stays missing. The two confirmations are independent. With expectedPreviewRevision, they cover only what the reviewed preview showed. The server does not keep a session. Status `source-changed` or `preview-changed` requires a new Apply review. Status `blocked` returns every blocker again, before import writes. Status `applied` includes counts, warnings and `missingDependencies`: the confirmed entries, which are still missing on this instance. Inspect status before reading counts. Unselected content stays unchanged. Requires the same Apply environment and permissions as the initial selection apply. The importer checks user write permissions. Another operation on the same environment returns 423.

  Requires the `promotions:apply` API key scope.
x-required-scope: promotions:apply
parameters:
  - $ref: ../../../../shared/spec/parameters/idempotencyKey.yml
  - schema:
      type: string
    required: true
    description: The ID of the project.
    name: projectId
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          workflowIds:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 36
          folderIds:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 36
            description: Folders of the project on the branch. Apply creates a selected folder, or moves and renames it to match the branch.
          expectedSource:
            type: object
            properties:
              environmentId:
                type: string
                minLength: 1
                maxLength: 36
              branchName:
                type: string
                minLength: 1
              commitSha:
                type: string
                pattern: ^[0-9a-f]{40}([0-9a-f]{24})?$
            required:
              - environmentId
              - branchName
              - commitSha
            additionalProperties: false
          expectedPreviewRevision:
            type: string
            pattern: ^[0-9a-f]{64}$
            description: The `revision` of the reviewed preview. The operation builds the preview again. When it differs, the operation returns status `preview-changed` and changes nothing.
          confirmDestructiveChanges:
            type: boolean
            description: 'Also applies destructive data table changes, which a `destructive-change` conflict reports: removed or retyped columns. The values in those columns are removed. Rows and other columns are kept. On a full apply, also deletes the team projects that a `project-deletion` conflict reports, with everything in them. Without `expectedPreviewRevision`, the confirmation covers every such change and deletion when Continue runs, including those that are not in the reviewed result.'
          confirmMissingDependencies:
            type: boolean
            description: Confirms the `missingDependencies` that the preview reports, so that the operation continues without them. Without this confirmation, an operation that has missing dependencies changes nothing and returns them. Send it with `expectedPreviewRevision` to confirm exactly the list of the reviewed preview. Without `expectedPreviewRevision`, the confirmation covers every missing dependency when the operation runs.
        required:
          - expectedSource
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/applyPackageResultDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    $ref: ../../../../shared/spec/responses/unprocessableEntity.yml
  '423':
    $ref: ../../../../shared/spec/responses/locked.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
