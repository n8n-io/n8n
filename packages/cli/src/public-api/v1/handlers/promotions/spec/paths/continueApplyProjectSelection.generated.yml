operationId: continueApplyProjectSelection
tags:
  - Promotions
summary: Continue applying a selection after binding setup
description: "Rechecks the project's Apply source and the current bindings for the selection. Resend the full selection in workflowIds. Send the required expectedSource with the environmentId, branchName, and full commitSha from the reviewed Apply result. Send `confirmDestructiveChanges: true` to also apply destructive data table changes. The server does not keep a session. Status `source-changed` requires a new Apply review. Status `blocked` returns fresh binding details before import writes. Status `applied` includes counts and warnings. Inspect status before reading counts. Unselected content stays unchanged. Requires the same connected Apply environment and permissions as the initial selection apply. The API key needs the promotions:apply scope. The importer checks user write permissions."
x-required-scope: promotions:apply
parameters:
  - $ref: ../../../../shared/spec/parameters/idempotencyKey.yml
  - schema:
      type: string
    required: true
    description: The ID of the project.
    name: projectId
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          workflowIds:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 36
            minItems: 1
          expectedSource:
            type: object
            properties:
              environmentId:
                type: string
                minLength: 1
                maxLength: 36
              branchName:
                type: string
                minLength: 1
              commitSha:
                type: string
                pattern: ^[0-9a-f]{40}([0-9a-f]{24})?$
            required:
              - environmentId
              - branchName
              - commitSha
            additionalProperties: false
          confirmDestructiveChanges:
            type: boolean
            description: 'Also applies destructive data table changes, which a `destructive-change` conflict reports: removed or retyped columns. The values in those columns are removed. Rows and other columns are kept. On a full apply, also deletes the team projects that a `project-deletion` conflict reports, with everything in them. The confirmation covers every such change and deletion when Continue runs, including those that are not in the reviewed result.'
        required:
          - workflowIds
          - expectedSource
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/applyPackageResultDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    $ref: ../../../../shared/spec/responses/unprocessableEntity.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
