operationId: getInstanceApplyChanges
tags:
  - Promotions
summary: 'Beta: Preview the Apply of the whole instance'
description: |-
  **Beta** — breaking changes may still occur without major version bump.

  Shows what applying the branch tip of an instance Apply environment changes on this instance, for every project of the package. `resources` and `dependencies` have the same shape as the project change preview. Resources are not selectable: Apply applies the whole package. A team project that the package does not hold is listed as `deleted`, with the folders, workflows, credentials, data tables and variables that it owns. Workflows and folders that a kept project no longer holds are listed as `deleted` too. `check` lists what blocks the Apply. A `project-deletion` conflict needs `confirmDestructiveChanges` on Continue. Send `revision` as expectedPreviewRevision and `commitSha` in expectedSource to apply only what this preview shows. Requires a connected Apply environment with instance scope.

  Requires the `promotions:apply` API key scope.
x-required-scope: promotions:apply
parameters:
  - schema:
      type: string
      format: uuid
    required: true
    description: The ID of the promotion environment.
    name: promotionEnvironmentId
    in: path
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            commitSha:
              type: string
            source:
              type: object
              properties:
                environmentId:
                  type: string
                  minLength: 1
                  maxLength: 36
                branchName:
                  type: string
              required:
                - environmentId
                - branchName
            resources:
              type: array
              items:
                $ref: ../../../../shared/spec/schemas/promotionResource.generated.yml
            dependencies:
              type: array
              items:
                type: object
                properties:
                  workflowKey:
                    type: string
                  resourceKey:
                    type: string
                  included:
                    type: boolean
                    description: Whether selecting the workflow also sends the resource. `false` for sub-workflows, which need their own selection.
                required:
                  - workflowKey
                  - resourceKey
                  - included
            check:
              allOf:
                - $ref: ../../../../shared/spec/schemas/promotionApplyCheck.generated.yml
                - type: object
                  properties:
                    movedWorkflows:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          project:
                            type: object
                            properties:
                              id:
                                type: string
                                minLength: 1
                              name:
                                type: string
                            required:
                              - id
                              - name
                          projectExists:
                            type: boolean
                          instanceProject:
                            type: object
                            properties:
                              id:
                                type: string
                                minLength: 1
                              name:
                                type: string
                            required:
                              - id
                        required:
                          - id
                          - name
                          - project
                          - projectExists
                          - instanceProject
                    movedFolders:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          project:
                            type: object
                            properties:
                              id:
                                type: string
                                minLength: 1
                              name:
                                type: string
                            required:
                              - id
                              - name
                          projectExists:
                            type: boolean
                          instanceProject:
                            type: object
                            properties:
                              id:
                                type: string
                                minLength: 1
                              name:
                                type: string
                            required:
                              - id
                        required:
                          - id
                          - name
                          - project
                          - projectExists
                          - instanceProject
                  required:
                    - movedWorkflows
                    - movedFolders
            revision:
              type: string
              description: Send it as `expectedPreviewRevision` to apply only when this instance still matches the preview.
          required:
            - commitSha
            - source
            - resources
            - dependencies
            - check
            - revision
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
