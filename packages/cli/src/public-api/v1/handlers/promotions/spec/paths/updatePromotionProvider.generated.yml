operationId: updatePromotionProvider
tags:
  - Promotions
summary: Update a promotion provider
description: Renames the provider, and replaces its credentials when `auth` is sent. A Git host provider can also update its base URL. A different API destination requires `auth` in the same request. Changed credentials and host settings are validated before they save. If another request changes the credentials or configuration before this update saves, the update returns 409. Reload the provider and try again. For GitLab, the service uses n8n as the Git transport username. Its auth.username is optional. The service ignores any supplied username. Plain Git token authentication requires auth.username. New credentials apply to every environment that uses this provider. The authentication method cannot change.
x-required-scope: gitConnection:update
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the promotion provider.
    name: promotionProviderId
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 128
          auth:
            oneOf:
              - type: object
                properties:
                  authType:
                    type: string
                    enum:
                      - ssh-key
                  keyType:
                    type: string
                    enum:
                      - ed25519
                      - rsa
                required:
                  - authType
                additionalProperties: false
              - type: object
                properties:
                  authType:
                    type: string
                    enum:
                      - token
                  username:
                    type: string
                    minLength: 1
                    description: Required for plain Git token authentication. For GitLab, the service ignores this field and uses n8n for Git transport.
                  password:
                    type: string
                    minLength: 1
                required:
                  - authType
                  - password
                additionalProperties: false
            type: object
          config:
            type: object
            properties:
              schemaVersion:
                type: number
                enum:
                  - 1
              baseUrl:
                type: string
            required:
              - schemaVersion
              - baseUrl
            additionalProperties: false
        additionalProperties: false
        minProperties: 1
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/promotionProviderPublicDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
