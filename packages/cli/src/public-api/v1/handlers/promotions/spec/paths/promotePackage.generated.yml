operationId: promotePackage
tags:
  - Promotions
summary: Promote all team projects
description: Exports every team project, commits it, and pushes to the configured base branch or a new timestamped branch. The response reports the target branch in `git.branchName`. Personal projects are ignored. Requires the Promote direction to be cloned first, and is available on the instance connection only. The API key also needs variable:list when the workflows reference variables.
x-required-scope: gitConnection:push
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the promotion connection.
    name: promotionConnectionId
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          commitMessage:
            type: string
            minLength: 1
            maxLength: 1000
          force:
            type: boolean
        required:
          - commitMessage
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/promotePackageResultDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
