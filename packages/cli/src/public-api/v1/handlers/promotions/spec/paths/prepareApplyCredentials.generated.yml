operationId: prepareApplyCredentials
tags:
  - Promotions
summary: 'Prototype: Create the missing credentials of an Apply from the branch'
description: |-
  **Beta** — breaking changes may still occur without major version bump.

  Prototype. Creates each listed credential that this instance lacks, with the name, type, description, expression values and sharing on the branch, and the saved draft values.

  Requires the `promotions:apply` API key scope.
x-required-scope: promotions:apply
parameters:
  - $ref: ../../../../shared/spec/parameters/idempotencyKey.yml
  - schema:
      type: string
    required: true
    description: The ID of the project.
    name: projectId
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          credentialIds:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 36
            maxItems: 500
        required:
          - credentialIds
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            credentials:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  type:
                    type: string
                  ownerProjectId:
                    type: string
                  created:
                    type: boolean
                  needsValues:
                    type: boolean
                  sharedWith:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                      required:
                        - id
                        - name
                  notShared:
                    type: array
                    items:
                      type: string
                required:
                  - id
                  - name
                  - type
                  - ownerProjectId
                  - created
                  - needsValues
                  - sharedWith
                  - notShared
          required:
            - credentials
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    $ref: ../../../../shared/spec/responses/unprocessableEntity.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
