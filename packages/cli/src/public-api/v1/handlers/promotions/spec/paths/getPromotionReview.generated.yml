operationId: getPromotionReview
tags:
  - Promotions
summary: Retrieve a promotion review
description: Returns the review with the configuration and branch of its newest promotion, and the merge request head commit from the Git host. remote and headCommitSha are null when the Git host did not answer, and remoteError gives the reason.
x-required-scope: gitConnection:readReviews
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the promotion review.
    name: promotionReviewId
    in: path
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 36
            state:
              type: string
              enum:
                - open
                - changes_requested
                - merged
                - closed
            remoteReviewId:
              type: string
              nullable: true
            connection:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 36
                name:
                  type: string
              required:
                - id
                - name
            createdBy:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                firstName:
                  type: string
                  nullable: true
                lastName:
                  type: string
                  nullable: true
                email:
                  type: string
                  nullable: true
              required:
                - id
                - firstName
                - lastName
                - email
            approvedBy:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                firstName:
                  type: string
                  nullable: true
                lastName:
                  type: string
                  nullable: true
                email:
                  type: string
                  nullable: true
              required:
                - id
                - firstName
                - lastName
                - email
            createdAt:
              type: string
              format: date-time
            approvedAt:
              type: string
              nullable: true
              format: date-time
            lastStateChangeAt:
              type: string
              nullable: true
              format: date-time
            remote:
              type: object
              nullable: true
              properties:
                title:
                  type: string
                webUrl:
                  type: string
                hasConflicts:
                  type: boolean
              required:
                - title
                - webUrl
                - hasConflicts
            remoteError:
              type: string
              nullable: true
              enum:
                - not_found
                - auth
                - unreachable
                - no_connection
            config:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 36
                name:
                  type: string
              required:
                - id
                - name
            branchName:
              type: string
              nullable: true
            headCommitSha:
              type: string
              nullable: true
          required:
            - id
            - state
            - remoteReviewId
            - connection
            - createdBy
            - approvedBy
            - createdAt
            - approvedAt
            - lastStateChangeAt
            - remote
            - remoteError
            - config
            - branchName
            - headCommitSha
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
