operationId: applyPackage
tags:
  - Promotions
summary: 'Beta: Apply a package to the instance'
description: |-
  **Beta** — breaking changes may still occur without major version bump.

  Checks the full package at the configured branch tip. Optionally send expectedSource with the environmentId, branchName, and full commitSha from the reviewed change preview; status `source-changed` means the branch moved since that review and nothing was imported. Optionally send expectedPreviewRevision with the `revision` of the reviewed preview; status `preview-changed` means this instance changed since that review and nothing was imported. Returns status `blocked` before import writes if bindings need setup, if the import conflicts with this instance, if the apply would delete team projects that the package does not hold, or if a dependency is missing: an entry of `check.missingDependencies` with `blocking: true`, or an entry with `blocking: false` that Continue did not confirm. `check.missingDependencies` lists every credential, variable, sub-workflow and error workflow that the applied workflows use and that is not usable on this instance after the Apply. The group `needs-action` holds what you can resolve, and the group `outside-access` holds what is in a project that you cannot access, or what the branch does not hold in a project (reason `not-on-branch`). Resolve an entry with `blocking: true` before you apply again. To apply without an entry with `blocking: false`, send `confirmMissingDependencies: true` with Continue. Apply never creates a credential of another project. The workflow keeps its reference to the credential. `check.warnings` also lists the references that were already broken on the source instance, which need no confirmation. Retain environmentId and git for Continue. Status `applied` includes counts, warnings and `missingDependencies`: the confirmed entries, which are still missing on this instance. Inspect status before reading counts. Existing target variable values, including empty strings, are preserved. Workflows and folders move within their project to match the branch, and folders take the name on the branch. Apply cannot move a workflow or folder between projects. It returns a `moved` conflict in `blocked` with both projects. For a personal project, the conflict gives only the ID. Requires an Apply environment with instance scope. The importer checks user write permissions; granular API-key write scopes are not passed to it. Another operation on the same environment returns 423.

  Requires the `promotions:apply` API key scope.
x-required-scope: promotions:apply
parameters:
  - $ref: ../../../../shared/spec/parameters/idempotencyKey.yml
  - schema:
      type: string
      format: uuid
    required: true
    description: The ID of the promotion environment.
    name: promotionEnvironmentId
    in: path
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          expectedSource:
            type: object
            properties:
              environmentId:
                type: string
                minLength: 1
                maxLength: 36
              branchName:
                type: string
                minLength: 1
              commitSha:
                type: string
                pattern: ^[0-9a-f]{40}([0-9a-f]{24})?$
            required:
              - environmentId
              - branchName
              - commitSha
            additionalProperties: false
          expectedPreviewRevision:
            type: string
            pattern: ^[0-9a-f]{64}$
            description: The `revision` of the reviewed preview. The operation builds the preview again. When it differs, the operation returns status `preview-changed` and changes nothing.
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/applyPackageResultDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    $ref: ../../../../shared/spec/responses/unprocessableEntity.yml
  '423':
    $ref: ../../../../shared/spec/responses/locked.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
