operationId: applyPackage
tags:
  - Promotions
summary: Apply a package to the instance
description: Checks the full package at the configured branch tip. Optionally send expectedSource with the configId, branchName, and full commitSha from the reviewed change preview; status `source-changed` means the branch moved since that review and nothing was imported. Returns status `blocked` before import writes if bindings need setup. Retain configId and git for Continue. Status `applied` includes counts and warnings. Inspect status before reading counts. Existing target variable values, including empty strings, are preserved. Requires a cloned Apply direction on an instance connection. The API key needs the gitConnection:pull scope. The importer checks user write permissions; granular API-key write scopes are not passed to it.
x-required-scope: gitConnection:pull
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the promotion connection.
    name: promotionConnectionId
    in: path
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          expectedSource:
            type: object
            properties:
              configId:
                type: string
                minLength: 1
                maxLength: 36
              branchName:
                type: string
                minLength: 1
              commitSha:
                type: string
                pattern: ^[0-9a-f]{40}([0-9a-f]{24})?$
            required:
              - configId
              - branchName
              - commitSha
            additionalProperties: false
          selectedProjectId:
            type: string
            minLength: 1
            maxLength: 36
          selectedWorkflowIds:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 36
          deletedWorkflowIds:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 36
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/applyPackageResultDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    $ref: ../../../../shared/spec/responses/unprocessableEntity.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
