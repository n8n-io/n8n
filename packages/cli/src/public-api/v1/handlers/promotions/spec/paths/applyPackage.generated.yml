operationId: applyPackage
tags:
  - Promotions
summary: 'Beta: Apply a package to the instance'
description: |-
  **Beta** — breaking changes may still occur without major version bump.

  Checks the full package at the configured branch tip. Optionally send expectedSource with the environmentId, branchName, and full commitSha from the reviewed change preview; status `source-changed` means the branch moved since that review and nothing was imported. Optionally send expectedPreviewRevision with the `revision` of the reviewed preview; status `preview-changed` means this instance changed since that review and nothing was imported. Returns status `blocked` before import writes if bindings need setup, if the import conflicts with this instance, or if the apply would delete team projects that the package does not hold. Retain environmentId and git for Continue. Status `applied` includes counts and warnings. Inspect status before reading counts. Existing target variable values, including empty strings, are preserved. Workflows and folders move within their project to match the branch, and folders take the name on the branch. Apply cannot move a workflow or folder between projects. It returns a `moved` conflict in `blocked` with both projects. For a personal project, the conflict gives only the ID. Requires a connected Apply environment with instance scope. The importer checks user write permissions; granular API-key write scopes are not passed to it. Another operation on the same environment returns 423. The Apply checks each static reference of an applied workflow against the state after the Apply. `dependencyReport` holds the result. Status `gaps-changed` means that the Apply stopped before any write: the environment is strict and the report has gaps, the gaps differ from `confirmedGapIds`, the report has a hard block, or the Apply deletes a workflow that other workflows call and `confirmDeletionCallers` is not set. On an environment that allows incomplete applies, send the `id` of each gap in `confirmedGapIds`: a credential that this instance does not hold then gets an empty placeholder credential, and other references stay unresolved. `grants` lists the credential access that a project of the Apply needs. Send the `id` of each grant that you accept in `confirmedGrantIds`; the key needs the credential:update scope. A confirmed grant is given at once and stays when the Apply then stops. A grant that is not confirmed gives status `blocked` with the credential in `accessRequirements`. `credentialHomeChoices` lists each credential that the branch holds without an owner: status `blocked` reports it as `unknown-owner` until `credentialHomes` names its project. A credential that the Apply writes for its owner project moves to that project when the user may move it, and every project keeps its access. The `applied` result lists `placeholders`, `grants`, `credentialMoves`, `keptWorkflows`, `keptProjects` and `dependencyMessages`. Apply never publishes and never unpublishes a workflow. A client must treat a gap `group` that it does not know as a blocker.

  Requires the `promotions:apply` API key scope.
x-required-scope: promotions:apply
parameters:
  - $ref: ../../../../shared/spec/parameters/idempotencyKey.yml
  - schema:
      type: string
      format: uuid
    required: true
    description: The ID of the promotion environment.
    name: promotionEnvironmentId
    in: path
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          expectedSource:
            type: object
            properties:
              environmentId:
                type: string
                minLength: 1
                maxLength: 36
              branchName:
                type: string
                minLength: 1
              commitSha:
                type: string
                pattern: ^[0-9a-f]{40}([0-9a-f]{24})?$
            required:
              - environmentId
              - branchName
              - commitSha
            additionalProperties: false
          expectedPreviewRevision:
            type: string
            pattern: ^[0-9a-f]{64}$
            description: The `revision` of the reviewed preview. The operation builds the preview again. When it differs, the operation returns status `preview-changed` and changes nothing.
          confirmedGapIds:
            type: array
            items:
              type: string
              minLength: 1
            description: The `id` of each gap that the user accepts, from the dependency report of the preview. Needs an environment that allows incomplete operations. When the list differs from the current gaps, the operation returns status `gaps-changed` and changes nothing.
          confirmedGrantIds:
            type: array
            items:
              type: string
              minLength: 1
            description: The `id` of each credential grant that the user accepts, from the report.
          confirmDeletionCallers:
            type: boolean
            description: Accepts that the Apply deletes workflows that other workflows on this instance call.
          credentialHomes:
            type: object
            additionalProperties:
              type: string
              minLength: 1
              maxLength: 36
            description: The project that gets each credential that the branch holds without an owner, by credential id.
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/applyPackageResultDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    $ref: ../../../../shared/spec/responses/unprocessableEntity.yml
  '423':
    $ref: ../../../../shared/spec/responses/locked.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
