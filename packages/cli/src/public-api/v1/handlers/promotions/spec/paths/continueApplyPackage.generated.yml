operationId: continueApplyPackage
tags:
  - Promotions
summary: 'Beta: Continue Apply after binding setup'
description: |-
  **Beta** — breaking changes may still occur without major version bump.

  Rechecks the configured source and current target bindings. Send expectedSource with the environmentId, branchName, and full commitSha from the reviewed Apply result. Send `confirmDestructiveChanges: true` to also apply destructive data table changes and delete the reported team projects. Send expectedPreviewRevision to confirm only what the reviewed preview showed. Status `source-changed` or `preview-changed` requires a new Apply review. Status `blocked` returns every blocker again, without import writes. Status `applied` includes counts and warnings. Inspect status before reading counts. Existing target variable values are preserved. Requires the same connected instance environment and permissions as Apply. The importer checks user write permissions; granular API-key write scopes are not passed to it. No server session or exactly-once guarantee is provided. Another operation on the same environment returns 423. The Apply checks each static reference of an applied workflow against the state after the Apply. `dependencyReport` holds the result. Status `gaps-changed` means that the Apply stopped before any write: the gaps differ from `confirmedGapIds`, the report has a hard block, or the Apply deletes a workflow that other workflows call and the request does not accept the callers: send the `id` of each `deletionCallers` row in `confirmedDeletionCallerIds` (the Apply stops when the rows changed), or set `confirmDeletionCallers` to accept every caller. An Apply can continue with gaps: send the `id` of each gap in `confirmedGapIds`. A credential that this instance does not hold then gets an empty credential, and other references stay unresolved. `grants` lists the credential access that a project of the Apply needs. Send the `id` of each grant that you accept in `confirmedGrantIds`; the key needs the credential:update scope. A confirmed grant is given at once and stays when the Apply then stops. A grant that is not confirmed gives status `blocked` with the credential in `accessRequirements`. `credentialHomeChoices` lists each credential that the branch holds without an owner: status `blocked` reports it as `unknown-owner` until `credentialHomes` names its project. A credential that the Apply writes for its owner project moves to that project when the user may move it, and every project keeps its access. The `applied` result lists `createdEmptyCredentials`, `grants`, `credentialMoves`, `keptWorkflows`, `keptProjects`, `liveWorkflowsWithEmptyCredential` and `dependencyMessages`. `resourceWarnings` of the report lists each data table and project variable of another project that a workflow uses: Apply does not copy it and continues. Apply never publishes and never unpublishes a workflow. A client must treat a gap `group` that it does not know as a blocker.

  Requires the `promotions:apply` API key scope.
x-required-scope: promotions:apply
parameters:
  - $ref: ../../../../shared/spec/parameters/idempotencyKey.yml
  - schema:
      type: string
      format: uuid
    required: true
    description: The ID of the promotion environment.
    name: promotionEnvironmentId
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          expectedSource:
            type: object
            properties:
              environmentId:
                type: string
                minLength: 1
                maxLength: 36
              branchName:
                type: string
                minLength: 1
              commitSha:
                type: string
                pattern: ^[0-9a-f]{40}([0-9a-f]{24})?$
            required:
              - environmentId
              - branchName
              - commitSha
            additionalProperties: false
          expectedPreviewRevision:
            type: string
            pattern: ^[0-9a-f]{64}$
            description: The `revision` of the reviewed preview. The operation builds the preview again. When it differs, the operation returns status `preview-changed` and changes nothing.
          confirmDestructiveChanges:
            type: boolean
            description: 'Also applies destructive data table changes, which a `destructive-change` conflict reports: removed or retyped columns. The values in those columns are removed. Rows and other columns are kept. On a full apply, also deletes the team projects that a `project-deletion` conflict reports, with everything in them. On an apply of an environment, also moves the workflows and folders that `plannedMoves` reports with `needsConfirmation`: they leave a project that the branch does not hold. Without `expectedPreviewRevision`, the confirmation covers every such change and deletion when Continue runs, including those that are not in the reviewed result.'
          confirmedGapIds:
            type: array
            items:
              type: string
              minLength: 1
            description: The `id` of each gap that the user accepts, from the dependency report of the preview. An operation with gaps needs it. When the list differs from the current gaps, the operation returns status `gaps-changed` and changes nothing.
          confirmedGrantIds:
            type: array
            items:
              type: string
              minLength: 1
            description: The `id` of each credential grant that the user accepts, from the report.
          confirmDeletionCallers:
            type: boolean
            description: Accepts that the Apply deletes workflows that other workflows on this instance call. It accepts every caller, also one that the reviewed report did not list. Prefer `confirmedDeletionCallerIds`.
          confirmedDeletionCallerIds:
            type: array
            items:
              type: string
              minLength: 1
            description: The `id` of each `deletionCallers` row that the user accepts, from the dependency report. When the list differs from the current rows, the Apply returns status `gaps-changed` and changes nothing.
          credentialHomes:
            type: object
            additionalProperties:
              type: string
              minLength: 1
              maxLength: 36
            description: The project that gets each credential that the branch holds without an owner, by credential id.
        required:
          - expectedSource
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/applyPackageResultDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    $ref: ../../../../shared/spec/responses/unprocessableEntity.yml
  '423':
    $ref: ../../../../shared/spec/responses/locked.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
