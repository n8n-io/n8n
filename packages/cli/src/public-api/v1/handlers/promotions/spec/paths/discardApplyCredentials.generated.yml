operationId: discardApplyCredentials
tags:
  - Promotions
summary: 'Prototype: Delete the credentials that an aborted Apply created'
description: |-
  **Beta** — breaking changes may still occur without major version bump.

  Prototype. Deletes the listed credentials that the prepare route created.

  Requires the `promotions:apply` API key scope.
x-required-scope: promotions:apply
parameters:
  - $ref: ../../../../shared/spec/parameters/idempotencyKey.yml
  - schema:
      type: string
    required: true
    description: The ID of the project.
    name: projectId
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          credentialIds:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 36
            maxItems: 500
        required:
          - credentialIds
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            deleted:
              type: array
              items:
                type: string
          required:
            - deleted
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    $ref: ../../../../shared/spec/responses/unprocessableEntity.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
