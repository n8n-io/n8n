operationId: getPromotionReviews
tags:
  - Promotions
summary: 'Beta: List promotion reviews'
description: |-
  **Beta** — breaking changes may still occur without major version bump.

  Returns the promotion reviews that the Inbox of the key owner shows. Instance owners and admins see all reviews. `state` selects the open or the closed reviews, as the Inbox tabs do. The list starts with the newest activity. The first page reads all open reviews from the Git host and records their new states. The next pages read only their own reviews and record no state, so paging does not move a review. An approval or a close between two pages can still move a review. `title`, `webUrl`, `headCommitSha` and `hasConflicts` come from the Git host. `remoteError` tells why they are missing. Returns 403 when the instance does not use promotion reviews.

  Requires the `promotions:readReviews` API key scope.
x-required-scope: promotions:readReviews
parameters:
  - $ref: ../../../../shared/spec/parameters/limit.yml
  - $ref: ../../../../shared/spec/parameters/cursor.yml
  - schema:
      type: string
      enum:
        - open
        - closed
      default: open
    required: false
    name: state
    in: query
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  state:
                    type: string
                    enum:
                      - open
                      - closed
                    description: The Inbox tab of the review. `closed` covers the merged and the closed reviews.
                  reviewState:
                    type: string
                    enum:
                      - open
                      - changes_requested
                      - merged
                      - closed
                    description: The state of the review. `open` and `changes_requested` come from the Git host. `merged` and `closed` are final.
                  reviewType:
                    type: string
                    enum:
                      - gitlab
                  title:
                    type: string
                    nullable: true
                  webUrl:
                    type: string
                    nullable: true
                  branchName:
                    type: string
                    nullable: true
                  environmentName:
                    type: string
                    nullable: true
                  requester:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                      firstName:
                        type: string
                        nullable: true
                      lastName:
                        type: string
                        nullable: true
                      email:
                        type: string
                        nullable: true
                    required:
                      - id
                      - firstName
                      - lastName
                      - email
                  approver:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                      firstName:
                        type: string
                        nullable: true
                      lastName:
                        type: string
                        nullable: true
                      email:
                        type: string
                        nullable: true
                    required:
                      - id
                      - firstName
                      - lastName
                      - email
                  remoteError:
                    type: string
                    nullable: true
                    enum:
                      - not_found
                      - auth
                      - unreachable
                      - no_connection
                    description: Why the Git host data is missing. Then `title`, `webUrl` and `headCommitSha` are NULL, and `hasConflicts` is false without a check. NULL when the Git host answered.
                  headCommitSha:
                    type: string
                    nullable: true
                    description: The head of the merge request on the Git host. It differs from `runCommitSha` after a push on the Git host.
                  runCommitSha:
                    type: string
                    nullable: true
                    description: The commit that n8n pushed in the newest promotion.
                  hasConflicts:
                    type: boolean
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                required:
                  - id
                  - state
                  - reviewState
                  - reviewType
                  - title
                  - webUrl
                  - branchName
                  - environmentName
                  - requester
                  - approver
                  - remoteError
                  - headCommitSha
                  - runCommitSha
                  - hasConflicts
                  - createdAt
                  - updatedAt
            nextCursor:
              type: string
              nullable: true
          required:
            - data
            - nextCursor
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
