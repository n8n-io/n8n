operationId: removeProjectFromPromotionEnvironment
tags:
  - Promotions
summary: Unlink a project from a promotion environment
x-required-scope: gitConnection:manageProjects
parameters:
  - schema:
      type: string
      format: uuid
    required: true
    description: The ID of the promotion environment.
    name: promotionEnvironmentId
    in: path
  - schema:
      type: string
    required: true
    description: The ID of the project.
    name: projectId
    in: path
responses:
  '204':
    description: Operation successful.
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
