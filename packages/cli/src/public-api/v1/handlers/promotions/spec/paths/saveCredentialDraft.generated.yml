operationId: saveCredentialDraft
tags:
  - Promotions
summary: 'Prototype: Save the values of a branch credential'
description: |-
  **Beta** — breaking changes may still occur without major version bump.

  Prototype. Saves the values, encrypted, until an Apply uses them.

  Requires the `promotions:apply` API key scope.
x-required-scope: promotions:apply
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the project.
    name: projectId
    in: path
  - schema:
      type: string
    required: true
    description: The ID of the project.
    name: sourceId
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 128
          data:
            type: object
            additionalProperties: {}
        required:
          - name
          - data
        additionalProperties: false
responses:
