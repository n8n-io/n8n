operationId: getPromotionProviderRepositories
tags:
  - Promotions
summary: List the repositories of a promotion provider
description: Returns a cursor-paginated list of the repositories that the provider credentials can reach on its Git host. Only a Git host provider, such as GitLab, has this list. Use a `remoteUrl` as the target of a connection.
x-required-scope: gitConnection:read
parameters:
  - $ref: ../../../../shared/spec/parameters/limit.yml
  - $ref: ../../../../shared/spec/parameters/cursor.yml
  - schema:
      type: string
    required: true
    description: The ID of the promotion provider.
    name: promotionProviderId
    in: path
  - schema:
      type: string
      maxLength: 255
    required: false
    name: search
    in: query
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  fullPath:
                    type: string
                  remoteUrl:
                    type: string
                required:
                  - id
                  - fullPath
                  - remoteUrl
            nextCursor:
              type: string
              nullable: true
          required:
            - data
            - nextCursor
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
