operationId: getPromotionProviderRepositories
tags:
  - Promotions
summary: List repositories of a promotion provider
description: Lists repositories accessible to the GitLab token, including repositories where its identity is not a member. Use remoteUrl as a connection target. Supports repository and namespace search and cursor pagination, with at most 50 items per page. A saved connection is not required. Invalid credentials return an error, not an empty list. If a response is too large, restart the list with a smaller limit and no cursor.
x-required-scope: gitConnection:read
parameters:
  - $ref: ../../../../shared/spec/parameters/limit.yml
  - $ref: ../../../../shared/spec/parameters/cursor.yml
  - schema:
      type: string
    required: true
    description: The ID of the promotion provider.
    name: promotionProviderId
    in: path
  - schema:
      type: string
      maxLength: 255
    required: false
    name: search
    in: query
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  fullPath:
                    type: string
                  remoteUrl:
                    type: string
                  defaultBranch:
                    type: string
                    nullable: true
                required:
                  - id
                  - name
                  - fullPath
                  - remoteUrl
                  - defaultBranch
            nextCursor:
              type: string
              nullable: true
          required:
            - data
            - nextCursor
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
