operationId: getPromotionEnvironments
tags:
  - Promotions
summary: List promotion environments
description: Returns a cursor-paginated list of environments. Filter by `scope` and `direction` for the instance environments, or by `providerId` to see which environments a provider edit affects.
x-required-scope: promotions:list
parameters:
  - $ref: ../../../../shared/spec/parameters/limit.yml
  - $ref: ../../../../shared/spec/parameters/cursor.yml
  - schema:
      type: string
      enum:
        - instance
        - projects
    required: false
    name: scope
    in: query
  - schema:
      type: string
      enum:
        - apply
        - promote
    required: false
    name: direction
    in: query
  - schema:
      type: string
      minLength: 1
      maxLength: 36
    required: false
    name: providerId
    in: query
