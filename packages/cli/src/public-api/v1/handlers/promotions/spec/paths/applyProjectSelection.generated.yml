operationId: applyProjectSelection
tags:
  - Promotions
summary: "Beta: Apply a selection of a project's workflows and folders"
description: |-
  **Beta** — breaking changes may still occur without major version bump.

  Applies selected changes from the project's Apply branch. The project's name, icon, description and telemetry tags always come from the branch, so a request without workflowIds and folderIds applies only the project. Send `credentialIds` to select the credentials of the project on the branch that Apply writes. Without it, Apply writes each credential of the project on the branch that this instance already holds: it moves the credential to the project when another project owns it here, and updates its name and expression values. The server imports the selected workflow IDs present on the branch for this project. It removes a selected workflow owned by this project when the branch does not hold it. Duplicate or invalid IDs reject the whole request. Unselected content stays unchanged. A selected workflow or folder is created, or moved within the project to match the branch, together with the folders above it, and those folders take the name on the branch; other folders stay as they are. Optionally send expectedSource with the environmentId, branchName, and full commitSha from the reviewed change preview. Status `source-changed` means the source changed since that review and nothing was imported. Optionally send expectedPreviewRevision with the revision of the reviewed Apply preview. Status `preview-changed` means this instance changed since that review and nothing was imported. Status `blocked` returns the blockers before import writes: bindings that need setup and conflicts with this instance. Apply cannot move a selected workflow or a folder of this project between projects. It returns a `moved` conflict in `blocked` with both projects. For a personal project, the conflict gives only the ID. Retain environmentId and git for Continue. Status `applied` includes counts and warnings. Inspect status before reading counts. Requires a connected Apply environment for the project: its own Apply environment, otherwise the instance Apply environment. The importer checks user write permissions. Another operation on the same environment returns 423. The Apply checks each static reference of an applied workflow against the state after the Apply. `dependencyReport` holds the result. Status `gaps-changed` means that the Apply stopped before any write: the gaps differ from `confirmedGapIds`, the report has a hard block, or the Apply deletes a workflow that other workflows call and the request does not accept the callers: send the `id` of each `deletionCallers` row in `confirmedDeletionCallerIds` (the Apply stops when the rows changed), or set `confirmDeletionCallers` to accept every caller. An Apply can continue with gaps: send the `id` of each gap in `confirmedGapIds`. A credential that this instance does not hold then gets an empty credential, and other references stay unresolved. `grants` lists the credential access that a project of the Apply needs. Send the `id` of each grant that you accept in `confirmedGrantIds`; the key needs the credential:update scope. A confirmed grant is given at once and stays when the Apply then stops. A grant that is not confirmed gives status `blocked` with the credential in `accessRequirements`. `credentialHomeChoices` lists each credential that the branch holds without an owner: status `blocked` reports it as `unknown-owner` until `credentialHomes` names its project. A credential that the Apply writes for its owner project moves to that project when the user may move it, and every project keeps its access. The `applied` result lists `empty credentials`, `grants`, `credentialMoves`, `keptWorkflows`, `keptProjects`, `liveWorkflowsWithEmptyCredential` and `dependencyMessages`. `resourceWarnings` of the report lists each data table and project variable of another project that a workflow uses: Apply does not copy it and continues. Apply never publishes and never unpublishes a workflow. A client must treat a gap `group` that it does not know as a blocker.

  Requires the `promotions:apply` API key scope.
x-required-scope: promotions:apply
parameters:
  - $ref: ../../../../shared/spec/parameters/idempotencyKey.yml
  - schema:
      type: string
    required: true
    description: The ID of the project.
    name: projectId
    in: path
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          workflowIds:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 36
          folderIds:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 36
            description: Folders of the project on the branch. Apply creates a selected folder, or moves and renames it to match the branch.
          credentialIds:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 36
            description: Credentials that the branch holds under the project. Apply updates a selected credential that this instance holds, moves it to the project when another project owns it here, and reports one that this instance lacks in `missingBindings`. When you leave it out, Apply writes each credential of the project on the branch that this instance already holds, and each credential that a selected workflow of the project uses. Send an empty list to write only the credentials that the selected workflows use.
          expectedSource:
            type: object
            properties:
              environmentId:
                type: string
                minLength: 1
                maxLength: 36
              branchName:
                type: string
                minLength: 1
              commitSha:
                type: string
                pattern: ^[0-9a-f]{40}([0-9a-f]{24})?$
            required:
              - environmentId
              - branchName
              - commitSha
            additionalProperties: false
          expectedPreviewRevision:
            type: string
            pattern: ^[0-9a-f]{64}$
            description: The `revision` of the reviewed preview. The operation builds the preview again. When it differs, the operation returns status `preview-changed` and changes nothing.
          confirmedGapIds:
            type: array
            items:
              type: string
              minLength: 1
            description: The `id` of each gap that the user accepts, from the dependency report of the preview. An operation with gaps needs it. When the list differs from the current gaps, the operation returns status `gaps-changed` and changes nothing.
          confirmedGrantIds:
            type: array
            items:
              type: string
              minLength: 1
            description: The `id` of each credential grant that the user accepts, from the report.
          confirmDeletionCallers:
            type: boolean
            description: Accepts that the Apply deletes workflows that other workflows on this instance call. It accepts every caller, also one that the reviewed report did not list. Prefer `confirmedDeletionCallerIds`.
          confirmedDeletionCallerIds:
            type: array
            items:
              type: string
              minLength: 1
            description: The `id` of each `deletionCallers` row that the user accepts, from the dependency report. When the list differs from the current rows, the Apply returns status `gaps-changed` and changes nothing.
          credentialHomes:
            type: object
            additionalProperties:
              type: string
              minLength: 1
              maxLength: 36
            description: The project that gets each credential that the branch holds without an owner, by credential id.
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/applyPackageResultDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '422':
    $ref: ../../../../shared/spec/responses/unprocessableEntity.yml
  '423':
    $ref: ../../../../shared/spec/responses/locked.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
