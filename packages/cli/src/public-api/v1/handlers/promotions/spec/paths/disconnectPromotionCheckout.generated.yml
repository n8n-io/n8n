description: Removes the local checkout and keeps the configuration, its credentials, and the trusted SSH host keys.
x-required-scope: gitConnection:clone
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the promotion connection.
    name: promotionConnectionId
    in: path
  - schema:
      type: string
    required: true
    description: 'The direction of the promotion: apply or promote.'
    name: direction
    in: path
responses:
