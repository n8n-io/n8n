operationId: addProjectToPromotionEnvironment
tags:
  - Promotions
summary: Link a project to a promotion environment
description: Links a team project to a project-scoped environment. A project can have one environment for each direction. A direction without a project environment uses the instance environment.
x-required-scope: gitConnection:manageProjects
parameters:
  - $ref: ../../../../shared/spec/parameters/idempotencyKey.yml
  - schema:
      type: string
      format: uuid
    required: true
    description: The ID of the promotion environment.
    name: promotionEnvironmentId
    in: path
  - schema:
      type: string
    required: true
    description: The ID of the project.
    name: projectId
    in: path
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            projectId:
              type: string
              minLength: 1
              maxLength: 36
            environmentId:
              type: string
              minLength: 1
              maxLength: 36
          required:
            - projectId
            - environmentId
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '422':
    $ref: ../../../../shared/spec/responses/unprocessableEntity.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
