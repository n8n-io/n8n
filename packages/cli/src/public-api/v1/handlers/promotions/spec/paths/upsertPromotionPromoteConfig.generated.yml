operationId: upsertPromotionPromoteConfig
tags:
  - Promotions
summary: Create or replace the Promote configuration
description: Replaces the whole configuration, so an omitted name resets it to "Promote" and `createBranchOnPromotion` is always required. Answers 200 whether it created or replaced.
x-required-scope: gitConnection:update
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    description: The ID of the promotion connection.
    name: id
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 128
          settings:
            type: object
            properties:
              schemaVersion:
                type: number
                enum:
                  - 1
              baseBranchName:
                type: string
                minLength: 1
                maxLength: 255
              createBranchOnPromotion:
                type: boolean
            required:
              - schemaVersion
              - baseBranchName
              - createBranchOnPromotion
            additionalProperties: false
        required:
          - settings
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            settings:
              type: object
              properties:
                schemaVersion:
                  type: number
                  enum:
                    - 1
                baseBranchName:
                  type: string
                  minLength: 1
                  maxLength: 255
                createBranchOnPromotion:
                  type: boolean
              required:
                - schemaVersion
                - baseBranchName
                - createBranchOnPromotion
              additionalProperties: false
          required:
            - id
            - name
            - createdAt
            - updatedAt
            - settings
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
