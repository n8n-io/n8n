type: object
additionalProperties: false
description: >
  The connection details to test against an OTLP collector. Fields managed declaratively via
  environment variables are overridden with their effective value before the test is sent.
required:
  - exporterEndpoint
  - exporterTracingPath
  - exporterServiceName
  - exporterHeaders
  - startupConnectivityTimeoutMs
properties:
  exporterProtocol:
    type: string
    enum:
      - http/protobuf
      - grpc
    default: http/protobuf
    description: >
      The wire protocol used to send the test span. Collectors conventionally serve OTLP/HTTP on
      port 4318 and OTLP/gRPC on port 4317. The endpoint scheme (`http://` or `https://`)
      controls TLS for both protocols. Optional: omitting it selects `http/protobuf`, unless an
      environment variable manages this field, which then supplies the value.
    example: http/protobuf
  exporterEndpoint:
    type: string
    format: uri
    description: >
      The base URL of the OTLP collector to export traces to. The value must be an `http://` or
      `https://` URL, because the scheme selects TLS — for gRPC, `https://` uses SSL and
      `http://` is plaintext.
    example: http://localhost:4318
  exporterTracingPath:
    type: string
    description: >
      The path appended to the endpoint for the OTLP traces signal. Ignored when
      `exporterProtocol` is `grpc`, which takes no URL path.
    example: /v1/traces
  exporterServiceName:
    type: string
    minLength: 1
    description: The `service.name` resource attribute reported on the test span.
    example: n8n
  exporterHeaders:
    type: string
    description: >
      Additional headers sent to the OTLP collector, as a single string of comma-separated
      `key=value` pairs (e.g. `authorization=Bearer my-token,x-tenant-id=acme`). Whitespace
      around each key and value is trimmed; a value may contain spaces but not commas. Use an
      empty string when unused.
    example: authorization=Bearer my-token,x-tenant-id=acme
  startupConnectivityTimeoutMs:
    type: integer
    minimum: 0
    description: How long, in milliseconds, to wait for the collector to respond.
    example: 2000
