operationId: pushGitConnectionProjects
tags:
  - GitConnections
summary: Push all team projects to a Git connection
description: Exports all team projects, commits them, and pushes to the configured branch — or to a new timestamped branch when the connection has `createBranchOnPromotion` enabled. The response reports the branch in `branchName`. Personal projects are ignored. Requires the repository to be cloned first.
x-required-scope: gitConnection:push
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    name: id
    in: path
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          commitMessage:
            type: string
            minLength: 1
            maxLength: 1000
          force:
            type: boolean
        required:
          - commitMessage
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            connectionId:
              type: string
            counts:
              type: object
              properties:
                workflows:
                  type: integer
                  minimum: 0
                folders:
                  type: integer
                  minimum: 0
                credentials:
                  type: integer
                  minimum: 0
                dataTables:
                  type: integer
                  minimum: 0
                variables:
                  type: integer
                  minimum: 0
                tags:
                  type: integer
                  minimum: 0
              required:
                - workflows
                - folders
                - credentials
                - dataTables
                - variables
                - tags
            commitSha:
              type: string
            branchName:
              type: string
          required:
            - connectionId
            - counts
            - commitSha
            - branchName
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
