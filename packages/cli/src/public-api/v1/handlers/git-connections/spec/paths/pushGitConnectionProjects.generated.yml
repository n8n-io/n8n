operationId: pushGitConnectionProjects
tags:
  - GitConnections
summary: Push linked projects to a Git connection
description: Exports all projects linked to the connection, commits them, and pushes to the configured branch. Requires the repository to be cloned first.
x-required-scope: gitConnection:push
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    name: id
    in: path
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          commitMessage:
            type: string
            minLength: 1
            maxLength: 1000
          force:
            type: boolean
        required:
          - commitMessage
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            connectionId:
              type: string
            counts:
              type: object
              properties:
                workflows:
                  type: integer
                  minimum: 0
                folders:
                  type: integer
                  minimum: 0
                credentials:
                  type: integer
                  minimum: 0
                dataTables:
                  type: integer
                  minimum: 0
                variables:
                  type: integer
                  minimum: 0
                tags:
                  type: integer
                  minimum: 0
              required:
                - workflows
                - folders
                - credentials
                - dataTables
                - variables
                - tags
            commit:
              type: string
              nullable: true
          required:
            - connectionId
            - counts
            - commit
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
