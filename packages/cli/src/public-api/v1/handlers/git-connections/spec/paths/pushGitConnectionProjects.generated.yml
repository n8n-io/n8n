operationId: pushGitConnectionProjects
tags:
  - GitConnections
summary: Push all projects linked to a Git connection
description: Work in progress. Exports all linked projects to the local repository working copy. It does not commit or push changes to the selected branch yet.
x-required-scope: gitConnection:push
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    name: id
    in: path
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            repositoryUrl:
              type: string
            branchName:
              type: string
              nullable: true
            connectionType:
              type: string
              enum:
                - ssh
                - https
            publicKey:
              type: string
              nullable: true
            keyGeneratorType:
              type: string
              nullable: true
              enum:
                - ed25519
                - rsa
            baseCommit:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required:
            - id
            - name
            - repositoryUrl
            - branchName
            - connectionType
            - publicKey
            - keyGeneratorType
            - baseCommit
            - createdAt
            - updatedAt
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
