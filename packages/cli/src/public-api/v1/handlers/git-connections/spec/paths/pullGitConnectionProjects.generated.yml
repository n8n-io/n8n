operationId: pullGitConnectionProjects
tags:
  - GitConnections
summary: Pull projects from a Git connection
description: Resets the local clone to the configured branch tip and imports projects into the instance, overwriting to match. Requires the repository to be cloned first.
x-required-scope: gitConnection:pull
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    name: id
    in: path
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            connectionId:
              type: string
            counts:
              type: object
              properties:
                projects:
                  type: object
                  properties:
                    created:
                      type: integer
                      minimum: 0
                    updated:
                      type: integer
                      minimum: 0
                    skipped:
                      type: integer
                      minimum: 0
                    deleted:
                      type: integer
                      minimum: 0
                  required:
                    - created
                    - updated
                    - skipped
                    - deleted
                folders:
                  type: object
                  properties:
                    created:
                      type: integer
                      minimum: 0
                    skipped:
                      type: integer
                      minimum: 0
                    removed:
                      type: integer
                      minimum: 0
                  required:
                    - created
                    - skipped
                    - removed
                workflows:
                  type: object
                  properties:
                    created:
                      type: integer
                      minimum: 0
                    updated:
                      type: integer
                      minimum: 0
                    skipped:
                      type: integer
                      minimum: 0
                    archived:
                      type: integer
                      minimum: 0
                    deleted:
                      type: integer
                      minimum: 0
                    publishing:
                      type: object
                      properties:
                        published:
                          type: integer
                          minimum: 0
                        unpublished:
                          type: integer
                          minimum: 0
                        unchanged:
                          type: integer
                          minimum: 0
                        blocked:
                          type: integer
                          minimum: 0
                        failed:
                          type: integer
                          minimum: 0
                      required:
                        - published
                        - unpublished
                        - unchanged
                        - blocked
                        - failed
                  required:
                    - created
                    - updated
                    - skipped
                    - archived
                    - deleted
                    - publishing
                credentials:
                  type: object
                  properties:
                    matched:
                      type: integer
                      minimum: 0
                    stubbed:
                      type: integer
                      minimum: 0
                  required:
                    - matched
                    - stubbed
                dataTables:
                  type: object
                  properties:
                    matched:
                      type: integer
                      minimum: 0
                    created:
                      type: integer
                      minimum: 0
                  required:
                    - matched
                    - created
                variables:
                  type: object
                  properties:
                    matched:
                      type: integer
                      minimum: 0
                    created:
                      type: integer
                      minimum: 0
                    updated:
                      type: integer
                      minimum: 0
                    stubbed:
                      type: integer
                      minimum: 0
                    missing:
                      type: integer
                      minimum: 0
                  required:
                    - matched
                    - created
                    - updated
                    - stubbed
                    - missing
                tags:
                  type: object
                  properties:
                    matched:
                      type: integer
                      minimum: 0
                    created:
                      type: integer
                      minimum: 0
                    renamed:
                      type: integer
                      minimum: 0
                    reconciled:
                      type: integer
                      minimum: 0
                    skipped:
                      type: integer
                      minimum: 0
                  required:
                    - matched
                    - created
                    - renamed
                    - reconciled
                    - skipped
              required:
                - projects
                - folders
                - workflows
                - credentials
                - dataTables
                - variables
                - tags
            commitSha:
              type: string
          required:
            - connectionId
            - counts
            - commitSha
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
