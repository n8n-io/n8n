operationId: pullGitConnectionProjects
tags:
  - GitConnections
summary: Pull projects from a Git connection
description: Resets the local clone to the configured branch tip and imports projects into the instance, overwriting to match. Requires the repository to be cloned first.
x-required-scope: gitConnection:pull
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
parameters:
  - schema:
      type: string
    required: true
    name: id
    in: path
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            connectionId:
              type: string
            counts:
              type: object
              properties:
                projects:
                  type: object
                  properties:
                    created:
                      type: integer
                      minimum: 0
                    updated:
                      type: integer
                      minimum: 0
                    skipped:
                      type: integer
                      minimum: 0
                  required:
                    - created
                    - updated
                    - skipped
                folders:
                  type: object
                  properties:
                    created:
                      type: integer
                      minimum: 0
                    skipped:
                      type: integer
                      minimum: 0
                  required:
                    - created
                    - skipped
                workflows:
                  type: object
                  properties:
                    created:
                      type: integer
                      minimum: 0
                    updated:
                      type: integer
                      minimum: 0
                    skipped:
                      type: integer
                      minimum: 0
                  required:
                    - created
                    - updated
                    - skipped
                credentials:
                  type: object
                  properties:
                    matched:
                      type: integer
                      minimum: 0
                    stubbed:
                      type: integer
                      minimum: 0
                  required:
                    - matched
                    - stubbed
                variables:
                  type: object
                  properties:
                    matched:
                      type: integer
                      minimum: 0
                    created:
                      type: integer
                      minimum: 0
                    updated:
                      type: integer
                      minimum: 0
                    stubbed:
                      type: integer
                      minimum: 0
                    missing:
                      type: integer
                      minimum: 0
                  required:
                    - matched
                    - created
                    - updated
                    - stubbed
                    - missing
                tags:
                  type: object
                  properties:
                    matched:
                      type: integer
                      minimum: 0
                    created:
                      type: integer
                      minimum: 0
                    renamed:
                      type: integer
                      minimum: 0
                    reconciled:
                      type: integer
                      minimum: 0
                    skipped:
                      type: integer
                      minimum: 0
                  required:
                    - matched
                    - created
                    - renamed
                    - reconciled
                    - skipped
              required:
                - projects
                - folders
                - workflows
                - credentials
                - variables
                - tags
            commit:
              type: string
          required:
            - connectionId
            - counts
            - commit
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '404':
    $ref: ../../../../shared/spec/responses/notFound.yml
  '503':
    $ref: ../../../../shared/spec/responses/serviceUnavailable.yml
