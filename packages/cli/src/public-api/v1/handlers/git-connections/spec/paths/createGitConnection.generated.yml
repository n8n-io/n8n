operationId: createGitConnection
tags:
  - GitConnections
summary: Create a Git connection
description: Creates a Git connection and its authentication material. Only one Git connection can exist.
x-required-scope: gitConnection:create
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 128
          repositoryUrl:
            type: string
            minLength: 1
          branchName:
            type: string
            minLength: 1
            maxLength: 255
          connectionType:
            type: string
            enum:
              - ssh
              - https
          keyGeneratorType:
            type: string
            enum:
              - ed25519
              - rsa
          username:
            type: string
            minLength: 1
          password:
            type: string
            minLength: 1
        required:
          - name
          - repositoryUrl
          - connectionType
responses:
  '201':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/gitConnectionPublicDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
