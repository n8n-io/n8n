operationId: runLdapSync
tags:
  - SettingsLdap
summary: Trigger an LDAP synchronization
description: Manually trigger an LDAP synchronization. The response returns the new sync history record. Requires the `ldap:sync` scope and the LDAP feature to be licensed.
x-required-scope: ldap:sync
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          type:
            type: string
            enum:
              - live
              - dry
            description: Type of synchronization. 'live' applies changes to the database. 'dry' performs a test run and does not persist changes.
            example: live
        required:
          - type
        additionalProperties: false
        description: Request body for triggering an LDAP synchronization.
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
              description: Unique identifier for this sync run.
              example: 1
            runMode:
              type: string
              enum:
                - dry
                - live
              description: Whether the sync was a dry run or applied live.
              example: live
            status:
              type: string
              description: Status of the synchronization (for example, success or error).
              example: success
            startedAt:
              type: string
              format: date-time
              description: Timestamp when the synchronization started.
              example: 2025-07-21T10:30:00Z
            endedAt:
              type: string
              format: date-time
              description: Timestamp when the synchronization completed.
              example: 2025-07-21T10:35:00Z
            scanned:
              type: integer
              description: Number of LDAP entries scanned during synchronization.
              example: 42
            created:
              type: integer
              description: Number of new users created during synchronization.
              example: 5
            updated:
              type: integer
              description: Number of existing users updated during synchronization.
              example: 3
            disabled:
              type: integer
              description: Number of users disabled during synchronization.
              example: 0
            error:
              type: string
              description: Error message if the synchronization failed. Empty string if successful.
              example: ''
          required:
            - id
            - runMode
            - status
            - startedAt
            - endedAt
            - scanned
            - created
            - updated
            - disabled
            - error
          description: LDAP synchronization history record.
          additionalProperties: false
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
