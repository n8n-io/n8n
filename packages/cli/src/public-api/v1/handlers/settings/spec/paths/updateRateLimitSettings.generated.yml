operationId: updateRateLimitSettings
tags:
  - SettingsRateLimits
summary: Set the Public API rate-limit settings
description: "Set the Public API rate-limit settings. You can send a GET response back as the body, and `envManagedFields` is ignored. When rate limiting is enabled, at least one limit must be greater than `0`. Fields set by environment variables can't be changed: a different value is rejected with 409, but sending the current value is accepted. Requires the `securitySettings:manage` scope. Requests to this route count against the rate limits."
x-required-scope: securitySettings:manage
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          enabled:
            type: boolean
            description: Whether Public API rate limiting is enabled.
          globalReadLimit:
            type: integer
            minimum: 0
            description: Read requests allowed for one API key across all endpoints. Set 0 for no limit.
          globalReadWindowSeconds:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            description: The window for the global read limit, in seconds.
          globalWriteLimit:
            type: integer
            minimum: 0
            description: Write requests allowed for one API key across all endpoints. Set 0 for no limit.
          globalWriteWindowSeconds:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            description: The window for the global write limit, in seconds.
          endpointReadLimit:
            type: integer
            minimum: 0
            description: Read requests allowed for one API key on one endpoint. Set 0 for no limit.
          endpointReadWindowSeconds:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            description: The window for the endpoint read limit, in seconds.
          endpointWriteLimit:
            type: integer
            minimum: 0
            description: Write requests allowed for one API key on one endpoint. Set 0 for no limit.
          endpointWriteWindowSeconds:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            description: The window for the endpoint write limit, in seconds.
          envManagedFields:
            type: array
            items:
              type: string
              enum:
                - enabled
                - globalReadLimit
                - globalReadWindowSeconds
                - globalWriteLimit
                - globalWriteWindowSeconds
                - endpointReadLimit
                - endpointReadWindowSeconds
                - endpointWriteLimit
                - endpointWriteWindowSeconds
            description: Fields controlled by environment variables, including _FILE variables. These fields return their effective values. A PUT can repeat these values but cannot change them.
            readOnly: true
        required:
          - enabled
          - globalReadLimit
          - globalReadWindowSeconds
          - globalWriteLimit
          - globalWriteWindowSeconds
          - endpointReadLimit
          - endpointReadWindowSeconds
          - endpointWriteLimit
          - endpointWriteWindowSeconds
        additionalProperties: false
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          $ref: ../../../../shared/spec/schemas/rateLimitSettingsPublicDto.generated.yml
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '409':
    $ref: ../../../../shared/spec/responses/conflict.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
  '429':
    $ref: ../../../../shared/spec/responses/tooManyRequests.yml
