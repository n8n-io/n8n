operationId: testOtelTrace
tags:
  - SettingsOtel
summary: Test the connection to an OTLP collector
description: Send a single test span to the given OTLP collector and report whether it was accepted. This tests the supplied connection details without changing the stored configuration. Fields managed declaratively via environment variables are overridden with their effective value before the test is sent. Requires the `otel:manage` scope.
x-required-scope: otel:manage
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          exporterProtocol:
            type: string
            enum:
              - http/protobuf
              - grpc
            default: http/protobuf
            description: 'The wire protocol used to send the test span. Collectors conventionally serve OTLP/HTTP on port 4318 and OTLP/gRPC on port 4317. The endpoint scheme (`http://` or `https://`) controls TLS for both protocols. Optional: omitting it selects `http/protobuf`, unless an environment variable manages this field, which then supplies the value.'
            example: http/protobuf
          exporterEndpoint:
            type: string
            format: uri
            pattern: ^https?:\/\/
            description: The base URL of the OTLP collector to export traces to. The value must be an `http://` or `https://` URL, because the scheme selects TLS — for gRPC, `https://` uses SSL and `http://` is plaintext.
            example: http://localhost:4318
          exporterTracingPath:
            type: string
            description: The path appended to the endpoint for the OTLP traces signal. Ignored when `exporterProtocol` is `grpc`, which takes no URL path.
            example: /v1/traces
          exporterServiceName:
            type: string
            minLength: 1
            description: The `service.name` resource attribute reported on the test span.
            example: n8n
          exporterHeaders:
            type: string
            description: Additional headers sent to the OTLP collector, as a single string of comma-separated `key=value` pairs (e.g. `authorization=Bearer my-token,x-tenant-id=acme`). Whitespace around each key and value is trimmed; a value may contain spaces but not commas. Use an empty string when unused.
            example: authorization=Bearer my-token,x-tenant-id=acme
          startupConnectivityTimeoutMs:
            type: integer
            minimum: 0
            description: How long, in milliseconds, to wait for the collector to respond.
            example: 2000
        required:
          - exporterEndpoint
          - exporterTracingPath
          - exporterServiceName
          - exporterHeaders
          - startupConnectivityTimeoutMs
        additionalProperties: false
        description: The connection details to test against an OTLP collector. Fields managed declaratively via environment variables are overridden with their effective value before the test is sent.
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              description: Whether the test span was accepted by the collector.
              example: true
            error:
              type: string
              description: The error reported by the collector or exporter. Present only when `success` is false.
              example: 'Failed to connect: 401 Unauthorized'
          required:
            - success
          additionalProperties: false
          description: The outcome of the test connection to the OTLP collector.
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
    $ref: ../../../../shared/spec/responses/forbidden.yml
  '415':
    $ref: ../../../../shared/spec/responses/unsupportedMediaType.yml
