operationId: getLogStreamingDestinations
tags:
  - LogStreaming
summary: List log streaming destinations
description: List the configured log streaming destinations. Requires the `eventBusDestination:list` scope and the Log Streaming feature to be licensed.
x-required-scope: eventBusDestination:list
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
responses:
  '200':
    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                oneOf:
                  - type: object
                    properties:
                      label:
                        type: string
                        minLength: 1
                        description: Human-readable name shown in the UI.
                        example: My destination
                      enabled:
                        type: boolean
                        description: Whether the destination currently receives events.
                        example: true
                      subscribedEvents:
                        type: array
                        items:
                          type: string
                        description: Event names (or group prefixes, e.g. `n8n.workflow`, which matches all `n8n.workflow.*` events) this destination receives. Retrieve the full list of streamable event names from `GET /settings/log-streaming/event-types`.
                        example:
                          - n8n.workflow
                          - n8n.audit
                      anonymizeAuditMessages:
                        type: boolean
                        description: Whether audit message payloads are anonymized before being sent.
                        example: false
                      circuitBreaker:
                        type: object
                        properties:
                          maxFailures:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                            description: Maximum failures within the sliding window before the breaker opens.
                          failureWindow:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                            description: Sliding window, in milliseconds, over which failures are counted.
                        description: Circuit-breaker tuning for delivery. After repeated failures the destination stops sending for a cool-down window instead of hammering an unhealthy target. All fields are optional; sensible defaults apply when omitted.
                      type:
                        type: string
                        enum:
                          - webhook
                        description: Sends each event as an HTTP request to a URL.
                        example: webhook
                      url:
                        type: string
                        format: uri
                        description: Target URL that receives the event payload.
                        example: https://example.com/n8n-events
                      method:
                        type: string
                        description: HTTP method used for the request.
                        example: POST
                      sendHeaders:
                        type: boolean
                        description: Whether to attach custom headers to the request.
                        example: false
                      specifyHeaders:
                        type: string
                        description: How custom headers are provided — `keypair` or `json`.
                        example: keypair
                      headerParameters:
                        type: object
                        properties:
                          parameters:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  example: Authorization
                                value:
                                  anyOf:
                                    - type: string
                                    - type: number
                                    - type: boolean
                                    - {}
                                    - {}
                                  description: Parameter value. Usually a string; numbers, booleans and null are also accepted.
                                  example: Bearer <token>
                              required:
                                - name
                                - value
                        required:
                          - parameters
                        description: Key-value pairs used when the matching `specify*` field is `keypair`.
                      jsonHeaders:
                        type: string
                        description: Custom headers as a JSON string when `specifyHeaders` is `json`.
                      sendQuery:
                        type: boolean
                        description: Whether to attach query parameters to the request.
                        example: false
                      specifyQuery:
                        type: string
                        description: How query parameters are provided — `keypair` or `json`.
                      queryParameters:
                        type: object
                        properties:
                          parameters:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  example: Authorization
                                value:
                                  anyOf:
                                    - type: string
                                    - type: number
                                    - type: boolean
                                    - {}
                                    - {}
                                  description: Parameter value. Usually a string; numbers, booleans and null are also accepted.
                                  example: Bearer <token>
                              required:
                                - name
                                - value
                        required:
                          - parameters
                        description: Key-value pairs used when the matching `specify*` field is `keypair`.
                      jsonQuery:
                        type: string
                        description: Query parameters as a JSON string when `specifyQuery` is `json`.
                      options:
                        type: object
                        properties:
                          timeout:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                            description: Request timeout in milliseconds.
                          allowUnauthorizedCerts:
                            type: boolean
                            description: Accept self-signed or otherwise invalid TLS certificates.
                          queryParameterArrays:
                            type: string
                            enum:
                              - indices
                              - brackets
                              - repeat
                            description: How array-valued query parameters are serialized into the query string.
                          redirect:
                            type: object
                            properties:
                              redirect:
                                type: object
                                properties:
                                  followRedirects:
                                    type: boolean
                                    description: Whether to follow HTTP redirects.
                                  maxRedirects:
                                    type: integer
                                    minimum: 0
                                    exclusiveMinimum: true
                                    description: Maximum number of redirects to follow.
                            required:
                              - redirect
                            description: Redirect-following behaviour.
                          proxy:
                            type: object
                            properties:
                              proxy:
                                type: object
                                properties:
                                  protocol:
                                    type: string
                                    enum:
                                      - https
                                      - http
                                    description: Proxy protocol.
                                  host:
                                    type: string
                                    description: Proxy host, without protocol or port.
                                  port:
                                    type: integer
                                    minimum: 0
                                    exclusiveMinimum: true
                                    description: Proxy port.
                                required:
                                  - protocol
                                  - host
                                  - port
                            required:
                              - proxy
                            description: Outbound proxy configuration.
                          socket:
                            type: object
                            properties:
                              keepAlive:
                                type: boolean
                                description: Whether to keep sockets open for reuse.
                              maxSockets:
                                type: integer
                                minimum: 0
                                exclusiveMinimum: true
                                description: Maximum sockets per host kept open at once.
                              maxFreeSockets:
                                type: integer
                                minimum: 0
                                exclusiveMinimum: true
                                description: Maximum idle sockets per host kept open.
                            description: Connection socket options.
                        description: Additional HTTP request options.
                      id:
                        type: string
                        description: Server-generated unique id of the destination. Returned in responses; not accepted in requests.
                        example: 88be6560-bfb4-455c-8aa1-06971e9e5522
                    required:
                      - type
                      - url
                      - id
                  - type: object
                    properties:
                      label:
                        type: string
                        minLength: 1
                        description: Human-readable name shown in the UI.
                        example: My destination
                      enabled:
                        type: boolean
                        description: Whether the destination currently receives events.
                        example: true
                      subscribedEvents:
                        type: array
                        items:
                          type: string
                        description: Event names (or group prefixes, e.g. `n8n.workflow`, which matches all `n8n.workflow.*` events) this destination receives. Retrieve the full list of streamable event names from `GET /settings/log-streaming/event-types`.
                        example:
                          - n8n.workflow
                          - n8n.audit
                      anonymizeAuditMessages:
                        type: boolean
                        description: Whether audit message payloads are anonymized before being sent.
                        example: false
                      circuitBreaker:
                        type: object
                        properties:
                          maxFailures:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                            description: Maximum failures within the sliding window before the breaker opens.
                          failureWindow:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                            description: Sliding window, in milliseconds, over which failures are counted.
                        description: Circuit-breaker tuning for delivery. After repeated failures the destination stops sending for a cool-down window instead of hammering an unhealthy target. All fields are optional; sensible defaults apply when omitted.
                      type:
                        type: string
                        enum:
                          - syslog
                        description: Sends each event to a syslog server.
                        example: syslog
                      host:
                        type: string
                        minLength: 1
                        description: Syslog server host.
                        example: syslog.example.com
                      port:
                        type: integer
                        minimum: 0
                        exclusiveMinimum: true
                        description: Syslog server port.
                        example: 514
                      protocol:
                        type: string
                        enum:
                          - udp
                          - tcp
                          - tls
                        description: Transport protocol.
                        example: udp
                      facility:
                        type: integer
                        minimum: 0
                        maximum: 23
                        description: 'Syslog facility code (0–23, per RFC 5424). Common values: 0 Kernel, 1 User, 3 System, 13 Audit, 14 Alert, 16 Local0, 17 Local1, 18 Local2, 19 Local3, 20 Local4, 21 Local5, 22 Local6, 23 Local7.'
                        example: 16
                      app_name:
                        type: string
                        description: Application name reported in the syslog message.
                        example: n8n
                      tlsCa:
                        type: string
                        description: PEM-encoded CA certificate used when `protocol` is `tls`.
                      id:
                        type: string
                        description: Server-generated unique id of the destination. Returned in responses; not accepted in requests.
                        example: 88be6560-bfb4-455c-8aa1-06971e9e5522
                    required:
                      - type
                      - host
                      - id
                  - type: object
                    properties:
                      label:
                        type: string
                        minLength: 1
                        description: Human-readable name shown in the UI.
                        example: My destination
                      enabled:
                        type: boolean
                        description: Whether the destination currently receives events.
                        example: true
                      subscribedEvents:
                        type: array
                        items:
                          type: string
                        description: Event names (or group prefixes, e.g. `n8n.workflow`, which matches all `n8n.workflow.*` events) this destination receives. Retrieve the full list of streamable event names from `GET /settings/log-streaming/event-types`.
                        example:
                          - n8n.workflow
                          - n8n.audit
                      anonymizeAuditMessages:
                        type: boolean
                        description: Whether audit message payloads are anonymized before being sent.
                        example: false
                      circuitBreaker:
                        type: object
                        properties:
                          maxFailures:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                            description: Maximum failures within the sliding window before the breaker opens.
                          failureWindow:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                            description: Sliding window, in milliseconds, over which failures are counted.
                        description: Circuit-breaker tuning for delivery. After repeated failures the destination stops sending for a cool-down window instead of hammering an unhealthy target. All fields are optional; sensible defaults apply when omitted.
                      type:
                        type: string
                        enum:
                          - sentry
                        description: Sends each event to a Sentry project.
                        example: sentry
                      dsn:
                        type: string
                        format: uri
                        description: Sentry DSN the events are sent to.
                        example: https://examplePublicKey@o0.ingest.sentry.io/0
                      id:
                        type: string
                        description: Server-generated unique id of the destination. Returned in responses; not accepted in requests.
                        example: 88be6560-bfb4-455c-8aa1-06971e9e5522
                    required:
                      - type
                      - dsn
                      - id
                description: 'A log streaming destination. The `type` field selects the variant and its type-specific fields: `webhook`, `syslog`, or `sentry`.'
              description: The configured log streaming destinations.
          required:
            - data
          additionalProperties: false
  '401':
    $ref: ../../../../shared/spec/responses/unauthorized.yml
  '403':
