type: object
properties:
  connectionId:
    type: string
    minLength: 1
    maxLength: 36
  configId:
    type: string
    minLength: 1
    maxLength: 36
  counts:
    type: object
    properties:
      workflows:
        type: integer
        minimum: 0
      folders:
        type: integer
        minimum: 0
      credentials:
        type: integer
        minimum: 0
      dataTables:
        type: integer
        minimum: 0
      variables:
        type: integer
        minimum: 0
      tags:
        type: integer
        minimum: 0
    required:
      - workflows
      - folders
      - credentials
      - dataTables
      - variables
      - tags
  git:
    type: object
    properties:
      commitSha:
        type: string
      branchName:
        type: string
    required:
      - commitSha
      - branchName
  mergeRequest:
    type: object
    properties:
      reviewId:
        type: string
        minLength: 1
        maxLength: 36
      iid:
        type: integer
      webUrl:
        type: string
    required:
      - reviewId
      - iid
      - webUrl
  warnings:
    type: array
    items:
      type: string
required:
  - connectionId
  - configId
  - counts
  - git
