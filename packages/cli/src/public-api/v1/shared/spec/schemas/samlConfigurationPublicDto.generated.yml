type: object
properties:
  entityID:
    type: string
    description: Service provider entity ID (metadata URL).
    readOnly: true
    example: https://n8n.example.com/rest/sso/saml/metadata
  returnUrl:
    type: string
    description: Assertion Consumer Service (ACS) return URL.
    readOnly: true
    example: https://n8n.example.com/rest/sso/saml/acs
  mapping:
    type: object
    properties:
      email:
        type: string
        description: SAML attribute mapped to the user's email.
      firstName:
        type: string
        description: SAML attribute mapped to the user's first name.
      lastName:
        type: string
        description: SAML attribute mapped to the user's last name.
      userPrincipalName:
        type: string
        description: SAML attribute mapped to the user's principal name.
      emailVerified:
        type: string
        description: SAML attribute that states whether the identity provider verified the user's email. An empty string when unused.
      n8nInstanceRole:
        type: string
        description: SAML attribute mapped to the n8n instance role.
      n8nProjectRoles:
        type: array
        items:
          type: string
        description: SAML attributes mapped to n8n project roles, formatted as `<projectId>:<role>`.
    required:
      - email
      - firstName
      - lastName
      - userPrincipalName
      - emailVerified
      - n8nInstanceRole
      - n8nProjectRoles
    description: Mapping of SAML attributes to n8n user fields.
    additionalProperties: false
  metadata:
    type: string
    description: Identity provider metadata in XML format. Redacted on read when set because it contains IdP certificates; never echoed back in plaintext. Use an empty string when unset.
    example: '**hidden**'
  metadataUrl:
    type: string
    description: URL to fetch identity provider metadata from. Use an empty string when unset.
  ignoreSSL:
    type: boolean
    description: Whether to ignore SSL certificate errors when fetching metadata from a URL.
    example: false
  loginBinding:
    type: string
    enum:
      - redirect
      - post
    description: SAML login request binding.
    example: redirect
  loginEnabled:
    type: boolean
    description: Whether SAML login is enabled.
    example: false
  loginLabel:
    type: string
    description: Label shown on the SAML login button.
    example: SAML
  authnRequestsSigned:
    type: boolean
    description: Whether authentication requests are signed.
    example: false
  wantAssertionsSigned:
    type: boolean
    description: Whether signed assertions are required.
    example: true
  wantMessageSigned:
    type: boolean
    description: Whether signed SAML messages are required.
    example: true
  emailVerifiedRequired:
    type: boolean
    description: Whether the identity provider must assert that the user's email address is verified before a login is linked to an existing user by email. When disabled, only an explicit negative assertion is rejected.
    example: false
  signingPrivateKey:
    type: string
    description: PEM-encoded private key for signing SAML AuthnRequests. Redacted on read when set; never echoed back in plaintext. Use an empty string when unset.
    example: '**hidden**'
  signingCertificate:
    type: string
    description: PEM-encoded certificate containing the public key matching the signing private key. Redacted on read when set; never echoed back in plaintext. Use an empty string when unset.
    example: '**hidden**'
  acsBinding:
    type: string
    enum:
      - redirect
      - post
    description: Assertion Consumer Service binding.
    example: post
  signatureConfig:
    type: object
    properties:
      prefix:
        type: string
        example: ds
      location:
        type: object
        properties:
          reference:
            type: string
            example: /samlp:Response/saml:Issuer
          action:
            type: string
            enum:
              - before
              - after
              - prepend
              - append
            example: after
        required:
          - reference
          - action
        additionalProperties: false
    required:
      - prefix
      - location
    description: Configuration for the signature in SAML requests and responses.
    additionalProperties: false
  relayState:
    type: string
    description: Default relay state value for SAML requests. Use an empty string when unset.
    example: https://n8n.example.com
required:
  - entityID
  - returnUrl
  - mapping
  - metadata
  - metadataUrl
  - ignoreSSL
  - loginBinding
  - loginEnabled
  - loginLabel
  - authnRequestsSigned
  - wantAssertionsSigned
  - wantMessageSigned
  - emailVerifiedRequired
  - signingPrivateKey
  - signingCertificate
  - acsBinding
  - signatureConfig
  - relayState
additionalProperties: false
