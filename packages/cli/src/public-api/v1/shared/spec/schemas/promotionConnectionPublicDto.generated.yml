type: object
properties:
  id:
    type: string
    minLength: 1
    maxLength: 36
  name:
    type: string
  scope:
    type: string
    enum:
      - instance
      - projects
  target:
    type: object
    properties:
      schemaVersion:
        type: number
        enum:
          - 1
      remoteUrl:
        type: string
        minLength: 1
      repositoryId:
        type: string
        minLength: 1
        maxLength: 256
        description: The repository ID returned by discovery. The server checks that it matches remoteUrl. Omit it when replacing the target to clear the saved ID. Plain Git targets do not use repository IDs.
    required:
      - schemaVersion
      - remoteUrl
    additionalProperties: false
  provider:
    type: object
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 36
      name:
        type: string
      type:
        type: string
        enum:
          - git
          - gitlab
      authType:
        type: string
        enum:
          - ssh-key
          - token
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
    required:
      - id
      - name
      - type
      - authType
      - createdAt
      - updatedAt
  configs:
    type: object
    properties:
      apply:
        type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 36
          name:
            type: string
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          checkout:
            type: object
            properties:
              hasCheckout:
                type: boolean
              matchesConfig:
                type: boolean
            required:
              - hasCheckout
              - matchesConfig
          settings:
            type: object
            properties:
              schemaVersion:
                type: number
                enum:
                  - 1
              branchName:
                type: string
                minLength: 1
                maxLength: 255
            required:
              - schemaVersion
              - branchName
            additionalProperties: false
        required:
          - id
          - name
          - createdAt
          - updatedAt
          - checkout
          - settings
      promote:
        type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 36
          name:
            type: string
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          checkout:
            type: object
            properties:
              hasCheckout:
                type: boolean
              matchesConfig:
                type: boolean
            required:
              - hasCheckout
              - matchesConfig
          settings:
            type: object
            properties:
              schemaVersion:
                type: number
                enum:
                  - 1
              baseBranchName:
                type: string
                minLength: 1
                maxLength: 255
              createBranchOnPromotion:
                type: boolean
            required:
              - schemaVersion
              - baseBranchName
              - createBranchOnPromotion
            additionalProperties: false
        required:
          - id
          - name
          - createdAt
          - updatedAt
          - checkout
          - settings
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
required:
  - id
  - name
  - scope
  - target
  - provider
  - configs
  - createdAt
  - updatedAt
