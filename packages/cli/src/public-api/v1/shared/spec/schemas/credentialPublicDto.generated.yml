type: object
properties:
  id:
    type: string
  name:
    type: string
  type:
    type: string
  isManaged:
    type: boolean
  isGlobal:
    type: boolean
  isResolvable:
    type: boolean
  resolvableAllowFallback:
    type: boolean
  resolverId:
    type: string
    nullable: true
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
  description:
    type: string
    nullable: true
    description: Present only when credential descriptions are enabled.
    example: Read-only key for the reporting database
required:
  - id
  - name
  - type
  - isManaged
  - isGlobal
  - isResolvable
  - resolvableAllowFallback
  - resolverId
  - createdAt
  - updatedAt
