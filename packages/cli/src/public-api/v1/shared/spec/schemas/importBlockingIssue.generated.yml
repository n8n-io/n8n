oneOf:
  - type: object
    properties:
      type:
        type: string
        enum:
          - workflow-conflict
      sourceWorkflowId:
        type: string
      existingWorkflowId:
        type: string
      name:
        type: string
    required:
      - type
      - sourceWorkflowId
      - existingWorkflowId
      - name
  - type: object
    properties:
      type:
        type: string
        enum:
          - workflow-lineage-conflict
      sourceWorkflowId:
        type: string
      projectId:
        type: string
      existingWorkflows:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            isArchived:
              type: boolean
          required:
            - id
            - name
            - isArchived
    required:
      - type
      - sourceWorkflowId
      - projectId
      - existingWorkflows
  - type: object
    properties:
      type:
        type: string
        enum:
          - workflow-id-conflict
      sourceWorkflowId:
        type: string
      existingWorkflowId:
        type: string
      existingProjectId:
        type: string
        nullable: true
      isArchived:
        type: boolean
      name:
        type: string
    required:
      - type
      - sourceWorkflowId
      - existingWorkflowId
      - existingProjectId
      - isArchived
      - name
  - type: object
    properties:
      type:
        type: string
        enum:
          - workflow-folder-conflict
      sourceWorkflowId:
        type: string
      existingWorkflowId:
        type: string
      existingParentFolderId:
        type: string
        nullable: true
      targetFolderId:
        type: string
      name:
        type: string
    required:
      - type
      - sourceWorkflowId
      - existingWorkflowId
      - existingParentFolderId
      - targetFolderId
      - name
  - type: object
    properties:
      type:
        type: string
        enum:
          - workflow-archive-forbidden
      sourceWorkflowId:
        type: string
      existingWorkflowId:
        type: string
      name:
        type: string
      projectId:
        type: string
      transition:
        type: string
        enum:
          - archive
          - unarchive
    required:
      - type
      - sourceWorkflowId
      - existingWorkflowId
      - name
      - projectId
      - transition
  - type: object
    properties:
      type:
        type: string
        enum:
          - credential-unresolved
      kind:
        type: string
        enum:
          - not_found
          - unknown_type
          - source_not_found
          - type_mismatch
      sourceId:
        type: string
      targetId:
        type: string
      expectedType:
        type: string
      actualType:
        type: string
      usedByWorkflows:
        type: array
        items:
          type: string
    required:
      - type
      - kind
      - sourceId
      - usedByWorkflows
  - type: object
    properties:
      type:
        type: string
        enum:
          - project-conflict
      kind:
        type: string
        enum:
          - fail-policy
      sourceProjectId:
        type: string
      name:
        type: string
    required:
      - type
      - kind
      - sourceProjectId
      - name
  - type: object
    properties:
      type:
        type: string
        enum:
          - folder-conflict
      kind:
        type: string
        enum:
          - parent-mismatch
          - id-in-other-project
          - fail-policy
      sourceFolderId:
        type: string
      name:
        type: string
      existingParentFolderId:
        type: string
        nullable: true
      expectedParentFolderId:
        type: string
        nullable: true
      existingProjectId:
        type: string
        nullable: true
    required:
      - type
      - kind
      - sourceFolderId
      - name
  - type: object
    properties:
      type:
        type: string
        enum:
          - workflow-removal-forbidden
      workflowId:
        type: string
      name:
        type: string
      projectId:
        type: string
    required:
      - type
      - workflowId
      - name
      - projectId
  - type: object
    properties:
      type:
        type: string
        enum:
          - workflow-removal-conflict
      sourceWorkflowId:
        type: string
      workflowId:
        type: string
      projectId:
        type: string
    required:
      - type
      - sourceWorkflowId
      - workflowId
      - projectId
  - type: object
    properties:
      type:
        type: string
        enum:
          - folder-removal-forbidden
      folderId:
        type: string
      name:
        type: string
      projectId:
        type: string
    required:
      - type
      - folderId
      - name
      - projectId
  - type: object
    properties:
      type:
        type: string
        enum:
          - data-table-unresolved
      kind:
        type: string
        enum:
          - missing
          - id-conflict
          - name-conflict
          - schema-incompatible
          - module-disabled
          - permission-denied
      sourceId:
        type: string
      name:
        type: string
      existingProjectId:
        type: string
      missingColumns:
        type: array
        items:
          type: string
      typeMismatches:
        type: array
        items:
          type: object
          properties:
            column:
              type: string
            expectedType:
              type: string
            actualType:
              type: string
          required:
            - column
            - expectedType
            - actualType
      extraColumns:
        type: array
        items:
          type: string
      usedByWorkflows:
        type: array
        items:
          type: string
    required:
      - type
      - kind
      - usedByWorkflows
  - type: object
    properties:
      type:
        type: string
        enum:
          - tag-unresolved
      kind:
        type: string
        enum:
          - rename-drift
          - name-collision
          - invalid-name
          - invalid-id
          - permission-denied
      sourceId:
        type: string
      name:
        type: string
      missingScope:
        type: string
        enum:
          - tag:create
          - tag:update
      existingTagId:
        type: string
      existingName:
        type: string
      usedByWorkflows:
        type: array
        items:
          type: string
    required:
      - type
      - kind
      - usedByWorkflows
  - type: object
    properties:
      type:
        type: string
        enum:
          - variable-unresolved
      name:
        type: string
      usedByWorkflows:
        type: array
        items:
          type: string
    required:
      - type
      - name
      - usedByWorkflows
  - type: object
    properties:
      type:
        type: string
        enum:
          - variable-conflict
      name:
        type: string
      projectId:
        type: string
      usedByWorkflows:
        type: array
        items:
          type: string
    required:
      - type
      - name
      - usedByWorkflows
  - type: object
    properties:
      type:
        type: string
        enum:
          - variable-limit-exceeded
      limit:
        type: number
      remaining:
        type: number
      requested:
        type: number
      names:
        type: array
        items:
          type: string
      usedByWorkflows:
        type: array
        items:
          type: string
    required:
      - type
      - limit
      - remaining
      - requested
      - names
      - usedByWorkflows
  - type: object
    properties:
      type:
        type: string
        enum:
          - missing-node-type
      nodeType:
        type: string
      typeVersion:
        type: number
      usedByWorkflows:
        type: array
        items:
          type: string
    required:
      - type
      - nodeType
      - typeVersion
      - usedByWorkflows
  - type: object
    properties:
      type:
        type: string
        enum:
          - policy-violation
      sourceWorkflowId:
        type: string
      name:
        type: string
      violations:
        type: array
        items:
          type: object
          properties:
            kind:
              type: string
            checkId:
              type: string
            message:
              type: string
            subject:
              type: string
            subjectType:
              type: string
            scope:
              type: string
            matchedRuleId:
              type: string
          required:
            - kind
            - checkId
            - message
    required:
      - type
      - sourceWorkflowId
      - name
      - violations
