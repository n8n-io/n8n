type: object
properties:
  ruleSet:
    type: object
    properties:
      rules:
        type: array
        items:
          type: object
          properties:
            ruleId:
              type: string
              minLength: 1
              maxLength: 80
            severity:
              type: string
              enum:
                - off
                - warn
                - block
            options:
              type: object
              additionalProperties: {}
            adjustable:
              type: boolean
          required:
            - ruleId
            - severity
        maxItems: 100
        default: []
      customRules:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              pattern: ^custom-[a-z0-9-]{1,60}$
            name:
              type: string
              minLength: 1
              maxLength: 80
            description:
              type: string
              maxLength: 500
            severity:
              type: string
              enum:
                - off
                - warn
                - block
            adjustable:
              type: boolean
            target:
              oneOf:
                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - workflow
                  required:
                    - kind
                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - nodes
                    nodeTypes:
                      type: array
                      items:
                        type: string
                        maxLength: 200
                      maxItems: 100
                      default: []
                  required:
                    - kind
              type: object
            require:
              type: object
              properties:
                subject:
                  type: string
                  enum:
                    - parameter
                    - nodeName
                    - nodeType
                    - credentialType
                    - disabled
                    - retryOnFail
                    - workflowName
                    - description
                    - setting
                    - nodeCount
                path:
                  type: string
                  maxLength: 200
                operator:
                  type: string
                  enum:
                    - isSet
                    - isNotSet
                    - equals
                    - notEquals
                    - oneOf
                    - notOneOf
                    - contains
                    - notContains
                    - matches
                    - notMatches
                    - lessThan
                    - greaterThan
                    - isExpression
                    - isNotExpression
                value:
                  anyOf:
                    - type: string
                      maxLength: 1000
                    - type: number
                    - type: boolean
                    - type: array
                      items:
                        type: string
                        maxLength: 200
                      maxItems: 200
                flags:
                  type: string
                  maxLength: 4
              required:
                - subject
                - operator
            message:
              type: string
              maxLength: 300
          required:
            - id
            - name
            - severity
            - target
            - require
        maxItems: 100
        default: []
  version:
    type: integer
    minimum: 0
  updatedAt:
    type: string
    nullable: true
    format: date-time
required:
  - ruleSet
  - version
  - updatedAt
