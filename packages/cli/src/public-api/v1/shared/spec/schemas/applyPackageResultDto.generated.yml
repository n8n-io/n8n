              created:
                type: integer
                minimum: 0
              updated:
                type: integer
                minimum: 0
              skipped:
                type: integer
                minimum: 0
              archived:
                type: integer
                minimum: 0
              deleted:
                type: integer
                minimum: 0
              publishing:
                type: object
                properties:
                  published:
                    type: integer
                    minimum: 0
                  unpublished:
                    type: integer
                    minimum: 0
                  unchanged:
                    type: integer
                    minimum: 0
                  blocked:
                    type: integer
                    minimum: 0
                  failed:
                    type: integer
                    minimum: 0
                required:
                  - published
                  - unpublished
                  - unchanged
                  - blocked
                  - failed
            required:
              - created
              - updated
              - skipped
              - archived
              - deleted
              - publishing
          credentials:
            type: object
            properties:
              matched:
                type: integer
                minimum: 0
              stubbed:
                type: integer
                minimum: 0
            required:
              - matched
              - stubbed
          dataTables:
            type: object
            properties:
              matched:
                type: integer
                minimum: 0
              created:
                type: integer
                minimum: 0
            required:
              - matched
              - created
          variables:
            type: object
            properties:
              matched:
                type: integer
                minimum: 0
              created:
                type: integer
                minimum: 0
              updated:
                type: integer
                minimum: 0
              stubbed:
                type: integer
                minimum: 0
              missing:
                type: integer
                minimum: 0
            required:
              - matched
              - created
              - updated
              - stubbed
              - missing
