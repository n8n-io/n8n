type: object
properties:
  id:
    type: string
  name:
    type: string
  projectId:
    type: string
  project:
    type: object
    nullable: true
    properties:
      id:
        type: string
      name:
        type: string
      type:
        type: string
    required:
      - id
      - name
      - type
  availableInMCP:
    type: boolean
  isArchived:
    type: boolean
  versionId:
    type: string
    nullable: true
  activeVersionId:
    type: string
    nullable: true
  createdAt:
    type: string
  updatedAt:
    type: string
  config:
    type: object
    nullable: true
  configHash:
    type: string
    nullable: true
  tools:
    type: object
    additionalProperties:
      type: object
      description: 'A custom tool: the code it runs and its descriptor.'
      properties:
        code:
          type: string
        descriptor:
          type: object
          description: The tool descriptor. `name` is required; other fields pass through.
          properties:
            name:
              type: string
          required:
            - name
          additionalProperties: true
      required:
        - code
        - descriptor
  activeVersion:
    type: object
    nullable: true
    properties:
      versionId:
        type: string
      integrations:
        type: array
        items:
          type: object
          description: A channel integration. `type` picks the platform.
          properties:
            type:
              type: string
              description: The integration type, for example `slack` or `webhook`.
            credentialId:
              type: string
            settings:
              type: object
              description: Platform-specific integration settings.
            approval:
              type: object
              description: Channel actions that need approval before they run.
          required:
            - type
            - credentialId
    required:
      - versionId
      - integrations
  parentFolder:
    type: object
    nullable: true
    properties:
      id:
        type: string
      name:
        type: string
      parentFolderId:
        type: string
        nullable: true
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
    required:
      - id
      - name
      - parentFolderId
      - createdAt
      - updatedAt
required:
  - id
  - name
  - projectId
  - project
  - availableInMCP
  - isArchived
  - versionId
  - activeVersionId
  - createdAt
  - updatedAt
  - config
  - configHash
  - tools
  - activeVersion
  - parentFolder
