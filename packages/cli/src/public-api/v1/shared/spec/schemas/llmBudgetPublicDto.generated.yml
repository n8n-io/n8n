type: object
properties:
  id:
    type: string
  name:
    type: string
    minLength: 1
    maxLength: 128
  enabled:
    type: boolean
    default: true
  target:
    type: object
    properties:
      workflow:
        oneOf:
          - type: object
            properties:
              match:
                type: string
                enum:
                  - all
            required:
              - match
            additionalProperties: false
          - type: object
            properties:
              match:
                type: string
                enum:
                  - ids
              ids:
                type: array
                items:
                  type: string
                  minLength: 1
                minItems: 1
            required:
              - match
              - ids
            additionalProperties: false
        type: object
      agent:
        oneOf:
          - type: object
            properties:
              match:
                type: string
                enum:
                  - all
            required:
              - match
            additionalProperties: false
          - type: object
            properties:
              match:
                type: string
                enum:
                  - ids
              ids:
                type: array
                items:
                  type: string
                  minLength: 1
                minItems: 1
            required:
              - match
              - ids
            additionalProperties: false
        type: object
      project:
        oneOf:
          - type: object
            properties:
              match:
                type: string
                enum:
                  - all
            required:
              - match
            additionalProperties: false
          - type: object
            properties:
              match:
                type: string
                enum:
                  - ids
              ids:
                type: array
                items:
                  type: string
                  minLength: 1
                minItems: 1
            required:
              - match
              - ids
            additionalProperties: false
        type: object
      user:
        oneOf:
          - type: object
            properties:
              match:
                type: string
                enum:
                  - all
            required:
              - match
            additionalProperties: false
          - type: object
            properties:
              match:
                type: string
                enum:
                  - ids
              ids:
                type: array
                items:
                  type: string
                  minLength: 1
                minItems: 1
            required:
              - match
              - ids
            additionalProperties: false
        type: object
      credential:
        oneOf:
          - type: object
            properties:
              match:
                type: string
                enum:
                  - all
            required:
              - match
            additionalProperties: false
          - type: object
            properties:
              match:
                type: string
                enum:
                  - ids
              ids:
                type: array
                items:
                  type: string
                  minLength: 1
                minItems: 1
            required:
              - match
              - ids
            additionalProperties: false
        type: object
    additionalProperties: false
    description: 'Dimension name to filter. `{ match: "all" }` gives each value its own counter; `{ match: "ids", ids }` only these values. A credential value is a credential ID, or `managed:aiGateway` for Gateway credits.'
  window:
    oneOf:
      - type: object
        properties:
          kind:
            type: string
            enum:
              - rolling
          unit:
            type: string
            enum:
              - day
              - week
              - month
        required:
          - kind
          - unit
        additionalProperties: false
      - type: object
        properties:
          kind:
            type: string
            enum:
              - calendar
          unit:
            type: string
            enum:
              - day
              - week
              - month
          timezone:
            type: string
            enum:
              - instance
              - UTC
        required:
          - kind
          - unit
        additionalProperties: false
    type: object
  metric:
    type: string
    enum:
      - costUsd
    default: costUsd
  limit:
    type: number
    minimum: 0
    exclusiveMinimum: true
    description: The limit in the unit of `metric`.
  action:
    type: string
    enum:
      - block
      - warn
    default: block
    description: '`block` stops calls at the limit. `warn` only emits events.'
  warnAtPercent:
    type: array
    items:
      type: integer
      minimum: 1
      maximum: 100
    maxItems: 5
    default:
      - 80
    description: Each threshold emits one log-streaming event when it is crossed.
  managedBy:
    type: string
    nullable: true
    maxLength: 32
    default: null
    description: The system that owns the budget, for example `lighthouse`.
  externalId:
    type: string
    nullable: true
    maxLength: 255
    default: null
  version:
    type: number
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
required:
  - id
  - name
  - target
  - window
  - limit
  - version
  - createdAt
  - updatedAt
