    properties:
      key:
        type: string
      type:
        type: string
        enum:
          - project
      before:
        type: object
        nullable: true
        properties:
          id:
            type: string
            minLength: 1
          name:
            type: string
            minLength: 1
          description:
            type: string
          icon:
            type: object
            properties:
              type:
                type: string
                enum:
                  - emoji
                  - icon
              value:
                type: string
            required:
              - type
              - value
          customTelemetryTags:
            type: array
            items:
              type: object
              properties:
                key:
                  type: string
                value:
                  type: string
              required:
                - key
                - value
        required:
          - id
          - name
      after:
        type: object
        nullable: true
        properties:
          id:
            type: string
            minLength: 1
          name:
            type: string
            minLength: 1
          description:
            type: string
          icon:
            type: object
            properties:
              type:
                type: string
                enum:
                  - emoji
                  - icon
              value:
