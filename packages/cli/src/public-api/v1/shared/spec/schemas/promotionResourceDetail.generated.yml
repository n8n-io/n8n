      before:
        type: object
        nullable: true
        properties:
          id:
            type: string
            minLength: 1
          name:
            type: string
            minLength: 1
          type:
            type: string
            minLength: 1
          description:
            type: string
            nullable: true
            maxLength: 512
          data:
            type: object
            additionalProperties:
              $ref: promotionCredentialExpressionValue.generated.yml
          dataIsComplete:
            type: boolean
        required:
          - id
          - name
          - type
        additionalProperties: false
      after:
        type: object
        nullable: true
        properties:
          id:
            type: string
            minLength: 1
          name:
            type: string
            minLength: 1
          type:
            type: string
            minLength: 1
          description:
            type: string
            nullable: true
            maxLength: 512
          data:
            type: object
            additionalProperties:
              $ref: promotionCredentialExpressionValue.generated.yml
          dataIsComplete:
            type: boolean
        required:
          - id
          - name
          - type
        additionalProperties: false
      revision:
        type: object
        properties:
          before:
            type: string
