      - type
      - before
      - after
      - revision
  - type: object
    properties:
      key:
        type: string
      type:
        type: string
        enum:
          - dataTable
      before:
        type: object
        nullable: true
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 36
            pattern: ^[a-zA-Z0-9]+$
          name:
            type: string
            minLength: 1
            maxLength: 128
          columns:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 36
                  pattern: ^[a-zA-Z0-9]+$
                name:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
                type:
                  type: string
                  enum:
                    - string
                    - number
                    - boolean
                    - date
                index:
                  type: integer
              required:
                - name
                - type
                - index
              additionalProperties: false
        required:
          - id
          - name
          - columns
        additionalProperties: false
      after:
        type: object
        nullable: true
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 36
            pattern: ^[a-zA-Z0-9]+$
          name:
            type: string
            minLength: 1
            maxLength: 128
          columns:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 36
                  pattern: ^[a-zA-Z0-9]+$
                name:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
                type:
                  type: string
                  enum:
                    - string
                    - number
                    - boolean
                    - date
                index:
                  type: integer
              required:
                - name
                - type
                - index
              additionalProperties: false
        required:
          - id
          - name
          - columns
        additionalProperties: false
      revision:
        type: object
        properties:
          before:
            type: string
            nullable: true
          after:
            type: string
            nullable: true
        required:
          - before
          - after
      dataTableChanges:
        type: array
        items:
          oneOf:
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - add-column
                column:
                  type: string
                type:
                  type: string
                  enum:
                    - string
                    - number
                    - boolean
                    - date
                destructive:
                  type: boolean
                  enum:
                    - false
              required:
                - kind
                - column
                - type
                - destructive
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - remove-column
                column:
                  type: string
                type:
                  type: string
                  enum:
                    - string
                    - number
                    - boolean
                    - date
                destructive:
                  type: boolean
                  enum:
                    - true
              required:
                - kind
                - column
                - type
                - destructive
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - change-column-type
                column:
                  type: string
                from:
                  type: string
                  enum:
                    - string
                    - number
                    - boolean
                    - date
                to:
                  type: string
                  enum:
                    - string
                    - number
                    - boolean
                    - date
                destructive:
                  type: boolean
                  enum:
                    - true
              required:
                - kind
                - column
                - from
                - to
                - destructive
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - rename-column
                from:
                  type: string
                to:
                  type: string
                destructive:
                  type: boolean
                  enum:
                    - false
              required:
                - kind
                - from
                - to
                - destructive
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - reorder-columns
                destructive:
                  type: boolean
                  enum:
                    - false
              required:
                - kind
                - destructive
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - rename-table
                from:
                  type: string
                to:
                  type: string
                destructive:
                  type: boolean
                  enum:
                    - false
              required:
                - kind
                - from
                - to
                - destructive
          type: object
    required:
      - key
      - type
      - before
      - after
      - revision
  - type: object
