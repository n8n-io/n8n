  - type: object
    properties:
      key:
        type: string
      type:
        type: string
        enum:
          - workflow
      before:
        type: object
        nullable: true
        properties:
          id:
            type: string
            minLength: 1
          name:
            type: string
            minLength: 1
          description:
            type: string
            nullable: true
          nodes:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                type:
                  type: string
                  minLength: 1
                typeVersion:
                  type: number
                position:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                parameters:
                  type: object
                  additionalProperties: {}
                credentials:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      id:
                        type: string
                        nullable: true
                      name:
                        type: string
                      __aiGatewayManaged:
                        type: boolean
                    required:
                      - id
                disabled:
                  type: boolean
                notes:
                  type: string
                notesInFlow:
                  type: boolean
                continueOnFail:
                  type: boolean
                retryOnFail:
                  type: boolean
                maxTries:
                  type: number
                waitBetweenTries:
                  type: number
                alwaysOutputData:
                  type: boolean
                executeOnce:
                  type: boolean
                onError:
                  type: string
                webhookId:
                  type: string
              required:
                - id
                - name
                - type
                - typeVersion
                - position
                - parameters
          connections:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                type: array
                items:
                  type: array
                  nullable: true
                  items:
                    type: object
                    properties:
                      node:
                        type: string
                      type:
                        type: string
                      index:
                        type: number
                    required:
                      - node
                      - type
                      - index
          nodeGroups:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                nodeIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                description:
                  type: string
              required:
                - id
                - name
                - nodeIds
          settings:
            type: object
            additionalProperties: {}
          parentFolderId:
            type: string
            nullable: true
          isArchived:
            type: boolean
          tagIds:
            type: array
            items:
              type: string
              minLength: 1
        required:
          - id
          - name
          - nodes
          - connections
          - parentFolderId
          - isArchived
      after:
        type: object
        nullable: true
        properties:
          id:
            type: string
            minLength: 1
          name:
            type: string
            minLength: 1
          description:
            type: string
            nullable: true
          nodes:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                type:
                  type: string
                  minLength: 1
                typeVersion:
                  type: number
                position:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                parameters:
                  type: object
                  additionalProperties: {}
                credentials:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      id:
                        type: string
                        nullable: true
                      name:
                        type: string
                      __aiGatewayManaged:
                        type: boolean
                    required:
                      - id
                disabled:
                  type: boolean
                notes:
                  type: string
                notesInFlow:
                  type: boolean
                continueOnFail:
                  type: boolean
                retryOnFail:
                  type: boolean
                maxTries:
                  type: number
                waitBetweenTries:
                  type: number
                alwaysOutputData:
                  type: boolean
                executeOnce:
                  type: boolean
                onError:
                  type: string
                webhookId:
                  type: string
              required:
                - id
                - name
                - type
                - typeVersion
                - position
                - parameters
          connections:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                type: array
                items:
                  type: array
                  nullable: true
                  items:
                    type: object
                    properties:
                      node:
                        type: string
                      type:
                        type: string
                      index:
                        type: number
                    required:
                      - node
                      - type
                      - index
          nodeGroups:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                nodeIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                description:
                  type: string
              required:
                - id
                - name
                - nodeIds
          settings:
            type: object
            additionalProperties: {}
          parentFolderId:
            type: string
            nullable: true
          isArchived:
            type: boolean
          tagIds:
            type: array
            items:
              type: string
              minLength: 1
        required:
          - id
          - name
          - nodes
          - connections
          - parentFolderId
          - isArchived
      revision:
        type: object
        properties:
          before:
            type: string
            nullable: true
          after:
            type: string
            nullable: true
        required:
          - before
          - after
    required:
      - key
      - type
      - before
      - after
      - revision
  - type: object
