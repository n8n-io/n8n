              - value
          customTelemetryTags:
            type: array
            items:
              type: object
              properties:
                key:
                  type: string
                value:
                  type: string
              required:
                - key
                - value
        required:
          - id
          - name
      revision:
        type: object
        properties:
          before:
            type: string
            nullable: true
          after:
            type: string
            nullable: true
        required:
          - before
          - after
    required:
      - key
      - type
      - before
      - after
      - revision
