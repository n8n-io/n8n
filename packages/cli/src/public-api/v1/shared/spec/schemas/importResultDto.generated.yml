type: object
properties:
  package:
    type: object
    properties:
      sourceN8nVersion:
        type: string
      sourceId:
        type: string
    required:
      - sourceN8nVersion
      - sourceId
  agents:
    type: array
    items:
      type: object
      properties:
        sourceAgentId:
          type: string
          description: Agent ID in the package.
        localId:
          type: string
          description: Agent ID on the target instance. New Agents use the package ID. Updated and skipped Agents keep their destination ID.
        name:
          type: string
        projectId:
          type: string
        activeVersionId:
          type: string
          nullable: true
          description: Published version on the target after import. Null when no version is published.
        status:
          type: string
          enum:
            - created
            - updated
            - skipped
        publishing:
          type: object
          properties:
            state:
              type: string
              enum:
                - published
                - unpublished
                - unchanged
                - blocked
                - failed
              description: '`blocked` means the imported version could not be published and no version is active (for example because the Agent or workflow uses an empty or incomplete credential, or a node type this instance does not have, or an Agent channel needs setup while publication is requested). When a prior published version remains active, `state` is `unchanged` with `skippedPublishReason` instead. `failed` means publish or unpublish was attempted but did not succeed.'
            error:
              type: string
              description: Present when `state` is `failed`. Explains why publish or unpublish could not be applied.
            blockedReason:
              type: string
              enum:
                - stub-credential
                - incomplete-credential
                - missing-node-type
                - channel-setup-required
              description: 'Present when `state` is `blocked`: the imported version could not be published and no version is active.'
            skippedPublishReason:
              type: string
              enum:
                - stub-credential
                - incomplete-credential
                - missing-node-type
                - channel-setup-required
              description: 'Present when `state` is `unchanged` but the policy wanted to publish the imported version: a prior published version is still active (for example after an update with empty or incomplete credentials).'
          required:
            - state
          description: Publication outcome. A failed publication does not undo the definition import.
        channels:
          type: array
          items:
            oneOf:
              - type: object
                properties:
                  type:
                    type: string
                    description: Channel type, for example `slack`.
                  status:
                    type: string
                    enum:
                      - reused
                    description: The import kept the channel connection that the destination Agent already had.
                required:
                  - type
                  - status
              - type: object
                properties:
                  type:
                    type: string
                    description: Channel type, for example `slack`.
                  status:
                    type: string
                    enum:
                      - setup-required
                    description: The import saved the channel settings without a connection. Set up the channel in the destination before the Agent can be published.
                  reason:
                    type: string
                    enum:
                      - new-channel
                      - destination-draft
                    description: '`new-channel`: the destination Agent had no connection for this channel. `destination-draft`: the destination Agent has this channel, but its setup is not complete.'
                  setupUrl:
                    type: string
                    description: Link to the destination Agent, where you can set up the channel.
                required:
                  - type
                  - status
                  - reason
                  - setupUrl
            type: object
          description: Channel outcome for each external channel in the imported definition. A credential from the package never connects a channel. Empty for skipped Agents.
      required:
        - sourceAgentId
        - localId
        - name
        - projectId
        - activeVersionId
        - status
        - publishing
        - channels
  counts:
    type: object
    properties:
      agents:
        type: object
        properties:
          created:
            type: integer
            minimum: 0
          updated:
            type: integer
            minimum: 0
          skipped:
            type: integer
            minimum: 0
        required:
          - created
          - updated
          - skipped
    required:
      - agents
  workflows:
    type: array
    items:
      type: object
      properties:
        sourceWorkflowId:
          type: string
          description: Workflow id as it appeared in the package.
        localId:
          type: string
          description: Workflow ID on the target instance. New workflows use the package ID. Updated and skipped workflows keep their destination ID.
        name:
          type: string
        projectId:
          type: string
        parentFolderId:
          type: string
          nullable: true
        activeVersionId:
          type: string
          nullable: true
          description: Published version on the target instance, if any. `null` when the workflow is not published after import.
        isArchived:
          type: boolean
          description: Whether the workflow is archived on the target after import. Under `new-version` this follows the package's `isArchived` flag. A skipped workflow keeps its own state.
        publishing:
          type: object
          properties:
            state:
              type: string
              enum:
                - published
                - unpublished
                - unchanged
                - blocked
                - failed
              description: '`blocked` means the imported version could not be published and no version is active (for example because the Agent or workflow uses an empty or incomplete credential, or a node type this instance does not have, or an Agent channel needs setup while publication is requested). When a prior published version remains active, `state` is `unchanged` with `skippedPublishReason` instead. `failed` means publish or unpublish was attempted but did not succeed.'
            error:
              type: string
              description: Present when `state` is `failed`. Explains why publish or unpublish could not be applied.
            blockedReason:
              type: string
              enum:
                - stub-credential
                - incomplete-credential
                - missing-node-type
                - channel-setup-required
              description: 'Present when `state` is `blocked`: the imported version could not be published and no version is active.'
            skippedPublishReason:
              type: string
              enum:
                - stub-credential
                - incomplete-credential
                - missing-node-type
                - channel-setup-required
              description: 'Present when `state` is `unchanged` but the policy wanted to publish the imported version: a prior published version is still active (for example after an update with empty or incomplete credentials).'
          required:
            - state
          description: Outcome of applying the selected publishing policy to this workflow.
        status:
          type: string
          enum:
            - created
            - updated
            - skipped
          description: Import outcome for this package workflow.
      required:
        - sourceWorkflowId
        - localId
        - name
        - projectId
        - parentFolderId
        - activeVersionId
        - isArchived
        - publishing
        - status
  removedWorkflows:
    type: array
    items:
      type: object
      properties:
        workflowId:
          type: string
          description: Id of the removed workflow on this instance.
        name:
          type: string
        projectId:
          type: string
          description: Project the workflow was reconciled against.
        parentFolderId:
          type: string
          nullable: true
          description: Folder that held the workflow, or null at the project root.
        deletion:
          type: string
          enum:
            - archived
            - deleted
          description: 'What actually happened, not what `overwriteDeletionPolicy` asked for: a `hard-delete` whose row could not be dropped yet is reported as `archived`.'
      required:
        - workflowId
        - name
        - projectId
        - parentFolderId
        - deletion
    description: Workflows removed from the target during this import.
  removedFolders:
    type: array
    items:
      type: object
      properties:
        folderId:
          type: string
        name:
          type: string
        projectId:
          type: string
        parentFolderId:
          type: string
          nullable: true
          description: Folder that held it, or null at the project root.
      required:
        - folderId
        - name
        - projectId
        - parentFolderId
    description: Folders the package does not define that reconciliation left empty, removed by `folderConflictPolicy=overwrite`. A folder still holding anything survives, so target-only content is never swept up. Empty under every other policy.
  folders:
    type: array
    items:
      type: object
      properties:
        sourceFolderId:
          type: string
          description: Folder id as it appeared in the package.
        localId:
          type: string
          description: Folder id on the target instance (equal to `sourceFolderId`; folder ids are reused).
        name:
          type: string
        parentFolderId:
          type: string
          nullable: true
          description: Resolved parent folder on the target, or `null` at the project root.
        status:
          type: string
          enum:
            - created
            - skipped
          description: Import outcome for this package folder.
      required:
        - sourceFolderId
        - localId
        - name
        - parentFolderId
        - status
    description: Folder shells created or skipped in the target project.
  projects:
    type: array
    items:
      type: object
      properties:
        sourceProjectId:
          type: string
          description: Project id as it appeared in the package.
        localId:
          type: string
          description: Project id on the target instance (equal to `sourceProjectId`; project ids are reused).
        name:
          type: string
          description: "The project's name on the target: the package's under `overwrite`, the pre-existing one under `merge`."
        status:
          type: string
          enum:
            - created
            - updated
            - skipped
          description: Import outcome for this package project. `skipped` means the project already existed and `projectConflictPolicy=merge` left its details untouched — its contents were still imported.
      required:
        - sourceProjectId
        - localId
        - name
        - status
    description: Project shells created, or matched and then updated or left as-is (see `projectConflictPolicy`). Present for project packages; empty when importing loose workflows/folders.
  bindings:
    type: object
    properties:
      agents:
        type: object
        additionalProperties:
          type: string
        description: Source-to-target IDs for created, updated, and skipped package Agents.
      workflows:
        type: object
        additionalProperties:
          type: string
      credentials:
        type: object
        additionalProperties:
          type: string
        description: Credential id from `requirements.credentials` in the package manifest → resolved target credential id on the target instance. Covers both a matched existing credential and a credential that the import created under `credentialMissingMode=create-stub` or `create-with-values`.
    required:
      - agents
      - workflows
      - credentials
    description: Source id → target id mappings produced during import, one map per entity type. Each value maps an id as it appeared in the package to the id on the target instance.
  credentials:
    type: object
    properties:
      matched:
        type: array
        items:
          type: string
        description: Source credential ids from the package that matched existing credentials on the target instance.
      stubbed:
        type: array
        items:
          type: string
        description: Source credential ids for which empty placeholder credentials were created in the target project.
      seeded:
        type: array
        items:
          type: string
        description: Source credential ids for which credentials were created in the target project with all their source data from the bundled expression values.
      incomplete:
        type: array
        items:
          type: string
        description: Source credential ids for which credentials were created in the target project with bundled expression values, but the package does not confirm that it carries all source data. These credentials need input. The import does not publish the imported version of workflows that use them (`incomplete-credential`).
      updated:
        type: array
        items:
          type: string
        description: Source credential ids whose matched credential this import changed under `credentialConflictPolicy=overwrite`. These ids are not listed under `matched`. Empty for other policies.
    required:
      - matched
      - stubbed
      - seeded
      - incomplete
      - updated
    description: Source credential ids grouped by whether they matched an existing credential, were created as empty stubs, seeded credentials, or incomplete credentials, or matched a credential that this import updated. Full source→target id mapping is in `bindings.credentials`.
  dataTables:
    type: object
    properties:
      matched:
        type: integer
        minimum: 0
      created:
        type: integer
        minimum: 0
      updated:
        type: integer
        minimum: 0
    required:
      - matched
      - created
      - updated
  variables:
    type: object
    properties:
      matched:
        type: array
        items:
          type: string
        description: Variable names that resolved to an existing variable (importing project's scope first, then global) and were left untouched. A resolved variable this import rewrote is listed under `updated` instead.
      missing:
        type: array
        items:
          type: string
        description: Variable names still unresolved after import. Under `variableMissingMode=do-nothing` these are warnings — the import still succeeds and nothing is created. A successful `create-stub` or `create-with-value` import normally leaves this empty.
      created:
        type: array
        items:
          type: string
        description: Variable names created with a package value under `variableMissingMode=create-with-value`. Empty stubs are listed under `stubbed`.
      stubbed:
        type: array
        items:
          type: string
        description: Variable names created with an empty value by this import under `variableMissingMode=create-stub`, or because `create-with-value` had no exported value. Empty for other outcomes.
      updated:
        type: array
        items:
          type: string
        description: Variable names whose existing value this import replaced with the package value under `variableConflictPolicy=overwrite`. Empty for other policies.
    required:
      - matched
      - missing
      - created
      - stubbed
      - updated
    description: Resolution of the package's variable requirements. Names only — values never travel in the response. For project packages these arrays are package-level unions of per-destination outcomes and may overlap (for example, a name may be created with a value in one project and stubbed in another); classification under concurrent external writes is best-effort.
  tags:
    type: object
    properties:
      matched:
        type: array
        items:
          type: string
        description: Tags that resolved to an existing tag with the same id and name; attached as-is.
      created:
        type: array
        items:
          type: string
        description: Tags created by this import, by name, under `tagMissingMode=create`.
      renamed:
        type: array
        items:
          type: string
        description: Target tags renamed to the package name under `tagConflictPolicy=rename`; listed by their new name.
      reconciled:
        type: array
        items:
          type: string
        description: Existing target tags re-keyed to the package (source) id on a name collision under `tagConflictPolicy=rename`; their name, workflow and folder taggings are kept.
      skipped:
        type: array
        items:
          type: string
        description: Tags dropped from the import — not created, not renamed, and not attached to any imported workflow — under `tagMissingMode=do-nothing` or `tagConflictPolicy=skip`.
    required:
      - matched
      - created
      - renamed
      - reconciled
      - skipped
    description: Resolution of the tags referenced by the imported workflows, matched by source id. Tag names only.
required:
  - package
  - agents
  - counts
  - workflows
  - removedWorkflows
  - removedFolders
  - folders
  - projects
  - bindings
  - credentials
  - dataTables
  - variables
  - tags
