openapi: 3.0.0
info:
  title: decorator-routes
  version: 0.0.0
paths:
  /files:
    get:
      $ref: ./handlers/files/spec/paths/getFiles.generated.yml
  /files/{fileId}:
    get:
      $ref: ./handlers/files/spec/paths/getFile.generated.yml
    put:
      $ref: ./handlers/files/spec/paths/updateFile.generated.yml
    delete:
      $ref: ./handlers/files/spec/paths/deleteFile.generated.yml
  /files/{fileId}/content:
    get:
      $ref: ./handlers/files/spec/paths/getFileContent.generated.yml
  /roles:
    get:
      $ref: ./handlers/roles/spec/paths/getAllRoles.generated.yml
    post:
      $ref: ./handlers/roles/spec/paths/createRole.generated.yml
  /tags:
    get:
      $ref: ./handlers/tags/spec/paths/getTags.generated.yml
  /workflows/{workflowId}:
    get:
      $ref: ./handlers/workflows/spec/paths/getWorkflow.generated.yml
  /workflows/{workflowId}/history:
    get:
      $ref: ./handlers/workflows/spec/paths/getWorkflowHistory.generated.yml
