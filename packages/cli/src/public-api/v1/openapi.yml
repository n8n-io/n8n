---
openapi: 3.0.0
x-enable-proxy: false
info:
  title: n8n Public API
  description: n8n Public API
  termsOfService: https://n8n.io/legal/#terms
  contact:
    email: hello@n8n.io
  license:
    name: Sustainable Use License
    url: https://github.com/n8n-io/n8n/blob/master/LICENSE.md
  version: 1.1.1
externalDocs:
  description: n8n API documentation
  url: https://docs.n8n.io/api/
servers:
  - url: /api/v1
    description: Current n8n instance (self-hosted built-in playground)
  - url: '{url}/api/v1'
    description: Self-hosted n8n instance
    variables:
      url:
        default: https://example.com
tags:
  # Child tags (alphabetically sorted)
  - name: Audit
    x-parent: InstanceOperations
    description: Operations about security audit
  - name: CommunityPackage
    x-parent: InstanceOperations
    description: Operations about community packages
  - name: Credential
    x-parent: BuildAndRun
    description: Operations about credentials
  - name: CredentialTypePolicy
    x-parent: InstanceSettings
    description: Preview — breaking changes may still occur without major version bump.
  - name: DataTable
    x-parent: BuildAndRun
    description: Operations about data tables and their rows
  - name: Discover
    x-parent: InstanceOperations
    description: API capability discovery
  - name: Evaluation
    x-parent: BuildAndRun
    description: Operations about evaluation test runs
  - name: Executions
    x-parent: BuildAndRun
    description: Operations about executions
  - name: Folders
    x-parent: BuildAndRun
    description: Operations about folders
  - name: Insights
    x-parent: InstanceOperations
    description: Operations about insights
  - name: LogStreaming
    x-parent: InstanceSettings
    description: Operations about log streaming destinations
  - name: N8nPackage
    x-parent: InstanceOperations
    description: Beta — breaking changes may still occur without major version bump.
  - name: NodeTypePolicy
    x-parent: InstanceSettings
    description: Preview — breaking changes may still occur without major version bump.
  - name: Projects
    x-parent: AccessAndOrganization
    description: Operations about projects
  - name: Promotions
    x-parent: InstanceOperations
    description: Operations about promotion providers, environments, and package operations
  - name: Role
    x-parent: AccessAndOrganization
    description: Operations about roles
  - name: RoleMappingRule
    x-parent: AccessAndOrganization
    description: Operations about identity-provider role-mapping rules
  - name: SecurityPolicy
    x-parent: InstanceSettings
    description: Operations about the instance security policy settings
  - name: SettingsLdap
    x-parent: InstanceSettings
    description: Operations about LDAP settings
  - name: SettingsOtel
    x-parent: InstanceSettings
    description: Operations about OpenTelemetry settings
  - name: SettingsSsoOidc
    x-parent: InstanceSettings
    description: Operations about OIDC SSO settings
  - name: SettingsSsoSaml
    x-parent: InstanceSettings
    description: Operations about SAML SSO settings
  - name: SourceControl
    x-parent: InstanceOperations
    description: Operations about source control
  - name: Tags
    x-parent: BuildAndRun
    description: Operations about tags
  - name: User
    x-parent: AccessAndOrganization
    description: Operations about users
  - name: Variables
    x-parent: BuildAndRun
    description: Operations about variables
  - name: Workflow
    x-parent: BuildAndRun
    description: Operations about workflows
  # Parent tags (alphabetically sorted)
  - name: AccessAndOrganization
    x-displayName: Access and organization
    description: Manage projects, users, roles, and role-mapping rules
  - name: BuildAndRun
    x-displayName: Build and run
    description: Build, run, and test workflows, and manage the resources that they use
  - name: InstanceOperations
    x-displayName: Instance operations
    description: Audit, extend, version, promote, and monitor the instance
  - name: InstanceSettings
    x-displayName: Instance settings
    description: Configure sign-in, security, type policies, log streaming, and telemetry for the instance

# Paths and components are generated from @PublicApiController routes. See openapi-gen/generate.ts.
paths: {}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-N8N-API-KEY
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      # Must match AUTH_COOKIE_NAME in packages/cli/src/constants.ts
      name: n8n-auth

security:
  - ApiKeyAuth: []
  - BearerAuth: []
  - CookieAuth: []
