<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>API-317 · real n8n editor</title>
		<link rel="stylesheet" href="/styles.css" />
		<style>
			body {
				display: flex;
				flex-direction: column;
				height: 100vh;
				overflow: hidden;
			}

			/* Invert the chrome bar against page theme so it stays distinct. */
			.embed-bar {
				display: flex;
				align-items: center;
				gap: var(--space-s);
				flex-wrap: wrap;
				padding: var(--space-s) var(--space-m);
				background: #101330;
				color: #f4f4f7;
				border-bottom: 1px solid #343854;
			}

			body[data-theme='dark'] .embed-bar {
				background: #ffffff;
				color: #101330;
				border-bottom-color: #d0d3de;
			}

			.embed-bar strong {
				font-size: 0.9rem;
			}

			.embed-bar p {
				margin: 0;
				color: #a3a7bd;
				font-size: 0.8rem;
			}

			body[data-theme='dark'] .embed-bar p {
				color: #5c617a;
			}

			.embed-bar .spacer {
				flex: 1;
			}

			.embed-bar .button {
				font-size: 0.8rem;
				padding: 0.35rem 0.6rem;
			}

			.embed-bar .button.ghost {
				color: #f4f4f7;
				border-color: #5c617a;
			}

			body[data-theme='dark'] .embed-bar .button.ghost {
				color: #101330;
				border-color: #d0d3de;
			}

			.usage-warning {
				display: flex;
				align-items: center;
				gap: var(--space-m);
				padding: var(--space-s) var(--space-m);
				padding-left: 24px;
				background: oklch(98.3% 0.0114 84.58);
				color: oklch(61.78% 0.1267 70.31);
				border-bottom: 1px solid oklch(61.78% 0.1267 70.31);
			}

			.usage-warning[hidden] {
				display: none;
			}

			.usage-warning-copy {
				flex: 1;
			}

			.usage-warning-icon {
				flex: none;
				width: 1rem;
				height: 1rem;
				color: inherit;
			}

			.usage-warning strong,
			.usage-warning p {
				display: block;
				margin: 0;
				color: inherit;
			}

			.usage-warning strong {
				font-size: 13px;
				font-weight: 600;
			}

			.usage-warning a,
			.usage-warning svg {
				color: inherit;
			}

			.usage-warning p {
				margin-top: var(--space-xs);
				font-size: 12px;
			}

			.usage-warning .button {
				flex: none;
				height: 1.75rem;
				padding: 0 0.75rem;
				border-radius: 0.25rem;
				background: transparent;
				color: inherit;
				border: 1px solid currentColor;
				font-size: 0.8125rem;
				font-weight: 500;
				line-height: 1;
			}

			iframe {
				flex: 1;
				min-height: 0;
				width: 100%;
				border: 0;
			}
		</style>
	</head>
	<body>
		<header class="embed-bar">
			<strong id="embed-ticket">API-317</strong>
			<p id="embed-title">Display n8n logo on canvas when N8N_CANVAS_ONLY is enabled</p>
			<span class="spacer"></span>
			<button class="button ghost" type="button" id="theme-toggle" aria-pressed="false">
				Dark mode
			</button>
			<a class="button ghost" href="/">Back to hub</a>
		</header>
		<section id="usage-warning" class="usage-warning" role="alert" hidden>
			<svg
				class="usage-warning-icon"
				xmlns="http://www.w3.org/2000/svg"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				aria-hidden="true"
				focusable="false"
			>
				<path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
				<path d="M12 9v4" />
				<path d="M12 17h.01" />
			</svg>
			<div class="usage-warning-copy">
				<strong>Usage reporting isn't reaching n8n</strong>
				<p>
					This instance hasn't sent a usage report since {date}. Contact your admin or check the
					airgap monitoring service.
				</p>
			</div>
			<button class="button" type="button" id="dismiss-usage-warning">Dismiss</button>
		</section>
		<iframe id="n8n" src="/workflow/new" title="n8n editor"></iframe>
		<script type="module" src="/n8n-embed.js"></script>
	</body>
</html>
